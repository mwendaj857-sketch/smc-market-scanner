name: "LSE Smart Signal Scanner v12.20 \u2014 Institutional Top-of-Book Execution + E2E Replay"
permissions:
  contents: read
concurrency:
  group: lse-smart-scanner-${{ github.event_name }}-${{ inputs.scan_mode || 'ONCE' }}
  cancel-in-progress: true
jobs:
  scan:
    needs:
    - tca_replay
    - e2e_replay
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      MAX_INSTRUMENTS: ${{ inputs.max_instruments || '0' }}
      SCAN_RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '8' }}
      LSE_CATEGORIES: ${{ inputs.categories || 'forex,commodity,crypto' }}
      TOP_N: ${{ inputs.top_n || '5' }}
      SCAN_MODE: ${{ inputs.scan_mode || 'ONCE' }}
      UNTIL_POSITION_MAX_MINUTES: ${{ inputs.until_position_max_minutes || '55' }}
      POLL_SECONDS: ${{ inputs.poll_seconds || '30' }}
      FAST_CANDIDATE_LIMIT: ${{ inputs.fast_candidate_limit || '8' }}
      FAST_MIN_SCORE: ${{ inputs.fast_min_score || '55' }}
      RUN_TCA: ${{ inputs.run_tca || 'false' }}
      TCA_SYMBOLS: ${{ inputs.tca_symbols || 'EUR/USD,GBP/USD,XAU/USD,BTC/USD' }}
      TCA_START: ${{ inputs.tca_start || '' }}
      TCA_END: ${{ inputs.tca_end || '' }}
      TCA_HORIZON_MINUTES: ${{ inputs.tca_horizon_minutes || '60' }}
      TCA_OBSERVATION_SECONDS: ${{ inputs.tca_observation_seconds || '4' }}
      TCA_MAX_SETUPS: ${{ inputs.tca_max_setups || '500' }}
      TCA_MIN_TICKS: ${{ inputs.tca_min_ticks || '3' }}
      TCA_CALIBRATION_MIN_OBSERVATIONS: ${{ inputs.tca_calibration_min_observations || '100' }}
      RUN_E2E: ${{ inputs.run_e2e || inputs.run_tca || 'false' }}
      NEWS_RSS_URLS: ${{ secrets.NEWS_RSS_URLS }}
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Download empirical execution calibration
      uses: actions/download-artifact@v7
      with:
        name: historical-tick-replay-tca
        path: .
      if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_tca == true || inputs.run_e2e == true) }}
    - name: Set up Python 3.12 (Node 24 actions)
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        python -m pip install "lse-data[frames]==0.14.0" "feedparser>=6.0,<7" "PyYAML>=6.0,<7" "matplotlib>=3.8,<4" "pandas>=2.0,<3" "pyarrow>=15,<23"

        '
    - name: Validate embedded scanner before live run
      shell: bash
      run: "set -euo pipefail\nexport WORKFLOW_DIR=\"$GITHUB_WORKSPACE/.github/workflows\"\npython - <<'PY'\nimport ast\nimport os\nfrom pathlib\
        \ import Path\nimport yaml\n\nworkflow_dir = Path(os.environ[\"WORKFLOW_DIR\"]).resolve()\nassert workflow_dir.is_dir(), f\"Workflow directory\
        \ missing: {workflow_dir}\"\n\n# Validate the exact workflow used by this GitHub Actions run.\n# This prevents an older v8.x scanner in\
        \ the repository from being selected.\nworkflow_ref = os.environ.get(\"GITHUB_WORKFLOW_REF\", \"\")\nworkflow_path = None\nif workflow_ref:\n\
        \    ref_path = workflow_ref.split(\"@\", 1)[0]\n    marker = \".github/workflows/\"\n    if marker in ref_path:\n        workflow_path\
        \ = workflow_dir / ref_path.split(marker, 1)[1]\n\nif workflow_path is None:\n    candidates = [\n        p for p in sorted(workflow_dir.glob(\"\
        *.yml\")) + sorted(workflow_dir.glob(\"*.yaml\"))\n        if p.is_file()\n    ]\n    matches = []\n    for candidate in candidates:\n\
        \        try:\n            candidate_text = candidate.read_text(encoding=\"utf-8\")\n        except OSError:\n            continue\n \
        \       if \"SMC LSE SMART INTRADAY SCANNER\" in candidate_text and \"from lse import LSE\" in candidate_text:\n            matches.append((candidate,\
        \ candidate_text))\n    assert len(matches) == 1, (\n        \"Could not safely identify the current scanner workflow. \"\n        \"\
        Remove duplicate scanner workflow files or run under GitHub Actions.\"\n    )\n    workflow_path, text = matches[0]\nelse:\n    assert\
        \ workflow_path.is_file(), f\"Current workflow file not found: {workflow_path}\"\n    text = workflow_path.read_text(encoding=\"utf-8\"\
        )\n\ndoc = yaml.safe_load(text)\nassert isinstance(doc, dict), \"Workflow is not a YAML mapping\"\njobs = doc.get(\"jobs\")\nassert isinstance(jobs,\
        \ dict) and isinstance(jobs.get(\"scan\"), dict), \"scan job missing\"\nsteps = jobs[\"scan\"].get(\"steps\", [])\nassert isinstance(steps,\
        \ list), \"scan.steps is not a list\"\n\nrun_blocks = [s.get(\"run\", \"\") for s in steps if isinstance(s, dict) and isinstance(s.get(\"\
        run\"), str)]\nscanner_blocks = [\n    x for x in run_blocks\n    if \"python - <<'PY'\" in x\n    and \"from lse import LSE\" in x\n\
        \    and \"print(\\\"LSE SMART SIGNAL SCANNER v12.7\" in x\n    and \"def now_utc\" in x\n]\nassert len(scanner_blocks) == 1, f\"Expected\
        \ exactly one main embedded scanner block, found {len(scanner_blocks)}\"\nscanner = scanner_blocks[0]\nassert \"v12.7\" in scanner and\
        \ \"FAST FILTER -> DEEP ANALYSIS\" in scanner, \"Wrong scanner version embedded in current workflow\"\nassert \"import feedparser\" in\
        \ scanner and \"def external_news\" in scanner, \"RSS layer missing from embedded scanner\"\nassert \"def event_risk\" in scanner and\
        \ \"RSS is secondary risk intelligence\" in scanner, \"RSS risk integration missing\"\nassert \"alignment = {\" in scanner, \"Timeframe\
        \ alignment definition missing\"\nassert '\"1mo\": nine_strategy_signals' in scanner, \"Monthly strategy analysis missing\"\nassert \"\
        monthly_alignment_ok\" in scanner and \"signal_timeframes\" in scanner, \"Monthly/any-timeframe agreement gate missing\"\nassert scanner.index(\"\
        alignment = {\") < scanner.index('\"alignment\":alignment'), \"Alignment must be defined before result construction\"\nassert \"strategy_score\"\
        \ in scanner and \"execution_quality_score\" in scanner, \"Separate strategy/execution scores missing\"\nassert \"ENTRY_HORIZONS\" in\
        \ scanner and \"horizon_for(\" in scanner, \"Entry-type horizon mapping missing\"\nassert \"WAIT \u2014 NOT CONFIRMED / NOT AN ENTRY\"\
        \ in scanner, \"WAIT/non-entry separation missing\"\nassert \"rss_news_risk\" in scanner and \"event_risk\" in scanner and \"event_alignment\"\
        \ in scanner, \"Event-aware risk output/integration missing\"\nassert \"actions/upload-artifact@v7\" in text, \"Artifact upload is not\
        \ using actions/upload-artifact@v7\"\nassert \"Send validated scanner output to Telegram\" in text, \"Telegram delivery step missing\"\
        \nassert \"BOT_TOKEN\" in text and \"TELEGRAM_CHAT_ID\" in text, \"Telegram secrets wiring missing\"\nassert \"matplotlib\" in text and\
        \ \"sendPhoto\" in text, \"Telegram candlestick chart delivery missing\"\nassert \"chart_candles\" in scanner and \"chart_timeframe\"\
        \ in scanner, \"Adaptive chart data missing from scanner handoff\"\nassert \"status_rule\" in scanner, \"WAIT/confirmed status rule missing\
        \ from JSON\"\nassert \"POSITION_TIMEFRAME_PROFILES\" in scanner, \"Adaptive position timeframe profiles missing\"\nassert \"timeframe_analysis\"\
        \ in scanner, \"Per-timeframe analysis missing\"\nassert \"position_timeframe\" in scanner, \"Position timeframe field missing\"\nassert\
        \ \"FAST_FETCH_LIMIT\" in scanner and \"fast_nine_strategy_signals\" in scanner, \"Fast native timeframe filter missing\"\nassert \"candidate_meta\"\
        \ in scanner and \"for idx, meta in enumerate(candidate_meta, 1)\" in scanner, \"Deep scan is not restricted to promoted candidates\"\n\
        assert \"entry_price\" in scanner and \"candidate_price\" in scanner and \"candidate_plan\" in scanner, \"Closed-candle entry plan missing\"\
        \nassert \"def execution_trigger_state\" in scanner, \"Closed-candle execution trigger engine missing\"\nassert \"trigger_crossed\" in\
        \ scanner and \"OVEREXTENDED\" in scanner, \"Conditional trigger state missing\"\nassert \"ENTRY_BUFFER_ATR =\" in scanner and \"ENTRY_MAX_CHASE_ATR\
        \ =\" in scanner, \"Execution trigger constants missing\"\nassert \"TRIGGER_SWING_LOOKBACK =\" in scanner and \"TRIGGER_SWING_WINDOW =\"\
        \ in scanner, \"Structural trigger configuration missing\"\nassert \"forming candle never votes\" in scanner, \"Forming candle must not\
        \ influence directional scoring\"\nassert \"entry_plan\" in scanner and \"take_profit\" in scanner and \"stop_loss\" in scanner, \"Fast-filter\
        \ entry plan missing\"\nassert \"FAST FILTER ENTRY PLANS\" in text, \"Telegram fast-filter entry plans missing\"\nassert \"scan_mode\"\
        \ in text and \"UNTIL_POSITION\" in text, \"Until-position scan mode missing\"\nassert \"SCAN_MODE\" in text and \"POLL_SECONDS\" in text,\
        \ \"Continuous scan configuration missing\"\nassert \"FAST_CANDIDATE_LIMIT\" in text and \"FAST_MIN_SCORE\" in text, \"Fast-filter configuration\
        \ missing\"\nassert \"historical tick replay\" in text and \"implementation_shortfall\" in text, \"Historical tick replay/TCA layer missing\"\
        \nassert \"api_date\" in text and \"LSE historical REST boundaries require YYYY-MM-DD\" in text, \"Historical replay date-boundary guard\
        \ missing\"\nassert \"execution_tca.json\" in text and \"execution_tca.csv\" in text, \"TCA artifacts missing\"\nassert \"FAST FILTER\
        \ -> DEEP ANALYSIS\" in scanner, \"Two-stage scan architecture missing\"\nassert \"fast_candidates\" in scanner and \"fast_watch\" in\
        \ scanner, \"Fast candidate/watch handoff missing\"\nassert \"deep_analysis_count\" in scanner and \"fast_filtered_count\" in scanner,\
        \ \"Two-stage scan metrics missing\"\nassert \"POTENTIAL \u2014 NOT CONFIRMED\" in scanner, \"Potential state missing\"\nassert \"fast_filter\"\
        \ in scanner, \"Fast-filter result metadata missing\"\nassert \"SNIPER_MIN_SCORE\" in scanner and \"sniper_opportunity\" in scanner, \"\
        SNIPER precision opportunity engine missing\"\nassert scanner.index(\"sniper_ranked = sorted(\") < scanner.index(\"len(sniper_ranked)\"\
        ), \"sniper_ranked must be defined before it is referenced\"\nassert \"data_quality_report\" in scanner and \"volatility_regime\" in scanner,\
        \ \"Data-quality/volatility validation layer missing\"\nassert \"ALL ELIGIBLE LIVE-CATALOG\" in scanner, \"Broad opportunity universe\
        \ missing\"\ntelegram_text = \"\\n\".join(run_blocks)\nassert \"\U0001F7E2\" in telegram_text and \"\U0001F7E1 WAIT \u2014 NOT CONFIRMED\
        \ / NOT AN ENTRY\" in telegram_text and \"\U0001F440 POTENTIAL \u2014 NOT CONFIRMED\" in telegram_text, \"Telegram status formatting missing\"\
        \nassert 'color=' in text, \"Colored Telegram chart elements missing\"\nheredocs = __import__(\"re\").findall(r\"python\\s+-\\s+<<[\\\
        '\\\"]?PY[\\'\\\"]?\\r?\\n(.*?)\\r?\\nPY(?:\\r?\\n|$)\", scanner, flags=__import__(\"re\").S)\npy_candidates = [block for block in heredocs\
        \ if \"from lse import LSE\" in block and \"FAST FILTER -> DEEP ANALYSIS\" in block]\nassert len(py_candidates) == 1, f\"Expected exactly\
        \ one scanner heredoc, found {len(py_candidates)}\"\npy = py_candidates[0]\n\nast.parse(py)\ncompile(py, \"<embedded-scanner>\", \"exec\"\
        )\nprint(f\"Workflow selected: {workflow_path}\")\nprint(\"YAML syntax: PASS\")\nprint(\"scan job structure: PASS\")\nprint(\"Main embedded\
        \ Python syntax: PASS\")\nprint(\"Embedded scanner compilation: PASS\")\nprint(\"RSS integration: PASS\")\nprint(\"Alignment definition/order:\
        \ PASS\")\nprint(\"Monthly master filter: PASS\")\nprint(\"Any-timeframe agreement gate: PASS\")\nprint(\"Score separation: PASS\")\n\
        print(\"Entry-type horizon mapping: PASS\")\nprint(\"WAIT/non-entry formatting: PASS\")\nprint(\"Artifact upload v7: PASS\")\nassert \"\
        def dominant(methods, minimum=2)\" in scanner, \"dominant() helper missing before fast filter\"\nassert \"Stage A: 1H + 15M only\" in\
        \ scanner, \"two-stage fast filter missing\"\nassert \"_candle_request\" in scanner and \"API_MAX_RETRIES\" in scanner and \"API_MIN_INTERVAL_SECONDS\"\
        \ in scanner, \"bounded LSE retry/pacing layer missing\"\nassert \"v12.7\" in scanner, \"scanner version mismatch\"\nassert scanner.count(\"\
        def dominant(methods, minimum=2)\") == 1, \"duplicate/missing dominant() definition\"\nassert 'daily_intelligence(client, [m[\"symbol\"\
        ] for m in candidate_meta])' in scanner, \"intelligence is not deferred to deep candidates\"\nassert \"lower_is_better\" in scanner, \"\
        event surprise polarity model missing\"\nprint(\"Scanner version: v12.7\")\nprint(\"Fast two-stage filter: PASS\")\nprint(\"Transient\
        \ LSE retry/backoff: PASS\")\nprint(\"Lazy benchmark loading: PASS\")\nPY\n"
    - name: Run scanner
      run: "set -euo pipefail\n\nscan_once() {\npython - <<'PY'\nimport ast\nimport bisect\nimport csv\nimport json\nimport feedparser\nimport\
        \ math\nimport os\nimport re\nimport statistics\nimport threading\nfrom collections import deque\nimport sys\nimport time\nimport traceback\n\
        import xml.etree.ElementTree as ET\nfrom collections import defaultdict\nfrom datetime import datetime, timedelta, timezone\nfrom pathlib\
        \ import Path\nfrom urllib.parse import urlparse\nfrom urllib.request import Request, urlopen\n\ntry:\n    from lse import LSE, LSEError\n\
        except Exception as exc:\n    print(f\"FATAL: lse-data import failed: {exc}\")\n    raise\n\nprint(\"=\" * 72)\nprint(\"LSE SMART SIGNAL\
        \ SCANNER v12.7 \u2014 INSTITUTIONAL TOP-OF-BOOK EXECUTION MODEL \u2014 VALIDATED\")\nprint(\"=\" * 72)\nprint(\"DAILY INTELLIGENCE ->\
        \ 1MO MASTER BIAS -> 1D CONTEXT -> 4H REGIME -> 1H DECISION\")\nprint(\"-> 1H DECISION -> 15M SETUP/CONFIRMATION -> 5M TRIGGER\")\nprint(\"\
        MONTHLY ALIGNMENT FILTER: EVERY SIGNAL TIMEFRAME MUST AGREE WITH MONTHLY + LOCAL TF CONSENSUS\")\nprint(\"DYNAMIC LSE CATALOG | >=2R CONFIRMATION\
        \ | STRUCTURAL TP | STRUCTURAL CLOSED-CANDLE ENTRY + LIVE-TRIGGER VALIDATION\")\nprint(\"AUTOMATIC TRADING: DISABLED\")\nprint()\n\n#\
        \ ----------------------------\n# Configuration\n# ----------------------------\n# Monthly is the highest-timeframe directional filter.\n\
        TF = [\"1mo\", \"1d\", \"4h\", \"1h\", \"15m\", \"5m\"]\nDIRECT_TF = [\"1mo\", \"1d\", \"4h\", \"1h\", \"15m\", \"5m\"]\nMIN_BARS = {\"\
        1mo\": 60, \"1d\": 120, \"4h\": 180, \"1h\": 240, \"15m\": 360, \"5m\": 500}\n# Deep analysis uses only enough closed history for the\
        \ nine strategies,\n# structure, levels and forming-candle logic. This cuts payload size without\n# changing the native LSE timeframe\
        \ architecture.\nFETCH_LIMIT = {\"1mo\": 70, \"1d\": 180, \"4h\": 240, \"1h\": 320, \"15m\": 420, \"5m\": 600}\nFAST_FETCH_LIMIT = {\"\
        1h\": 120, \"15m\": 160, \"5m\": 220}\nFAST_PRESELECT_LIMIT = 8\nAPI_MAX_RETRIES = 3\nAPI_RETRY_BASE_SECONDS = 0.8\nAPI_MIN_INTERVAL_SECONDS\
        \ = 0.18\nLAST_API_REQUEST_AT = 0.0\n\nENTRY_STRATEGY_SCORE_MIN = 80.0\nSNIPER_MIN_SCORE = 78.0\nSNIPER_MAX_ENTRY_DISTANCE_ATR = 0.45\n\
        MIN_DATA_QUALITY = 0.98\nPOTENTIAL_SCORE_MIN = 70.0\nFORMING_CANDLE_MIN_BODY_RATIO = 0.35\nMIN_CONFIRMED_RR = 2.0\n\n# Execution-quality\
        \ controls. Explicit constants prevent silent runtime\n# failures and keep the trigger model auditable.\nENTRY_BUFFER_ATR = 0.10\nENTRY_MAX_CHASE_ATR\
        \ = 0.50\nTRIGGER_SWING_LOOKBACK = 2\nTRIGGER_SWING_WINDOW = 40\n\n# Institutional-style top-of-book execution model. LSE supplies live\n\
        # websocket ticks containing bid/ask/price/volume. This model does not\n# pretend to be a full central-limit-order-book model: without\
        \ depth/queue\n# data we explicitly model only executable top-of-book conditions, quote\n# freshness, spread cost, micro-price movement\
        \ and chase risk.\nLIVE_TICK_TIMEOUT_SECONDS = 4.0\nLIVE_TICK_MIN_SAMPLES = 3\nMAX_QUOTE_AGE_SECONDS = 3.0\nMAX_SPREAD_ATR = 0.35\nMAX_SPREAD_MEDIAN_MULTIPLIER\
        \ = 2.50\nEXECUTION_STABILITY_MAX_ATR_PER_TICK = 0.12\nEXECUTION_SCORE_MIN = 70.0\nEXECUTION_HIGH_QUALITY_SCORE = 85.0\nEXECUTION_CALIBRATION_SOURCE\
        \ = \"static_default\"\n# Use only an empirically calibrated file produced by the preceding\n# calibration job. The live scan never tunes\
        \ thresholds on its own data.\ncalibration_path = Path(\"execution_calibration.json\")\nif calibration_path.exists():\n    try:\n    \
        \    calibration = json.loads(calibration_path.read_text(encoding=\"utf-8\"))\n        if calibration.get(\"status\") == \"CALIBRATED\"\
        :\n            EXECUTION_SCORE_MIN = float(calibration.get(\"min_confirmed_score\", EXECUTION_SCORE_MIN))\n            EXECUTION_HIGH_QUALITY_SCORE\
        \ = float(calibration.get(\"high_quality_score\", EXECUTION_HIGH_QUALITY_SCORE))\n            EXECUTION_CALIBRATION_SOURCE = str(calibration.get(\"\
        source\", \"empirical_tca\"))\n    except Exception as exc:\n        print(f\"CALIBRATION WARNING: execution_calibration.json ignored:\
        \ {type(exc).__name__}: {exc}\")\nEXECUTION_SCORE_MIN = max(50.0, min(95.0, EXECUTION_SCORE_MIN))\nEXECUTION_HIGH_QUALITY_SCORE = max(EXECUTION_SCORE_MIN,\
        \ min(99.0, EXECUTION_HIGH_QUALITY_SCORE))\nprint(f\"EXECUTION CALIBRATION: min_confirmed={EXECUTION_SCORE_MIN:.1f} high_quality={EXECUTION_HIGH_QUALITY_SCORE:.1f}\
        \ source={EXECUTION_CALIBRATION_SOURCE}\")\nEXECUTION_STREAM_BATCH = 10\n\n# Entry-type-specific holding horizons. WAIT is deliberately\
        \ not a\n# trade type and therefore has no trading horizon.\nENTRY_HORIZONS = {\n    \"SCALP\": \"5M-15M / minutes to under 1 hour\",\n\
        \    \"INTRADAY\": \"15M-4H / same trading day\",\n    \"SWING/HOLD\": \"1H-1D / multiple days\",\n    \"ADAPTIVE PRICE-MOVEMENT\": \"\
        15M-1H / minutes to several hours\",\n    \"WAIT\": \"NOT APPLICABLE \u2014 WAIT / no entry\",\n}\n\ndef horizon_for(entry_type):\n  \
        \  return ENTRY_HORIZONS.get(entry_type, ENTRY_HORIZONS[\"WAIT\"])\n\n# Each operational timeframe is evaluated independently. The scanner\n\
        # still downloads the complete multi-timeframe history for every symbol,\n# but a position is tied to the timeframe that actually produced\
        \ the\n# local 2-of-9 consensus instead of being labelled from aggregate votes.\nPOSITION_TIMEFRAME_PROFILES = {\n    \"4h\": {\"trade_types\"\
        : (\"SWING/HOLD\",), \"min_strategies\": 2, \"min_context_tfs\": 1, \"context\": (\"1d\",)},\n    \"1h\": {\"trade_types\": (\"INTRADAY\"\
        , \"SWING/HOLD\"), \"min_strategies\": 2, \"min_context_tfs\": 1, \"context\": (\"4h\",)},\n    \"15m\": {\"trade_types\": (\"SCALP\"\
        , \"INTRADAY\"), \"min_strategies\": 2, \"min_context_tfs\": 1, \"context\": (\"1h\",)},\n    \"5m\": {\"trade_types\": (\"SCALP\",),\
        \ \"min_strategies\": 2, \"min_context_tfs\": 1, \"context\": (\"15m\", \"1h\")},\n}\nPOSITION_TIMEFRAMES = tuple(POSITION_TIMEFRAME_PROFILES.keys())\n\
        \ndef profile_trade_type(tf_name, local_count, local_tf_count):\n    if tf_name in (\"5m\", \"15m\"):\n        return \"SCALP\"\n    if\
        \ tf_name == \"1h\":\n        return \"INTRADAY\"\n    return \"SWING/HOLD\"\n\ndef execution_quality_score(rr, event_level, level, event_state=\"\
        NONE\"):\n    \"\"\"Score execution quality separately from strategy consensus and event timing.\"\"\"\n    rr_component = 0.0\n    if\
        \ rr is not None:\n        try:\n            rr_component = min(70.0, max(0.0, float(rr) / 2.0 * 70.0))\n        except (TypeError, ValueError):\n\
        \            rr_component = 0.0\n\n    news_component = {\n        \"IMMEDIATE_HIGH\": 0.0,\n        \"POST_EVENT_ALIGNED\": 20.0,\n \
        \       \"POST_EVENT_UNCLEAR\": 10.0,\n        \"POST_EVENT_CONFLICT\": 0.0,\n        \"UPCOMING\": 15.0,\n        \"OUTSIDE_IMMEDIATE_WINDOW\"\
        : 20.0,\n        \"NONE\": 20.0,\n    }.get(str(event_state).upper(), 5.0 if str(event_level).upper() == \"HIGH\" else 15.0)\n\n    level_component\
        \ = 10.0 if (\n        isinstance(level, (list, tuple)) and len(level) >= 3 and\n        all(isinstance(x, (int, float)) and math.isfinite(float(x))\
        \ for x in level[:3])\n    ) else 0.0\n    return round(min(100.0, rr_component + news_component + level_component), 1)\ndef env_int(name,\
        \ default):\n    try:\n        return int(os.getenv(name, str(default)) or str(default))\n    except (TypeError, ValueError):\n      \
        \  print(f\"CONFIG WARNING: {name} is invalid; using {default}\")\n        return default\n\ndef env_float(name, default):\n    try:\n\
        \        return float(os.getenv(name, str(default)) or str(default))\n    except (TypeError, ValueError):\n        print(f\"CONFIG WARNING:\
        \ {name} is invalid; using {default}\")\n        return default\n\nMAX_INSTRUMENTS = max(0, env_int(\"MAX_INSTRUMENTS\", 0))\nTOP_N =\
        \ max(1, env_int(\"TOP_N\", 5))\nFAST_CANDIDATE_LIMIT = max(1, min(10, env_int(\"FAST_CANDIDATE_LIMIT\", 6)))\nFAST_MIN_SCORE = max(40.0,\
        \ min(90.0, env_float(\"FAST_MIN_SCORE\", 55.0)))\nRUNTIME_MINUTES = env_float(\"SCAN_RUNTIME_MINUTES\", 8.0)\nif RUNTIME_MINUTES <= 0:\n\
        \    RUNTIME_MINUTES = 8.0\nRUNTIME_MINUTES = min(RUNTIME_MINUTES, 10.0)\n# Keep a small safety reserve so the scanner stops before the\
        \ configured budget\n# instead of overrunning it because of final formatting / cleanup.\nRUNTIME_GUARD_SECONDS = 20.0\nSCAN_START = time.monotonic()\n\
        SCAN_BUDGET_SECONDS = max(30.0, RUNTIME_MINUTES * 60.0 - RUNTIME_GUARD_SECONDS)\nSCAN_DEADLINE = SCAN_START + SCAN_BUDGET_SECONDS\nCATEGORIES\
        \ = [x.strip().lower() for x in os.getenv(\n    \"LSE_CATEGORIES\", \"forex,commodity,index,crypto,stock,etf,futures\"\n).split(\",\"\
        ) if x.strip()]\ndef parse_rss_urls(raw):\n    raw = str(raw or \"\").strip()\n    if not raw:\n        return []\n    # Accept a JSON\
        \ string array or a simple comma/newline/semicolon list.\n    if raw.startswith(\"[\"):\n        try:\n            parsed = json.loads(raw)\n\
        \            if isinstance(parsed, list):\n                return [str(x).strip() for x in parsed if str(x).strip()]\n        except Exception:\n\
        \            pass\n    parts = raw.replace(\"\\n\", \",\").replace(\";\", \",\").split(\",\")\n    return [x.strip() for x in parts if\
        \ x.strip()]\n\nNEWS_URLS = parse_rss_urls(os.getenv(\"NEWS_RSS_URLS\", \"\"))\nMAJOR_FX = {\"EUR/USD\",\"GBP/USD\",\"USD/JPY\",\"USD/CHF\"\
        ,\"AUD/USD\",\"USD/CAD\",\"NZD/USD\",\"EUR/GBP\",\"EUR/JPY\",\"GBP/JPY\",\"EUR/CHF\",\"AUD/JPY\"}\nPRIORITY_METALS = {\"XAU/USD\",\"XAG/USD\"\
        ,\"XPT/USD\",\"XPD/USD\"}\nPRIORITY_CRYPTO = {\"BTC/USD\"}\nFOCUSED_SYMBOLS = MAJOR_FX | PRIORITY_METALS | PRIORITY_CRYPTO\nSYMBOL_ALIASES\
