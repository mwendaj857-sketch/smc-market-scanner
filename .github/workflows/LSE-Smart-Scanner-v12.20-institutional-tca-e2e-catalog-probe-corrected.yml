        rr\"] < 1.0:\n                continue\n\n            obs_end = min(end_dt, asof + timedelta(seconds=observation_seconds))\n         \
        \   snapshot = []\n            j = tick_i\n            while j < len(ticks) and ticks[j][\"timestamp\"] <= obs_end:\n                snapshot.append(ticks[j]);\
        \ j += 1\n            pred = prediction(snapshot, side, trigger, a, asof)\n            if pred is None:\n                continue\n\n\
        \            decision_time = parse_ts(pred[\"decision_time\"])\n            future_end = min(end_dt, decision_time + timedelta(minutes=horizon_minutes))\n\
        \            if pred[\"state\"] == \"EXECUTABLE_TRIGGER_CROSSED\":\n                cross = snapshot[-1]\n            else:\n        \
        \        cross = first_cross(ticks, tick_times, decision_time, future_end, side, trigger)\n            row = {\n                \"symbol\"\
        :symbol, \"asof\":asof.isoformat(), \"decision_time\":pred[\"decision_time\"], \"side\":side,\n                \"trigger\":trigger, \"\
        atr\":a, \"planned_sl\":plan[\"sl\"], \"planned_tp\":plan[\"tp\"],\n                \"planned_rr\":plan[\"rr\"], \"prediction_state\"\
        :pred[\"state\"],\n                \"predicted_execution_score\":pred[\"execution_score\"],\n                \"predicted_spread_bps\"\
        :pred[\"spread_bps\"],\n                \"predicted_spread_atr\":pred[\"spread_atr\"],\n                \"predicted_slippage_proxy_atr\"\
        :pred[\"slippage_proxy_atr\"],\n                \"predicted_chase_atr\":pred[\"chase_distance_atr\"],\n                \"predicted_tick_count\"\
        :pred[\"tick_count\"],\n                \"trigger_crossed_within_horizon\":bool(cross),\n                \"fill_time\":None, \"fill_price\"\
        :None,\n                \"arrival_mid\":pred[\"mid\"],\n                \"implementation_shortfall_bps\":None,\n                \"realized_entry_slippage_atr\"\
        :None,\n                \"realized_spread_bps\":None,\n                \"realized_spread_atr\":None,\n                \"markout_5m_bps\"\
        :None, \"markout_15m_bps\":None,\n                \"markout_60m_bps\":None, \"mfe_r\":None, \"mae_r\":None,\n                \"outcome_1r\"\
        :None, \"tp_or_sl_first\":None,\n            }\n            if cross:\n                fill_time = cross[\"timestamp\"]\n            \
        \    fill_price = cross[\"ask\"] if side == \"BUY\" else cross[\"bid\"]\n                fill_mid = (cross[\"bid\"]+cross[\"ask\"])/2.0\n\
        \                row[\"fill_time\"] = fill_time.isoformat()\n                row[\"fill_price\"] = fill_price\n                row[\"\
        realized_entry_slippage_atr\"] = abs(fill_price-trigger)/a\n                row[\"realized_spread_bps\"] = (cross[\"ask\"]-cross[\"bid\"\
        ])/max(fill_mid,1e-12)*10000.0\n                row[\"realized_spread_atr\"] = (cross[\"ask\"]-cross[\"bid\"])/max(a,1e-12)\n        \
        \        arrival_mid = float(pred[\"mid\"])\n                if side == \"BUY\":\n                    row[\"implementation_shortfall_bps\"\
        ] = (fill_price-arrival_mid)/max(arrival_mid,1e-12)*10000.0\n                else:\n                    row[\"implementation_shortfall_bps\"\
        ] = (arrival_mid-fill_price)/max(arrival_mid,1e-12)*10000.0\n                for mins, key in ((5,\"markout_5m_bps\"),(15,\"markout_15m_bps\"\
        ),(60,\"markout_60m_bps\")):\n                    if mins*60 <= horizon_minutes:\n                        mo = markout(ticks, tick_times,\
        \ fill_time, side, fill_price, mins*60)\n                        if mo:\n                            denom = max(fill_price,1e-12)\n \
        \                           row[key] = (mo[\"final\"]/denom)*10000.0\n                            if mins == 5:\n                    \
        \            row[\"mfe_r\"] = mo[\"mfe\"]/max(plan[\"risk\"],1e-12)\n                                row[\"mae_r\"] = mo[\"mae\"]/max(plan[\"\
        risk\"],1e-12)\n                outcome, outcome_tick = hit_order(ticks, tick_times, fill_time, side, plan[\"sl\"], plan[\"tp\"], horizon_minutes*60)\n\
        \                row[\"tp_or_sl_first\"] = outcome\n                if outcome == \"TP_FIRST\":\n                    row[\"outcome_1r\"\
        ] = \"WIN\"\n                elif outcome == \"SL_FIRST\":\n                    row[\"outcome_1r\"] = \"LOSS\"\n                else:\n\
        \                    row[\"outcome_1r\"] = \"OPEN_AT_HORIZON\"\n            observations.append(row)\n            setup_count += 1\n \
        \           if setup_count >= max_setups:\n                break\n        if setup_count >= max_setups:\n            break\n\n    print(f\"\
        TCA REPLAY {symbol}: {setup_count} historical setup snapshots evaluated\")\n\ntry:\n    client.disconnect()\nexcept Exception:\n    pass\n\
        \n# Calibration statistics.\ndef mean(values):\n    vals = [float(x) for x in values if x is not None and math.isfinite(float(x))]\n \
        \   return statistics.fmean(vals) if vals else None\n\ndef rate(values, positive):\n    vals = [x for x in values if x is not None]\n\
        \    return (sum(1 for x in vals if x == positive)/len(vals)*100.0) if vals else None\n\nbuckets = defaultdict(list)\nfor row in observations:\n\
        \    buckets[bucket(float(row[\"predicted_execution_score\"]))].append(row)\n\nbucket_summary = {}\nfor name in (\"0-49\",\"50-69\",\"\
        70-84\",\"85-100\"):\n    rows = buckets.get(name, [])\n    bucket_summary[name] = {\n        \"observations\":len(rows),\n        \"\
        trigger_fill_rate_pct\":rate([r[\"trigger_crossed_within_horizon\"] for r in rows], True),\n        \"avg_predicted_spread_bps\":mean([r[\"\
        predicted_spread_bps\"] for r in rows]),\n        \"avg_realized_spread_bps\":mean([r[\"realized_spread_bps\"] for r in rows]),\n    \
        \    \"avg_predicted_slippage_atr\":mean([r[\"predicted_slippage_proxy_atr\"] for r in rows]),\n        \"avg_realized_entry_slippage_atr\"\
        :mean([r[\"realized_entry_slippage_atr\"] for r in rows]),\n        \"avg_5m_markout_bps\":mean([r[\"markout_5m_bps\"] for r in rows]),\n\
        \        \"avg_15m_markout_bps\":mean([r[\"markout_15m_bps\"] for r in rows]),\n        \"win_rate_pct\":rate([r[\"outcome_1r\"] for r\
        \ in rows], \"WIN\"),\n        \"loss_rate_pct\":rate([r[\"outcome_1r\"] for r in rows], \"LOSS\"),\n    }\n\nfill_rows = [r for r in\
        \ observations if r[\"fill_price\"] is not None]\nspread_abs_errors = [abs(r[\"predicted_spread_bps\"]-r[\"realized_spread_bps\"]) for\
        \ r in fill_rows\n                     if r[\"realized_spread_bps\"] is not None]\nslip_abs_errors = [abs(r[\"predicted_slippage_proxy_atr\"\
        ]-r[\"realized_entry_slippage_atr\"]) for r in fill_rows\n                   if r[\"realized_entry_slippage_atr\"] is not None]\noverall\
        \ = {\n    \"observations\":len(observations),\n    \"fills\":len(fill_rows),\n    \"trigger_fill_rate_pct\": (len(fill_rows)/len(observations)*100.0)\
        \ if observations else None,\n    \"avg_predicted_spread_bps\":mean([r[\"predicted_spread_bps\"] for r in observations]),\n    \"avg_realized_spread_bps\"\
        :mean([r[\"realized_spread_bps\"] for r in fill_rows]),\n    \"spread_prediction_mae_bps\":mean(spread_abs_errors),\n    \"avg_predicted_slippage_proxy_atr\"\
        :mean([r[\"predicted_slippage_proxy_atr\"] for r in observations]),\n    \"avg_realized_entry_slippage_atr\":mean([r[\"realized_entry_slippage_atr\"\
        ] for r in fill_rows]),\n    \"slippage_prediction_mae_atr\":mean(slip_abs_errors),\n    \"avg_5m_markout_bps\":mean([r[\"markout_5m_bps\"\
        ] for r in fill_rows]),\n    \"avg_15m_markout_bps\":mean([r[\"markout_15m_bps\"] for r in fill_rows]),\n    \"avg_60m_markout_bps\":mean([r[\"\
        markout_60m_bps\"] for r in fill_rows]),\n    \"win_rate_pct\":rate([r[\"outcome_1r\"] for r in fill_rows], \"WIN\"),\n    \"loss_rate_pct\"\
        :rate([r[\"outcome_1r\"] for r in fill_rows], \"LOSS\"),\n}\n\n\n# Empirical threshold calibration. The thresholds are selected only on\
        \ the\n# chronological training slice, checked for stability on validation, then\n# frozen and evaluated on a final holdout. The holdout\
        \ never tunes a value.\nfilled = [r for r in observations if r.get(\"fill_price\") is not None and\n          r.get(\"realized_entry_slippage_atr\"\
        ) is not None and\n          r.get(\"implementation_shortfall_bps\") is not None]\nfilled.sort(key=lambda r: parse_ts(r[\"decision_time\"\
        ]))\ncalibration = {\n    \"version\": \"v12.7-execution-calibration\",\n    \"status\": \"FALLBACK\",\n    \"source\": \"static_default\"\
        ,\n    \"min_confirmed_score\": 70.0,\n    \"high_quality_score\": 85.0,\n    \"oos_validated\": False,\n    \"observations\": len(filled),\n\
        \    \"method\": \"chronological 60/20/20 train-validation-holdout; highest score meeting minimum acceptable-execution rate with minimum\
        \ sample guards\",\n    \"acceptable_execution_definition\": {\n        \"max_realized_entry_slippage_atr\": 0.20,\n        \"max_implementation_shortfall_bps_relative_to_realized_spread\"\
        : 1.0,\n        \"minimum_absolute_shortfall_tolerance_bps\": 0.5\n    }\n}\n\ndef acceptable_execution(row):\n    try:\n        slip\
        \ = float(row[\"realized_entry_slippage_atr\"])\n        shortfall = float(row[\"implementation_shortfall_bps\"])\n        spread = float(row[\"\
        realized_spread_bps\"])\n        return (\n            math.isfinite(slip) and math.isfinite(shortfall) and math.isfinite(spread)\n  \
        \          and slip <= 0.20\n            and shortfall <= max(0.5, spread)\n        )\n    except (TypeError, ValueError, KeyError):\n\
        \        return False\n\ndef rate_for(rows, threshold):\n    selected = [r for r in rows if float(r[\"predicted_execution_score\"]) >=\
        \ threshold]\n    if not selected:\n        return None, 0\n    good = sum(1 for r in selected if acceptable_execution(r))\n    return\
        \ good / len(selected) * 100.0, len(selected)\n\nif len(filled) >= calibration_min_obs:\n    n = len(filled)\n    train_end = max(1, int(n\
        \ * 0.60))\n    valid_end = max(train_end + 1, int(n * 0.80))\n    train = filled[:train_end]\n    validation = filled[train_end:valid_end]\n\
        \    holdout = filled[valid_end:]\n    candidate_scores = list(range(50, 96))\n\n    def choose_threshold(rows, target_rate, min_n):\n\
        \        eligible = []\n        for threshold in candidate_scores:\n            good_rate, count = rate_for(rows, threshold)\n       \
        \     if count >= min_n and good_rate is not None and good_rate >= target_rate:\n                eligible.append((threshold, good_rate,\
        \ count))\n        # Highest passing threshold is intentionally chosen: it is the\n        # conservative boundary, not the easiest threshold\
        \ to pass.\n        return eligible[-1] if eligible else None\n\n    min_sample_train = max(20, min(100, len(train) // 4))\n    min_sample_validation\
        \ = max(10, min(50, len(validation) // 4))\n    min_sample_holdout = max(10, min(50, len(holdout) // 4))\n\n    chosen_min = choose_threshold(train,\
        \ 70.0, min_sample_train)\n    chosen_high = choose_threshold(train, 80.0, min_sample_train)\n\n    if chosen_min and chosen_high:\n \
        \       min_score, train_min_rate, train_min_n = chosen_min\n        high_score, train_high_rate, train_high_n = chosen_high\n       \
        \ val_min_rate, val_min_n = rate_for(validation, min_score)\n        val_high_rate, val_high_n = rate_for(validation, high_score)\n  \
        \      hold_min_rate, hold_min_n = rate_for(holdout, min_score)\n        hold_high_rate, hold_high_n = rate_for(holdout, high_score)\n\
        \n        stable = (\n            val_min_rate is not None and val_high_rate is not None\n            and val_min_n >= min_sample_validation\n\
        \            and val_high_n >= min_sample_validation\n            and hold_min_rate is not None and hold_high_rate is not None\n     \
        \       and hold_min_n >= min_sample_holdout\n            and hold_high_n >= min_sample_holdout\n            and val_min_rate >= train_min_rate\
        \ - 10.0\n            and val_high_rate >= train_high_rate - 10.0\n            and hold_min_rate >= 65.0\n            and hold_high_rate\
        \ >= 75.0\n            and high_score >= min_score\n        )\n        if stable:\n            calibration.update({\n                \"\
        status\": \"CALIBRATED\",\n                \"source\": \"empirical_tca_oos_validated\",\n                \"min_confirmed_score\": float(min_score),\n\
        \                \"high_quality_score\": float(high_score),\n                \"oos_validated\": True,\n                \"train\": {\n\
        \                    \"observations\": len(train),\n                    \"min_threshold\": min_score,\n                    \"min_rate_pct\"\
        : train_min_rate,\n                    \"min_selected\": train_min_n,\n                    \"high_threshold\": high_score,\n         \
        \           \"high_rate_pct\": train_high_rate,\n                    \"high_selected\": train_high_n\n                },\n           \
        \     \"validation\": {\n                    \"observations\": len(validation),\n                    \"min_rate_pct\": val_min_rate,\n\
        \                    \"min_selected\": val_min_n,\n                    \"high_rate_pct\": val_high_rate,\n                    \"high_selected\"\
        : val_high_n\n                },\n                \"holdout\": {\n                    \"observations\": len(holdout),\n              \
        \      \"min_rate_pct\": hold_min_rate,\n                    \"min_selected\": hold_min_n,\n                    \"high_rate_pct\": hold_high_rate,\n\
        \                    \"high_selected\": hold_high_n\n                }\n            })\n        else:\n            calibration[\"reason\"\
        ] = \"Candidate thresholds failed chronological validation/holdout stability gates; static thresholds retained.\"\n    else:\n       \
        \ calibration[\"reason\"] = \"Insufficient stable score bands meeting empirical quality targets; static thresholds retained.\"\nelse:\n\
        \    calibration[\"reason\"] = f\"Only {len(filled)} filled observations; at least {calibration_min_obs} are required before calibration\
        \ is trusted.\"\n\nwith open(\"execution_calibration.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(calibration, f, indent=2)\n\
        print(\"EMPIRICAL EXECUTION CALIBRATION\")\nprint(json.dumps(calibration, indent=2))\n\nreport = {\n    \"version\":\"v12.20-historical-tick-replay-tca\"\
        ,\n    \"generated_at\":now_utc().isoformat(),\n    \"methodology\":{\n        \"source\":\"LSE historical raw tick tape + 5m closed candles\"\
        ,\n        \"execution_side_rule\":\"BUY=ASK, SELL=BID\",\n        \"prediction_window_seconds\":observation_seconds,\n        \"minimum_prediction_ticks\"\
        :min_ticks,\n        \"trigger\":\"closed-candle structural breakout + 0.10 ATR buffer\",\n        \"fill\":\"first historical executable\
        \ bid/ask crossing trigger\",\n        \"markout\":\"executable opposite side after fill; no mid/last substitution\",\n        \"warning\"\
        :\"This is execution-model validation, not a full nine-strategy directional backtest. It measures whether the live top-of-book execution\
        \ model predicts realized execution conditions and post-trigger outcomes.\"\n    },\n    \"period\":{\"start\":start_dt.isoformat(),\"\
        end\":end_dt.isoformat()},\n    \"symbols\":symbols,\n    \"tick_replay\":tick_replay_meta,\n    \"overall\":overall,\n    \"score_calibration\"\
        :bucket_summary,\n    \"execution_calibration\":calibration,\n    \"failures\":failures,\n    \"observations\":observations,\n}\nwith\
        \ open(\"execution_tca.json\",\"w\",encoding=\"utf-8\") as f:\n    json.dump(report,f,indent=2,default=str)\nfields = list(observations[0].keys())\
        \ if observations else [\n    \"symbol\",\"asof\",\"side\",\"trigger\",\"predicted_execution_score\"\n]\nwith open(\"execution_tca.csv\"\
        ,\"w\",newline=\"\",encoding=\"utf-8\") as f:\n    w=csv.DictWriter(f,fieldnames=fields)\n    w.writeheader()\n    w.writerows(observations)\n\
        \nprint(\"=\"*72)\nprint(\"HISTORICAL TICK REPLAY + EXECUTION TCA\")\nprint(\"=\"*72)\nprint(json.dumps({\"overall\":overall,\"score_calibration\"\
        :bucket_summary,\"execution_calibration\":calibration,\"failures\":failures},indent=2))\nif not observations:\n    tick_data_available\
        \ = any(\n        meta.get(\"ticks\",0) >= MIN_TICKS and meta.get(\"source\") != \"DATA_UNAVAILABLE\"\n        for meta in tick_replay_meta.values()\n\
        \    )\n    report[\"status\"] = \"NO_QUALIFIED_OBSERVATIONS\" if tick_data_available else \"DATA_UNAVAILABLE\"\n    with open(\"execution_tca.json\"\
        ,\"w\",encoding=\"utf-8\") as f:\n        json.dump(report,f,indent=2,default=str)\n    if report[\"status\"] == \"DATA_UNAVAILABLE\"\
        :\n        print(\n            \"TCA DATA_UNAVAILABLE: no symbol supplied enough validated bid/ask \"\n            \"ticks in the exact\
        \ UTC window. No empirical calibration is trusted.\"\n        )\n    else:\n        print(\n            \"TCA NO_QUALIFIED_OBSERVATIONS:\
        \ validated tick data was available, \"\n            \"but no historical setup satisfied the execution observation gates. \"\n       \
        \     \"No empirical calibration is trusted.\"\n        )\nelif failures:\n    report[\"status\"] = \"PARTIAL\"\n    with open(\"execution_tca.json\"\
        ,\"w\",encoding=\"utf-8\") as f:\n        json.dump(report,f,indent=2,default=str)\n    print(\n        f\"TCA PARTIAL: {len(observations)}\
        \ observations / {len(fill_rows)} simulated fills; \"\n        f\"{len(failures)} symbol/data failures | \"\n        f\"calibration={calibration.get('status')}\
        \ \"\n        f\"min={calibration.get('min_confirmed_score')} high={calibration.get('high_quality_score')}\"\n    )\nelse:\n    report[\"\
        status\"] = \"COMPLETE\"\n    with open(\"execution_tca.json\",\"w\",encoding=\"utf-8\") as f:\n        json.dump(report,f,indent=2,default=str)\n\
        \    print(\n        f\"TCA COMPLETE: {len(observations)} observations / {len(fill_rows)} simulated fills | \"\n        f\"calibration={calibration.get('status')}\
        \ \"\n        f\"min={calibration.get('min_confirmed_score')} high={calibration.get('high_quality_score')}\"\n    )\nPY\n"
    - name: Validate TCA report
      run: "set -euo pipefail\npython - <<'PY'\nimport json, math\nfrom pathlib import Path\nreport=json.loads(Path(\"execution_tca.json\").read_text(encoding=\"\
        utf-8\"))\nassert report.get(\"version\") == \"v12.20-historical-tick-replay-tca\"\n\nif report.get(\"status\") == \"DISABLED\":\n   \
        \ cal=report.get(\"calibration\", {})\n    assert cal.get(\"status\") == \"DEFAULT\"\n    assert float(cal.get(\"min_confirmed_score\"\
        , 70)) == 70.0\n    assert float(cal.get(\"high_quality_score\", 85)) == 85.0\n    print(\"Historical tick replay/TCA disabled validation:\
        \ PASS\")\n    raise SystemExit(0)\n\ncal=report.get(\"execution_calibration\", {})\nassert cal.get(\"status\") in (\"CALIBRATED\",\"\
        FALLBACK\")\nassert 50 <= float(cal.get(\"min_confirmed_score\", 70)) <= 95\nassert 50 <= float(cal.get(\"high_quality_score\", 85)) <=\
        \ 99\n\nreplay=report.get(\"tick_replay\", {})\nassert isinstance(replay, dict), \"tick_replay diagnostics missing\"\nassert isinstance(report.get(\"\
        failures\"), list)\n\nobservations=report.get(\"observations\")\nassert isinstance(observations, list)\n\n# Zero observations are a valid\
        \ evidence state, not a Python/runtime failure.\n# They must be reported explicitly and must never be treated as calibration evidence.\n\
        if report.get(\"status\") in (\"DATA_UNAVAILABLE\",\"NO_QUALIFIED_OBSERVATIONS\"):\n    assert not observations\n    assert cal.get(\"\
        status\") == \"FALLBACK\"\n    assert cal.get(\"oos_validated\") is False\n    assert isinstance(replay, dict)\n    print(f\"Historical\
        \ tick replay/TCA validation: PASS ({report.get('status')}; no calibration trusted)\")\n    raise SystemExit(0)\n\nassert report.get(\"\
        status\") in (\"COMPLETE\",\"PARTIAL\")\nassert observations\nif report.get(\"status\") == \"PARTIAL\":\n    assert report.get(\"failures\"\
        )\n\noverall=report[\"overall\"]\nfor key in (\"observations\",\"fills\",\"trigger_fill_rate_pct\",\"avg_predicted_spread_bps\",\n   \
        \         \"avg_realized_spread_bps\",\"avg_predicted_slippage_proxy_atr\",\n            \"avg_realized_entry_slippage_atr\"):\n    assert\
        \ key in overall, f\"Missing TCA field: {key}\"\n\nfor row in observations[:100]:\n    assert row[\"side\"] in (\"BUY\",\"SELL\")\n  \
        \  assert row[\"trigger\"] is not None\n    assert row[\"predicted_execution_score\"] is not None\n    assert 0 <= float(row[\"predicted_execution_score\"\
        ]) <= 100\n    if row[\"fill_price\"] is not None:\n        assert row[\"fill_time\"] is not None\n        assert row[\"realized_entry_slippage_atr\"\
        ] is not None\n\nprint(\"Historical tick replay/TCA report validation: PASS\")\nprint(f\"Observations: {overall['observations']} | fills:\
        \ {overall['fills']}\")\nPY\n"
    - name: Upload TCA artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: historical-tick-replay-tca
        path: 'execution_calibration.json

          execution_tca.json

          execution_tca.csv

          '
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      max_instruments:
        description: 0 = discover all eligible instruments; runtime governor prevents runaway scans
        required: false
        default: '0'
        type: string
      categories:
        description: Catalog categories to scan; every eligible live-catalog instrument in these categories is eligible for discovery
        required: false
        default: forex,commodity,crypto
        type: string
      top_n:
        description: Number of qualified setups / WAIT candidates to display
        required: false
        default: '5'
        type: string
      runtime_minutes:
        description: Maximum scanner runtime in minutes; 0 uses the safe default
        required: false
        default: '8'
        type: string
      scan_mode:
        description: ONCE = one complete scan; UNTIL_POSITION = repeat full scans until a confirmed position is found or the safety limit is reached
        required: false
        default: ONCE
        type: choice
        options:
        - ONCE
        - UNTIL_POSITION
      until_position_max_minutes:
        description: Safety limit for UNTIL_POSITION mode (maximum 55 minutes)
        required: false
        default: '55'
        type: string
      poll_seconds:
        description: Pause between full scans in UNTIL_POSITION mode
        required: false
        default: '30'
        type: string
      fast_candidate_limit:
        description: Maximum instruments promoted from the fast 1H/15M/5M filter to deep analysis
        required: false
        default: '8'
        type: string
      fast_min_score:
        description: Minimum fast-filter opportunity score to promote an instrument; lower values show more potential setups
        required: false
        default: '55'
        type: string
      run_tca:
        description: Run historical tick replay + execution TCA calibration; uses the LSE WebSocket historical source and automatically feeds
          E2E.
        required: false
        default: false
        type: boolean
      tca_symbols:
        description: Comma-separated symbols for execution replay
        required: false
        default: EUR/USD,GBP/USD,XAU/USD,BTC/USD
        type: string
      tca_start:
        description: UTC replay start (ISO timestamp); blank = last 23h30m. WebSocket replay is attempted first; if zero/insufficient, validated
          vault history is used and filtered locally to the exact resolved UTC window.
        required: false
        default: ''
        type: string
      tca_end:
        description: UTC replay end (ISO timestamp); blank = now. Historical ticks are filtered locally to this exact UTC window.
        required: false
        default: ''
        type: string
      tca_horizon_minutes:
        description: Maximum realized markout horizon after a simulated fill
        required: false
        default: '60'
        type: string
      tca_observation_seconds:
        description: Historical top-of-book observation window used to predict execution conditions
        required: false
        default: '4'
        type: string
      tca_max_setups:
        description: Maximum historical closed-candle setup snapshots per symbol
        required: false
        default: '500'
        type: string
      tca_min_ticks:
        description: Minimum ticks required in an execution observation window
        required: false
        default: '3'
        type: string
      tca_calibration_min_observations:
        description: Minimum filled observations required before empirical execution-score calibration is trusted; never used to hand-tune live
          thresholds
        required: false
        default: '100'
        type: string
      run_e2e:
        description: 'Run historical nine-strategy end-to-end replay: signal -> trigger -> bid/ask fill -> MFE/MAE -> TP/SL'
        required: false
        default: false
        type: boolean
      e2e_symbols:
        description: Comma-separated symbols for end-to-end replay
        required: false
        default: EUR/USD,GBP/USD,XAU/USD,BTC/USD
        type: string
      e2e_start:
        description: UTC E2E replay start (ISO timestamp); blank = last 23h30m. WebSocket replay is attempted first; if zero/insufficient, validated
          vault history is used and filtered locally to the exact resolved UTC window.
        required: false
        default: ''
        type: string
      e2e_end:
        description: UTC E2E replay end (ISO timestamp); blank = now. Historical ticks are filtered locally to this exact UTC window.
        required: false
        default: ''
        type: string
      e2e_max_setups:
        description: Maximum historical qualified signal setups across all symbols
        required: false
        default: '500'
        type: string
      e2e_horizon_minutes:
        description: Maximum historical holding horizon used for realized TP/SL and MFE/MAE
        required: false
        default: '240'
        type: string
  schedule:
  - cron: 5,20,35,50 * * * *
