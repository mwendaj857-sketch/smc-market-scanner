        \ for x in os.environ.get(\"E2E_SYMBOLS\",\"\").split(\",\") if x.strip()]\nassert symbols, \"E2E_SYMBOLS is empty\"\nstart=os.environ.get(\"\
        E2E_START\",\"\").strip()\nend=os.environ.get(\"E2E_END\",\"\").strip()\ndef parse(v):\n    if not v: return None\n    return datetime.fromisoformat(v.replace(\"\
