    - name: Upload scanner results
      if: ${{ success() && hashFiles('scan_results.json') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: scanner-results
        path: scan_results.json
        if-no-files-found: error
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.run_tca != true && inputs.run_e2e != true) || needs.tca_replay.result
      == 'success') && (github.event_name != 'workflow_dispatch' || inputs.run_e2e != true || needs.e2e_replay.result == 'success') }}
  e2e_replay:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.run_e2e == true || inputs.run_tca == true) && needs.tca_replay.result
      == 'success' }}
    needs: tca_replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      E2E_SYMBOLS: ${{ inputs.e2e_symbols || 'EUR/USD,GBP/USD,XAU/USD,BTC/USD' }}
      E2E_START: ${{ inputs.e2e_start || '' }}
      E2E_END: ${{ inputs.e2e_end || '' }}
      E2E_MAX_SETUPS: ${{ inputs.e2e_max_setups || '500' }}
      E2E_HORIZON_MINUTES: ${{ inputs.e2e_horizon_minutes || '240' }}
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install end-to-end replay dependencies
      run: 'set -euo pipefail

        python -m pip install --upgrade pip

        python -m pip install "lse-data[frames]==0.14.0" "PyYAML>=6.0,<7" "feedparser>=6.0,<7"

        '
    - name: Download empirical execution calibration
      uses: actions/download-artifact@v7
      with:
        name: historical-tick-replay-tca
        path: .
    - name: Validate empirical calibration artifact
      run: 'set -euo pipefail

        test -f execution_calibration.json

        python - <<''PY''

        import json

        from pathlib import Path

        cal=json.loads(Path("execution_calibration.json").read_text(encoding="utf-8"))

        assert isinstance(cal, dict), "execution_calibration.json must contain an object"

        assert cal.get("version") == "v12.7-execution-calibration", "Unexpected calibration version"

        assert cal.get("status") in ("CALIBRATED","FALLBACK","DEFAULT"), f"Unexpected calibration status: {cal.get(''status'')}"

        assert 50 <= float(cal.get("min_confirmed_score",70)) <= 95

        assert 50 <= float(cal.get("high_quality_score",85)) <= 99

        print(f"CALIBRATION ARTIFACT OK | status={cal.get(''status'')} | source={cal.get(''source'')} | min={cal.get(''min_confirmed_score'')}
        | high={cal.get(''high_quality_score'')}")

        PY

        '
    - name: Validate end-to-end replay configuration
