        \ central-limit-order-book model: without depth/queue\n# data we explicitly model only executable top-of-book conditions,\
        \ quote\n# freshness, spread cost, micro-price movement and chase risk.\nLIVE_TICK_TIMEOUT_SECONDS = 4.0\nLIVE_TICK_MIN_SAMPLES\
        \ = 3\nMAX_QUOTE_AGE_SECONDS = 3.0\nMAX_SPREAD_ATR = 0.35\nMAX_SPREAD_MEDIAN_MULTIPLIER = 2.50\nEXECUTION_STABILITY_MAX_ATR_PER_TICK\
        \ = 0.12\nEXECUTION_SCORE_MIN = 70.0\nEXECUTION_HIGH_QUALITY_SCORE = 85.0\nEXECUTION_CALIBRATION_SOURCE = \"static_default\"\
        \n# Use only an empirically calibrated file produced by the preceding\n# calibration job. The live scan never tunes\
        \ thresholds on its own data.\ncalibration_path = Path(\"execution_calibration.json\")\nif calibration_path.exists():\n\
        \    try:\n        calibration = json.loads(calibration_path.read_text(encoding=\"utf-8\"))\n        if calibration.get(\"\
        status\") == \"CALIBRATED\":\n            EXECUTION_SCORE_MIN = float(calibration.get(\"min_confirmed_score\", EXECUTION_SCORE_MIN))\n\
        \            EXECUTION_HIGH_QUALITY_SCORE = float(calibration.get(\"high_quality_score\", EXECUTION_HIGH_QUALITY_SCORE))\n\
        \            EXECUTION_CALIBRATION_SOURCE = str(calibration.get(\"source\", \"empirical_tca\"))\n    except Exception\
