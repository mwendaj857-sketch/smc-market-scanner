        \   except (TypeError, ValueError):\n            rr_component = 0.0\n\n    news_component = {\n        \"IMMEDIATE_HIGH\"\
        : 0.0,\n        \"POST_EVENT_ALIGNED\": 20.0,\n        \"POST_EVENT_UNCLEAR\": 10.0,\n        \"POST_EVENT_CONFLICT\"\
