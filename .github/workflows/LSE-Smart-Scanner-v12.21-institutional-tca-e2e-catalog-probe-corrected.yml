        python - <<'PY'
        import json
        import math
        import os
        from datetime import datetime
        from pathlib import Path
        from urllib.parse import urlencode
        from urllib.request import Request, urlopen

        import matplotlib
        matplotlib.use("Agg")
        import matplotlib.dates as mdates
        import matplotlib.pyplot as plt

        token = os.environ.get("BOT_TOKEN", "").strip()
        chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
        if not token:
            raise SystemExit("Telegram delivery blocked: BOT_TOKEN repository secret is missing")
        if not chat_id:
            raise SystemExit("Telegram delivery blocked: TELEGRAM_CHAT_ID repository secret is missing")

        TOP_N = max(1, int(os.environ.get("TOP_N", "5") or "5"))
        data = json.loads(Path("scan_results.json").read_text(encoding="utf-8"))
        if not isinstance(data, dict):
            raise SystemExit("Telegram delivery blocked: scan_results.json is not an object")

        def fmt_score(value):
            try:
                return f"{float(value):.1f}/100"
            except Exception:
                return "UNAVAILABLE"

        def fmt_rr(value):
            try:
                return f"{float(value):.2f}R"
            except Exception:
                return "UNAVAILABLE"

        def fmt_price(value):
            try:
                x = float(value)
                if not math.isfinite(x):
                    return "UNAVAILABLE"
                return f"{x:.6g}"
            except Exception:
                return "UNAVAILABLE"

        def confirmed_line(item):
            symbol = item.get("symbol", "UNKNOWN")
            side = item.get("side", "NEUTRAL")
            trade_type = item.get("trade_type", "UNKNOWN")
            levels = item.get("levels") or []
            level_text = "UNAVAILABLE"
            if isinstance(levels, list) and len(levels) >= 3:
                level_text = f"Entry {fmt_price(levels[0])} | SL {fmt_price(levels[1])} | TP {fmt_price(levels[2])}"
            return "\n".join([
                f"🟢 {symbol} | {side} | {trade_type} | {', '.join(item.get('setup_types', [])) or 'CONSENSUS'}",
                f"Strategy score: {fmt_score(item.get('strategy_score'))}",
                f"Execution quality: {fmt_score(item.get('execution_quality_score'))}",
                f"{level_text} | R:R {fmt_rr(item.get('rr'))}",
                f"TP ladder: {' | '.join(f'TP{i+1} {fmt_price(x)}' for i, x in enumerate(item.get('take_profit_levels', []))) or 'UNAVAILABLE'}",
                f"Horizon: {item.get('horizon', 'UNAVAILABLE')}",
                f"Monthly master bias: {item.get('monthly_bias', 'UNAVAILABLE')}",
                f"Signal timeframe(s): {', '.join(item.get('signal_timeframes', [])) or 'UNAVAILABLE'}",
                f"Execution timeframe: {item.get('position_timeframe', 'UNAVAILABLE')}",
                f"Alignment: {item.get('alignment_chain', {}).get('count', 'UNAVAILABLE')}/6",
                f"Event/news risk: {item.get('event_level', 'UNAVAILABLE')} | {item.get('event_alignment', {}).get('state', 'UNAVAILABLE')}",
                f"RSS risk: {item.get('rss_news_risk', 'UNAVAILABLE')}",
            ])

        def make_candlestick_chart(item, output_dir):
            """Create an execution-timeframe candlestick chart for confirmed entries only."""
            candles = item.get("chart_candles")
            levels = item.get("levels")
            status = str(item.get("status", ""))
            if not status.startswith("CONFIRMED "):
                return None
            if not isinstance(candles, list) or len(candles) < 10:
                raise RuntimeError(f"Insufficient chart candles for {item.get('symbol', 'UNKNOWN')}")
            if not isinstance(levels, list) or len(levels) < 3:
                raise RuntimeError(f"Missing Entry/SL/TP levels for {item.get('symbol', 'UNKNOWN')}")

            rows = candles[-80:]
            parsed = []
            for row in rows:
                try:
                    ts = str(row["timestamp"])
                    if ts.endswith("Z"):
                        ts = ts[:-1] + "+00:00"
                    dt = datetime.fromisoformat(ts)
                    values = [float(row[k]) for k in ("open", "high", "low", "close")]
                    if not all(math.isfinite(v) for v in values):
                        raise ValueError("non-finite OHLC")
                    parsed.append((dt, *values))
                except Exception as exc:
                    raise RuntimeError(f"Invalid chart candle for {item.get('symbol', 'UNKNOWN')}: {exc}")

            dates = [x[0] for x in parsed]
            opens = [x[1] for x in parsed]
            highs = [x[2] for x in parsed]
            lows = [x[3] for x in parsed]
            closes = [x[4] for x in parsed]
            xvals = mdates.date2num(dates)
            width = (xvals[1] - xvals[0]) * 0.68 if len(xvals) > 1 else 0.01

            fig, ax = plt.subplots(figsize=(12, 6.8), dpi=150)
            fig.patch.set_facecolor("#0b0f14")
            ax.set_facecolor("#0b0f14")

            for x, o, h, l, c in zip(xvals, opens, highs, lows, closes):
                bullish = c >= o
                body_low = min(o, c)
                body_height = max(abs(c - o), 1e-12)
                candle_color = "#22c55e" if bullish else "#ef4444"
                ax.vlines(x, l, h, color=candle_color, linewidth=1.0)
                ax.add_patch(plt.Rectangle(
                    (x - width / 2, body_low), width, body_height,
                    facecolor=candle_color, edgecolor=candle_color,
                    fill=True, alpha=0.85, linewidth=0.8
                ))

            entry, sl, tp = [float(v) for v in levels[:3]]
            ax.axhline(entry, color="#3b82f6", linestyle="--", linewidth=1.5, label=f"ENTRY {fmt_price(entry)}")
            ax.axhline(sl, color="#ef4444", linestyle="--", linewidth=1.5, label=f"SL {fmt_price(sl)}")
            ax.axhline(tp, color="#22c55e", linestyle="--", linewidth=1.5, label=f"TP {fmt_price(tp)}")

            ax.set_title(
                f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | {item.get('trade_type', 'UNKNOWN')} | {item.get("chart_timeframe", item.get("position_timeframe", "TF")).upper()}",
                fontsize=13, pad=12
            )
            ax.text(
                0.01, 0.98,
                f"Entry {fmt_price(entry)}   SL {fmt_price(sl)}   TP {fmt_price(tp)}   R:R {fmt_rr(item.get('rr'))}",
                transform=ax.transAxes, va="top", fontsize=9
            )
            ax.grid(True, alpha=0.15)
            ax.xaxis_date()
            ax.xaxis.set_major_formatter(mdates.DateFormatter("%d %b\n%H:%M"))
            ax.tick_params(axis="both", labelsize=8)
            ax.legend(loc="upper left", fontsize=8, frameon=False)
            fig.autofmt_xdate()
            fig.tight_layout()

            output_dir.mkdir(parents=True, exist_ok=True)
            safe_symbol = str(item.get("symbol", "UNKNOWN")).replace("/", "_").replace(" ", "_")
            path = output_dir / f"{safe_symbol}_{item.get('side', 'NEUTRAL')}.png"
            fig.savefig(path, bbox_inches="tight")
            plt.close(fig)
            return path

        def send_message(text):
            api = f"https://api.telegram.org/bot{token}/sendMessage"
            payload = urlencode({
                "chat_id": chat_id,
                "text": text,
                "disable_web_page_preview": "true",
            }).encode("utf-8")
            request = Request(api, data=payload, method="POST")
            with urlopen(request, timeout=30) as response:
                result = json.loads(response.read().decode("utf-8"))
            if not result.get("ok"):
                raise SystemExit(f"Telegram API rejected message: {result}")

        def send_photo(path, caption):
            # Telegram sendPhoto uses multipart/form-data; keep the implementation
            # dependency-free so the workflow does not need python-telegram-bot.
            boundary = "----LSEScannerBoundary7f9d"
            fields = {"chat_id": chat_id, "caption": caption[:1024]}
            body = bytearray()
            for name, value in fields.items():
                body.extend(f"--{boundary}\r\n".encode())
                body.extend(f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode())
                body.extend(str(value).encode("utf-8"))
                body.extend(b"\r\n")
            body.extend(f"--{boundary}\r\n".encode())
            body.extend(b'Content-Disposition: form-data; name="photo"; filename="signal_chart.png"\r\n')
            body.extend(b"Content-Type: image/png\r\n\r\n")
            body.extend(Path(path).read_bytes())
            body.extend(b"\r\n")
            body.extend(f"--{boundary}--\r\n".encode())

            api = f"https://api.telegram.org/bot{token}/sendPhoto"
            request = Request(
                api,
                data=bytes(body),
                headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                method="POST",
            )
            with urlopen(request, timeout=60) as response:
                result = json.loads(response.read().decode("utf-8"))
            if not result.get("ok"):
                raise SystemExit(f"Telegram API rejected chart: {result}")

        sections = []
        confirmed_items = []
        buckets = [
            ("INTRADAY", data.get("intraday_entries", [])),
            ("SCALP", data.get("scalp_entries", [])),
            ("SWING/HOLD", data.get("swing_entries", [])),
            ("ADAPTIVE PRICE-MOVEMENT", data.get("adaptive_entries", [])),
        ]
        for label, items in buckets:
            if items:
                sections.append(f"🎯 CONFIRMED {label}")
                for item in items[:5]:
                    sections.append(confirmed_line(item))
                    confirmed_items.append(item)

        if not sections:
            sections.append("⛔ NO CONFIRMED ENTRY")
            sections.append(
                "No signal passed the 2-of-9 / 3-method route together with "
                "the monthly master-bias and timeframe-agreement gates."
            )

        sniper_items = data.get("sniper_opportunities", [])[:5]
        if sniper_items:
            sections.append("🎯 SNIPER PRECISION OPPORTUNITIES")
            for item in sniper_items:
                s = item.get("sniper") or {}
                zone = s.get("entry_zone") or []
                zone_text = "–".join(fmt_price(x) for x in zone) if zone else "UNAVAILABLE"
                sections.append(
                    f"{item.get('symbol','UNKNOWN')} | {s.get('side','NEUTRAL')} | {s.get('status','WATCH')} | "
                    f"Score {fmt_score(s.get('score'))} | R:R {fmt_rr(s.get('rr'))}\n"
                    f"Entry {fmt_price(s.get('entry'))} | SL {fmt_price(s.get('sl'))} | TP1 {fmt_price(s.get('tp'))}\n"
                    f"Entry zone {zone_text} | Sweep {bool(s.get('liquidity_sweep'))} | "
                    f"Displacement {s.get('displacement')} | MSS {s.get('mss')} | FVG {s.get('fvg_signal')} | HTF agree {s.get('higher_tf_agrees')}"
                )

        waiting = data.get("setup_waiting", [])[:3]
        potential = data.get("potential", [])[:3]
        if waiting:
            sections.append("🟡 WAIT — NOT CONFIRMED / NOT AN ENTRY")
            for item in waiting:
                sections.append(
                    f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                    f"{item.get('trade_type', 'UNKNOWN')}\n"
                    f"Strategy score: {fmt_score(item.get('strategy_score'))} | "
                    f"Execution quality: {fmt_score(item.get('execution_quality_score'))}\n"
                    "Status: WAIT — NOT CONFIRMED / NOT AN ENTRY\n"
                    f"Reason: {'; '.join(item.get('blockers', [])[:2]) or 'execution/risk condition incomplete'}"
                )
        if potential:
            sections.append("👀 POTENTIAL — NOT CONFIRMED")
            for item in potential:
                sections.append(
                    f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                    f"{item.get('trade_type', 'UNKNOWN')}\n"
                    "Status: POTENTIAL — NOT CONFIRMED / NOT AN ENTRY"
                )

        intel = data.get("intelligence", {})
        news_count = data.get("rss_items", len(intel.get("news", [])) if isinstance(intel, dict) else 0)
        sections.append(
            f"📰 RSS intelligence: ACTIVE | {news_count} item(s) | "
            f"feeds configured: {data.get('rss_feeds_configured', 0)}"
        )
        sections.append(
            f"📊 Scan: {data.get('complete', 0)} fully analyzed | "
            f"{data.get('errors', 0)} analysis errors"
        )
        ff = data.get("fast_filter", {})
        sections.append(
            f"⚡ Fast filter: {ff.get('scanned', 0)} scanned -> {ff.get('promoted', 0)} deep analyzed | "
            f"{ff.get('watch_only', 0)} watch-only"
        )
        cal_meta = data.get("execution_calibration", {}) if isinstance(data.get("execution_calibration", {}), dict) else {}
        sections.append(
            f"🧪 Execution calibration: {cal_meta.get('source', 'static_default')} | "
            f"confirmed ≥ {float(cal_meta.get('min_confirmed_score', 70.0)):.1f} | "
            f"high-quality ≥ {float(cal_meta.get('high_quality_score', 85.0)):.1f}"
        )
        fast_entries = ff.get("candidates", [])[:TOP_N]
        if fast_entries:
            sections.append("⚡ FAST FILTER ENTRY PLANS — CONDITIONAL / NOT CONFIRMED")
            for item in fast_entries:
                sections.append(
                    f"{item.get('symbol','UNKNOWN')} | {item.get('side','NEUTRAL')} | SCORE {fmt_score(item.get('score'))}\n"
                    f"Entry {fmt_price(item.get('entry_price'))} | SL {fmt_price(item.get('stop_loss'))} | TP {fmt_price(item.get('take_profit'))} | R:R {fmt_rr(item.get('rr'))}\n"
                    f"Entry state: {item.get('entry_status','UNAVAILABLE')} | basis: CLOSED-CANDLE trigger"
                )
        sections.append("🤖 Automatic trading: DISABLED")

        header = "📡 LSE SMART SIGNAL SCANNER v12.7"
        body = header + "\n\n" + "\n\n".join(sections)

        # Send text first, preserving the explicit WAIT/POTENTIAL non-entry wording.
        chunks = []
        current = ""
        for section in body.split("\n\n"):
            candidate = section if not current else current + "\n\n" + section
            if len(candidate) <= 4000:
                current = candidate
            else:
                if current:
                    chunks.append(current)
                while len(section) > 4000:
                    chunks.append(section[:4000])
                    section = section[4000:]
                current = section
        if current:
            chunks.append(current)

        for chunk in chunks:
            send_message(chunk)

        # Only CONFIRMED entries get a chart. WAIT and POTENTIAL are never rendered
        # as trade charts, so Telegram cannot visually imply a confirmed trade.
        chart_dir = Path("telegram_charts")
        sent_charts = 0
        for item in confirmed_items:
            chart_path = make_candlestick_chart(item, chart_dir)
            caption = (
                f"🕯️ CONFIRMED {item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                f"{item.get('trade_type', 'UNKNOWN')}\n"
                f"Entry {fmt_price(item['levels'][0])} | SL {fmt_price(item['levels'][1])} | TP {fmt_price(item['levels'][2])} | R:R {fmt_rr(item.get('rr'))}"
            )
            send_photo(chart_path, caption)
            sent_charts += 1

        print(f"Telegram delivery: PASS ({len(chunks)} text message(s), {sent_charts} chart(s))")
        PY
    - name: Upload scanner results
      if: ${{ success() && hashFiles('scan_results.json') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: scanner-results
        path: scan_results.json
        if-no-files-found: error
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.run_tca != true && inputs.run_e2e != true) ||
      needs.tca_replay.result == 'success') && (github.event_name != 'workflow_dispatch' || inputs.run_e2e != true || needs.e2e_replay.result
      == 'success') }}
  e2e_replay:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.run_e2e == true || inputs.run_tca == true) &&
      needs.tca_replay.result == 'success' }}
    needs: tca_replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      E2E_SYMBOLS: ${{ inputs.e2e_symbols || 'EUR/USD,GBP/USD,XAU/USD,BTC/USD' }}
      E2E_START: ${{ inputs.e2e_start || '' }}
      E2E_END: ${{ inputs.e2e_end || '' }}
      E2E_MAX_SETUPS: ${{ inputs.e2e_max_setups || '500' }}
      E2E_HORIZON_MINUTES: ${{ inputs.e2e_horizon_minutes || '240' }}
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install end-to-end replay dependencies
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install "lse-data[frames]==0.14.0" "PyYAML>=6.0,<7" "feedparser>=6.0,<7"
    - name: Download empirical execution calibration
      uses: actions/download-artifact@v8
      with:
        name: historical-tick-replay-tca
        path: .
    - name: Validate empirical calibration artifact
      run: |
        set -euo pipefail
        test -f execution_calibration.json
        python - <<'PY'
        import json
        from pathlib import Path
        cal=json.loads(Path("execution_calibration.json").read_text(encoding="utf-8"))
        assert isinstance(cal, dict), "execution_calibration.json must contain an object"
        assert cal.get("version") == "v12.7-execution-calibration", "Unexpected calibration version"
        assert cal.get("status") in ("CALIBRATED","FALLBACK","DEFAULT"), f"Unexpected calibration status: {cal.get('status')}"
        assert 50 <= float(cal.get("min_confirmed_score",70)) <= 95
        assert 50 <= float(cal.get("high_quality_score",85)) <= 99
        print(f"CALIBRATION ARTIFACT OK | status={cal.get('status')} | source={cal.get('source')} | min={cal.get('min_confirmed_score')} | high={cal.get('high_quality_score')}")
        PY
    - name: Validate end-to-end replay configuration
      run: |
        set -euo pipefail
        python - <<'PY'
        import os
        from datetime import datetime, timezone
        from pathlib import Path
        symbols=[x.strip() for x in os.environ.get("E2E_SYMBOLS","").split(",") if x.strip()]
        assert symbols, "E2E_SYMBOLS is empty"
        start=os.environ.get("E2E_START","").strip()
        end=os.environ.get("E2E_END","").strip()
        def parse(v):
            if not v: return None
            return datetime.fromisoformat(v.replace("Z","+00:00")).astimezone(timezone.utc)
        s=parse(start); e=parse(end)
        if s and e:
            assert e>s, "E2E_END must be later than E2E_START"
        if s and e and (e-s).total_seconds()>7*86400:
            raise SystemExit("E2E replay is capped at 7 days per run; split longer studies")
        n=int(os.environ.get("E2E_MAX_SETUPS","500"))
        h=int(os.environ.get("E2E_HORIZON_MINUTES","240"))
        assert 50 <= n <= 5000, "E2E_MAX_SETUPS must be 50..5000"
        assert 15 <= h <= 1440, "E2E_HORIZON_MINUTES must be 15..1440"
        print(f"E2E CONFIG OK | symbols={symbols} | max_setups={n} | horizon={h}m | default_window=23h30m")
        PY
    - name: Historical nine-strategy end-to-end replay
      run: |
        set -euo pipefail
        python - <<'PY'
        import bisect, csv, json, math, os, statistics
        from collections import defaultdict
        from datetime import datetime, timedelta, timezone
        from lse import LSE

        API_KEY=os.environ.get("LSE_API_KEY","").strip()
        if not API_KEY:
            raise SystemExit("E2E replay requires LSE_API_KEY")
        SYMBOLS=[x.strip() for x in os.environ.get("E2E_SYMBOLS","").split(",") if x.strip()]
        client=LSE(api_key=API_KEY, timeout=120)
        MAX_SETUPS=max(50,min(5000,int(os.environ.get("E2E_MAX_SETUPS","500"))))
        HORIZON=max(15,min(1440,int(os.environ.get("E2E_HORIZON_MINUTES","240"))))
        try:
            calibration=json.load(open("execution_calibration.json",encoding="utf-8"))
        except Exception as exc:
            raise SystemExit(f"Missing/invalid execution calibration artifact: {type(exc).__name__}: {exc}")
        CAL_STATUS=calibration.get("status","DEFAULT")
        EXEC_MIN=float(calibration.get("min_confirmed_score",70.0))
        EXEC_HIGH=float(calibration.get("high_quality_score",85.0))
        if not (50.0<=EXEC_MIN<=95.0 and EXEC_MIN<=EXEC_HIGH<=99.0):
            raise SystemExit("Invalid calibrated execution thresholds")
        print(f"E2E execution calibration: status={CAL_STATUS} min={EXEC_MIN:.1f} high={EXEC_HIGH:.1f}")
        print("E2E POLICY: no manual threshold tuning; promotion decisions must come from historical TCA evidence and out-of-sample validation.")

        def parse_ts(v):
            if isinstance(v,datetime):
                return v.astimezone(timezone.utc) if v.tzinfo else v.replace(tzinfo=timezone.utc)
            return datetime.fromisoformat(str(v).replace("Z","+00:00")).astimezone(timezone.utc)

        def now_utc(): return datetime.now(timezone.utc)

        def api_date(dt):
            """LSE historical REST boundaries require YYYY-MM-DD; replay precision is restored locally."""
            return dt.date().isoformat()

        requested_end = parse_ts(os.environ["E2E_END"]) if os.environ.get("E2E_END","").strip() else None
        requested_start = parse_ts(os.environ["E2E_START"]) if os.environ.get("E2E_START","").strip() else None

        def catalog_probe(symbol):
            try:
                entries=[
                    x for x in client.catalog()
                    if str(x.get("symbol","")).strip().upper()==symbol.upper()
                    and str(x.get("dataset","")).strip().lower()!="options"
                ]
            except Exception as exc:
                return {"status":"CATALOG_ERROR","error":f"{type(exc).__name__}: {exc}"}
            if not entries:
                return {"status":"NOT_IN_CATALOG","error":f"{symbol} not present in live vault catalog"}
            entries.sort(key=lambda x:int(x.get("ticks") or 0), reverse=True)
            x=entries[0]
            try:
                first=parse_ts(x.get("first")) if x.get("first") else None
                last=parse_ts(x.get("last")) if x.get("last") else None
            except Exception as exc:
                return {"status":"CATALOG_BAD_RANGE","error":f"{type(exc).__name__}: {exc}","entry":x}
            return {
                "status":"AVAILABLE" if int(x.get("ticks") or 0)>0 and first and last else "NO_TICK_SPAN",
                "symbol":x.get("symbol") or symbol,
                "dataset":x.get("dataset"),
                "ticks":int(x.get("ticks") or 0),
                "first":first,
                "last":last,
                "entry":x,
            }

        catalog_meta={s:catalog_probe(s) for s in SYMBOLS}
        for s,m in catalog_meta.items():
            if m.get("status")=="AVAILABLE":
                print(f"CATALOG {s}: dataset={m['dataset']} ticks={m['ticks']} first={m['first'].isoformat()} last={m['last'].isoformat()}")
            else:
                print(f"CATALOG {s}: status={m.get('status')} error={m.get('error')}")

        available=[m for m in catalog_meta.values() if m.get("status")=="AVAILABLE"]
        if requested_start is None and requested_end is None:
            if not available:
                raise SystemExit("No requested symbol has an available tick span in the live vault catalog")
            end=min([now_utc()]+[m["last"] for m in available])
            start=end-timedelta(hours=23,minutes=30)
            common_first=max(m["first"] for m in available)
            if common_first>start:
                start=common_first
        elif requested_start is None:
            end=requested_end
            start=end-timedelta(hours=23,minutes=30)
        else:
            start=requested_start
            end=requested_end or now_utc()

        if end<=start: raise SystemExit("E2E_END must be later than E2E_START")
        if (end-start).total_seconds()>7*86400: raise SystemExit("E2E replay capped at 7 days")
        print(f"E2E REQUESTED UTC WINDOW: {os.environ.get('E2E_START','').strip() or '<blank>'} -> {os.environ.get('E2E_END','').strip() or '<blank>'}")
        print(f"E2E RESOLVED UTC WINDOW: {start.isoformat().replace('+00:00','Z')} -> {end.isoformat().replace('+00:00','Z')}")

        # Extract the exact strategy functions from the checked-out scanner.
        # We execute only imports, constant/config assignments and function definitions;
        # the live scanner's catalog/network main loop is never executed.
        workflow=None
        workflow_ref=os.environ.get("GITHUB_WORKFLOW_REF","")
        if ".github/workflows/" in workflow_ref:
            candidate=workflow_ref.split(".github/workflows/",1)[1].split("@",1)[0]
            if os.path.exists(".github/workflows/"+candidate):
                workflow=".github/workflows/"+candidate
        if not workflow:
            # Avoid hard-coding an obsolete versioned workflow filename.
            workflow_candidates=list(__import__("pathlib").Path(".github/workflows").glob("*.yml"))
            matches=[]
            for p in workflow_candidates:
                try:
                    s=p.read_text(encoding="utf-8")
                except OSError:
                    continue
                if "FAST FILTER -> DEEP ANALYSIS" in s and "def dominant(methods, minimum=2)" in s:
                    matches.append(str(p))
            if len(matches)==1:
                workflow=matches[0]
            elif matches:
                workflow=sorted(matches)[-1]
        if not workflow:
            workflow_candidates=list(__import__("pathlib").Path(".github/workflows").glob("*.yml"))
            matches=[str(p) for p in workflow_candidates if "LSE-Smart-Scanner" in p.name]
            if len(matches)==1:
                workflow=matches[0]
            elif matches:
                # Prefer the highest-versioned scanner rather than an arbitrary directory order.
                workflow=sorted(matches)[-1]
        if not workflow: raise SystemExit("Could not locate scanner workflow for exact strategy-function extraction")
        source=open(workflow,encoding="utf-8").read()
        if "python - <<'PY'" not in source: raise SystemExit("Scanner Python block not found")
        import re
        import yaml
        workflow_doc = yaml.safe_load(source)
        scan_job = workflow_doc.get("jobs", {}).get("scan", {})
        run_blocks = [
            step.get("run", "")
            for step in scan_job.get("steps", [])
            if isinstance(step, dict) and isinstance(step.get("run"), str)
        ]
        scanner_candidates = []
        for run_block in run_blocks:
            if "from lse import LSE" not in run_block:
                continue
            blocks = re.findall(
                r"python\s+-\s+<<[\'\"]?PY[\'\"]?\r?\n(.*?)\r?\nPY(?:\r?\n|$)",
                run_block,
                flags=re.S,
            )
            scanner_candidates.extend(
                block for block in blocks
                if "FAST FILTER -> DEEP ANALYSIS" in block
                and "def dominant(methods, minimum=2)" in block
                and "print(\"LSE SMART SIGNAL SCANNER v12.7" in block
                and "def now_utc" in block
            )
        if len(scanner_candidates) != 1:
            raise SystemExit(f"Could not safely extract the main scanner Python block; candidates={len(scanner_candidates)}")
        scanner = scanner_candidates[0]
        import ast
        tree=ast.parse(scanner)
        allowed=[]
        for node in tree.body:
            if isinstance(node,(ast.Import,ast.ImportFrom,ast.FunctionDef,ast.AsyncFunctionDef)):
                allowed.append(node)
            elif isinstance(node,ast.Assign):
                # Preserve scanner constants/config needed by strategy functions.
                if all(isinstance(t,ast.Name) for t in node.targets):
                    names=[t.id for t in node.targets]
                    if any(n in {"TF","DIRECT_TF","MIN_BARS","FETCH_LIMIT","FAST_FETCH_LIMIT",
                                 "ENTRY_HORIZONS","POSITION_TIMEFRAME_PROFILES","POSITION_TIMEFRAMES",
                                 "TRIGGER_SWING_LOOKBACK","TRIGGER_SWING_WINDOW","ENTRY_BUFFER_ATR",
                                 "ENTRY_MAX_CHASE_ATR"} for n in names):
                        allowed.append(node)
        mod=ast.Module(body=allowed,type_ignores=[])
        ast.fix_missing_locations(mod)
        ns={}
        exec(compile(mod,workflow,"exec"),ns,ns)

        required=["atr","swings","direction","structure_signal","liquidity_signal",
                  "supply_demand_signal","candle_signal","fib_signal","trend_signal",
                  "indicator_signal","session_signal","smc_core","closed_breakout_level","levels"]
        missing=[x for x in required if x not in ns]
        if missing: raise SystemExit("Strategy extraction missing: "+", ".join(missing))

        def rows_from_result(raw):
            if hasattr(raw, "to_dict"):
                try:
                    frame=raw
                    if hasattr(frame,"columns") and hasattr(frame,"reset_index"):
                        try:
                            frame=frame.reset_index()
                        except Exception:
                            pass
                    records=frame.to_dict("records")
                except Exception:
                    records=raw.to_dict()
                if isinstance(records,list):
                    return records
                if isinstance(records,dict):
                    for key in ("data","rows","ticks","candles"):
                        if isinstance(records.get(key),list):
                            return records[key]
                    return [records]
            if isinstance(raw,dict):
                for key in ("data","rows","ticks","candles"):
                    if isinstance(raw.get(key),list):
                        return raw[key]
                return [raw]
            return list(raw) if isinstance(raw,(list,tuple)) else []

        def normalize_rows(raw):
            out=[]
            for x in rows_from_result(raw):
                if not isinstance(x,dict): continue
                ts=x.get("timestamp",x.get("ts",x.get("time",x.get("datetime",x.get("date",x.get("index"))))))
                try:
                    ts=parse_ts(ts)
                    o=float(x.get("open")); h=float(x.get("high")); l=float(x.get("low")); c=float(x.get("close"))
                    v=float(x.get("volume",0) or 0)
                except (TypeError,ValueError): continue
                if h<max(o,c,l) or l>min(o,h,c) or min(o,h,l,c)<=0: continue
                out.append({"timestamp":ts,"open":o,"high":h,"low":l,"close":c,"volume":v})
            return sorted(out,key=lambda r:r["timestamp"])

        def raw_schema(raw):
            """Inspect returned history columns without assuming a quote schema."""
            try:
                cols = list(getattr(raw, "columns", []) or [])
                if cols:
                    return [str(c) for c in cols]
            except Exception:
                pass
            keys = set()
            for row in rows_from_history(raw)[:20]:
                if isinstance(row, dict):
                    keys.update(str(k) for k in row.keys())
            return sorted(keys)

        def normalize_ticks(raw):
            out=[]
            for x in rows_from_result(raw):
                if not isinstance(x,dict): continue
                ts=x.get("timestamp",x.get("time",x.get("datetime")))
                bid=x.get("bid",x.get("bid_price",x.get("best_bid"))); ask=x.get("ask",x.get("ask_price",x.get("best_ask")))
                try:
                    ts=parse_ts(ts); bid=float(bid); ask=float(ask)
                except (TypeError,ValueError): continue
                if not (math.isfinite(bid) and math.isfinite(ask) and bid>0 and ask>0 and ask>=bid): continue
                price=x.get("price",x.get("last"))
                try: price=float(price) if price is not None else (bid+ask)/2
                except (TypeError,ValueError): price=(bid+ask)/2
                try: volume=float(x.get("volume",x.get("size",0)) or 0)
                except (TypeError,ValueError): volume=0.0
                out.append({"timestamp":ts,"bid":bid,"ask":ask,"price":price,"volume":volume})
            return sorted(out,key=lambda r:r["timestamp"])

        TF_LOOKBACK={
            "1mo": timedelta(days=365*6),
            "1d": timedelta(days=500),
            "4h": timedelta(days=120),
            "1h": timedelta(days=45),
            "15m": timedelta(days=14),
            "5m": timedelta(days=3),
        }
        TF_MIN={"1mo":60,"1d":120,"4h":180,"1h":240,"15m":360,"5m":500}
        TF_DELTA={"1d":timedelta(days=1),"4h":timedelta(hours=4),
                  "1h":timedelta(hours=1),"15m":timedelta(minutes=15),"5m":timedelta(minutes=5)}
        def closed_by_decision(row, tf, decision_time):
            ts=row["timestamp"]
            if tf=="1mo":
                return (ts.year, ts.month) < (decision_time.year, decision_time.month)
            return ts + TF_DELTA[tf] <= decision_time
        profile={
            "4h":{"type":"SWING/HOLD","context":("1d",)},
            "1h":{"type":"INTRADAY","context":("4h",)},
            "15m":{"type":"SCALP","context":("1h",)},
            "5m":{"type":"SCALP","context":("15m","1h")}
        }

        def strategy_signals(rows, category):
            smc=ns["smc_core"](rows)
            out=[
                {"name":"SMC","signal":smc.get("side") if smc.get("passed") else "NEUTRAL"},
            ]
            for name,fn in [
                ("Market Structure",ns["structure_signal"]),
                ("Liquidity",ns["liquidity_signal"]),
                ("Supply/Demand",ns["supply_demand_signal"]),
                ("Price Action",ns["candle_signal"]),
                ("Fibonacci",ns["fib_signal"]),
                ("Trend",ns["trend_signal"]),
                ("RSI+MACD",ns["indicator_signal"]),
                ("Session",lambda r: ns["session_signal"](r,category))
            ]:
                try: sig,_=fn(rows)
                except Exception: sig="NEUTRAL"
                out.append({"name":name,"signal":sig})
            return out

        def dominant(methods,minimum=2):
            b=sum(m["signal"]=="BUY" for m in methods)
            s=sum(m["signal"]=="SELL" for m in methods)
            if b>=minimum and b>s:return "BUY"
            if s>=minimum and s>b:return "SELL"
            return "NEUTRAL"

        def first_cross(ticks,times,start,end,side,trigger):
            lo=bisect.bisect_left(times,start); hi=bisect.bisect_right(times,end)
            for t in ticks[lo:hi]:
                px=t["ask"] if side=="BUY" else t["bid"]
                if (side=="BUY" and px>=trigger) or (side=="SELL" and px<=trigger): return t
            return None

        def markout_metrics(ticks,times,fill,side,fill_price,risk,horizon):
            endt=fill+timedelta(seconds=horizon*60)
            lo=bisect.bisect_left(times,fill); hi=bisect.bisect_right(times,endt)
            ex=[t["bid"] if side=="BUY" else t["ask"] for t in ticks[lo:hi]]
            if not ex:return None
            if side=="BUY":
                fav=max(ex)-fill_price; adverse=max(fill_price-x for x in ex); final=ex[-1]-fill_price
            else:
                fav=fill_price-min(ex); adverse=max(x-fill_price for x in ex); final=fill_price-ex[-1]
            return {"mfe_r":fav/max(risk,1e-12),"mae_r":adverse/max(risk,1e-12),
                    "markout_bps":final/max(fill_price,1e-12)*10000.0}

        def hit_order(ticks,times,fill,side,sl,tp,horizon):
            # If the simulated fill already crossed a fixed SL/TP because of a gap,
            # resolve that immediately rather than waiting for a later tick.
            first_fill_idx=bisect.bisect_left(times,fill)
            if first_fill_idx < len(ticks):
                first=ticks[first_fill_idx]
                px=first["bid"] if side=="BUY" else first["ask"]
                if side=="BUY":
                    if px<=sl:return "SL_FIRST",first
                    if px>=tp:return "TP_FIRST",first
                else:
                    if px>=sl:return "SL_FIRST",first
                    if px<=tp:return "TP_FIRST",first
            endt=fill+timedelta(minutes=horizon)
            lo=bisect.bisect_left(times,fill); hi=bisect.bisect_right(times,endt)
            for t in ticks[lo:hi]:
                px=t["bid"] if side=="BUY" else t["ask"]
                if side=="BUY":
                    if px<=sl:return "SL_FIRST",t
                    if px>=tp:return "TP_FIRST",t
                else:
                    if px>=sl:return "SL_FIRST",t
                    if px<=tp:return "TP_FIRST",t
            return "NEITHER",None

        def avg(xs):
            xs=[float(x) for x in xs if x is not None and math.isfinite(float(x))]
            return statistics.fmean(xs) if xs else None

        def pct(n,d): return (100*n/d) if d else None


        def tick_to_row(tick):
            ts = getattr(tick, "timestamp", None)
            bid = fnum(getattr(tick, "bid", None))
            ask = fnum(getattr(tick, "ask", None))
            price = fnum(getattr(tick, "price", None))
            volume = fnum(getattr(tick, "volume", None)) or 0.0
            if ts is None or bid is None or ask is None or bid <= 0 or ask <= 0 or ask < bid:
                return None
            try:
                dt = parse_ts(ts)
            except Exception:
                return None
            return {"timestamp":dt,"bid":bid,"ask":ask,
                    "price":price or (bid+ask)/2.0,"volume":volume}

        def load_replay_ticks(symbols, start, end):
            """WebSocket-first E2E tick loader with explicit vault raw-tick fallback.

            Hierarchy:
              1) WebSocket historical replay
              2) validate replay bid/ask ticks
              3) if zero/insufficient -> client.history(symbol)
              4) normalize raw tick DataFrame/rows
              5) filter locally to the exact UTC window
              6) validate bid/ask again
              7) if still insufficient -> DATA_UNAVAILABLE
            """
            ws_replay_allowed = (end-start).total_seconds() <= 23*3600+55*60
            E2E_MIN_TICKS = 100
            meta={}
            out={}

            def iso_z(dt):
                return dt.astimezone(timezone.utc).isoformat().replace("+00:00","Z")

            def load_ws(symbol,replay_start):
                rows=[]; seen=set(); live_seen=False; error=None; c=None
                try:
                    c=LSE(api_key=API_KEY)
                    for tick in c.stream([symbol],start=replay_start.isoformat()):
                        if str(getattr(tick,"symbol","") or "").strip().upper()!=symbol.upper(): continue
                        if getattr(tick,"replay",None) is not True:
                            live_seen=True
                            break
                        row=tick_to_row(tick)
                        if row is None: continue
                        ts=row["timestamp"]
                        if ts<start: continue
                        if ts>end: break
                        key=(ts,row["bid"],row["ask"])
                        if key in seen: continue
                        seen.add(key); rows.append(row)
                except Exception as exc: error=f"{type(exc).__name__}: {exc}"
                finally:
                    if c is not None:
                        try: c.disconnect()
                        except Exception: pass
                return sorted(rows,key=lambda r:r["timestamp"]),live_seen,error

            def load_vault(symbol):
                """Load catalog-pinned raw ticks and distinguish raw rows from valid quotes."""
                meta = catalog_meta.get(symbol, {})
                errors = []
                if meta.get("status") != "AVAILABLE":
                    return [], 0, 0, meta.get("error") or meta.get("status"), None, None, meta, []
                dataset = meta["dataset"]
                query_start = max(start, meta["first"])
                query_end = min(end, meta["last"])
                if query_end < query_start:
                    return [], 0, 0, "catalog history span does not intersect exact UTC window", None, None, meta, []
                raw_rows=[]; raw_count=0; schema=[]
                try:
                    targeted = client.history(symbol, dataset=dataset, timeframe="tick",
                                              start=iso_z(query_start), end=iso_z(query_end),
                                              dataframe=True, timeout=900)
                    schema = raw_schema(targeted)
                    raw_list = rows_from_history(targeted)
                    raw_count = len(raw_list)
                    raw_rows = normalize_ticks(targeted)
                except Exception as exc:
                    errors.append(f"targeted_history:{type(exc).__name__}: {exc}")
                filtered=[r for r in raw_rows if start <= r["timestamp"] <= end]
                quote_fields={"bid","ask","bid_price","ask_price","best_bid","best_ask"}
                has_quote_fields=bool(set(schema)&quote_fields)
                # If the exact export is empty, probe only a small 15-minute slice at the
                # catalog end. This is a bounded diagnostic and avoids a multi-million-row
                # whole-day export on the free 1M-row plan.
                if not filtered:
                    probe_end=min(meta["last"], end)
                    probe_start=max(meta["first"], probe_end-timedelta(minutes=15))
                    if probe_end >= probe_start:
                        try:
                            probe=client.history(symbol, dataset=dataset, timeframe="tick",
                                                 start=iso_z(probe_start), end=iso_z(probe_end),
                                                 dataframe=True, timeout=900)
                            ps=raw_schema(probe)
                            schema=sorted(set(schema)|set(ps))
                            plist=rows_from_history(probe)
                            raw_count=max(raw_count,len(plist))
                            prows=normalize_ticks(probe)
                            filtered=[r for r in prows if start <= r["timestamp"] <= end]
                            if plist and not prows:
                                errors.append("probe returned raw rows but zero valid bid/ask quotes")
                        except Exception as exc:
                            errors.append(f"boundary_probe:{type(exc).__name__}: {exc}")
                diagnostic=None
                if raw_count and not filtered:
                    diagnostic="QUOTE_FIELDS_UNAVAILABLE" if not has_quote_fields else "NO_VALID_BID_ASK_IN_WINDOW"
                first_raw=raw_rows[0]["timestamp"].isoformat() if raw_rows else None
                last_raw=raw_rows[-1]["timestamp"].isoformat() if raw_rows else None
                return filtered, raw_count, len(raw_rows), "; ".join(errors) if errors else diagnostic, first_raw, last_raw, meta, schema

            print(f"E2E RESOLVED UTC WINDOW: {iso_z(start)} -> {iso_z(end)}")
            for symbol in symbols:
                if ws_replay_allowed:
                    ws_rows,live_seen,ws_error=load_ws(symbol,start)
                else:
                    ws_rows=[]; live_seen=False
                    ws_error="WebSocket replay skipped: requested UTC window exceeds the provider replay horizon; vault fallback is authoritative."
                replay_count=len(ws_rows)
                retry_used=False
                fallback_error=None
                vault_raw_count=0
                vault_window_count=0
                vault_first=None
                vault_last=None
                vault_catalog=catalog_meta.get(symbol,{})
                source="websocket_replay" if replay_count>=E2E_MIN_TICKS else "DATA_UNAVAILABLE"

                # A retry is still WebSocket replay, but only within the provider's
                # documented <=24h replay horizon. It is attempted when the first
                # replay is zero/insufficient.
                if replay_count < E2E_MIN_TICKS and ws_replay_allowed:
                    retry_used=True
                    retry_start=max(start-timedelta(minutes=2),end-timedelta(hours=23,minutes=55))
                    retry_rows,live_retry,retry_error=load_ws(symbol,retry_start)
                    live_seen=live_seen or live_retry
                    if retry_error and not ws_error: ws_error=retry_error
                    if len(retry_rows) >= E2E_MIN_TICKS:
                        ws_rows=retry_rows
                        replay_count=len(replay_rows)
                        source="websocket_replay"

                # Never call the vault unless WebSocket replay is zero/insufficient.
                # The vault is a separate historical source, not a silent success path.
                if replay_count < E2E_MIN_TICKS:
                    vault_rows,vault_raw_count,vault_valid_count,fallback_error,vault_first,vault_last,vault_catalog,vault_schema=load_vault(symbol)
                    vault_window_count=len(vault_rows)
                    if len(vault_rows) >= E2E_MIN_TICKS:
                        rows=vault_rows
                        source="vault_history_fallback"
                    else:
                        rows=[]
                        source="DATA_UNAVAILABLE"
                else:
                    rows=ws_rows

                first_ts=rows[0]["timestamp"].isoformat() if rows else None
                last_ts=rows[-1]["timestamp"].isoformat() if rows else None
                meta[symbol]={
                    "ticks":len(rows),
                    "source":source,
                    "websocket_replay_valid_ticks":replay_count,
                    "vault_raw_rows":vault_raw_count,
                    "vault_raw_valid_bid_ask_ticks":vault_valid_count,
                    "vault_window_valid_ticks":vault_window_count,
                    "vault_raw_first_timestamp":vault_first,
                    "vault_raw_last_timestamp":vault_last,
                    "vault_catalog_dataset":vault_catalog.get("dataset"),
                    "vault_catalog_ticks":vault_catalog.get("ticks"),
                    "vault_catalog_first_timestamp":vault_catalog.get("first").isoformat() if vault_catalog.get("first") else None,
                    "vault_catalog_last_timestamp":vault_catalog.get("last").isoformat() if vault_catalog.get("last") else None,
                    "live_ticks_seen":live_seen,
                    "retry_used":retry_used,
                    "websocket_replay_allowed":ws_replay_allowed,
                    "websocket_error":ws_error,
                    "fallback_error":fallback_error,
                    "vault_schema":vault_schema,
                    "resolved_window_start":start.isoformat(),
                    "resolved_window_end":end.isoformat(),
                    "replay_evidence":"PRESENT" if rows else "NONE",
                    "diagnostic":(
                        "Historical ticks loaded from WebSocket replay."
                        if source=="websocket_replay" else
                        "WebSocket replay zero/insufficient; loaded and locally filtered LSE vault raw-tick history."
                        if source=="vault_history_fallback" else
                        "DATA_UNAVAILABLE: neither WebSocket replay nor vault raw-tick history contained enough valid bid/ask ticks for the exact UTC window."
                    ),
                    "first_timestamp":first_ts,
                    "last_timestamp":last_ts
                }
                print(f"{symbol}")
                print(f"WebSocket replay: {replay_count} valid ticks")
                if replay_count < E2E_MIN_TICKS:
                    print(f"Vault catalog: dataset={vault_catalog.get('dataset')} ticks={vault_catalog.get('ticks')} first={vault_catalog.get('first')} last={vault_catalog.get('last')}")
                    print(f"Vault raw tick history rows: {vault_raw_count} | valid bid/ask ticks: {vault_valid_count}")
                    print(f"Vault raw schema: {vault_schema or 'UNKNOWN'}")
                    print(f"Vault ticks in exact window: {vault_window_count} valid bid/ask ticks")
                    print(f"Vault raw returned range: {vault_first} -> {vault_last}")
                print(f"Selected source: {source}")
                print(f"Window: {iso_z(start)} -> {iso_z(end)}")
                print(f"E2E REPLAY {symbol}: {len(rows)} valid historical bid/ask ticks | source={source}")
                if source=="DATA_UNAVAILABLE":
                    print(f"E2E DATA_UNAVAILABLE {symbol}: minimum required valid bid/ask ticks={E2E_MIN_TICKS}")
                out[symbol]=rows
            return out,meta
        replay_tick_map, replay_tick_meta=load_replay_ticks(SYMBOLS,start,end)


        rows_out=[]; failures=[]
        total_setup_count=0
        for symbol in SYMBOLS:
            category="forex" if "/" in symbol and symbol.upper() not in ("XAU/USD","BTC/USD") else ("commodity" if symbol.upper()=="XAU/USD" else "crypto")
            print(f"E2E {symbol}: loading six closed-native timeframes + tick tape")
            try:
                candles={}
                for tf in ("1mo","1d","4h","1h","15m","5m"):
                    raw=client.candles(
                        symbol, tf,
                        start=api_date(start-TF_LOOKBACK[tf]),
                        end=api_date(end)
                    )
                    candles[tf]=[
                        r for r in normalize_rows(raw)
                        if (start-TF_LOOKBACK[tf]) <= r["timestamp"] <= end
                    ]
                    if len(candles[tf])<TF_MIN[tf]:
                        raise RuntimeError(f"{tf}: only {len(candles[tf])} candles; need {TF_MIN[tf]}")
                ticks=replay_tick_map.get(symbol, [])
                # WebSocket historical replay is used for ticks so the E2E phase does
                # not consume another vault bulk-export job after TCA.
                if len(ticks)<100: raise RuntimeError(f"only {len(ticks)} valid bid/ask ticks")
            except Exception as exc:
                failures.append({"symbol":symbol,"stage":"load","error":f"{type(exc).__name__}: {exc}"})
                print(f"E2E ERROR {symbol}: {type(exc).__name__}: {exc}")
                continue

            tick_times=[t["timestamp"] for t in ticks]
            # Evaluate each closed 5m decision point; every higher timeframe is cut
            # at that timestamp, so no future candle participates in the signal.
            decisions=[r for r in candles["5m"] if start <= r["timestamp"]+timedelta(minutes=5) < end]
            seen_setups=set()
            setup_count=0
            for c5 in decisions:
                decision_time=c5["timestamp"]+timedelta(minutes=5)
                data={}
                for tf in candles:
                    data[tf]=[r for r in candles[tf] if closed_by_decision(r,tf,decision_time)]
                if any(len(data[tf])<30 for tf in data): continue

                strategy_by_tf={tf:strategy_signals(data[tf],category) for tf in data}
                tf_cons={tf:dominant(strategy_by_tf[tf],2) for tf in strategy_by_tf}
                monthly=tf_cons["1mo"]
                if monthly=="NEUTRAL": continue

                # Reproduce the scanner's exact position-timeframe selection:
                # 5M -> 15M -> 1H -> 4H when the timeframe and its required
                # context agree; then fall back to the first agreeing timeframe.
                context_map={"5m":("15m","1h"),"15m":("1h",),"1h":("4h",),"4h":("1d",)}
                chosen_exec_tf=None
                for candidate_tf in ("5m","15m","1h","4h"):
                    if tf_cons.get(candidate_tf) in ("BUY","SELL") and all(tf_cons.get(x)==tf_cons.get(candidate_tf) for x in context_map[candidate_tf]):
                        chosen_exec_tf=candidate_tf
                        break
                if chosen_exec_tf is None:
                    for candidate_tf in ("15m","1h","4h","5m"):
                        if tf_cons.get(candidate_tf) in ("BUY","SELL"):
                            chosen_exec_tf=candidate_tf
                            break
                if chosen_exec_tf is None:
                    continue

                # Reproduce the scanner's operational qualification for the chosen position TF.
                for exec_tf,pr in profile.items():
                    if exec_tf != chosen_exec_tf:
                        continue
                    side=tf_cons.get(exec_tf)
                    if side not in ("BUY","SELL") or side!=monthly: continue
                    ctx_ok=all(tf_cons.get(x)==side for x in pr["context"])
                    aligned=[m["name"] for m in strategy_by_tf[exec_tf] if m["signal"]==side]
                    if len(set(aligned))<2 or not ctx_ok: continue

                    # Freeze the risk plan at the historical decision point. The
                    # later tick crossing may change the realized fill, but it may NOT
                    # rewrite SL/TP using future information.
                    decision_entry=float(data[exec_tf][-1]["close"])
                    level=ns["levels"](data[exec_tf],side,entry_price=decision_entry)
                    if not level: continue
                    entry,sl,tp,a=level
                    risk=abs(entry-sl); rr=abs(tp-entry)/max(risk,1e-12)
                    if rr<2.0: continue

                    trigger_ref=ns["closed_breakout_level"](data[exec_tf],side)
                    if trigger_ref is None: continue
                    trigger=trigger_ref+a*float(ns.get("ENTRY_BUFFER_ATR",0.10)) if side=="BUY" else trigger_ref-a*float(ns.get("ENTRY_BUFFER_ATR",0.10))
                    # Trigger is frozen at decision time. Future ticks can only cross it;
                    # they cannot move it.
                    fill=first_cross(ticks,tick_times,decision_time,min(end,decision_time+timedelta(minutes=HORIZON)),side,trigger)
                    obs_end=min(end,decision_time+timedelta(seconds=4))
                    lo=bisect.bisect_left(tick_times,decision_time); hi=bisect.bisect_right(tick_times,obs_end)
                    snapshot=ticks[lo:hi]
                    predicted_execution_score=None
                    predicted_spread_bps=None
                    predicted_slippage_atr=None
                    if len(snapshot)>=3:
                        spreads=[x["ask"]-x["bid"] for x in snapshot]
                        mids=[(x["bid"]+x["ask"])/2 for x in snapshot]
                        latest=snapshot[-1]; mid=(latest["bid"]+latest["ask"])/2
                        spread=latest["ask"]-latest["bid"]
                        spread_atr=spread/max(a,1e-12)
                        spread_bps=spread/max(mid,1e-12)*10000
                        med=max(statistics.median(spreads),1e-12)
                        micro=max([abs(mids[i]-mids[i-1])/max(a,1e-12) for i in range(1,len(mids))] or [0.0])
                        executable=latest["ask"] if side=="BUY" else latest["bid"]
                        chase=abs(executable-trigger)/max(a,1e-12)
                        predicted_slippage_atr=(spread/2)/max(a,1e-12)+micro
                        predicted_execution_score=100.0
                        if spread_atr>0.35: predicted_execution_score-=25
                        if spread/med>2.5: predicted_execution_score-=20
                        if micro>0.12: predicted_execution_score-=20
                        if chase>0.50: predicted_execution_score-=30
                        predicted_execution_score=max(0.0,min(100.0,predicted_execution_score))
                        predicted_spread_bps=spread_bps
                    aligned_names=set()
                    opposed_names=set()
                    aligned_tfs=set()
                    for tf_name, methods in strategy_by_tf.items():
                        for m in methods:
                            if m["signal"]==side:
                                aligned_names.add(m["name"]); aligned_tfs.add(tf_name)
                            elif m["signal"] in ("BUY","SELL") and m["signal"]!=side:
                                opposed_names.add(m["name"])
                    local_consensus_tfs={tf_name for tf_name,methods in strategy_by_tf.items() if dominant(methods,2)==side}
                    agreeing_signal_tfs={tf for tf in local_consensus_tfs if tf!="1mo"}
                    price_names={"Supply/Demand","Price Action","Fibonacci","Trend","RSI+MACD"}
                    price_count=len(aligned_names & price_names)
                    price_tf_count=sum(
                        1 for tf_name,methods in strategy_by_tf.items()
                        if any(m["name"] in price_names and m["signal"]==side for m in methods)
                    )
                    three_price=price_count>=3 and price_tf_count>=2 and len(opposed_names)<=3
                    consensus_score=min(100.0,45.0+len(aligned_names)*11.0+
                                        max(0,len(aligned_tfs)-1)*4.0-len(opposed_names)*4.0)
                    if monthly==side:
                        consensus_score=min(100.0,consensus_score+8.0)
                    consensus_score=min(100.0,consensus_score+min(16.0,len(agreeing_signal_tfs)*4.0))
                    if three_price:
                        consensus_score=max(consensus_score,min(100.0,50.0+price_count*9.0+price_tf_count*4.0-len(opposed_names)*4.0))
                    consensus_score=min(100.0,consensus_score+min(10.0,len(local_consensus_tfs)*1.5))
                    setup_key=(exec_tf,side,round(trigger,8))
                    if setup_key in seen_setups:
                        continue
                    seen_setups.add(setup_key)
                    row={
                        "symbol":symbol,"asset_category":category,"decision_time":decision_time.isoformat(),
                        "execution_timeframe":exec_tf,"trade_type":pr["type"],"side":side,
                        "monthly_regime":monthly,"regime_4h":tf_cons.get("4h","NEUTRAL"),
                        "strategy_count":len(aligned_names),
                        "strategies":"|".join(sorted(aligned_names)),
                        "opposed_strategies":"|".join(sorted(opposed_names)),
                        "signal_timeframes":"|".join(sorted(aligned_tfs)),
                        "local_consensus_timeframes":"|".join(sorted(local_consensus_tfs)),
                        "strategy_score":round(consensus_score,1),
                        "predicted_execution_score":predicted_execution_score,
                        "predicted_spread_bps":predicted_spread_bps,
                        "predicted_slippage_atr":predicted_slippage_atr,
                        "execution_threshold_used":EXEC_MIN,
                        "execution_calibration_status":CAL_STATUS,
                        "execution_gate_passed":bool(predicted_execution_score is not None and predicted_execution_score>=EXEC_MIN),
                        "high_quality_execution":bool(predicted_execution_score is not None and predicted_execution_score>=EXEC_HIGH),
                        "production_eligible":bool(predicted_execution_score is not None and predicted_execution_score>=EXEC_MIN),
                        "trigger":trigger,"planned_entry":entry,"planned_sl":sl,"planned_tp":tp,"planned_rr":rr,
                        "realized_risk":None,"realized_reward":None,"realized_rr":None,
                        "fill_time":None,"fill_price":None,"realized_entry_slippage_atr":None,
                        "spread_bps":None,"implementation_shortfall_bps":None,
                        "mfe_r":None,"mae_r":None,"markout_bps":None,
                        "tp_or_sl_first":"NO_FILL","outcome":"NO_FILL"
                    }
                    if fill:
                        fill_px=fill["ask"] if side=="BUY" else fill["bid"]
                        fill_mid=(fill["bid"]+fill["ask"])/2
                        row["fill_time"]=fill["timestamp"].isoformat()
                        row["fill_price"]=fill_px
                        row["realized_risk"]=abs(fill_px-sl)
                        row["realized_reward"]=abs(tp-fill_px)
                        row["realized_rr"]=abs(tp-fill_px)/max(abs(fill_px-sl),1e-12)
                        row["realized_entry_slippage_atr"]=abs(fill_px-trigger)/max(a,1e-12)
                        row["spread_bps"]=(fill["ask"]-fill["bid"])/max(fill_mid,1e-12)*10000
                        arrival=(ticks[bisect.bisect_left(tick_times,decision_time)]["bid"]+
                                 ticks[bisect.bisect_left(tick_times,decision_time)]["ask"])/2 if bisect.bisect_left(tick_times,decision_time)<len(ticks) else fill_mid
                        row["implementation_shortfall_bps"]=((fill_px-arrival)/max(arrival,1e-12)*10000
                            if side=="BUY" else (arrival-fill_px)/max(arrival,1e-12)*10000)
                        mm=markout_metrics(ticks,tick_times,fill["timestamp"],side,fill_px,risk,HORIZON)
                        if mm: row.update(mm)
                        outcome,_=hit_order(ticks,tick_times,fill["timestamp"],side,sl,tp,HORIZON)
                        row["tp_or_sl_first"]=outcome
                        row["outcome"]="WIN" if outcome=="TP_FIRST" else ("LOSS" if outcome=="SL_FIRST" else "OPEN_AT_HORIZON")
                    rows_out.append(row)
                    setup_count+=1
                    total_setup_count+=1
                    if total_setup_count>=MAX_SETUPS: break
                if total_setup_count>=MAX_SETUPS: break
            print(f"E2E {symbol}: {setup_count} qualified historical signal paths | total={total_setup_count}/{MAX_SETUPS}")
            if total_setup_count>=MAX_SETUPS:
                break

        try:
            client.disconnect()
        except Exception:
            pass

        if not rows_out:
            available_tick_symbols = [
                s for s in SYMBOLS
                if replay_tick_meta.get(s,{}).get("ticks",0) >= 100
                and replay_tick_meta.get(s,{}).get("source") != "DATA_UNAVAILABLE"
            ]
            status = "NO_QUALIFIED_SIGNALS" if available_tick_symbols else "DATA_UNAVAILABLE"
            report={"version":"v12.20-nine-strategy-e2e",
                 "status":status,
                 "reason":(
                     "Historical tick data was available, but the institutional nine-strategy "
                     "gates produced no qualified signal paths in the requested period."
                     if status=="NO_QUALIFIED_SIGNALS" else
                     "No symbol had enough validated bid/ask tick history in the exact UTC window."
                 ),
                 "tick_replay":replay_tick_meta,"failures":failures}
        else:
            filled=[r for r in rows_out if r["fill_price"] is not None]
            def group_summary(rows):
                return {
                    "signals":len(rows),"fills":len([r for r in rows if r["fill_price"] is not None]),
                    "fill_rate_pct":pct(len([r for r in rows if r["fill_price"] is not None]),len(rows)),
                    "win_rate_pct":pct(sum(r["outcome"]=="WIN" for r in rows),len([r for r in rows if r["outcome"] in ("WIN","LOSS")])),
                    "loss_rate_pct":pct(sum(r["outcome"]=="LOSS" for r in rows),len([r for r in rows if r["outcome"] in ("WIN","LOSS")])),
                    "avg_rr":avg([r["planned_rr"] for r in rows]),
                    "avg_realized_rr":avg([r["realized_rr"] for r in rows]),
                    "avg_slippage_atr":avg([r["realized_entry_slippage_atr"] for r in rows]),
                    "avg_predicted_execution_score":avg([r["predicted_execution_score"] for r in rows]),
                    "avg_predicted_spread_bps":avg([r["predicted_spread_bps"] for r in rows]),
                    "avg_predicted_slippage_atr":avg([r["predicted_slippage_atr"] for r in rows]),
                    "avg_shortfall_bps":avg([r["implementation_shortfall_bps"] for r in rows]),
                    "avg_mfe_r":avg([r["mfe_r"] for r in rows]),
                    "avg_mae_r":avg([r["mae_r"] for r in rows]),
                    "tp_first_pct":pct(sum(r["tp_or_sl_first"]=="TP_FIRST" for r in rows),len([r for r in rows if r["tp_or_sl_first"] in ("TP_FIRST","SL_FIRST")])),
                    "sl_first_pct":pct(sum(r["tp_or_sl_first"]=="SL_FIRST" for r in rows),len([r for r in rows if r["tp_or_sl_first"] in ("TP_FIRST","SL_FIRST")]))
                }
            by_trade={k:group_summary([r for r in rows_out if r["trade_type"]==k]) for k in ("SCALP","INTRADAY","SWING/HOLD")}
            by_asset={k:group_summary([r for r in rows_out if r["asset_category"]==k]) for k in sorted(set(r["asset_category"] for r in rows_out))}
            by_regime={k:group_summary([r for r in rows_out if r["regime_4h"]==k]) for k in ("BUY","SELL","NEUTRAL")}
            strat_names=["SMC","Market Structure","Liquidity","Supply/Demand","Price Action","Fibonacci","Trend","RSI+MACD","Session"]
            by_strategy={}
            for name in strat_names:
                subset=[r for r in rows_out if name in r["strategies"].split("|")]
                by_strategy[name]=group_summary(subset)
            score_bands={}
            for lo,hi in ((0,59),(60,69),(70,79),(80,89),(90,100)):
                band=[r for r in rows_out if lo<=float(r["strategy_score"])<=hi]
                score_bands[f"{lo}-{hi}"]=group_summary(band)
            by_execution_gate={
                "PASSED":group_summary([r for r in rows_out if r["execution_gate_passed"]]),
                "FAILED":group_summary([r for r in rows_out if not r["execution_gate_passed"]])
            }
            overall=group_summary(rows_out)
            report={"version":"v12.20-nine-strategy-e2e","status":"PARTIAL" if failures else "COMPLETE","methodology":{
                "direction":"exact scanner nine-strategy function logic extracted from the checked-out workflow; no future candles are visible at decision time",
                "timeframes":"1MO,1D,4H,1H,15M,5M; each decision uses only candles closed by decision_time",
                "monthly_master":"completed 1MO 2-of-9 directional consensus required",
                "operational_gate":"2 distinct strategies on execution timeframe + required context agreement + completed monthly directional agreement + completed 4H regime context",
                "trigger":"closed structural breakout + 0.10 ATR buffer",
                "fill":"first historical executable ASK for BUY / BID for SELL crossing trigger",
                "exit":"historical executable BID for BUY / ASK for SELL",
                "metrics":"realized slippage, implementation shortfall, MFE/MAE in R, TP/SL-first, markout",
                "warning":"Point-in-time nine-strategy/trigger/execution replay. Economic-calendar/RSS/news gating is not replayed because point-in-time historical event snapshots are not guaranteed by the current data source; it is therefore not a complete news-aware backtest. Queue position, partial fills, market impact beyond top-of-book, and order-book depth are also not simulated."
            },"period":{"start":start.isoformat(),"end":end.isoformat()},"symbols":SYMBOLS,
            "overall":overall,"score_bands":score_bands,"by_execution_gate":by_execution_gate,"by_trade_type":by_trade,"by_asset":by_asset,"by_4h_regime":by_regime,
            "by_strategy":by_strategy,"tick_replay":replay_tick_meta,
            "failures":failures,"observations":rows_out}
        with open("nine_strategy_e2e.json","w",encoding="utf-8") as f: json.dump(report,f,indent=2,default=str)
        fields=list(rows_out[0].keys()) if rows_out else ["symbol","decision_time","trade_type","side","outcome"]
        with open("nine_strategy_e2e.csv","w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows_out)
        print("="*72); print("NINE-STRATEGY HISTORICAL END-TO-END REPLAY"); print("="*72)
        print(json.dumps({k:report[k] for k in ("status","overall","score_bands","by_execution_gate","by_trade_type","by_asset","by_4h_regime","by_strategy","failures") if k in report},indent=2))
        if report["status"]=="NO_OBSERVATIONS":
            raise SystemExit("E2E replay produced zero qualified observations; check date range, symbol history, and strategy requirements")
        PY
    - name: Validate end-to-end report
      run: |
        set -euo pipefail
        python - <<'PY'
        import json, math
        r=json.loads(open("nine_strategy_e2e.json",encoding="utf-8").read())
        assert r["version"]=="v12.20-nine-strategy-e2e"
        if r["status"]=="DATA_UNAVAILABLE":
            assert not r.get("observations")
            assert isinstance(r.get("failures"), list)
            print("E2E validation: PASS (DATA_UNAVAILABLE; no observations treated as evidence)")
            raise SystemExit(0)
        if r["status"]=="NO_QUALIFIED_SIGNALS":
            assert not r.get("observations")
            assert isinstance(r.get("tick_replay"), dict)
            print("E2E validation: PASS (tick data available; no qualified signal paths)")
            raise SystemExit(0)
        assert r["status"] in ("COMPLETE","PARTIAL")
        assert r["observations"], "No observations"
        names={"SMC","Market Structure","Liquidity","Supply/Demand","Price Action","Fibonacci","Trend","RSI+MACD","Session"}
        for row in r["observations"]:
            assert row["side"] in ("BUY","SELL")
            assert row["trade_type"] in ("SCALP","INTRADAY","SWING/HOLD")
            assert len(set(row["strategies"].split("|")) & names)>=2
            assert row["planned_rr"] >= 2.0
            assert row["strategy_score"] is not None and 0 <= float(row["strategy_score"]) <= 100
            if row["predicted_execution_score"] is not None:
                assert 0 <= float(row["predicted_execution_score"]) <= 100
            assert isinstance(row["execution_gate_passed"], bool)
            assert row["execution_threshold_used"] >= 50
            if row["fill_price"] is not None:
                assert row["fill_time"] is not None
                assert row["realized_entry_slippage_atr"] is not None
                assert row["realized_rr"] is not None and row["realized_rr"] >= 0
                assert row["mfe_r"] is not None and row["mae_r"] is not None
        print("Nine-strategy end-to-end report validation: PASS")
        print(f"Observations={len(r['observations'])} | fills={r['overall']['fills']} | win={r['overall']['win_rate_pct']}")
        PY
    - name: Upload end-to-end replay artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: nine-strategy-end-to-end-replay
        path: |
          nine_strategy_e2e.json
          nine_strategy_e2e.csv
        if-no-files-found: error
  tca_replay:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_tca == true || inputs.run_e2e == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      RUN_TCA: ${{ inputs.run_tca || 'false' }}
      TCA_SYMBOLS: ${{ inputs.tca_symbols || 'EUR/USD,GBP/USD,XAU/USD,BTC/USD' }}
      TCA_START: ${{ inputs.tca_start || '' }}
      TCA_END: ${{ inputs.tca_end }}
      TCA_HORIZON_MINUTES: ${{ inputs.tca_horizon_minutes }}
      TCA_OBSERVATION_SECONDS: ${{ inputs.tca_observation_seconds }}
      TCA_MAX_SETUPS: ${{ inputs.tca_max_setups }}
      TCA_MIN_TICKS: ${{ inputs.tca_min_ticks || '3' }}
      TCA_CALIBRATION_MIN_OBSERVATIONS: ${{ inputs.tca_calibration_min_observations || '100' }}
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install TCA replay dependencies
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install "lse-data[frames]==0.14.0" "pandas>=2.0,<3" "pyarrow>=15,<23"
    - name: Historical tick replay + execution TCA
      run: |
        set -euo pipefail
        python - <<'PY'
        import bisect
        import csv
        import json
        import math
        import os
        import statistics
        from collections import defaultdict
        from datetime import datetime, timedelta, timezone

        from lse import LSE, LSEError

        RUN_TCA = os.environ.get("RUN_TCA", "false").strip().lower() == "true"
        if not RUN_TCA:
            default_calibration = {
                "version": "v12.7-execution-calibration",
                "status": "DEFAULT",
                "source": "static_default",
                "reason": "Historical TCA disabled for this run; no empirical thresholds were applied.",
                "min_confirmed_score": 70.0,
                "high_quality_score": 85.0,
                "oos_validated": False,
                "observations": 0
            }
            default_report = {
                "version": "v12.21-historical-tick-replay-tca",
                "status": "DISABLED",
                "generated_at": datetime.now(timezone.utc).isoformat(),
                "calibration": default_calibration,
                "observations": []
            }
            with open("execution_calibration.json", "w", encoding="utf-8") as f:
                json.dump(default_calibration, f, indent=2)
            with open("execution_tca.json", "w", encoding="utf-8") as f:
                json.dump(default_report, f, indent=2)
            with open("execution_tca.csv", "w", newline="", encoding="utf-8") as f:
                w = csv.DictWriter(f, fieldnames=["status"])
                w.writeheader()
                w.writerow({"status": "DISABLED"})
            print("TCA REPLAY: disabled; using static safety thresholds 70/85 until empirical TCA is run.")
            raise SystemExit(0)

        def now_utc():
            return datetime.now(timezone.utc)

        def api_date(dt):
            """LSE historical REST boundaries require YYYY-MM-DD; exact UTC filtering is local."""
            return dt.date().isoformat()

        def parse_ts(value):
            if isinstance(value, datetime):
                dt = value
            else:
                s = str(value).strip()
                if s.endswith("Z"):
                    s = s[:-1] + "+00:00"
                dt = datetime.fromisoformat(s)
            if dt.tzinfo is None:
                dt = dt.replace(tzinfo=timezone.utc)
            return dt.astimezone(timezone.utc)

        def fnum(value):
            try:
                x = float(value)
                return x if math.isfinite(x) else None
            except (TypeError, ValueError):
                return None

        def rows_from_history(obj):
            # lse-data[frames] returns a pandas DataFrame for history(). Preserve the
            # index because some Parquet layouts may carry the tick timestamp there.
            if hasattr(obj, "to_dict"):
                try:
                    frame = obj
                    if hasattr(frame, "columns") and hasattr(frame, "reset_index"):
                        try:
                            frame = frame.reset_index()
                        except Exception:
                            pass
                    records = frame.to_dict(orient="records")
                except TypeError:
                    records = obj.to_dict()
                except Exception:
                    records = []
                if isinstance(records, list):
                    return records
                if isinstance(records, dict):
                    for key in ("data", "rows", "ticks", "candles"):
                        if isinstance(records.get(key), list):
                            return records[key]
                    return [records]
            if isinstance(obj, dict):
                for key in ("data", "rows", "ticks", "candles"):
                    if isinstance(obj.get(key), list):
                        return obj[key]
                return [obj]
            if isinstance(obj, (list, tuple)):
                return list(obj)
            return []

        def raw_schema(raw):
            """Inspect returned history columns without assuming a quote schema."""
            try:
                cols = list(getattr(raw, "columns", []) or [])
                if cols:
                    return [str(c) for c in cols]
            except Exception:
                pass
            keys = set()
            for row in rows_from_history(raw)[:20]:
                if isinstance(row, dict):
                    keys.update(str(k) for k in row.keys())
            return sorted(keys)

        def normalize_ticks(raw):
            out = []
            for row in rows_from_history(raw):
                if not isinstance(row, dict):
                    continue
                ts = row.get("timestamp", row.get("ts", row.get("datetime",
                     row.get("time", row.get("date", row.get("index"))))))
                bid = fnum(row.get("bid", row.get("bid_price", row.get("best_bid"))))
                ask = fnum(row.get("ask", row.get("ask_price", row.get("best_ask"))))
                price = fnum(row.get("price", row.get("last", row.get("mid"))))
                volume = fnum(row.get("volume", row.get("size"))) or 0.0
                if ts is None or bid is None or ask is None:
                    continue
                if bid <= 0 or ask <= 0 or ask < bid:
                    continue
                try:
                    dt = parse_ts(ts)
                except Exception:
                    continue
                out.append({"timestamp": dt, "bid": bid, "ask": ask,
                            "price": price or (bid + ask) / 2.0, "volume": volume})
            out.sort(key=lambda x: x["timestamp"])
            return out

        def normalize_candles(raw):
            out = []
            for row in rows_from_history(raw):
                if not isinstance(row, dict):
                    continue
                ts = row.get("timestamp", row.get("time", row.get("datetime")))
                vals = [fnum(row.get(k)) for k in ("open", "high", "low", "close")]
                if ts is None or any(v is None for v in vals):
                    continue
                try:
                    dt = parse_ts(ts)
                except Exception:
                    continue
                out.append({"timestamp": dt, "open": vals[0], "high": vals[1],
                            "low": vals[2], "close": vals[3],
                            "volume": fnum(row.get("volume")) or 0.0})
            out.sort(key=lambda x: x["timestamp"])
            return out

        def atr(rows, period=14):
            if len(rows) <= period:
                return None
            trs = []
            for i in range(1, len(rows)):
                h, l, pc = rows[i]["high"], rows[i]["low"], rows[i-1]["close"]
                trs.append(max(h-l, abs(h-pc), abs(l-pc)))
            return statistics.fmean(trs[-period:]) if trs else None

        def swings(rows, lookback=2):
            highs, lows = [], []
            for i in range(lookback, len(rows)-lookback):
                h, l = rows[i]["high"], rows[i]["low"]
                if h == max(x["high"] for x in rows[i-lookback:i+lookback+1]):
                    highs.append((i, h))
                if l == min(x["low"] for x in rows[i-lookback:i+lookback+1]):
                    lows.append((i, l))
            return highs, lows

        def closed_breakout_level(rows, side, window=40, lookback=2):
            if not rows:
                return None
            sample = rows[-window:]
            last = sample[-1]
            highs, lows = swings(sample, lookback)
            if side == "BUY":
                return float(highs[-1][1]) if highs else float(last["high"])
            if side == "SELL":
                return float(lows[-1][1]) if lows else float(last["low"])
            return None

        def levels(rows, side, entry):
            a = atr(rows)
            if not a or a <= 0:
                return None
            highs, lows = swings(rows[-100:], 2)
            price = float(entry)
            base_close = float(rows[-1]["close"])
            if not math.isfinite(base_close) or base_close <= 0:
                return None
            relative_gap = abs(price - base_close) / base_close
            max_reasonable_gap = min(0.35, max(0.10, 12.0 * a / base_close))
            if relative_gap > max_reasonable_gap:
                return None
            if side == "BUY":
                stop_candidates = [x[1] for x in lows if x[1] < price]
                targets = sorted(set(x[1] for x in highs if x[1] > price))
                if not stop_candidates or not targets:
                    return None
                sl = max(stop_candidates[-3:]) - 0.25 * a
                tp = targets[0]
            else:
                stop_candidates = [x[1] for x in highs if x[1] > price]
                targets = sorted(set(x[1] for x in lows if x[1] < price), reverse=True)
                if not stop_candidates or not targets:
                    return None
                sl = min(stop_candidates[-3:]) + 0.25 * a
                tp = targets[0]
            risk = abs(price-sl)
            reward = abs(tp-price)
            if risk <= 0:
                return None
            return {"entry":price, "sl":sl, "tp":tp, "atr":a,
                    "rr":reward/risk, "risk":risk}

        def prediction(snapshot, side, trigger, atr_value, asof):
            if side not in ("BUY","SELL") or not snapshot or not atr_value:
                return None
            # The snapshot represents the same bounded observation period used by
            # the live scanner. The decision is made at the final observed tick,
            # so no tick after decision_time may influence the prediction.
            valid = list(snapshot)
            if len(valid) < MIN_TICKS:
                return None
            latest = valid[-1]
            bid, ask = latest["bid"], latest["ask"]
            mids = [(x["bid"]+x["ask"])/2.0 for x in valid]
            spreads = [x["ask"]-x["bid"] for x in valid]
            mid = (bid+ask)/2.0
            spread = ask-bid
            median_spread = statistics.median(spreads)
            executable = ask if side == "BUY" else bid
            crossed = executable >= trigger if side == "BUY" else executable <= trigger
            spread_atr = spread/atr_value
            spread_bps = spread/max(mid, 1e-12)*10000.0
            spread_vs_median = spread/max(median_spread, 1e-12)
            micro_moves = [abs(mids[i]-mids[i-1])/atr_value for i in range(1,len(mids))]
            micro_move = statistics.median(micro_moves) if micro_moves else 0.0
            chase = abs(executable-trigger)/atr_value
            slippage_proxy = (spread/2.0)/atr_value + max(0.0, micro_move)
            score = 100.0
            reasons = []
            if spread_atr > MAX_SPREAD_ATR:
                score -= 25.0; reasons.append("wide_spread")
            if spread_vs_median > MAX_SPREAD_MEDIAN_MULTIPLIER:
                score -= 20.0; reasons.append("spread_vs_median")
            if micro_move > EXECUTION_STABILITY_MAX_ATR_PER_TICK:
                score -= 20.0; reasons.append("unstable_microstructure")
            if chase > ENTRY_MAX_CHASE_ATR:
                score -= 30.0; reasons.append("overextended")
            if len(valid) < MIN_TICKS:
                score -= 15.0; reasons.append("insufficient_ticks")
            score = max(0.0, min(100.0, score))
            state = "OVEREXTENDED" if crossed and chase > ENTRY_MAX_CHASE_ATR else (
                    "EXECUTABLE_TRIGGER_CROSSED" if crossed else "WAITING_FOR_TRIGGER")
            return {
                "state": state, "prediction_time": valid[-1]["timestamp"].isoformat(), "decision_time": valid[-1]["timestamp"].isoformat(),
                "executable_price": executable, "bid": bid, "ask": ask, "mid": mid,
                "spread": spread, "spread_bps": spread_bps,
                "spread_atr": spread_atr, "spread_vs_median": spread_vs_median,
                "micro_move_atr_per_tick": micro_move, "chase_distance_atr": chase,
                "slippage_proxy_atr": slippage_proxy, "execution_score": round(score,1),
                "tick_count": len(valid), "reasons": reasons
            }

        def tick_slice(ticks, tick_times, start, end):
            lo = bisect.bisect_left(tick_times, start)
            hi = bisect.bisect_right(tick_times, end)
            return ticks[lo:hi]

        def first_cross(ticks, tick_times, start, end, side, trigger):
            lo = bisect.bisect_left(tick_times, start)
            hi = bisect.bisect_right(tick_times, end)
            for t in ticks[lo:hi]:
                executable = t["ask"] if side == "BUY" else t["bid"]
                if (side == "BUY" and executable >= trigger) or (side == "SELL" and executable <= trigger):
                    return t
            return None

        def markout(ticks, tick_times, fill_time, side, fill_price, horizon_seconds):
            end = fill_time + timedelta(seconds=horizon_seconds)
            future = tick_slice(ticks, tick_times, fill_time, end)
            if not future:
                return None
            # Exit is the opposite executable side: BID for a long, ASK for a short.
            exits = [(t["bid"] if side == "BUY" else t["ask"]) for t in future]
            if side == "BUY":
                mfe = max(exits) - fill_price
                mae = min(exits) - fill_price
                final = exits[-1] - fill_price
            else:
                mfe = fill_price - min(exits)
                mae = fill_price - max(exits)
                final = fill_price - exits[-1]
            return {"mfe":mfe, "mae":mae, "final":final, "ticks":len(future)}

        def hit_order(ticks, tick_times, fill_time, side, sl, tp, horizon_seconds):
            end = fill_time + timedelta(seconds=horizon_seconds)
            for t in tick_slice(ticks, tick_times, fill_time, end):
                exit_px = t["bid"] if side == "BUY" else t["ask"]
                if side == "BUY":
                    if exit_px <= sl:
                        return "SL_FIRST", t
                    if exit_px >= tp:
                        return "TP_FIRST", t
                else:
                    if exit_px >= sl:
                        return "SL_FIRST", t
                    if exit_px <= tp:
                        return "TP_FIRST", t
            return "NEITHER", None

        def bucket(score):
            if score < 50: return "0-49"
            if score < 70: return "50-69"
            if score < 85: return "70-84"
            return "85-100"

        # Configuration with safety bounds.
        api_key = os.environ.get("LSE_API_KEY", "").strip()
        if not api_key:
            raise SystemExit("TCA replay requires LSE_API_KEY")
        symbols = [x.strip() for x in os.environ.get("TCA_SYMBOLS","").split(",") if x.strip()]
        if not symbols:
            raise SystemExit("TCA replay requires at least one symbol")
        try:
            horizon_minutes = max(5, min(240, int(os.environ.get("TCA_HORIZON_MINUTES","60"))))
            observation_seconds = max(1, min(30, int(os.environ.get("TCA_OBSERVATION_SECONDS","4"))))
            max_setups = max(20, min(5000, int(os.environ.get("TCA_MAX_SETUPS","500"))))
            min_ticks = max(2, min(100, int(os.environ.get("TCA_MIN_TICKS","3"))))
            calibration_min_obs = max(50, min(5000, int(os.environ.get("TCA_CALIBRATION_MIN_OBSERVATIONS","100"))))
        except ValueError as exc:
            raise SystemExit(f"Invalid TCA numeric configuration: {exc}")
        MIN_TICKS = min_ticks
        MAX_SPREAD_ATR = 0.35
        MAX_SPREAD_MEDIAN_MULTIPLIER = 2.50
        EXECUTION_STABILITY_MAX_ATR_PER_TICK = 0.12
        ENTRY_BUFFER_ATR = 0.10
        ENTRY_MAX_CHASE_ATR = 0.50

        end_env = os.environ.get("TCA_END","").strip()
        start_env = os.environ.get("TCA_START","").strip()
        requested_end = parse_ts(end_env) if end_env else None
        requested_start = parse_ts(start_env) if start_env else None

        client = LSE(api_key=api_key, timeout=120)
        observations = []
        failures = []

        def catalog_probe(symbol):
            # Resolve the exact vault dataset and its advertised tick history span.
            try:
                entries = [
                    x for x in client.catalog()
                    if str(x.get("symbol","")).strip().upper() == symbol.upper()
                    and str(x.get("dataset","")).strip().lower() != "options"
                ]
            except Exception as exc:
                return {"status":"CATALOG_ERROR", "error":f"{type(exc).__name__}: {exc}"}
            if not entries:
                return {"status":"NOT_IN_CATALOG", "error":f"{symbol} not present in live vault catalog"}
            entries.sort(key=lambda x: int(x.get("ticks") or 0), reverse=True)
            x = entries[0]
            first = last = None
            try:
                if x.get("first"): first = parse_ts(x["first"])
                if x.get("last"): last = parse_ts(x["last"])
            except Exception as exc:
                return {"status":"CATALOG_BAD_RANGE", "error":f"{type(exc).__name__}: {exc}", "entry":x}
            return {
                "status":"AVAILABLE" if (x.get("ticks") or 0) > 0 and first and last else "NO_TICK_SPAN",
                "symbol":x.get("symbol") or symbol,
                "dataset":x.get("dataset"),
                "ticks":int(x.get("ticks") or 0),
                "first":first,
                "last":last,
                "entry":x,
            }

        catalog_meta = {s: catalog_probe(s) for s in symbols}
        for s,m in catalog_meta.items():
            if m.get("status") == "AVAILABLE":
                print(f"CATALOG {s}: dataset={m['dataset']} ticks={m['ticks']} first={m['first'].isoformat()} last={m['last'].isoformat()}")
            else:
                print(f"CATALOG {s}: status={m.get('status')} error={m.get('error')}")

        # Blank boundaries mean "use the newest common vault window", not "use now"
        # blindly. This prevents a stale catalog/live-feed gap from producing an empty
        # 23h30 request. Explicit user boundaries are never silently changed.
        available = [m for m in catalog_meta.values() if m.get("status") == "AVAILABLE"]
        if requested_start is None and requested_end is None:
            if not available:
                raise SystemExit("No requested symbol has an available tick span in the live vault catalog")
            resolved_end = min([now_utc()] + [m["last"] for m in available])
            resolved_start = resolved_end - timedelta(hours=4)
            common_first = max(m["first"] for m in available)
            if common_first > resolved_start:
                resolved_start = common_first
            start_dt, end_dt = resolved_start, resolved_end
        elif requested_start is None:
            end_dt = requested_end
            start_dt = end_dt - timedelta(hours=23, minutes=30)
        else:
            start_dt = requested_start
            end_dt = requested_end or now_utc()

        if end_dt <= start_dt:
            raise SystemExit("TCA_END must be later than TCA_START")
        if (end_dt - start_dt).total_seconds() > 7*86400:
            raise SystemExit("TCA replay is capped at 7 days per manual run; split longer studies into separate runs")
        def iso_z(dt):
            return dt.astimezone(timezone.utc).isoformat().replace("+00:00","Z")
        print(f"TCA REQUESTED UTC WINDOW: {start_env or '<blank>'} -> {end_env or '<blank>'}")
        print(f"TCA RESOLVED UTC WINDOW: {iso_z(start_dt)} -> {iso_z(end_dt)}")

        def tick_to_row(tick):
            """Normalize an SDK Tick object without requiring an export job."""
            ts = getattr(tick, "timestamp", None)
            bid = fnum(getattr(tick, "bid", None))
            ask = fnum(getattr(tick, "ask", None))
            price = fnum(getattr(tick, "price", None))
            volume = fnum(getattr(tick, "volume", None)) or 0.0
            if ts is None or bid is None or ask is None:
                return None
            if bid <= 0 or ask <= 0 or ask < bid:
                return None
            try:
                dt = parse_ts(ts)
            except Exception:
                return None
            return {
                "timestamp": dt,
                "bid": bid,
                "ask": ask,
                "price": price or (bid + ask) / 2.0,
                "volume": volume,
            }

        def load_ticks(symbols, start_dt, end_dt):
            """WebSocket-first TCA tick loader with explicit vault raw-tick fallback.

            Hierarchy:
              1) WebSocket historical replay
              2) validate replay bid/ask ticks
              3) if zero/insufficient -> client.history(symbol)
              4) normalize raw tick DataFrame/rows
              5) filter locally to the exact UTC window
              6) validate bid/ask again
              7) if still insufficient -> DATA_UNAVAILABLE
            """
            ws_replay_allowed = (end_dt-start_dt).total_seconds() <= 23*3600+55*60
            collected={}; replay_meta={}

            def load_ws(symbol,replay_start):
                rows=[]; seen=set(); live_seen=0; error=None; c=None
                try:
                    c=LSE(api_key=api_key)
                    for tick in c.stream([symbol],start=replay_start.isoformat()):
                        if str(getattr(tick,"symbol","") or "").strip().upper()!=symbol.upper(): continue
                        if getattr(tick,"replay",None) is not True:
                            live_seen+=1
                            break
                        row=tick_to_row(tick)
                        if row is None: continue
                        ts=row["timestamp"]
                        if ts<start_dt: continue
                        if ts>end_dt: break
                        key=(ts,row["bid"],row["ask"])
                        if key in seen: continue
                        seen.add(key); rows.append(row)
                except Exception as exc: error=f"{type(exc).__name__}: {exc}"
                finally:
                    if c is not None:
                        try: c.disconnect()
                        except Exception: pass
                return sorted(rows,key=lambda r:r["timestamp"]),live_seen,error

            def load_vault(symbol):
                """Load catalog-pinned raw ticks and distinguish raw rows from valid quotes."""
                meta = catalog_meta.get(symbol, {})
                errors = []
                if meta.get("status") != "AVAILABLE":
                    return [], 0, 0, meta.get("error") or meta.get("status"), None, None, meta, []
                dataset = meta["dataset"]
                query_start = max(start_dt, meta["first"])
                query_end = min(end_dt, meta["last"])
                if query_end < query_start:
                    return [], 0, 0, "catalog history span does not intersect exact UTC window", None, None, meta, []
                raw_rows=[]; raw_count=0; schema=[]
                try:
                    targeted = client.history(symbol, dataset=dataset, timeframe="tick",
                                              start=iso_z(query_start), end=iso_z(query_end),
                                              dataframe=True, timeout=900)
                    schema = raw_schema(targeted)
                    raw_list = rows_from_history(targeted)
                    raw_count = len(raw_list)
                    raw_rows = normalize_ticks(targeted)
                except Exception as exc:
                    errors.append(f"targeted_history:{type(exc).__name__}: {exc}")
                filtered=[r for r in raw_rows if start_dt <= r["timestamp"] <= end_dt]
                quote_fields={"bid","ask","bid_price","ask_price","best_bid","best_ask"}
                has_quote_fields=bool(set(schema)&quote_fields)
                # If the exact export is empty, probe only a small 15-minute slice at the
                # catalog end. This is a bounded diagnostic and avoids a multi-million-row
                # whole-day export on the free 1M-row plan.
                if not filtered:
                    probe_end=min(meta["last"], end_dt)
                    probe_start=max(meta["first"], probe_end-timedelta(minutes=15))
                    if probe_end >= probe_start:
                        try:
                            probe=client.history(symbol, dataset=dataset, timeframe="tick",
                                                 start=iso_z(probe_start), end=iso_z(probe_end),
                                                 dataframe=True, timeout=900)
                            ps=raw_schema(probe)
                            schema=sorted(set(schema)|set(ps))
                            plist=rows_from_history(probe)
                            raw_count=max(raw_count,len(plist))
                            prows=normalize_ticks(probe)
                            filtered=[r for r in prows if start_dt <= r["timestamp"] <= end_dt]
                            if plist and not prows:
                                errors.append("probe returned raw rows but zero valid bid/ask quotes")
                        except Exception as exc:
                            errors.append(f"boundary_probe:{type(exc).__name__}: {exc}")
                diagnostic=None
                if raw_count and not filtered:
                    diagnostic="QUOTE_FIELDS_UNAVAILABLE" if not has_quote_fields else "NO_VALID_BID_ASK_IN_WINDOW"
                first_raw=raw_rows[0]["timestamp"].isoformat() if raw_rows else None
                last_raw=raw_rows[-1]["timestamp"].isoformat() if raw_rows else None
                return filtered, raw_count, len(raw_rows), "; ".join(errors) if errors else diagnostic, first_raw, last_raw, meta, schema

            print(f"TCA RESOLVED UTC WINDOW: {iso_z(start_dt)} -> {iso_z(end_dt)}")
            for symbol in symbols:
                if ws_replay_allowed:
                    ws_rows,live_seen,ws_error=load_ws(symbol,start_dt)
                else:
                    ws_rows=[]; live_seen=0
                    ws_error="WebSocket replay skipped: requested UTC window exceeds the provider replay horizon; vault fallback is authoritative."
                replay_count=len(ws_rows)
                retry_used=False
                fallback_error=None
                vault_raw_count=0
                vault_window_count=0
                vault_first=None
                vault_last=None
                vault_catalog=catalog_meta.get(symbol, {})
                source="websocket_replay" if replay_count>=MIN_TICKS else "DATA_UNAVAILABLE"

                # Retry remains WebSocket replay and is only used when the first
                # replay is zero/insufficient.
                if replay_count < MIN_TICKS and ws_replay_allowed:
                    retry_used=True
                    retry_start=max(start_dt-timedelta(minutes=2),end_dt-timedelta(hours=23,minutes=55))
                    retry_rows,live_retry,retry_error=load_ws(symbol,retry_start)
                    live_seen+=live_retry
                    if retry_error and not ws_error: ws_error=retry_error
                    if len(retry_rows)>=MIN_TICKS:
                        ws_rows=retry_rows
                        replay_count=len(retry_rows)
                        source="websocket_replay"

                # Fallback is only entered for zero/insufficient WebSocket evidence.
                if replay_count < MIN_TICKS:
                    vault_rows,vault_raw_count,vault_valid_count,fallback_error,vault_first,vault_last,vault_catalog,vault_schema=load_vault(symbol)
                    vault_window_count=len(vault_rows)
                    if len(vault_rows)>=MIN_TICKS:
                        rows=vault_rows
                        source="vault_history_fallback"
                    else:
                        rows=[]
                        source="DATA_UNAVAILABLE"
                else:
                    rows=ws_rows

                collected[symbol]=rows
                replay_meta[symbol]={
                    "ticks":len(rows),
                    "source":source,
                    "websocket_replay_valid_ticks":replay_count,
                    "vault_raw_rows":vault_raw_count,
                    "vault_raw_valid_bid_ask_ticks":vault_valid_count,
                    "vault_window_valid_ticks":vault_window_count,
                    "vault_raw_first_timestamp":vault_first,
                    "vault_raw_last_timestamp":vault_last,
                    "vault_catalog_dataset":vault_catalog.get("dataset"),
                    "vault_catalog_ticks":vault_catalog.get("ticks"),
                    "vault_catalog_first_timestamp":vault_catalog.get("first").isoformat() if vault_catalog.get("first") else None,
                    "vault_catalog_last_timestamp":vault_catalog.get("last").isoformat() if vault_catalog.get("last") else None,
                    "live_ticks_seen":live_seen,
                    "retry_used":retry_used,
                    "websocket_replay_allowed":ws_replay_allowed,
                    "websocket_error":ws_error,
                    "fallback_error":fallback_error,
                    "vault_schema":vault_schema,
                    "resolved_window_start":start_dt.isoformat(),
                    "resolved_window_end":end_dt.isoformat(),
                    "replay_evidence":"PRESENT" if rows else "NONE",
                    "diagnostic":(
                        "Historical ticks loaded from WebSocket replay."
                        if source=="websocket_replay" else
                        "WebSocket replay zero/insufficient; loaded and locally filtered LSE vault raw-tick history."
                        if source=="vault_history_fallback" else
                        "DATA_UNAVAILABLE: neither WebSocket replay nor vault raw-tick history contained enough valid bid/ask ticks for the exact UTC window."
                    ),
                    "first_timestamp":rows[0]["timestamp"].isoformat() if rows else None,
                    "last_timestamp":rows[-1]["timestamp"].isoformat() if rows else None
                }
                print(f"{symbol}")
                print(f"WebSocket replay: {replay_count} valid ticks")
                if replay_count < MIN_TICKS:
                    print(f"Vault catalog: dataset={vault_catalog.get('dataset')} ticks={vault_catalog.get('ticks')} first={vault_catalog.get('first')} last={vault_catalog.get('last')}")
                    print(f"Vault raw tick history rows: {vault_raw_count} | valid bid/ask ticks: {vault_valid_count}")
                    print(f"Vault raw schema: {vault_schema or 'UNKNOWN'}")
                    print(f"Vault ticks in exact window: {vault_window_count} valid bid/ask ticks")
                    print(f"Vault raw returned range: {vault_first} -> {vault_last}")
                print(f"Selected source: {source}")
                print(f"Window: {iso_z(start_dt)} -> {iso_z(end_dt)}")
                print(f"TCA REPLAY {symbol}: {len(rows)} valid historical bid/ask ticks | source={source}")
                if source=="DATA_UNAVAILABLE":
                    print(f"TCA DATA_UNAVAILABLE {symbol}: minimum required valid bid/ask ticks={MIN_TICKS}")
            return collected,replay_meta
        tick_map, tick_replay_meta = load_ticks(symbols, start_dt, end_dt)

        for symbol in symbols:
            ticks = tick_map.get(symbol, [])
            tick_times = [t["timestamp"] for t in ticks]
            selected_source = tick_replay_meta.get(symbol, {}).get("source", "DATA_UNAVAILABLE")
            if ticks:
                print(f"TCA REPLAY {symbol}: received historical tick tape | source={selected_source}")
            else:
                print(f"TCA REPLAY {symbol}: no usable historical tick tape | source={selected_source}")
            print(f"TCA REPLAY {symbol}: {len(ticks)} valid bid/ask ticks")
            if len(ticks) < 100:
                failures.append({"symbol":symbol, "stage":"ticks", "source":tick_replay_meta.get(symbol, {}).get("source", "DATA_UNAVAILABLE"),
                                 "error":"insufficient valid tick history"})
                continue

            # Pull 5m candles with a lookback so ATR and structural swings are known
            # at every historical decision point. This is execution replay, not a
            # replacement for the nine-strategy directional backtest.
            lookback_start = start_dt - timedelta(hours=12)
            try:
                raw_candles = client.candles(
                    symbol,
                    "5m",
                    start=api_date(lookback_start),
                    end=api_date(end_dt)
                )
                candles = [
                    c for c in normalize_candles(raw_candles)
                    if lookback_start <= c["timestamp"] <= end_dt
                ]
            except Exception as exc:
                failures.append({"symbol":symbol, "stage":"candles", "error":f"{type(exc).__name__}: {exc}"})
                print(f"TCA ERROR {symbol} candles: {type(exc).__name__}: {exc}")
                continue

            if len(candles) < 60:
                failures.append({"symbol":symbol, "stage":"candles", "error":"insufficient 5m candle history"})
                continue

            tick_i = 0
            setup_count = 0
            for i in range(50, len(candles)-1):
                candle = candles[i]
                asof = candle["timestamp"] + timedelta(minutes=5)
                if asof < start_dt or asof >= end_dt:
                    continue
                # Only use ticks after the candle is closed. No future tick is used
                # in the trigger, ATR, SL/TP or predicted execution score.
                while tick_i < len(ticks) and ticks[tick_i]["timestamp"] < asof:
                    tick_i += 1
                if tick_i >= len(ticks):
                    break

                history_rows = candles[:i+1]
                a = atr(history_rows)
                if not a or a <= 0:
                    continue

                for side in ("BUY","SELL"):
                    reference = closed_breakout_level(history_rows, side)
                    if reference is None:
                        continue
                    trigger = reference + a*ENTRY_BUFFER_ATR if side == "BUY" else reference - a*ENTRY_BUFFER_ATR
                    plan = levels(history_rows, side, trigger)
                    if not plan or plan["rr"] < 1.0:
                        continue

                    obs_end = min(end_dt, asof + timedelta(seconds=observation_seconds))
                    snapshot = []
                    j = tick_i
                    while j < len(ticks) and ticks[j]["timestamp"] <= obs_end:
                        snapshot.append(ticks[j]); j += 1
                    pred = prediction(snapshot, side, trigger, a, asof)
                    if pred is None:
                        continue

                    decision_time = parse_ts(pred["decision_time"])
                    future_end = min(end_dt, decision_time + timedelta(minutes=horizon_minutes))
                    if pred["state"] == "EXECUTABLE_TRIGGER_CROSSED":
                        cross = snapshot[-1]
                    else:
                        cross = first_cross(ticks, tick_times, decision_time, future_end, side, trigger)
                    row = {
                        "symbol":symbol, "asof":asof.isoformat(), "decision_time":pred["decision_time"], "side":side,
                        "trigger":trigger, "atr":a, "planned_sl":plan["sl"], "planned_tp":plan["tp"],
                        "planned_rr":plan["rr"], "prediction_state":pred["state"],
                        "predicted_execution_score":pred["execution_score"],
                        "predicted_spread_bps":pred["spread_bps"],
                        "predicted_spread_atr":pred["spread_atr"],
                        "predicted_slippage_proxy_atr":pred["slippage_proxy_atr"],
                        "predicted_chase_atr":pred["chase_distance_atr"],
                        "predicted_tick_count":pred["tick_count"],
                        "trigger_crossed_within_horizon":bool(cross),
                        "fill_time":None, "fill_price":None,
                        "arrival_mid":pred["mid"],
                        "implementation_shortfall_bps":None,
                        "realized_entry_slippage_atr":None,
                        "realized_spread_bps":None,
                        "realized_spread_atr":None,
                        "markout_5m_bps":None, "markout_15m_bps":None,
                        "markout_60m_bps":None, "mfe_r":None, "mae_r":None,
                        "outcome_1r":None, "tp_or_sl_first":None,
                    }
                    if cross:
                        fill_time = cross["timestamp"]
                        fill_price = cross["ask"] if side == "BUY" else cross["bid"]
                        fill_mid = (cross["bid"]+cross["ask"])/2.0
                        row["fill_time"] = fill_time.isoformat()
                        row["fill_price"] = fill_price
                        row["realized_entry_slippage_atr"] = abs(fill_price-trigger)/a
                        row["realized_spread_bps"] = (cross["ask"]-cross["bid"])/max(fill_mid,1e-12)*10000.0
                        row["realized_spread_atr"] = (cross["ask"]-cross["bid"])/max(a,1e-12)
                        arrival_mid = float(pred["mid"])
                        if side == "BUY":
                            row["implementation_shortfall_bps"] = (fill_price-arrival_mid)/max(arrival_mid,1e-12)*10000.0
                        else:
                            row["implementation_shortfall_bps"] = (arrival_mid-fill_price)/max(arrival_mid,1e-12)*10000.0
                        for mins, key in ((5,"markout_5m_bps"),(15,"markout_15m_bps"),(60,"markout_60m_bps")):
                            if mins*60 <= horizon_minutes:
                                mo = markout(ticks, tick_times, fill_time, side, fill_price, mins*60)
                                if mo:
                                    denom = max(fill_price,1e-12)
                                    row[key] = (mo["final"]/denom)*10000.0
                                    if mins == 5:
                                        row["mfe_r"] = mo["mfe"]/max(plan["risk"],1e-12)
                                        row["mae_r"] = mo["mae"]/max(plan["risk"],1e-12)
                        outcome, outcome_tick = hit_order(ticks, tick_times, fill_time, side, plan["sl"], plan["tp"], horizon_minutes*60)
                        row["tp_or_sl_first"] = outcome
                        if outcome == "TP_FIRST":
                            row["outcome_1r"] = "WIN"
                        elif outcome == "SL_FIRST":
                            row["outcome_1r"] = "LOSS"
                        else:
                            row["outcome_1r"] = "OPEN_AT_HORIZON"
                    observations.append(row)
                    setup_count += 1
                    if setup_count >= max_setups:
                        break
                if setup_count >= max_setups:
                    break

            print(f"TCA REPLAY {symbol}: {setup_count} historical setup snapshots evaluated")

        try:
            client.disconnect()
        except Exception:
            pass

        # Calibration statistics.
        def mean(values):
            vals = [float(x) for x in values if x is not None and math.isfinite(float(x))]
            return statistics.fmean(vals) if vals else None

        def rate(values, positive):
            vals = [x for x in values if x is not None]
            return (sum(1 for x in vals if x == positive)/len(vals)*100.0) if vals else None

        buckets = defaultdict(list)
        for row in observations:
            buckets[bucket(float(row["predicted_execution_score"]))].append(row)

        bucket_summary = {}
        for name in ("0-49","50-69","70-84","85-100"):
            rows = buckets.get(name, [])
            bucket_summary[name] = {
                "observations":len(rows),
                "trigger_fill_rate_pct":rate([r["trigger_crossed_within_horizon"] for r in rows], True),
                "avg_predicted_spread_bps":mean([r["predicted_spread_bps"] for r in rows]),
                "avg_realized_spread_bps":mean([r["realized_spread_bps"] for r in rows]),
                "avg_predicted_slippage_atr":mean([r["predicted_slippage_proxy_atr"] for r in rows]),
                "avg_realized_entry_slippage_atr":mean([r["realized_entry_slippage_atr"] for r in rows]),
                "avg_5m_markout_bps":mean([r["markout_5m_bps"] for r in rows]),
                "avg_15m_markout_bps":mean([r["markout_15m_bps"] for r in rows]),
                "win_rate_pct":rate([r["outcome_1r"] for r in rows], "WIN"),
                "loss_rate_pct":rate([r["outcome_1r"] for r in rows], "LOSS"),
            }

        fill_rows = [r for r in observations if r["fill_price"] is not None]
        spread_abs_errors = [abs(r["predicted_spread_bps"]-r["realized_spread_bps"]) for r in fill_rows
                             if r["realized_spread_bps"] is not None]
        slip_abs_errors = [abs(r["predicted_slippage_proxy_atr"]-r["realized_entry_slippage_atr"]) for r in fill_rows
                           if r["realized_entry_slippage_atr"] is not None]
        overall = {
            "observations":len(observations),
            "fills":len(fill_rows),
            "trigger_fill_rate_pct": (len(fill_rows)/len(observations)*100.0) if observations else None,
            "avg_predicted_spread_bps":mean([r["predicted_spread_bps"] for r in observations]),
            "avg_realized_spread_bps":mean([r["realized_spread_bps"] for r in fill_rows]),
            "spread_prediction_mae_bps":mean(spread_abs_errors),
            "avg_predicted_slippage_proxy_atr":mean([r["predicted_slippage_proxy_atr"] for r in observations]),
            "avg_realized_entry_slippage_atr":mean([r["realized_entry_slippage_atr"] for r in fill_rows]),
            "slippage_prediction_mae_atr":mean(slip_abs_errors),
            "avg_5m_markout_bps":mean([r["markout_5m_bps"] for r in fill_rows]),
            "avg_15m_markout_bps":mean([r["markout_15m_bps"] for r in fill_rows]),
            "avg_60m_markout_bps":mean([r["markout_60m_bps"] for r in fill_rows]),
            "win_rate_pct":rate([r["outcome_1r"] for r in fill_rows], "WIN"),
            "loss_rate_pct":rate([r["outcome_1r"] for r in fill_rows], "LOSS"),
        }


        # Empirical threshold calibration. The thresholds are selected only on the
        # chronological training slice, checked for stability on validation, then
        # frozen and evaluated on a final holdout. The holdout never tunes a value.
        filled = [r for r in observations if r.get("fill_price") is not None and
                  r.get("realized_entry_slippage_atr") is not None and
                  r.get("implementation_shortfall_bps") is not None]
        filled.sort(key=lambda r: parse_ts(r["decision_time"]))
        calibration = {
            "version": "v12.7-execution-calibration",
            "status": "FALLBACK",
            "source": "static_default",
            "min_confirmed_score": 70.0,
            "high_quality_score": 85.0,
            "oos_validated": False,
            "observations": len(filled),
            "method": "chronological 60/20/20 train-validation-holdout; highest score meeting minimum acceptable-execution rate with minimum sample guards",
            "acceptable_execution_definition": {
                "max_realized_entry_slippage_atr": 0.20,
                "max_implementation_shortfall_bps_relative_to_realized_spread": 1.0,
                "minimum_absolute_shortfall_tolerance_bps": 0.5
            }
        }

        def acceptable_execution(row):
            try:
                slip = float(row["realized_entry_slippage_atr"])
                shortfall = float(row["implementation_shortfall_bps"])
                spread = float(row["realized_spread_bps"])
                return (
                    math.isfinite(slip) and math.isfinite(shortfall) and math.isfinite(spread)
                    and slip <= 0.20
                    and shortfall <= max(0.5, spread)
                )
            except (TypeError, ValueError, KeyError):
                return False

        def rate_for(rows, threshold):
            selected = [r for r in rows if float(r["predicted_execution_score"]) >= threshold]
            if not selected:
                return None, 0
            good = sum(1 for r in selected if acceptable_execution(r))
            return good / len(selected) * 100.0, len(selected)

        if len(filled) >= calibration_min_obs:
            n = len(filled)
            train_end = max(1, int(n * 0.60))
            valid_end = max(train_end + 1, int(n * 0.80))
            train = filled[:train_end]
            validation = filled[train_end:valid_end]
            holdout = filled[valid_end:]
            candidate_scores = list(range(50, 96))

            def choose_threshold(rows, target_rate, min_n):
                eligible = []
                for threshold in candidate_scores:
                    good_rate, count = rate_for(rows, threshold)
                    if count >= min_n and good_rate is not None and good_rate >= target_rate:
                        eligible.append((threshold, good_rate, count))
                # Highest passing threshold is intentionally chosen: it is the
                # conservative boundary, not the easiest threshold to pass.
                return eligible[-1] if eligible else None

            min_sample_train = max(20, min(100, len(train) // 4))
            min_sample_validation = max(10, min(50, len(validation) // 4))
            min_sample_holdout = max(10, min(50, len(holdout) // 4))

            chosen_min = choose_threshold(train, 70.0, min_sample_train)
            chosen_high = choose_threshold(train, 80.0, min_sample_train)

            if chosen_min and chosen_high:
                min_score, train_min_rate, train_min_n = chosen_min
                high_score, train_high_rate, train_high_n = chosen_high
                val_min_rate, val_min_n = rate_for(validation, min_score)
                val_high_rate, val_high_n = rate_for(validation, high_score)
                hold_min_rate, hold_min_n = rate_for(holdout, min_score)
                hold_high_rate, hold_high_n = rate_for(holdout, high_score)

                stable = (
                    val_min_rate is not None and val_high_rate is not None
                    and val_min_n >= min_sample_validation
                    and val_high_n >= min_sample_validation
                    and hold_min_rate is not None and hold_high_rate is not None
                    and hold_min_n >= min_sample_holdout
                    and hold_high_n >= min_sample_holdout
                    and val_min_rate >= train_min_rate - 10.0
                    and val_high_rate >= train_high_rate - 10.0
                    and hold_min_rate >= 65.0
                    and hold_high_rate >= 75.0
                    and high_score >= min_score
                )
                if stable:
                    calibration.update({
                        "status": "CALIBRATED",
                        "source": "empirical_tca_oos_validated",
                        "min_confirmed_score": float(min_score),
                        "high_quality_score": float(high_score),
                        "oos_validated": True,
                        "train": {
                            "observations": len(train),
                            "min_threshold": min_score,
                            "min_rate_pct": train_min_rate,
                            "min_selected": train_min_n,
                            "high_threshold": high_score,
                            "high_rate_pct": train_high_rate,
                            "high_selected": train_high_n
                        },
                        "validation": {
                            "observations": len(validation),
                            "min_rate_pct": val_min_rate,
                            "min_selected": val_min_n,
                            "high_rate_pct": val_high_rate,
                            "high_selected": val_high_n
                        },
                        "holdout": {
                            "observations": len(holdout),
                            "min_rate_pct": hold_min_rate,
                            "min_selected": hold_min_n,
                            "high_rate_pct": hold_high_rate,
                            "high_selected": hold_high_n
                        }
                    })
                else:
                    calibration["reason"] = "Candidate thresholds failed chronological validation/holdout stability gates; static thresholds retained."
            else:
                calibration["reason"] = "Insufficient stable score bands meeting empirical quality targets; static thresholds retained."
        else:
            calibration["reason"] = f"Only {len(filled)} filled observations; at least {calibration_min_obs} are required before calibration is trusted."

        with open("execution_calibration.json", "w", encoding="utf-8") as f:
            json.dump(calibration, f, indent=2)
        print("EMPIRICAL EXECUTION CALIBRATION")
        print(json.dumps(calibration, indent=2))

        report = {
            "version":"v12.21-historical-tick-replay-tca",
            "generated_at":now_utc().isoformat(),
            "methodology":{
                "source":"LSE historical raw tick tape + 5m closed candles",
                "execution_side_rule":"BUY=ASK, SELL=BID",
                "prediction_window_seconds":observation_seconds,
                "minimum_prediction_ticks":min_ticks,
                "trigger":"closed-candle structural breakout + 0.10 ATR buffer",
                "fill":"first historical executable bid/ask crossing trigger",
                "markout":"executable opposite side after fill; no mid/last substitution",
                "warning":"This is execution-model validation, not a full nine-strategy directional backtest. It measures whether the live top-of-book execution model predicts realized execution conditions and post-trigger outcomes."
            },
            "period":{"start":start_dt.isoformat(),"end":end_dt.isoformat()},
            "symbols":symbols,
            "tick_replay":tick_replay_meta,
            "overall":overall,
            "score_calibration":bucket_summary,
            "execution_calibration":calibration,
            "failures":failures,
            "observations":observations,
        }
        with open("execution_tca.json","w",encoding="utf-8") as f:
            json.dump(report,f,indent=2,default=str)
        fields = list(observations[0].keys()) if observations else [
            "symbol","asof","side","trigger","predicted_execution_score"
        ]
        with open("execution_tca.csv","w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=fields)
            w.writeheader()
            w.writerows(observations)

        print("="*72)
        print("HISTORICAL TICK REPLAY + EXECUTION TCA")
        print("="*72)
        print(json.dumps({"overall":overall,"score_calibration":bucket_summary,"execution_calibration":calibration,"failures":failures},indent=2))
        if not observations:
            tick_data_available = any(
                meta.get("ticks",0) >= MIN_TICKS and meta.get("source") != "DATA_UNAVAILABLE"
                for meta in tick_replay_meta.values()
            )
            report["status"] = "NO_QUALIFIED_OBSERVATIONS" if tick_data_available else "DATA_UNAVAILABLE"
            with open("execution_tca.json","w",encoding="utf-8") as f:
                json.dump(report,f,indent=2,default=str)
            if report["status"] == "DATA_UNAVAILABLE":
                print(
                    "TCA DATA_UNAVAILABLE: no symbol supplied enough validated bid/ask "
                    "ticks in the exact UTC window. No empirical calibration is trusted."
                )
            else:
                print(
                    "TCA NO_QUALIFIED_OBSERVATIONS: validated tick data was available, "
                    "but no historical setup satisfied the execution observation gates. "
                    "No empirical calibration is trusted."
                )
        elif failures:
            report["status"] = "PARTIAL"
            with open("execution_tca.json","w",encoding="utf-8") as f:
                json.dump(report,f,indent=2,default=str)
            print(
                f"TCA PARTIAL: {len(observations)} observations / {len(fill_rows)} simulated fills; "
                f"{len(failures)} symbol/data failures | "
                f"calibration={calibration.get('status')} "
                f"min={calibration.get('min_confirmed_score')} high={calibration.get('high_quality_score')}"
            )
        else:
            report["status"] = "COMPLETE"
            with open("execution_tca.json","w",encoding="utf-8") as f:
                json.dump(report,f,indent=2,default=str)
            print(
                f"TCA COMPLETE: {len(observations)} observations / {len(fill_rows)} simulated fills | "
                f"calibration={calibration.get('status')} "
                f"min={calibration.get('min_confirmed_score')} high={calibration.get('high_quality_score')}"
            )
        PY
    - name: Validate TCA report
      run: |
        set -euo pipefail
        python - <<'PY'
        import json, math
        from pathlib import Path
        report=json.loads(Path("execution_tca.json").read_text(encoding="utf-8"))
        assert report.get("version") == "v12.21-historical-tick-replay-tca"

        if report.get("status") == "DISABLED":
            cal=report.get("calibration", {})
            assert cal.get("status") == "DEFAULT"
            assert float(cal.get("min_confirmed_score", 70)) == 70.0
            assert float(cal.get("high_quality_score", 85)) == 85.0
            print("Historical tick replay/TCA disabled validation: PASS")
            raise SystemExit(0)

        cal=report.get("execution_calibration", {})
        assert cal.get("status") in ("CALIBRATED","FALLBACK")
        assert 50 <= float(cal.get("min_confirmed_score", 70)) <= 95
        assert 50 <= float(cal.get("high_quality_score", 85)) <= 99

        replay=report.get("tick_replay", {})
        assert isinstance(replay, dict), "tick_replay diagnostics missing"
        assert isinstance(report.get("failures"), list)

        observations=report.get("observations")
        assert isinstance(observations, list)

        # Zero observations are a valid evidence state, not a Python/runtime failure.
        # They must be reported explicitly and must never be treated as calibration evidence.
        if report.get("status") in ("DATA_UNAVAILABLE","NO_QUALIFIED_OBSERVATIONS"):
            assert not observations
            assert cal.get("status") == "FALLBACK"
            assert cal.get("oos_validated") is False
            assert isinstance(replay, dict)
            print(f"Historical tick replay/TCA validation: PASS ({report.get('status')}; no calibration trusted)")
            raise SystemExit(0)

        assert report.get("status") in ("COMPLETE","PARTIAL")
        assert observations
        if report.get("status") == "PARTIAL":
            assert report.get("failures")

        overall=report["overall"]
        for key in ("observations","fills","trigger_fill_rate_pct","avg_predicted_spread_bps",
                    "avg_realized_spread_bps","avg_predicted_slippage_proxy_atr",
                    "avg_realized_entry_slippage_atr"):
            assert key in overall, f"Missing TCA field: {key}"

        for row in observations[:100]:
            assert row["side"] in ("BUY","SELL")
            assert row["trigger"] is not None
            assert row["predicted_execution_score"] is not None
            assert 0 <= float(row["predicted_execution_score"]) <= 100
            if row["fill_price"] is not None:
                assert row["fill_time"] is not None
                assert row["realized_entry_slippage_atr"] is not None

        print("Historical tick replay/TCA report validation: PASS")
        print(f"Observations: {overall['observations']} | fills: {overall['fills']}")
        PY
    - name: Upload TCA artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: historical-tick-replay-tca
        path: |
          execution_calibration.json
          execution_tca.json
          execution_tca.csv
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      max_instruments:
        description: 0 = discover all eligible instruments; runtime governor prevents runaway scans
        required: false
        default: '0'
        type: string
      categories:
        description: Catalog categories to scan; every eligible live-catalog instrument in these categories is eligible for
          discovery
        required: false
        default: forex,commodity,crypto
        type: string
      top_n:
        description: Number of qualified setups / WAIT candidates to display
        required: false
        default: '5'
        type: string
      runtime_minutes:
        description: Maximum scanner runtime in minutes; 0 uses the safe default
        required: false
        default: '8'
        type: string
      scan_mode:
        description: ONCE = one complete scan; UNTIL_POSITION = repeat full scans until a confirmed position is found or the
          safety limit is reached
        required: false
        default: ONCE
        type: choice
        options:
        - ONCE
        - UNTIL_POSITION
      until_position_max_minutes:
        description: Safety limit for UNTIL_POSITION mode (maximum 55 minutes)
        required: false
        default: '55'
        type: string
      poll_seconds:
        description: Pause between full scans in UNTIL_POSITION mode
        required: false
        default: '30'
        type: string
      fast_candidate_limit:
        description: Maximum instruments promoted from the fast 1H/15M/5M filter to deep analysis
        required: false
        default: '8'
        type: string
      fast_min_score:
        description: Minimum fast-filter opportunity score to promote an instrument; lower values show more potential setups
        required: false
        default: '55'
        type: string
      run_tca:
        description: Run historical tick replay + execution TCA calibration; uses the LSE WebSocket historical source and
          automatically feeds E2E.
        required: false
        default: false
        type: boolean
      tca_symbols:
        description: Comma-separated symbols for execution replay
        required: false
        default: EUR/USD,GBP/USD,XAU/USD,BTC/USD
        type: string
      tca_start:
        description: UTC replay start (ISO timestamp); blank = newest catalog-backed 4-hour window. WebSocket replay is attempted
          first; if zero/insufficient, validated vault history is used and filtered locally to the exact resolved UTC window.
        required: false
        default: ''
        type: string
      tca_end:
        description: UTC replay end (ISO timestamp); blank = now. Historical ticks are filtered locally to this exact UTC
          window.
        required: false
        default: ''
        type: string
      tca_horizon_minutes:
        description: Maximum realized markout horizon after a simulated fill
        required: false
        default: '60'
        type: string
      tca_observation_seconds:
        description: Historical top-of-book observation window used to predict execution conditions
        required: false
        default: '4'
        type: string
      tca_max_setups:
        description: Maximum historical closed-candle setup snapshots per symbol
        required: false
        default: '500'
        type: string
      tca_min_ticks:
        description: Minimum ticks required in an execution observation window
        required: false
        default: '3'
        type: string
      tca_calibration_min_observations:
        description: Minimum filled observations required before empirical execution-score calibration is trusted; never used
          to hand-tune live thresholds
        required: false
        default: '100'
        type: string
      run_e2e:
        description: 'Run historical nine-strategy end-to-end replay: signal -> trigger -> bid/ask fill -> MFE/MAE -> TP/SL'
        required: false
        default: false
        type: boolean
      e2e_symbols:
        description: Comma-separated symbols for end-to-end replay
        required: false
        default: EUR/USD,GBP/USD,XAU/USD,BTC/USD
        type: string
      e2e_start:
        description: UTC E2E replay start (ISO timestamp); blank = newest catalog-backed 23h30m window. WebSocket replay is
          attempted first; if zero/insufficient, validated vault history is used and filtered locally to the exact resolved
          UTC window.
        required: false
        default: ''
        type: string
      e2e_end:
        description: UTC E2E replay end (ISO timestamp); blank = now. Historical ticks are filtered locally to this exact
          UTC window.
        required: false
        default: ''
        type: string
      e2e_max_setups:
        description: Maximum historical qualified signal setups across all symbols
        required: false
        default: '500'
        type: string
      e2e_horizon_minutes:
        description: Maximum historical holding horizon used for realized TP/SL and MFE/MAE
        required: false
        default: '240'
        type: string
  schedule:
  - cron: 5,20,35,50 * * * *
