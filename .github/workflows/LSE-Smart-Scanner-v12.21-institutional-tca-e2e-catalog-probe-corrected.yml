        \ = {\n\"EURUSD\":\"EUR/USD\",\"EUR-USD\":\"EUR/USD\",\"EUR_USD\":\"EUR/USD\",\n\"GBPUSD\":\"GBP/USD\",\"GBP-USD\"\
