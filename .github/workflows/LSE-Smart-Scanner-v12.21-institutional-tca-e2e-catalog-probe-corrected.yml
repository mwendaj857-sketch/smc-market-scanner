        USDCHF\":\"USD/CHF\",\"USD-CHF\":\"USD/CHF\",\"USD_CHF\":\"USD/CHF\",\n\"AUDUSD\":\"AUD/USD\",\"AUD-USD\":\"AUD/USD\"\
        ,\"AUD_USD\":\"AUD/USD\",\n\"USDCAD\":\"USD/CAD\",\"USD-CAD\":\"USD/CAD\",\"USD_CAD\":\"USD/CAD\",\n\"NZDUSD\":\"\
