            )
            scanner_candidates.extend(
                block for block in blocks
                if "FAST FILTER -> DEEP ANALYSIS" in block
                and "def dominant(methods, minimum=2)" in block
                and "def atr(" in block
                and "def strategy_catalog(" in block
                and "def now_utc" in block
