            "avg_15m_markout_bps":mean([r["markout_15m_bps"] for r in fill_rows]),
            "avg_60m_markout_bps":mean([r["markout_60m_bps"] for r in fill_rows]),
            "win_rate_pct":rate([r["outcome_1r"] for r in fill_rows], "WIN"),
            "loss_rate_pct":rate([r["outcome_1r"] for r in fill_rows], "LOSS"),
        }
        
        
        # Empirical threshold calibration. The thresholds are selected only on the
        # chronological training slice, checked for stability on validation, then
        # frozen and evaluated on a final holdout. The holdout never tunes a value.
        filled = [r for r in observations if r.get("fill_price") is not None and
                  r.get("realized_entry_slippage_atr") is not None and
                  r.get("implementation_shortfall_bps") is not None]
        filled.sort(key=lambda r: parse_ts(r["decision_time"]))
        calibration = {
            "version": "v12.43-execution-calibration",
            "status": "FALLBACK",
            "source": "static_default",
            "min_confirmed_score": 70.0,
            "high_quality_score": 85.0,
            "oos_validated": False,
            "observations": len(filled),
            "method": "chronological 60/20/20 train-validation-holdout; highest score meeting minimum acceptable-execution rate with minimum sample guards",
            "acceptable_execution_definition": {
                "max_realized_entry_slippage_atr": 0.20,
                "max_implementation_shortfall_bps_relative_to_realized_spread": 1.0,
                "minimum_absolute_shortfall_tolerance_bps": 0.5
            }
        }
        
        def acceptable_execution(row):
            try:
                slip = float(row["realized_entry_slippage_atr"])
                shortfall = float(row["implementation_shortfall_bps"])
                spread = float(row["realized_spread_bps"])
                return (
                    math.isfinite(slip) and math.isfinite(shortfall) and math.isfinite(spread)
                    and slip <= 0.20
                    and shortfall <= max(0.5, spread)
                )
            except (TypeError, ValueError, KeyError):
                return False
        
        def rate_for(rows, threshold):
            selected = [r for r in rows if float(r["predicted_execution_score"]) >= threshold]
            if not selected:
                return None, 0
            good = sum(1 for r in selected if acceptable_execution(r))
            return good / len(selected) * 100.0, len(selected)
        
        if len(filled) >= calibration_min_obs:
            n = len(filled)
            train_end = max(1, int(n * 0.60))
            valid_end = max(train_end + 1, int(n * 0.80))
            train = filled[:train_end]
            validation = filled[train_end:valid_end]
            holdout = filled[valid_end:]
            candidate_scores = list(range(50, 96))
        
            def choose_threshold(rows, target_rate, min_n):
                eligible = []
                for threshold in candidate_scores:
                    good_rate, count = rate_for(rows, threshold)
                    if count >= min_n and good_rate is not None and good_rate >= target_rate:
                        eligible.append((threshold, good_rate, count))
                # Highest passing threshold is intentionally chosen: it is the
                # conservative boundary, not the easiest threshold to pass.
                return eligible[-1] if eligible else None
        
            min_sample_train = max(20, min(100, len(train) // 4))
            min_sample_validation = max(10, min(50, len(validation) // 4))
            min_sample_holdout = max(10, min(50, len(holdout) // 4))
        
            chosen_min = choose_threshold(train, 70.0, min_sample_train)
            chosen_high = choose_threshold(train, 80.0, min_sample_train)
        
            if chosen_min and chosen_high:
                min_score, train_min_rate, train_min_n = chosen_min
                high_score, train_high_rate, train_high_n = chosen_high
                val_min_rate, val_min_n = rate_for(validation, min_score)
                val_high_rate, val_high_n = rate_for(validation, high_score)
                hold_min_rate, hold_min_n = rate_for(holdout, min_score)
                hold_high_rate, hold_high_n = rate_for(holdout, high_score)
        
                stable = (
                    val_min_rate is not None and val_high_rate is not None
                    and val_min_n >= min_sample_validation
                    and val_high_n >= min_sample_validation
                    and hold_min_rate is not None and hold_high_rate is not None
                    and hold_min_n >= min_sample_holdout
                    and hold_high_n >= min_sample_holdout
                    and val_min_rate >= train_min_rate - 10.0
                    and val_high_rate >= train_high_rate - 10.0
                    and hold_min_rate >= 65.0
                    and hold_high_rate >= 75.0
                    and high_score >= min_score
                )
                if stable:
                    calibration.update({
                        "status": "CALIBRATED",
                        "source": "empirical_tca_oos_validated",
                        "min_confirmed_score": float(min_score),
                        "high_quality_score": float(high_score),
                        "oos_validated": True,
                        "train": {
                            "observations": len(train),
                            "min_threshold": min_score,
                            "min_rate_pct": train_min_rate,
                            "min_selected": train_min_n,
                            "high_threshold": high_score,
                            "high_rate_pct": train_high_rate,
                            "high_selected": train_high_n
                        },
                        "validation": {
                            "observations": len(validation),
                            "min_rate_pct": val_min_rate,
                            "min_selected": val_min_n,
                            "high_rate_pct": val_high_rate,
                            "high_selected": val_high_n
                        },
                        "holdout": {
                            "observations": len(holdout),
                            "min_rate_pct": hold_min_rate,
                            "min_selected": hold_min_n,
                            "high_rate_pct": hold_high_rate,
                            "high_selected": hold_high_n
                        }
                    })
                else:
                    calibration["reason"] = "Candidate thresholds failed chronological validation/holdout stability gates; static thresholds retained."
            else:
                calibration["reason"] = "Insufficient stable score bands meeting empirical quality targets; static thresholds retained."
        else:
            calibration["reason"] = f"Only {len(filled)} filled observations; at least {calibration_min_obs} are required before calibration is trusted."
        
        with open("execution_calibration.json", "w", encoding="utf-8") as f:
            json.dump(calibration, f, indent=2)
        print("EMPIRICAL EXECUTION CALIBRATION")
        print(json.dumps(calibration, indent=2))
        
        report = {
            "version":"v12.43-historical-tick-replay-tca",
            "generated_at":now_utc().isoformat(),
            "methodology":{
                "source":"LSE historical raw tick tape + point-in-time six-timeframe candle reconstruction",
                "historical_setup_reconstruction":"Same scanner directional primitives evaluated independently on 1MO/1D/4H/1H/15M/5M snapshots cut strictly at each closed 5M decision time; quote ticks are not required for setup discovery; TCA never calls an undefined runtime strategy_catalog namespace.",
                "execution_side_rule":"BUY=ASK, SELL=BID",
                "prediction_window_seconds":observation_seconds,
                "minimum_prediction_ticks":min_ticks,
                "trigger":"closed-candle structural breakout + 0.10 ATR buffer",
                "fill":"first historical executable bid/ask crossing trigger",
                "markout":"executable opposite side after fill; no mid/last substitution",
                "warning":"This is execution-model validation, not a full nine-strategy directional backtest. It measures whether the live top-of-book execution model predicts realized execution conditions and post-trigger outcomes."
            },
            "period":{"start":start_dt.isoformat(),"end":end_dt.isoformat()},
            "symbols":symbols,
            "tick_replay":tick_replay_meta,
            "overall":overall,
            "score_calibration":bucket_summary,
            "execution_calibration":calibration,
            "historical_reconstruction":{
                "decision_snapshots_evaluated":historical_setup_snapshots_evaluated,
                "strategy_catalog_candidates":historical_catalog_candidates,
                "qualified_signal_paths":historical_qualified_setups,
                "reconstruction_failures":historical_reconstruction_failures,
                "future_candle_policy":"strictly excluded by closed_by_decision_tca()"
            },
            "failures":failures,
            "observations":observations,
        }
        with open("execution_tca.json","w",encoding="utf-8") as f:
            json.dump(report,f,indent=2,default=str)
        fields = list(observations[0].keys()) if observations else [
            "symbol","asof","side","trigger","predicted_execution_score"
        ]
        with open("execution_tca.csv","w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=fields)
            w.writeheader()
            w.writerows(observations)
        
        print("="*72)
        print("HISTORICAL TICK REPLAY + EXECUTION TCA")
        print("="*72)
        print(json.dumps({"overall":overall,"historical_reconstruction":report["historical_reconstruction"],"score_calibration":bucket_summary,"execution_calibration":calibration,"failures":failures},indent=2))
        if not observations:
            tick_data_available = any(
                meta.get("ticks",0) >= MIN_TICKS and meta.get("source") != "DATA_UNAVAILABLE"
                for meta in tick_replay_meta.values()
            )
            rate_limited = any(meta.get("source") == "RATE_LIMITED" for meta in tick_replay_meta.values())
            export_capped = any(meta.get("source") == "EXPORT_BUDGET_CAPPED" for meta in tick_replay_meta.values())
            report["status"] = (
                "RATE_LIMITED" if rate_limited and not tick_data_available else
                "EXPORT_BUDGET_CAPPED" if export_capped and not tick_data_available else
                "NO_QUALIFIED_OBSERVATIONS" if tick_data_available else
                "DATA_UNAVAILABLE"
            )
            with open("execution_tca.json","w",encoding="utf-8") as f:
                json.dump(report,f,indent=2,default=str)
            if report["status"] == "RATE_LIMITED":
                print("TCA RATE_LIMITED: LSE vault export returned HTTP 429. Remaining export calls were intentionally skipped; no empirical calibration is trusted.")
            elif report["status"] == "EXPORT_BUDGET_CAPPED":
                print("TCA EXPORT_BUDGET_CAPPED: local vault-export safety cap was reached before all symbols were exported; no empirical calibration is trusted.")
            elif report["status"] == "DATA_UNAVAILABLE":
                print(
                    "TCA DATA_UNAVAILABLE: no symbol supplied enough validated bid/ask "
                    "ticks in the exact UTC window. No empirical calibration is trusted."
                )
            else:
                print(
                    "TCA NO_QUALIFIED_OBSERVATIONS: validated tick data was available, "
                    "but no historical setup satisfied the execution observation gates. "
                    "No empirical calibration is trusted."
                )
        elif failures:
            report["status"] = "PARTIAL"
            with open("execution_tca.json","w",encoding="utf-8") as f:
                json.dump(report,f,indent=2,default=str)
            print(
                f"TCA PARTIAL: {len(observations)} observations / {len(fill_rows)} simulated fills; "
                f"{len(failures)} symbol/data failures | "
                f"calibration={calibration.get('status')} "
                f"min={calibration.get('min_confirmed_score')} high={calibration.get('high_quality_score')}"
            )
        else:
            report["status"] = "COMPLETE"
            with open("execution_tca.json","w",encoding="utf-8") as f:
                json.dump(report,f,indent=2,default=str)
            print(
                f"TCA COMPLETE: {len(observations)} observations / {len(fill_rows)} simulated fills | "
                f"calibration={calibration.get('status')} "
                f"min={calibration.get('min_confirmed_score')} high={calibration.get('high_quality_score')}"
            )
        PY
    - name: Validate TCA report
      run: "set -euo pipefail\npython - <<'PY'\nimport json, math\nfrom pathlib import Path\nreport=json.loads(Path(\"execution_tca.json\").read_text(encoding=\"\
        utf-8\"))\nassert report.get(\"version\") == \"v12.43-historical-tick-replay-tca\"\n\nif report.get(\"status\") == \"DISABLED\":\n   \
        \ cal=report.get(\"calibration\", {})\n    assert cal.get(\"status\") == \"DEFAULT\"\n    assert float(cal.get(\"min_confirmed_score\"\
        , 70)) == 70.0\n    assert float(cal.get(\"high_quality_score\", 85)) == 85.0\n    print(\"Historical tick replay/TCA disabled validation:\
        \ PASS\")\n    raise SystemExit(0)\n\ncal=report.get(\"execution_calibration\", {})\nassert cal.get(\"status\") in (\"CALIBRATED\",\"\
        FALLBACK\")\nassert 50 <= float(cal.get(\"min_confirmed_score\", 70)) <= 95\nassert 50 <= float(cal.get(\"high_quality_score\", 85)) <=\
        \ 99\n\nreplay=report.get(\"tick_replay\", {})\nassert isinstance(replay, dict), \"tick_replay diagnostics missing\"\nassert isinstance(report.get(\"\
        failures\"), list)\n\nobservations=report.get(\"observations\")\nassert isinstance(observations, list)\n\n# Zero observations are a valid\
        \ evidence state, not a Python/runtime failure.\n# They must be reported explicitly and must never be treated as calibration evidence.\n\
        if report.get(\"status\") in (\"RATE_LIMITED\",\"EXPORT_BUDGET_CAPPED\",\"DATA_UNAVAILABLE\",\"NO_QUALIFIED_OBSERVATIONS\"):\n    assert not observations\n   \
        \ assert cal.get(\"status\") == \"FALLBACK\"\n    assert cal.get(\"oos_validated\") is False\n    assert isinstance(replay, dict)\n  \
        \  print(f\"Historical tick replay/TCA validation: PASS ({report.get('status')}; no calibration trusted)\")\n    raise SystemExit(0)\n\
        \nassert report.get(\"status\") in (\"COMPLETE\",\"PARTIAL\")\nassert observations\nif report.get(\"status\") == \"PARTIAL\":\n    assert\
        \ report.get(\"failures\")\n\noverall=report[\"overall\"]\nfor key in (\"observations\",\"fills\",\"trigger_fill_rate_pct\",\"avg_predicted_spread_bps\"\
        ,\n            \"avg_realized_spread_bps\",\"avg_predicted_slippage_proxy_atr\",\n            \"avg_realized_entry_slippage_atr\"):\n\
        \    assert key in overall, f\"Missing TCA field: {key}\"\n\nfor row in observations[:100]:\n    assert row[\"side\"] in (\"BUY\",\"SELL\"\
        )\n    assert row[\"trigger\"] is not None\n    assert row[\"predicted_execution_score\"] is not None\n    assert 0 <= float(row[\"predicted_execution_score\"\
        ]) <= 100\n    if row[\"fill_price\"] is not None:\n        assert row[\"fill_time\"] is not None\n        assert row[\"realized_entry_slippage_atr\"\
        ] is not None\n\nprint(\"Historical tick replay/TCA report validation: PASS\")\nprint(f\"Observations: {overall['observations']} | fills:\
        \ {overall['fills']}\")\nPY\n"
    - name: Upload TCA artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: historical-tick-replay-tca
        path: 'execution_calibration.json

          execution_tca.json

          execution_tca.csv

          historical_tick_cache/

          '
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      max_instruments:
        description: 0 = discover all eligible instruments; runtime governor prevents runaway scans
        required: false
        default: '0'
        type: string
      categories:
        description: Catalog categories to scan; every eligible live-catalog instrument in these categories is eligible for discovery
        required: false
        default: forex,commodity,crypto
        type: string
      top_n:
        description: Number of qualified setups / WAIT candidates to display
        required: false
        default: '5'
        type: string
      runtime_minutes:
        description: Maximum scanner runtime in minutes; 0 uses the safe default
        required: false
        default: '8'
        type: string
      scan_mode:
        description: ONCE = one complete scan; UNTIL_POSITION = repeat full scans until a confirmed position is found or the safety limit is reached
        required: false
        default: ONCE
        type: choice
        options:
        - ONCE
        - UNTIL_POSITION
      until_position_max_minutes:
        description: Safety limit for UNTIL_POSITION mode (maximum 55 minutes)
        required: false
        default: '55'
        type: string
      poll_seconds:
        description: Pause between full scans in UNTIL_POSITION mode
        required: false
        default: '30'
        type: string
      fast_candidate_limit:
        description: Maximum instruments promoted from the fast 1H/15M/5M filter to deep analysis
        required: false
        default: '8'
        type: string
      fast_min_score:
        description: Minimum fast-filter opportunity score to promote an instrument; lower values show more potential setups
        required: false
        default: '55'
        type: string
      run_tca:
        description: Run historical tick replay + execution TCA calibration; uses the LSE WebSocket historical source and automatically feeds
          E2E.
        required: false
        default: false
        type: boolean
      tca_symbols:
        description: Comma-separated symbols for execution replay
        required: false
        default: EUR/USD,GBP/USD,USD/JPY,USD/CHF
        type: string
      tca_start:
        description: UTC replay start (ISO timestamp); blank = newest catalog-backed 4-hour window. WebSocket replay is attempted first; if zero/insufficient,
          validated vault history is used and filtered locally to the exact resolved UTC window.
        required: false
        default: ''
        type: string
      tca_end:
        description: UTC replay end (ISO timestamp); blank = now. Historical ticks are filtered locally to this exact UTC window.
        required: false
        default: ''
        type: string
      deep_history_start:
        description: Deep candle reconstruction start date; default 2021-01-01. Independent of bounded execution tick replay.
        required: false
        default: '2021-01-01'
        type: string
      deep_history_end:
        description: Deep candle reconstruction end date; blank = now.
        required: false
        default: ''
        type: string
      deep_history_symbols:
        description: Symbols to export for deep 5m history; higher timeframes are reconstructed locally.
        required: false
        default: EUR/USD,GBP/USD,USD/JPY,USD/CHF
        type: string
      deep_history_max_exports:
        description: Maximum 5m LSE vault export jobs for the deep study; one export per symbol.
        required: false
        default: '4'
        type: string
      deep_history_warmup_days:
        description: Pre-start warmup days used to stabilize indicators; decisions remain limited to DEEP_HISTORY_START onward.
        required: false
        default: '370'
        type: string
      deep_decision_step_minutes:
        description: Historical decision cadence over the full deep period; 60m is the optimized default to reduce redundant 5m decision evaluations while preserving 2021-to-now coverage.
        required: false
        default: '60'
        type: choice
        options:
        - '5'
        - '10'
        - '15'
        - '30'
        - '60'
      run_e2e:
        description: 'Run historical nine-strategy end-to-end replay: closed-candle signal -> trigger -> executable bid/ask fill -> MFE/MAE ->
          TP/SL'
        required: false
        default: false
        type: boolean
      e2e_symbols:
        description: Comma-separated symbols for end-to-end replay
        required: false
        default: EUR/USD,GBP/USD,USD/JPY,USD/CHF
        type: string
      e2e_start:
        description: UTC E2E replay start (ISO timestamp); blank = newest catalog-backed 23h30m window. WebSocket replay is attempted first; if
          zero/insufficient, validated vault history is used and filtered locally to the exact resolved UTC window.
        required: false
        default: ''
        type: string
      e2e_end:
        description: UTC E2E replay end (ISO timestamp); blank = now. Historical ticks are filtered locally to this exact UTC window.
        required: false
        default: ''
        type: string
      e2e_max_setups:
        description: Maximum retained historical qualified signal setups across the full deep period; deterministic reservoir sampling preserves coverage across 2021-to-now.
        required: false
        default: '1500'
        type: string
      e2e_horizon_minutes:
        description: Maximum historical holding horizon used for realized TP/SL and MFE/MAE
        required: false
        default: '240'
        type: string
  schedule:
  - cron: 5,20,35,50 * * * *
