        E2E_CANDLE_MAX_RETRIES = 2
        E2E_CANDLE_RETRY_BASE_SECONDS = 1.5
        _last_e2e_candle_request = 0.0

        def e2e_candle_request(symbol, timeframe, **kwargs):
            global _last_e2e_candle_request
            last_error = None
            for attempt in range(E2E_CANDLE_MAX_RETRIES):
                wait_for = E2E_CANDLE_MIN_INTERVAL_SECONDS - (
                    time.monotonic() - _last_e2e_candle_request
                )
                if wait_for > 0:
                    time.sleep(wait_for)
                try:
                    result = client.candles(symbol, timeframe, **kwargs)
                    _last_e2e_candle_request = time.monotonic()
                    return result
                except LSEError as exc:
                    last_error = exc
                    _last_e2e_candle_request = time.monotonic()
                    # Never retry 429/quota errors. Transient gateway/timeouts
                    # receive only bounded retries.
                    if exc.status == 429:
                        raise
                    if exc.status not in (0, 502, 503, 504) or attempt == E2E_CANDLE_MAX_RETRIES - 1:
                        raise
                    delay = E2E_CANDLE_RETRY_BASE_SECONDS * (2 ** attempt)
                    print(
                        f"E2E candle transient {symbol} {timeframe} [{exc.status}] "
                        f"retry {attempt+1}/{E2E_CANDLE_MAX_RETRIES-1} in {delay:.1f}s"
                    )
                    time.sleep(delay)
                except Exception as exc:
                    last_error = exc
                    _last_e2e_candle_request = time.monotonic()
                    if attempt == E2E_CANDLE_MAX_RETRIES - 1:
