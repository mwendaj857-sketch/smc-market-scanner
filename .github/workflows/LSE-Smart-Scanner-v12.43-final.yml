        import json
        import os
        from lse import LSE, LSEError

        key = os.environ.get("LSE_API_KEY", "").strip()
        if not key:
            raise SystemExit(
                "LSE API KEY STATUS: MISSING — repository secret LSE_API_KEY is empty. "
                "The workflow cannot authenticate to LSE."
            )

        client = LSE(api_key=key, timeout=45)

        def fail_status(stage, exc):
            if isinstance(exc, LSEError):
                if exc.status == 401:
                    raise SystemExit(f"LSE API KEY STATUS: INVALID — {stage} returned HTTP 401 (unauthorized).")
                if exc.status == 403:
                    raise SystemExit(f"LSE API KEY STATUS: FORBIDDEN — {stage} returned HTTP 403 (key/account entitlement does not permit this operation).")
                if exc.status == 429:
                    raise SystemExit(f"LSE API STATUS: RATE_LIMITED — {stage} returned HTTP 429. The key authenticated, but the request/export allowance was exceeded.")
                raise SystemExit(f"LSE API STATUS: ERROR — {stage} returned HTTP {exc.status}: {exc.message}")
            raise SystemExit(f"LSE API STATUS: NETWORK/CLIENT_ERROR — {stage} failed with {type(exc).__name__}: {exc}")

        try:
            catalog = client.catalog()
            if not isinstance(catalog, list) or not catalog:
                raise RuntimeError(f"catalog() returned unexpected/empty data: {type(catalog).__name__}")
            print(f"LSE API KEY STATUS: REST_AUTH_OK | catalog_rows={len(catalog)}")
        except Exception as exc:
            fail_status("catalog()", exc)

        try:
            candles = client.candles("EUR/USD", "1m", limit=1, order="desc")
            print(f"LSE API KEY STATUS: HISTORY_READ_OK | EUR/USD 1m rows={len(candles) if isinstance(candles, list) else 'unknown'}")
        except Exception as exc:
            fail_status("candles(EUR/USD,1m)", exc)

        try:
            usage = client._vault_call("/usage")
            print("LSE API KEY STATUS: VAULT_USAGE_OK | " + json.dumps(usage, default=str, sort_keys=True)[:1500])
        except Exception as exc:
            print(f"LSE API USAGE DIAGNOSTIC: unavailable ({type(exc).__name__}: {exc})")

        print("LSE API KEY PREFLIGHT: PASS — the supplied LSE_API_KEY authenticated and can read catalog + historical candle data.")
