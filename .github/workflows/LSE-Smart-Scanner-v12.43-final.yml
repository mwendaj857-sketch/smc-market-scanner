        def resample_5m_to_timeframe(rows, tf):
            if tf=="5m": return list(rows)
            out=[]; current=None
            for r in rows:
                ts=r["timestamp"]
                if tf=="15m": key=ts.replace(minute=(ts.minute//15)*15,second=0,microsecond=0)
                elif tf=="1h": key=ts.replace(minute=0,second=0,microsecond=0)
                elif tf=="4h": key=ts.replace(hour=(ts.hour//4)*4,minute=0,second=0,microsecond=0)
                elif tf=="1d": key=ts.replace(hour=0,minute=0,second=0,microsecond=0)
