            smc=ns["smc_core"](rows)
            out=[{"name":"SMC","signal":smc.get("side") if smc.get("passed") else "NEUTRAL"}]
            for name,fn in [
                ("Market Structure",ns["structure_signal"]), ("Liquidity",ns["liquidity_signal"]),
                ("Supply/Demand",ns["supply_demand_signal"]), ("Price Action",ns["candle_signal"]),
