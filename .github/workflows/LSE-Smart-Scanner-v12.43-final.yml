        if-no-files-found: error
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.run_tca != true && inputs.run_e2e != true) || needs.tca_replay.result
      == 'success') && (github.event_name != 'workflow_dispatch' || inputs.run_e2e != true || needs.e2e_replay.result == 'success') }}
  deep_history:
    needs:
    - validate_workflow
    - tca_replay
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_e2e == true || inputs.run_tca == true) && needs.tca_replay.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      DEEP_HISTORY_START: ${{ inputs.deep_history_start || '2021-01-01' }}
      DEEP_HISTORY_END: ${{ inputs.deep_history_end || '' }}
      DEEP_HISTORY_SYMBOLS: ${{ inputs.deep_history_symbols || inputs.e2e_symbols || 'EUR/USD,GBP/USD,USD/JPY,USD/CHF' }}
      DEEP_HISTORY_MAX_EXPORTS: ${{ inputs.deep_history_max_exports || '3' }}
      DEEP_HISTORY_WARMUP_DAYS: ${{ inputs.deep_history_warmup_days || '370' }}
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install deep-history dependencies
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install "lse-data[frames]==0.14.0" "pyarrow>=15,<23" "pandas>=2.0,<3"
    - name: Build deep 5m candle history without vault export jobs
      run: |
        set -euo pipefail
        python - <<'PY'
        import json, math, os, re, time
        from datetime import datetime, timedelta, timezone
        from pathlib import Path
        from lse import LSE

        def parse(v):
            s=str(v).strip()
            if s.endswith("Z"): s=s[:-1]+"+00:00"
            dt=datetime.fromisoformat(s)
            return (dt.replace(tzinfo=timezone.utc) if dt.tzinfo is None else dt).astimezone(timezone.utc)
        def now_utc(): return datetime.now(timezone.utc)
        def iso(dt): return dt.isoformat().replace("+00:00","Z")
        def safe_symbol(symbol): return re.sub(r"[^A-Za-z0-9._-]+","_",symbol.replace("/","_"))

        key=os.environ.get("LSE_API_KEY","").strip()
        if not key: raise SystemExit("DEEP HISTORY: LSE_API_KEY is missing")
        start=parse(os.environ.get("DEEP_HISTORY_START","2021-01-01"))
        end=parse(os.environ["DEEP_HISTORY_END"]) if os.environ.get("DEEP_HISTORY_END","").strip() else now_utc()
        warmup=max(30,min(730,int(os.environ.get("DEEP_HISTORY_WARMUP_DAYS","370"))))
        fetch_start=start-timedelta(days=warmup)
        if end<=start: raise SystemExit("DEEP_HISTORY_END must be later than DEEP_HISTORY_START")
        symbols=[x.strip().upper() for x in os.environ.get("DEEP_HISTORY_SYMBOLS","").split(",") if x.strip()]
        if not symbols: raise SystemExit("DEEP_HISTORY_SYMBOLS is empty")

        # This job intentionally uses REST candles(), not history()/dataset().
        # candles() is a synchronous vault read and does not consume a bulk-export
        # job. This removes the TCA/deep-history 429 coupling permanently.
        out=Path("deep_history"); out.mkdir(parents=True,exist_ok=True)
        client=LSE(api_key=key,timeout=120)
        try:
            cat=client.catalog()
        except Exception as exc:
            raise SystemExit(f"DEEP HISTORY catalog() failed: {type(exc).__name__}: {exc}")

        catalog_index={}
        for row in cat if isinstance(cat,list) else []:
            if not isinstance(row,dict): continue
            sym=str(row.get("symbol","")).strip().upper()
            ds=str(row.get("dataset","")).strip().lower()
            if sym and ds!="options": catalog_index.setdefault(sym,[]).append(row)

        manifest={
            "version":"v12.42-deep-history-candles-no-export",
            "status":"READY",
            "source":"LSE REST candles()",
            "source_timeframe":"5m",
            "decision_start":iso(start),
            "decision_end":iso(end),
            "warmup_start":iso(fetch_start),
            "warmup_days":warmup,
            "requested_symbols":symbols,
            "symbols":{},
            "export_jobs_attempted":0,
            "policy":"5m candle REST reads in bounded chunks; no history()/dataset() export jobs; higher timeframes reconstructed locally."
        }

        def normalize_records(raw):
            if isinstance(raw,dict):
                records=raw.get("data",raw.get("rows",[]))
            elif isinstance(raw,list):
                records=raw
            else:
                records=list(raw) if isinstance(raw,(tuple,)) else []
            normalized=[]
            for r in records:
                if not isinstance(r,dict): continue
                keyed={str(k).strip().lower():v for k,v in r.items()}
                def pick(*names):
                    for n in names:
                        if n.lower() in keyed and keyed[n.lower()] is not None:
                            return keyed[n.lower()]
                    return None
                try:
                    ts=pick("timestamp","ts","datetime","time","date","minute","index")
                    if isinstance(ts,(int,float)):
                        x=float(ts)
                        if abs(x)>=1e18:x/=1e9
                        elif abs(x)>=1e15:x/=1e6
                        elif abs(x)>=1e12:x/=1e3
                        dt=datetime.fromtimestamp(x,tz=timezone.utc)
                    else:
                        dt=parse(ts)
                    o=float(pick("open")); h=float(pick("high")); l=float(pick("low")); c=float(pick("close")); v=float(pick("volume") or 0)
                except Exception:
                    continue
                if not all(math.isfinite(x) for x in (o,h,l,c,v)): continue
                if h<max(o,c,l) or l>min(o,h,c) or min(o,h,l,c)<=0: continue
                normalized.append({"timestamp":dt,"open":o,"high":h,"low":l,"close":c,"volume":v})
            return normalized

        # 180-day chunks keep REST responses bounded while remaining far below
        # the provider's bulk-export mechanism.
        CHUNK_DAYS=90
        for symbol in symbols:
            if symbol not in catalog_index:
                manifest["symbols"][symbol]={"status":"DATA_UNAVAILABLE","reason":"NOT_IN_CATALOG","source_timeframe":"5m"}
                print(f"DEEP HISTORY {symbol}: NOT_IN_CATALOG")
                continue
            try:
                all_rows={}
                cursor=fetch_start
                calls=0
                while cursor < end:
                    chunk_end=min(end,cursor+timedelta(days=CHUNK_DAYS))
                    raw=client.candles(
                        symbol,
                        "5m",
                        start=iso(cursor),
                        end=iso(chunk_end),
                    )
                    calls += 1
                    for r in normalize_records(raw):
                        if fetch_start <= r["timestamp"] <= end:
                            all_rows[r["timestamp"].isoformat()] = r
                    cursor=chunk_end
                    time.sleep(0.20)
                normalized=[all_rows[k] for k in sorted(all_rows)]
                records=[{
                    "timestamp":r["timestamp"].isoformat(),
                    "open":r["open"],"high":r["high"],"low":r["low"],
                    "close":r["close"],"volume":r["volume"]
                } for r in normalized]
                if len(records) < 100:
                    raise RuntimeError(f"only {len(records)} valid 5m candles returned")
                import pyarrow as pa, pyarrow.parquet as pq
                file=f"{safe_symbol(symbol)}.parquet"
                pq.write_table(pa.Table.from_pylist(records),out/file,compression="zstd")
                manifest["symbols"][symbol]={
                    "status":"READY","file":file,"rows":len(records),
                    "first":records[0]["timestamp"],"last":records[-1]["timestamp"],
                    "source_timeframe":"5m","dataset":catalog_index[symbol][0].get("dataset"),
                    "rest_candle_calls":calls
                }
                print(f"DEEP HISTORY {symbol}: {len(records)} valid 5m candles via candles() | REST calls={calls}")
            except Exception as exc:
                manifest["symbols"][symbol]={
                    "status":"DATA_UNAVAILABLE",
                    "reason":f"{type(exc).__name__}: {exc}",
                    "source_timeframe":"5m"
                }
                print(f"DEEP HISTORY DATA_UNAVAILABLE {symbol}: {type(exc).__name__}: {exc}")

        ready=sum(1 for m in manifest["symbols"].values() if m.get("status")=="READY")
        manifest["status"]="READY" if ready else "DATA_UNAVAILABLE"
        manifest["ready_symbols"]=ready
        (out/"deep_history_manifest.json").write_text(json.dumps(manifest,indent=2,default=str),encoding="utf-8")
        print(json.dumps(manifest,indent=2,default=str))
        PY
    - name: Validate deep-history artifact
