            dataset_name = str(entry.get("dataset","")).strip().lower()
            if sym and dataset_name != "options":
                catalog_index[sym].append(entry)
        
        def catalog_probe_from_snapshot(symbol):
            entries = list(catalog_index.get(symbol.upper(), []))
            if not entries:
                return {"status":"NOT_IN_CATALOG", "error":f"{symbol} not present in live vault catalog"}
            entries.sort(key=lambda x: int(x.get("ticks") or 0), reverse=True)
            x = entries[0]
            try:
                first = parse_ts(x["first"]) if x.get("first") else None
                last = parse_ts(x["last"]) if x.get("last") else None
            except Exception as exc:
                return {"status":"CATALOG_BAD_RANGE", "error":f"{type(exc).__name__}: {exc}", "entry":x}
            return {
                "status":"AVAILABLE" if (x.get("ticks") or 0) > 0 and first and last else "NO_TICK_SPAN",
                "symbol":x.get("symbol") or symbol,
                "dataset":x.get("dataset"),
                "ticks":int(x.get("ticks") or 0),
                "first":first,
                "last":last,
                "entry":x,
            }
        
        catalog_meta = {s: catalog_probe_from_snapshot(s) for s in symbols}
        print(f"TCA CATALOG SNAPSHOT: one catalog() call; entries={len(catalog_rows)}")
        for s,m in catalog_meta.items():
            if m.get("status") == "AVAILABLE":
                print(f"CATALOG {s}: available_span={m["first"].isoformat()} -> {m["last"].isoformat()} | metadata_only=true | active_tick_floor=rolling-365-days")
            else:
                print(f"CATALOG {s}: status={m.get('status')} error={m.get('error')}")
        
        # Blank boundaries mean "use the newest common vault window", not "use now"
        # blindly. This prevents a stale catalog/live-feed gap from producing an empty
        # 23h30 request. Explicit user boundaries are never silently changed.
        available = [m for m in catalog_meta.values() if m.get("status") == "AVAILABLE"]
        if requested_start is None and requested_end is None:
            if not available:
                raise SystemExit("No requested symbol has an available tick span in the live vault catalog")
            resolved_end = min([now_utc()] + [m["last"] for m in available])
            resolved_start = resolved_end - timedelta(hours=23, minutes=30)
            common_first = max(m["first"] for m in available)
            if common_first > resolved_start:
                resolved_start = common_first
            start_dt, end_dt = resolved_start, resolved_end
        elif requested_start is None:
            end_dt = requested_end
            start_dt = end_dt - timedelta(hours=23, minutes=30)
        else:
            start_dt = requested_start
            end_dt = requested_end or now_utc()
        
        def iso_z(dt):
            return dt.astimezone(timezone.utc).isoformat().replace("+00:00","Z")

        # Never export ticks older than the active one-year history floor.
        # Provider catalog depth is metadata only; active requests are rolling one-year.
        if start_dt < TICK_HISTORY_FLOOR:
            print(
                f"TCA HISTORY FLOOR: clamping active start "
                f"{iso_z(start_dt)} -> {iso_z(TICK_HISTORY_FLOOR)}"
            )
            start_dt = TICK_HISTORY_FLOOR
        if end_dt < TICK_HISTORY_FLOOR:
            raise SystemExit(
                "TCA DATA_UNAVAILABLE: requested window ends before the scanner's 2026 tick-history floor"
            )
        if end_dt <= start_dt:
            raise SystemExit("TCA_END must be later than TCA_START")
        if (end_dt - start_dt).total_seconds() > 7*86400:
            raise SystemExit("TCA replay is capped at 7 days per manual run; split longer studies into separate runs")
        print(f"TCA REQUESTED UTC WINDOW: {start_env or '<blank>'} -> {end_env or '<blank>'}")
        print(f"TCA RESOLVED UTC WINDOW: {iso_z(start_dt)} -> {iso_z(end_dt)}")
        
        def tick_field(tick, *names):
            """Read SDK Tick fields robustly across object/dict/case variants."""
            candidates = {str(n).lower() for n in names}
            if isinstance(tick, dict):
                for k, v in tick.items():
                    if str(k).strip().lower() in candidates:
                        return v
                for nested_name in ("fields", "data", "quote"):
                    nested = tick.get(nested_name)
                    if isinstance(nested, dict):
                        for k, v in nested.items():
                            if str(k).strip().lower() in candidates:
                                return v
            for name in names:
                try:
                    value = getattr(tick, name)
                    if value is not None:
                        return value
                except Exception:
                    pass
            return None

        def tick_bool(tick, *names):
            value = tick_field(tick, *names)
            if isinstance(value, bool):
                return value
            if value is None:
                return None
            return str(value).strip().lower() in {"true", "1", "yes", "y", "replay"}

        def tick_to_row(tick):
            ts = tick_field(tick, "timestamp", "datetime", "time", "date")
            bid = fnum(tick_field(tick, "bid", "BID", "bid_price", "best_bid", "bidprice", "bid_1"))
            ask = fnum(tick_field(tick, "ask", "ASK", "ask_price", "best_ask", "askprice", "ask_1"))
            price = fnum(tick_field(tick, "price", "last", "last_price", "trade_price", "mid", "mid_price"))
            volume = fnum(tick_field(tick, "volume", "size", "trade_size")) or 0.0
            if ts is None or bid is None or ask is None or bid <= 0 or ask <= 0 or ask < bid:
                return None
            try:
                dt = parse_ts(ts)
            except Exception:
                return None
            return {"timestamp":dt,"bid":bid,"ask":ask,
                    "price":price if price is not None else (bid+ask)/2.0,"volume":volume}

        def load_ticks(symbols, start_dt, end_dt):
            """WebSocket-first TCA tick loader with explicit vault raw-tick fallback.
        
            Hierarchy:
              1) WebSocket historical replay
              2) validate replay bid/ask ticks
              3) if zero/insufficient -> client.history(symbol)
              4) normalize raw tick DataFrame/rows
              5) filter locally to the exact UTC window
              6) validate bid/ask again
              7) if still insufficient -> DATA_UNAVAILABLE
            """
            ws_replay_allowed = 0 < (end_dt-start_dt).total_seconds() <= 24*3600
            collected={}; replay_meta={}
        
            def is_rate_limited_error(err):
                s=str(err or "").lower()
                return "[429]" in s or "too many export requests" in s or "rate limit" in s
        
            def is_export_budget_429(err):
                s=str(err or "").lower()
                return "too many export requests" in s or "export limit" in s
        
            # Export circuit breaker: serialize vault history requests, enforce a
            # minimum interval, and use bounded exponential backoff on HTTP 429.
            HISTORY_MAX_RETRIES = 0
            HISTORY_MIN_INTERVAL_SECONDS = 12.0
            last_history_attempt = 0.0
            history_exports_used = 0
        
            def history_with_backoff(symbol, dataset, query_start, query_end):
                nonlocal last_history_attempt, history_exports_used
                if history_exports_used >= HISTORY_EXPORT_CAP:
                    return (
                        None,
                        "EXPORT_BUDGET_CAPPED: per-run LSE vault export safety cap reached; "
                        "no additional bulk tick-history request was issued.",
                        0,
                    )
                history_exports_used += 1
                last_error = None
                for attempt in range(HISTORY_MAX_RETRIES + 1):
                    wait_for = HISTORY_MIN_INTERVAL_SECONDS - (time.monotonic() - last_history_attempt)
                    if wait_for > 0:
                        time.sleep(wait_for)
                    last_history_attempt = time.monotonic()
                    try:
                        return client.history(
                            symbol,
                            dataset=dataset,
                            # LSE documents history(symbol) as the raw tick-tape export.
                            # Do not force a candle-style timeframe for raw tick datasets.
                            # Vault export boundaries are date-only; exact UTC filtering is restored locally.
                            start=api_date(query_start),
                            end=api_date(query_end + timedelta(days=1)),
                            dataframe=True,
                            timeout=900,
                        ), None, attempt
                    except Exception as exc:
                        last_error = f"{type(exc).__name__}: {exc}"
                        if is_export_budget_429(last_error):
                            return None, f"RATE_LIMITED: {last_error}", attempt
                        if not is_rate_limited_error(last_error):
                            return None, last_error, attempt
                        if attempt >= HISTORY_MAX_RETRIES:
                            return None, f"RATE_LIMITED: {last_error}", attempt
                return None, f"RATE_LIMITED: {last_error or 'HTTP 429'}", HISTORY_MAX_RETRIES
        
            CACHE_DIR = os.path.abspath("historical_tick_cache")
            os.makedirs(CACHE_DIR, exist_ok=True)
            CACHE_MANIFEST = os.path.join(CACHE_DIR, "manifest.json")
            cache_manifest = {
                "version": "v12.33-single-owner-quote-safe-tick-cache-v3",
                "window_start": iso_z(start_dt),
                "window_end": iso_z(end_dt),
                "symbols": {},
                "policy": "normalized valid bid/ask ticks produced only after WebSocket validation or successful vault export; exact UTC window preserved",
            }
        
            def cache_write(symbol, rows, source, schema=None):
                if not rows:
                    return None
                try:
                    import pyarrow as pa
                    import pyarrow.parquet as pq
                    path = os.path.join(CACHE_DIR, symbol.replace("/","_") + ".parquet")
                    payload = [{
                        "timestamp": iso_z(r["timestamp"]),
                        "bid": float(r["bid"]),
                        "ask": float(r["ask"]),
                        "price": float(r.get("price") or ((r["bid"] + r["ask"]) / 2.0)),
                        "volume": float(r.get("volume") or 0.0),
                    } for r in rows]
                    table = pa.Table.from_pylist(payload)
                    pq.write_table(table, path, compression="zstd")
                    cache_manifest["symbols"][symbol] = {
                        "path": os.path.relpath(path, "."),
                        "ticks": len(payload),
                        "source": source,
                        "first": payload[0]["timestamp"],
                        "last": payload[-1]["timestamp"],
                        "schema": schema or [],
                    }
                    return path
                except Exception as exc:
                    print(f"WARNING: tick cache write failed for {symbol}: {type(exc).__name__}: {exc}")
                    return None
        
            def cache_finalize():
                try:
                    with open(CACHE_MANIFEST, "w", encoding="utf-8") as f:
                        json.dump(cache_manifest, f, indent=2)
                except Exception as exc:
                    print(f"WARNING: tick cache manifest write failed: {type(exc).__name__}: {exc}")
        
            def load_ws(symbol,replay_start,window_start,window_end,minimum_ticks):
                """LSE WebSocket replay: START-anchored, <=24h, locally END-clipped.

                Official LSE contract: client.stream([symbol], start=<ISO timestamp>).
                The server replays from START for up to 24 hours, then transitions
                to live ticks. END is not a WebSocket parameter; this workflow
                enforces END locally and never accepts live ticks as historical evidence.
                """
                rows=[]; seen=set(); live_seen=0; replay_seen=0
                invalid_bidask=0; invalid_timestamp=0; before_window=0; after_window=0
                first_tick_ts=None; first_tick_replay=None
                first_tick_bid=None; first_tick_ask=None
                error=None; c=None
                if window_end <= window_start:
                    return [],0,"REPLAY_INVALID_WINDOW: end must be after start"
                if (window_end-window_start).total_seconds() > 24*3600:
                    return [],0,"REPLAY_HORIZON_EXCEEDED: requested window exceeds LSE's documented 24h replay horizon"
                try:
                    c=LSE(api_key=api_key)
                    replay_anchor=replay_start.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S")
                    print(f"LSE WS REPLAY REQUEST {symbol}: start={replay_anchor} | local_end={window_end.astimezone(timezone.utc).isoformat()}")
                    for tick in c.stream([symbol],start=replay_anchor):
                        if str(tick_field(tick, "symbol", "RIC", "name") or "").strip().upper()!=symbol.upper():
                            continue
                        raw_dt=getattr(tick,"datetime",None)
                        raw_ts=tick_field(tick, "timestamp", "datetime", "time", "date")
                        try:
                            tick_dt=(raw_dt.astimezone(timezone.utc)
                                     if raw_dt is not None else parse_ts(raw_ts))
                        except Exception:
                            try: tick_dt=parse_ts(raw_ts)
                            except Exception: tick_dt=None
                        if first_tick_ts is None:
                            first_tick_ts=tick_dt.isoformat() if tick_dt else str(raw_ts)
                            first_tick_replay=tick_bool(tick, "replay", "is_replay")
                            first_tick_bid=tick_field(tick, "bid", "BID", "bid_price")
                            first_tick_ask=tick_field(tick, "ask", "ASK", "ask_price")
                            print(f"LSE WS FIRST TICK {symbol}: timestamp={first_tick_ts} replay={first_tick_replay} bid={first_tick_bid!r} ask={first_tick_ask!r}")
                        replay_flag=tick_bool(tick, "replay", "is_replay")
                        if replay_flag is False:
                            live_seen+=1
                            print(f"LSE WS REPLAY COMPLETE/NO_REPLAY {symbol}: replay_seen={replay_seen} live_seen={live_seen}")
                            break
                        replay_seen+=1
                        row=tick_to_row(tick)
                        if row is None:
                            invalid_bidask += 1
                            if invalid_bidask <= 3:
                                print(f"LSE WS INVALID TICK {symbol}: ts={raw_ts!r} bid={tick_field(tick,'bid','BID','bid_price')!r} ask={tick_field(tick,'ask','ASK','ask_price')!r}")
                            continue
                        ts=row["timestamp"]
                        if ts < window_start:
                            before_window += 1
                            continue
                        if ts > window_end:
                            after_window += 1
                            break
                        key=(ts,row["bid"],row["ask"])
                        if key in seen:
                            continue
                        seen.add(key); rows.append(row)
                        if len(rows)>=minimum_ticks:
                            print(f"LSE WS REPLAY SUFFICIENT {symbol}: valid_bid_ask={len(rows)} replay_seen={replay_seen}")
                            break
                except Exception as exc:
                    error=f"{type(exc).__name__}: {exc}"
                finally:
                    if c is not None:
                        try: c.disconnect()
                        except Exception: pass
                if not rows and not error:
                    reason=("NO_VALID_BID_ASK_IN_REPLAY"
                            if replay_seen>0 and invalid_bidask>0 else "REPLAY_EMPTY")
                    error=(f"{reason}: replay_seen={replay_seen} valid_bid_ask={len(rows)} "
                           f"invalid_bidask={invalid_bidask} invalid_timestamp={invalid_timestamp} "
                           f"before_window={before_window} after_window={after_window} "
                           f"first_tick_replay={first_tick_replay!r} "
                           f"first_tick_bid={first_tick_bid!r} first_tick_ask={first_tick_ask!r}")
                    print(f"LSE WS REPLAY DIAGNOSTIC {symbol}: {error}")
                return sorted(rows,key=lambda r:r["timestamp"]),live_seen,error
            def load_vault(symbol):
                """Load catalog-pinned raw ticks and distinguish price ticks from quotes.

                LSE's documented Tick model exposes bid/ask only when available. A vault
                dataset can therefore contain a valid price/trade tape without historical
                top-of-book quotes. That is valid market-data evidence, but not executable
                bid/ask evidence. Never synthesize a spread from price-only rows.
                """
                meta = catalog_meta.get(symbol, {})
                errors = []
                if meta.get("status") != "AVAILABLE":
                    return [], 0, 0, 0, meta.get("error") or meta.get("status"), None, None, meta, []
                dataset = meta["dataset"]
                query_start = max(start_dt, meta["first"])
                query_end = min(end_dt, meta["last"])
                if query_end < query_start:
                    return [], 0, 0, 0, "catalog history span does not intersect exact UTC window", None, None, meta, []
                raw_rows=[]; raw_count=0; raw_price_rows=[]; raw_price_count=0; schema=[]
                try:
                    targeted, history_error, history_attempts = history_with_backoff(
                        symbol, dataset, query_start, query_end
                    )
                    if history_error:
                        errors.append(f"targeted_history:{history_error}")
                    if targeted is not None:
                        schema = raw_schema(targeted)
                        raw_list = rows_from_history(targeted)
                        raw_count = len(raw_list)
                        raw_price_rows = normalize_price_ticks(targeted)
                        raw_price_count = len(raw_price_rows)
                        raw_rows = normalize_ticks(targeted)
