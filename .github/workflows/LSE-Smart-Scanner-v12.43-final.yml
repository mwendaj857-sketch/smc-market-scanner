                    if x.get("name")==name and x.get("side")==side
                ]
                best=max([float(x.get("score",0)) for x in catalog_matches], default=0.0)
                return {
                    "confirmed": bool(HISTORICAL_STRATEGY_ACTIVE and direct_tfs),
                    "count": 1 if (HISTORICAL_STRATEGY_ACTIVE and direct_tfs) else 0,
                    "strategies": [name] if (HISTORICAL_STRATEGY_ACTIVE and direct_tfs) else [],
                    "categories": sorted(set(str(x.get("category","")) for x in catalog_matches if x.get("category"))),
                    "tier": "A" if best>=85 else "B",
                    "score": round(best,1),
                    "best": catalog_matches[0] if catalog_matches else None,
                    "all_matches": catalog_matches[:5],
                }
            strategy_by_side = {s: active_strategy_summary(s) for s in ("BUY","SELL")}

            price_method_names = {
                "Supply/Demand","Price Action","Fibonacci","Trend","RSI+MACD"
            }
        
            # Any operational timeframe may originate a signal, but only when
            # the single historically validated strategy agrees with the completed monthly bias.
            tf_consensus = {
                tf_name: next(
                    (m.get("signal","NEUTRAL") for m in strategy_by_tf.get(tf_name, [])
                     if m.get("name")==ACTIVE_STRATEGY_NAME),
                    "NEUTRAL"
                ) if HISTORICAL_STRATEGY_ACTIVE else "NEUTRAL"
                for tf_name in TF
            }
            # Regime context is available before candidate qualification. The
            # completed 4H consensus is used as a risk-context gate, never as an
            # additional strategy vote.
            regime_side = tf_consensus.get("4h", "NEUTRAL")
            monthly_side = tf_consensus.get("1mo", "NEUTRAL")
            operational_signal_tfs = {
                side_c: [
                    tf_name for tf_name in TF
                    if tf_name != "1mo" and tf_consensus.get(tf_name) == side_c
                ]
                for side_c in ("BUY", "SELL")
            }
        
            def monthly_alignment_ok(side_c):
                # A directional monthly bias remains a hard directional filter.
                # A neutral monthly bias is non-evidence, not an opposing signal.
                return monthly_side in (side_c, "NEUTRAL")

            def signal_timeframes(side_c):
                # Only operational execution timeframes count as local agreement.
                return [
                    tf for tf in POSITION_TIMEFRAMES
                    if tf_consensus.get(tf) == side_c
                ]
        
            def timeframe_local_stats(tf_name, side_c):
                methods = strategy_by_tf.get(tf_name, [])
                aligned = [m["name"] for m in methods if m["signal"] == side_c]
                opposed = [m["name"] for m in methods if m["signal"] in ("BUY", "SELL") and m["signal"] != side_c]
                local_side = dominant(methods, minimum=2)
                return {
                    "timeframe": tf_name,
                    "side": side_c,
                    "aligned": sorted(set(aligned)),
                    "opposed": sorted(set(opposed)),
                    "aligned_count": len(set(aligned)),
                    "opposed_count": len(set(opposed)),
                    "local_consensus": local_side == side_c,
                }
        
            def build_timeframe_analysis(side_c):
                analysis = []
                for tf_name in POSITION_TIMEFRAMES:
                    profile = POSITION_TIMEFRAME_PROFILES[tf_name]
                    stats = timeframe_local_stats(tf_name, side_c)
                    context = []
                    for ctx_tf in profile["context"]:
                        ctx_methods = strategy_by_tf.get(ctx_tf, [])
                        if dominant(ctx_methods, minimum=2) == side_c:
                            context.append(ctx_tf)
                    level = levels(data.get(tf_name, []), side_c) if stats["local_consensus"] else None
                    rr_value = None
                    if level:
                        rr_value = abs(level[2] - level[0]) / max(abs(level[0] - level[1]), 1e-12)
                    context_ok = len(context) >= profile["min_context_tfs"]
                    # Strict master-bias rule: lower-TF strength never bypasses
                    # the completed monthly directional consensus.
                    monthly_ok = monthly_side == side_c
                    ready = (
                        stats["aligned_count"] >= profile["min_strategies"] and
                        stats["local_consensus"] and
                        context_ok and
                        monthly_ok
                    )
                    analysis.append({
                        "timeframe": tf_name,
                        "side": side_c,
                        "trade_type": profile_trade_type(tf_name, stats["aligned_count"], len(context)),
                        "strategies": stats["aligned"],
                        "aligned_count": stats["aligned_count"],
                        "opposed": stats["opposed"],
                        "context_timeframes": context,
                        "monthly_agreement": monthly_side == side_c,
                        "level": level,
                        "rr": rr_value,
                        "ready": ready,
                        "status": "READY" if ready else "WAIT",
                    })
                return analysis
        
            def consensus_stats(side_c):
                # Count DISTINCT strategies, not raw indicator votes. This
                # prevents one method repeated on several TFs from pretending
                # to be multiple strategies.
                aligned_names = set()
                opposed_names = set()
                aligned_tfs = set()
                opposed_tfs = set()
                per_strategy_tfs = {}
                for tf_name, methods in strategy_by_tf.items():
                    for m in methods:
                        if m["signal"] == side_c:
                            aligned_names.add(m["name"])
                            aligned_tfs.add(tf_name)
                            per_strategy_tfs.setdefault(m["name"], set()).add(tf_name)
                        elif m["signal"] in ("BUY","SELL") and m["signal"] != side_c:
                            opposed_names.add(m["name"])
                            opposed_tfs.add(tf_name)
        
                # A strategy counts once even if it agrees on several TFs.
                # Multi-TF breadth is retained as a quality bonus rather than
                # an SMC dependency.
                price_names = aligned_names & price_method_names
                price_tfs = set()
                for tf_name, methods in strategy_by_tf.items():
                    if any(m["name"] in price_method_names and m["signal"] == side_c for m in methods):
                        price_tfs.add(tf_name)
        
                return {
                    "aligned_names": aligned_names,
                    "opposed_names": opposed_names,
                    "aligned_count": len(aligned_names),
                    "opposed_count": len(opposed_names),
                    "aligned_tfs": aligned_tfs,
                    "opposed_tfs": opposed_tfs,
                    "tf_count": len(aligned_tfs),
                    "price_names": price_names,
                    "price_count": len(price_names),
                    "price_tfs": price_tfs,
                    "price_tf_count": len(price_tfs),
                    "per_strategy_tfs": per_strategy_tfs,
                }
        
            def closed_entry_price(rows):
                if not rows:
                    return None
                try:
                    value = float(rows[-1].get("close"))
                except (TypeError, ValueError):
                    return None
                return value if math.isfinite(value) and value > 0 else None
        
            def level_rr(c, strategy="INTRADAY", entry_price=None):
                execution_rows = {
                    "INTRADAY": m15,
                    "SCALP": m5,
                    "SWING/HOLD": h1,
                }.get(strategy, m15)
                level = levels(execution_rows, c, entry_price=entry_price)
                if not level:
                    return None, None
                entry, sl, tp, a = level
                rr = abs(tp-entry) / max(abs(entry-sl), 1e-12)
                return level, rr
        
            def target_ladder(rows, side, entry):
                """Return up to three real opposing swing targets beyond the reference entry."""
                if not rows or entry is None:
                    return []
                highs, lows = swings(rows[-120:], 2)
                if side == "BUY":
                    targets = sorted({float(x[1]) for x in highs if x[1] > entry})
                elif side == "SELL":
                    targets = sorted({float(x[1]) for x in lows if x[1] < entry}, reverse=True)
                else:
                    return []
                return targets[:3]
        
            def support_score(methods, side_c):
                aligned, opposed, neutral = counts(methods, side_c)
                return max(0.0, min(100.0,
                    (aligned / max(len(methods), 1)) * 100.0 -
                    (opposed / max(len(methods), 1)) * 20.0))
        
            def support_reasons(methods, side_c):
                return [f"{m['name']}: {m['why']}" for m in methods if m["signal"] == side_c]
        
            event_level, events = event_risk(intel, symbol)
            event_info = {"state":"NONE","gate":True,"score_adjustment":0.0,"events":[],"reason":"No candidate side evaluated yet"}
        
            rss_news_level, rss_news_events = rss_event_risk(intel, symbol)
            correlations = correlation_context(symbol, h1, benchmark_rows)
            yield_diff = yield_context(intel, symbol)
        
            # Candidate directions come from the 9-strategy consensus itself,
            # so SMC-neutral symbols are still eligible.
            candidate_sides = []
            for c in ("BUY","SELL"):
                cs = consensus_stats(c)
                if cs["aligned_count"] >= 1 or strategy_by_side[c]["count"] >= 1:
                    candidate_sides.append(c)
        
            entry_candidates = []
            potential_candidates = []
            setup_wait_candidates = []
        
            def choose_position_timeframe(side_c):
                context_map = {"5m": ("15m", "1h"), "15m": ("1h",), "1h": ("4h",), "4h": ("1d",)}
                for tf_name in ("5m", "15m", "1h", "4h"):
                    if tf_consensus.get(tf_name) == side_c and all(tf_consensus.get(x) == side_c for x in context_map[tf_name]):
                        return tf_name
                for tf_name in ("15m", "1h", "4h", "5m"):
                    if tf_consensus.get(tf_name) == side_c:
                        return tf_name
                return "UNSPECIFIED"
        
            def alignment_chain(side_c):
                chain = ["1mo", "1d", "4h", "1h", "15m", "5m"]
                agreed = [tf for tf in chain if tf_consensus.get(tf) == side_c]
                return {"agreed": agreed, "count": len(agreed), "ratio": round(len(agreed) / len(chain) * 100.0, 1)}
        
            for c in candidate_sides:
                cs = consensus_stats(c)
                event_info = event_alignment(intel, symbol, c, m5, m15)
                position_tf = choose_position_timeframe(c)
                chain_info = alignment_chain(c)
                aligned_names = cs["aligned_names"]
                aligned_count = cs["aligned_count"]
                opposed_count = cs["opposed_count"]
                strat = strategy_by_side[c]
                strategy_confirmed = strat["confirmed"]
                strategy_count = strat["count"]
                strategy_category = strat["best"]["category"] if strat.get("best") else "WAIT"
                strategy_tier = strat["tier"]
        
                # Production rule: exactly ONE historically validated strategy
                # establishes direction. No second strategy vote is required.
                one_strategy_confirmed = (
                    HISTORICAL_STRATEGY_ACTIVE
                    and strategy_confirmed
                    and strategy_count == 1
                    and aligned_count >= 1
                )
        
                # Directional monthly bias blocks only opposite directions.
                # A neutral monthly consensus is a non-evidence state, not a SELL/BUY veto.
                agreeing_signal_tfs = signal_timeframes(c)
                monthly_gate = monthly_alignment_ok(c)
                timeframe_gate = bool(agreeing_signal_tfs)
                lse_alignment_gate = monthly_gate and timeframe_gate
        
                # No alternate strategy route is allowed in production.
                # Price-method confluence remains informational only.
                three_price = False
        
                # Determine the strongest applicable execution horizon.
                level_map = {
                    "INTRADAY": level_rr(c, "INTRADAY", closed_entry_price(m15)),
                    "SCALP": level_rr(c, "SCALP", closed_entry_price(m5)),
                    "SWING/HOLD": level_rr(c, "SWING/HOLD", closed_entry_price(h1)),
                }
        
                # Public category is selected from the strongest complete
                # strategy cluster. Horizon remains a separate field.
                chosen_category = strategy_category if strategy_confirmed else ("SCALPING" if position_tf in ("5m","15m") else "INTRADAY")
                if position_tf == "5m":
                    chosen_strategy = "SCALP"
                elif position_tf == "4h":
                    chosen_strategy = "SWING/HOLD"
                else:
                    chosen_strategy = "INTRADAY"
        
                # Final qualification is evaluated after the final strategy score
                # and execution-candle state are calculated below.
        
                selected_strategy = chosen_strategy
                level, rr = level_map.get(selected_strategy, (None, None))
                if selected_strategy == "ADAPTIVE PRICE-MOVEMENT":
                    level, rr = level_map["INTRADAY"]
        
                consensus_score = min(
                    100.0,
                    40.0 + aligned_count * 8.0 +
                    max(0, cs["tf_count"] - 1) * 4.0 -
                    opposed_count * 4.0
                )
                if strategy_confirmed:
                    consensus_score = max(consensus_score, strat["score"])
                if one_strategy_confirmed:
                    consensus_score = min(100.0, consensus_score + 5.0)
                # Signal-strength boost from monthly agreement and independent operational
                # timeframe consensus. Score alone never confirms an entry.
                if monthly_side == c:
                    consensus_score = min(100.0, consensus_score + 8.0)
                elif monthly_side == "NEUTRAL":
                    consensus_score = min(100.0, consensus_score + 4.0)
                consensus_score = min(
                    100.0,
                    consensus_score + min(16.0, len(agreeing_signal_tfs) * 4.0)
                )
                if three_price:
                    consensus_score = max(consensus_score, min(
                        100.0, 50.0 + cs["price_count"] * 9.0 + cs["price_tf_count"] * 4.0 - opposed_count * 4.0
                    ))
                # Event-aware intelligence and native LSE timeframe-chain bonus.
                consensus_score = max(0.0, min(100.0, consensus_score + float(event_info.get("score_adjustment", 0.0))))
                consensus_score = max(0.0, min(100.0, consensus_score + min(10.0, chain_info["count"] * 1.5)))
                fx_alignment = currency_pair_alignment(currency_strength, symbol, c)
                if fx_alignment["state"] == "ALIGNED":
                    consensus_score = min(100.0, consensus_score + fx_alignment["score"])
                elif fx_alignment["state"] == "CONFLICT":
                    consensus_score = max(0.0, consensus_score + fx_alignment["score"])
        
                trigger_tf = {"SCALP": "5m", "INTRADAY": "15m", "SWING/HOLD": "1h", "ADAPTIVE PRICE-MOVEMENT": "15m"}.get(chosen_strategy, "15m")
                trigger_state = execution_trigger_state(data.get(trigger_tf, []), {"ticks": deep_live_raw.get(symbol, [])}, c)
                trigger_crossed = bool(trigger_state.get("trigger_crossed", False))
                trigger_safe = trigger_state.get("state") != "OVEREXTENDED"
                plan_current = trigger_state.get("current_price")
                closed_plan = candidate_plan(data.get(trigger_tf, []), c, current_price=plan_current)
                if closed_plan:
                    level = (closed_plan["entry"], closed_plan["sl"], closed_plan["tp"], closed_plan["atr"])
                    rr = closed_plan["rr"]
                enforced_level = enforce_min_target(symbol, level)
                if isinstance(enforced_level, (list, tuple)) and len(enforced_level) >= 5:
                    level = tuple(enforced_level[:4])
                    rr = enforced_level[4]
                # Forming OHLC never votes, never changes strategy score, and never sets levels.
                target_pips = target_distance_pips(symbol, level[0], level[2]) if level else None
                target_pips_ok = target_pips is None or target_pips >= MIN_TARGET_PIPS or "/" not in str(symbol)
                early_entry_ok = early_entry_window_ok(trigger_state, EARLY_ENTRY_MINUTES)
                rr_ok_now = rr is not None and rr >= MIN_CONFIRMED_RR and target_pips_ok
                score_gate = consensus_score >= ENTRY_STRATEGY_SCORE_MIN
                quality_gate = all(quality.get(tf, {}).get("ok", False) for tf in ("1h","15m","5m"))
                volatility_gate = volatility.get(trigger_tf, {}).get("state") != "EXTREME_HIGH"
                # Completed 4H regime is a hard risk gate for swing/hold. Shorter
                # horizons may trade tactically only when 4H is neutral or aligned.
                regime_gate = (
                    regime_side in (c, "NEUTRAL")
                    if chosen_strategy != "SWING/HOLD"
                    else regime_side == c
                )
                execution_gate = (
                    trigger_state.get("state") == "EXECUTABLE_TRIGGER_CROSSED"
                    and float(trigger_state.get("execution_score", 0.0)) >= EXECUTION_SCORE_MIN
                    and float(trigger_state.get("quote_age_seconds") or 999.0) <= MAX_QUOTE_AGE_SECONDS
                )
                category_threshold = CATEGORY_SCORE_MIN.get(chosen_category, ENTRY_STRATEGY_SCORE_MIN)
                category_score_gate = consensus_score >= category_threshold
                tier_gate = strategy_confirmed and HISTORICAL_STRATEGY_ACTIVE
                # Tactical reversal categories may oppose the monthly bias;
                # continuation categories still require monthly alignment.
                tactical_bias_gate = (monthly_side in (c,"NEUTRAL")
                                      or chosen_category in ("SNIPER","SCALPING","ADVANCED_CONFLUENCE"))
                qualifies = (one_strategy_confirmed and tier_gate and category_score_gate and
                             trigger_crossed and trigger_safe and early_entry_ok and quality_gate
                             and volatility_gate and regime_gate and execution_gate
                             and tactical_bias_gate and rr_ok_now
                             and event_info.get("gate",True))
        
                reasons = [
                    f"STRATEGY CLUSTER: {strategy_count} distinct strategies ({', '.join(strat.get('strategies',[])[:6])})",
                    f"CATEGORY: {chosen_category} | TIER: {strategy_tier} | STRATEGY SCORE: {strat.get('score',0):.1f}/100",
                    f"LEGACY METHOD CONSENSUS: {aligned_count}/9 ({', '.join(sorted(aligned_names))})"
                ]
                if cs["tf_count"]:
                    reasons.append(f"TIMEFRAME BREADTH: {cs['tf_count']} timeframe(s)")
                reasons.append(f"MONTHLY MASTER BIAS: {monthly_side}")
                reasons.append(f"ENTRY TRIGGER {trigger_tf.upper()}: {trigger_state.get('state')} — {trigger_state.get('reason')}")
                reasons.append(f"EARLY ENTRY WINDOW: {EARLY_ENTRY_MINUTES:.0f}m minimum pre-move/controlled-trigger model")
                if target_pips is not None:
                    reasons.append(f"TARGET DISTANCE: {target_pips:.1f} pips")
                if fx_alignment.get("state") != "UNAVAILABLE":
                    reasons.append(f"FX RELATIVE STRENGTH: {fx_alignment['state']} ({fx_alignment['score']:+.2f})")
                reasons.append(
                    "SIGNAL TF AGREEMENT: " + ", ".join(agreeing_signal_tfs)
                    if agreeing_signal_tfs else
                    "SIGNAL TF AGREEMENT: none"
                )
                if "SMC" in aligned_names:
                    reasons.append("SMC CONTEXT: aligned; no priority gate")
                else:
                    reasons.append("SMC CONTEXT: not required; independent strategy consensus is qualifying")
                if three_price:
                    reasons.append(f"PRICE-MOVEMENT: {cs['price_count']} distinct methods across {cs['price_tf_count']} timeframes")
                if opposed_count:
                    reasons.append(f"OPPOSITION: {opposed_count} distinct strategy method(s) opposed")
        
                blockers = []
                if not strategy_confirmed or not HISTORICAL_STRATEGY_ACTIVE:
                  blockers.append("MISSING: one historically validated strategy must be available and directional")
                if not one_strategy_confirmed:
                  blockers.append("MISSING: the single historical strategy is not currently confirmed on the required timeframe")
                if not category_score_gate:
                    blockers.append(f"MISSING: {chosen_category} score must be >= {category_threshold:.0f}/100 (now {consensus_score:.1f})")
                if not trigger_crossed:
                    blockers.append(f"MISSING: {c} entry trigger at {trigger_state.get('trigger_price'):.6g} has not been crossed by the live price snapshot")
                if not trigger_safe:
                    blockers.append("BLOCKED: trigger crossed but price is overextended; wait for a fresh setup")
                if monthly_side not in (c, "NEUTRAL") and chosen_category not in ("SNIPER","SCALPING","ADVANCED_CONFLUENCE"):
                  blockers.append(f"BLOCKED: monthly master bias is {monthly_side}; signal direction is {c}")
                if not timeframe_gate:
                  blockers.append("BLOCKED: no operational timeframe is confirmed by the single historically validated strategy")
                if not quality_gate:
                    blockers.append("BLOCKED: candle data-quality gate failed on one or more execution timeframes")
                if not volatility_gate:
                    blockers.append(f"BLOCKED: {trigger_tf.upper()} volatility is EXTREME_HIGH; wait for normalized execution conditions")
                if not regime_gate:
                    blockers.append(f"BLOCKED: completed 4H regime is {regime_side}; {chosen_strategy} direction is {c}")
                if not execution_gate:
                    blockers.append(f"BLOCKED: institutional top-of-book execution gate = {trigger_state.get('state')} | score {float(trigger_state.get('execution_score', 0.0)):.1f}/100 | {trigger_state.get('reason','unavailable')}")
                if not target_pips_ok and target_pips is not None:
                    blockers.append(f"MISSING: FX target distance must be >= {MIN_TARGET_PIPS:.0f} pips (now {target_pips:.1f})")
                if not early_entry_ok:
                    blockers.append(f"MISSING: entry must be in the {EARLY_ENTRY_MINUTES:.0f}-minute pre-move/controlled-trigger window; do not chase")
                if not rr_ok_now:
                    blockers.append(
                        f"MISSING: real execution R:R must be >= {MIN_CONFIRMED_RR:.1f}R (now {rr:.2f}R)"
                        if rr is not None else
                        "MISSING: real execution R:R unavailable"
                    )
                if not event_info.get("gate", True):
                    blockers.append("BLOCKED: " + str(event_info.get("reason", "event execution window")))
                else:
                    reasons.append("EVENT ALIGNMENT: " + str(event_info.get("reason", "no active event conflict")))
        
                if qualifies and rr_ok_now and event_info.get("gate", True):
                    entry_candidates.append({
                        "strategy":selected_strategy,
                        "validated_strategy":ACTIVE_STRATEGY_NAME,
                        "entry_category":chosen_category,
                        "strategy_tier":strategy_tier,
                        "confirmed_strategy_count":strategy_count,
                        "confirmed_strategies":strat.get("strategies",[]),
                        "strategy_matches":strat.get("all_matches",[]),
                        "side":c,
                        "level":level,
                        "rr":rr,
                        "score_basis":consensus_score,
                        "signal_timeframes": list(agreeing_signal_tfs),
                        "position_timeframe": position_tf,
                        "alignment_chain": chain_info,
                        "monthly_bias": monthly_side,
                        "horizon":horizon_for(selected_strategy),
                        "reasons":reasons,
                        "execution_trigger": trigger_state,
                    })
                elif qualifies and event_info.get("gate", True):
                    setup_wait_candidates.append({
                        "status": "WAITING_FOR_TRIGGER",
                        "strategy":selected_strategy,
                        "validated_strategy":ACTIVE_STRATEGY_NAME,
                        "entry_category":chosen_category,
                        "strategy_tier":strategy_tier,
                        "confirmed_strategy_count":strategy_count,
                        "confirmed_strategies":strat.get("strategies",[]),
                        "strategy_matches":strat.get("all_matches",[]),
                        "side":c,
                        "level":level,
                        "rr":rr,
                        "score_basis":consensus_score,
                        "signal_timeframes": list(agreeing_signal_tfs),
                        "position_timeframe": position_tf,
                        "alignment_chain": chain_info,
                        "monthly_bias": monthly_side,
                        "horizon":horizon_for(selected_strategy),
                        "reasons":blockers or ["WAIT: risk-quality condition pending"],
                        "execution_trigger": trigger_state,
                    })
        
                # Early-warning candidates: developing setups from the single historically validated strategy
                # are shown as POTENTIAL while execution gates are still forming.
                potential_ready = consensus_score >= POTENTIAL_SCORE_MIN and strategy_count >= 1 and HISTORICAL_STRATEGY_ACTIVE
                near_complete = strategy_count == 1 and HISTORICAL_STRATEGY_ACTIVE
                if event_info.get("gate", True) and (potential_ready or near_complete):
                    missing_count = max(1, MIN_CONFIRMED_STRATEGIES - strategy_count)
                    potential_candidates.append({
                        "status": f"POTENTIAL_{c}",
                        "strategy":selected_strategy,
                        "validated_strategy":ACTIVE_STRATEGY_NAME,
                        "entry_category":chosen_category,
                        "strategy_tier":strategy_tier,
                        "confirmed_strategy_count":strategy_count,
                        "confirmed_strategies":strat.get("strategies",[]),
                        "strategy_matches":strat.get("all_matches",[]),
                        "side":c,
                        "level":level,
                        "rr":rr,
                        "score_basis":consensus_score,
                        "signal_timeframes": list(agreeing_signal_tfs),
                        "position_timeframe": position_tf,
                        "alignment_chain": chain_info,
                        "monthly_bias": monthly_side,
                        "horizon":horizon_for(selected_strategy),
                        "reasons":[
                            (f"POTENTIAL: strategy score {consensus_score:.1f}/100; final execution gates still pending"
                             if potential_ready and aligned_count >= 2 else
                             f"MISSING: historical strategy confirmation is not active"
                             if strategy_count < MIN_CONFIRMED_STRATEGIES else
                             "MISSING: single historical strategy confirmation is not active"),
