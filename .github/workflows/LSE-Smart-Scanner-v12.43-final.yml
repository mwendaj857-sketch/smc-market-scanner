                    assert row["realized_rr"] is not None and row["realized_rr"] >= 0
                    assert row["mfe_r"] is not None and row["mae_r"] is not None
            print(f"E2E validation: PASS | status={status} | observations={len(r['observations'])}")

        sel=json.loads(open("historical_strategy_selection.json",encoding="utf-8").read())
        assert sel["version"]=="v12.42-historical-strategy-selection"
        assert sel["status"] in ("VALIDATED","NO_VALIDATED_STRATEGY")
        allowed={"SMC","Market Structure","Liquidity","Supply/Demand","Price Action","Fibonacci","Trend","RSI+MACD","Session"}
        if sel["status"]=="VALIDATED":
            assert sel.get("strategy") in allowed
            assert sel.get("selected_metrics",{}).get("holdout",{}).get("expectancy_r") is not None
        print(f"Historical strategy selection validation: PASS | status={sel['status']} | strategy={sel.get('strategy')}")
