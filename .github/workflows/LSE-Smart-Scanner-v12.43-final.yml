        def export_remaining_from_usage(value, export_context=False):
            """Best-effort extraction of an export allowance from /vault/usage.
            Unknown response shapes never block the run; the local cap remains active.
            """
            if isinstance(value, dict):
                local_context = export_context or any(
                    token in str(k).lower() for k in value.keys()
                    for token in ("export", "download")
                )
                for k, v in value.items():
                    key = str(k).lower()
                    if local_context and isinstance(v, (int, float)) and math.isfinite(float(v)):
                        if "remaining" in key or "available" in key:
                            return max(0, int(v))
                for v in value.values():
                    found = export_remaining_from_usage(v, local_context)
                    if found is not None:
                        return found
            return None

        provider_export_remaining = export_remaining_from_usage(vault_usage_snapshot)
        if provider_export_remaining is not None:
