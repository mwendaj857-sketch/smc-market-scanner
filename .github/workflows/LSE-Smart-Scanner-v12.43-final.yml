name: LSE Smart Signal Scanner v12.43 — LSE Tick-Safe Historical-Strategy-Validated Single-Strategy Execution
permissions:
  contents: read
concurrency:
  group: lse-smart-scanner-${{ github.event_name }}-${{ inputs.scan_mode || 'ONCE' }}
  cancel-in-progress: true
jobs:
  validate_workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Validate YAML, duplicate keys, and embedded Python before LSE access
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
        python - <<'PY'
        import ast
        import os
        import re
        from pathlib import Path
        import yaml
        
        class DuplicateKeyLoader(yaml.SafeLoader):
            pass
        
        def construct_mapping(loader, node, deep=False):
            mapping = {}
            for key_node, value_node in node.value:
                key = loader.construct_object(key_node, deep=deep)
                if key in mapping:
                    raise ValueError(
                        f"Duplicate YAML key {key!r} at line {key_node.start_mark.line + 1}"
                    )
                mapping[key] = loader.construct_object(value_node, deep=deep)
            return mapping
        
        DuplicateKeyLoader.add_constructor(
            yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
            construct_mapping,
        )
        
        workflow_ref = os.environ.get("GITHUB_WORKFLOW_REF", "")
        workflow = None
        marker = ".github/workflows/"
        if marker in workflow_ref:
            candidate = workflow_ref.split(marker, 1)[1].split("@", 1)[0]
            path = Path(".github/workflows") / candidate
            if path.is_file():
                workflow = path
        
        if workflow is None:
            candidates = sorted(Path(".github/workflows").glob("*.yml")) + sorted(Path(".github/workflows").glob("*.yaml"))
            matches = []
            for candidate in candidates:
                try:
                    candidate_text = candidate.read_text(encoding="utf-8")
                except OSError:
                    continue
                if (
                    "LSE Smart Signal Scanner" in candidate_text
                    and "from lse import LSE" in candidate_text
                    and "FAST FILTER -> DEEP ANALYSIS" in candidate_text
                ):
                    matches.append(candidate)
            if len(matches) != 1:
                raise SystemExit(
                    f"Expected exactly one current LSE scanner workflow, found {len(matches)}: {matches}"
                )
            workflow = matches[0]

        source = workflow.read_text(encoding="utf-8")
        doc = yaml.load(source, Loader=DuplicateKeyLoader)
        assert isinstance(doc, dict), "Workflow root must be a mapping"
        jobs = doc.get("jobs")
        assert isinstance(jobs, dict), "jobs mapping missing"
        for required in ("validate_workflow", "tca_replay", "deep_history", "e2e_replay", "scan"):
            assert required in jobs, f"Missing job: {required}"
        
        scan_env = jobs["scan"].get("env", {})
        assert list(scan_env).count("RUN_E2E") == 1, "RUN_E2E must have exactly one authoritative scan-env definition"
        assert "RUN_E2E" in scan_env
        assert "RUN_E2E" not in jobs["tca_replay"].get("env", {}), "TCA must not define a second RUN_E2E switch"
        assert jobs["tca_replay"].get("needs") == ["validate_workflow"]
        assert jobs["e2e_replay"].get("needs") == ["validate_workflow", "tca_replay", "deep_history"]
        assert "validate_workflow" in jobs["scan"].get("needs", [])
        assert "on" in doc, "GitHub workflow trigger block is missing"
        scan_if = str(jobs["scan"].get("if", ""))
        assert "always()" in scan_if and "needs.tca_replay.result" in scan_if and "needs.e2e_replay.result" in scan_if, "Scan must explicitly allow skipped optional replay jobs"
        
        text = source

        def step_by_name(job_name, step_name):
            job_steps = jobs[job_name].get("steps", [])
            matches = [s for s in job_steps if s.get("name") == step_name]
            assert len(matches) == 1, f"Expected exactly one step named {step_name!r} in {job_name}, found {len(matches)}"
            return matches[0]

        tca_history_step = step_by_name("tca_replay", "Historical tick replay + execution TCA")
        tca_preflight_step = step_by_name("tca_replay", "LSE API key and data-access preflight")
        e2e_replay_step = step_by_name("e2e_replay", "Historical nine-strategy end-to-end replay")
        scan_runs = "\n".join(
            s.get("run", "") for s in jobs["scan"].get("steps", [])
            if isinstance(s.get("run"), str)
        )

        tca_run_source = tca_history_step["run"]
        e2e_run_source = e2e_replay_step["run"]

        assert "start=api_date(query_start)" in tca_run_source
        assert "end=api_date(query_end + timedelta(days=1))" in tca_run_source
        assert "HISTORY_MAX_RETRIES = 0" in tca_run_source
        assert "TICK_HISTORY_FLOOR" in tca_run_source, "TCA rolling 1-year tick-history floor missing"
        assert "TCA_MAX_VAULT_EXPORTS" in jobs["tca_replay"].get("env", {}), "TCA vault export safety cap missing"
        assert "client._vault_call(\"/usage\")" in tca_run_source, "LSE vault usage preflight missing"
        assert "EXPORT_BUDGET_CAPPED" in tca_run_source, "Controlled export-cap state missing"
        assert "rows_from_result" in e2e_run_source
        assert "insufficient valid EMA closes" in scan_runs, "EMA pullback must tolerate null/invalid historical closes"
        assert 'ns["strategy_catalog"](data,symbol,{})' in e2e_run_source, "Historical setup reconstruction must use the scanner strategy catalog"
        assert "historical_decision_count" in e2e_run_source, "Historical setup evaluation counter missing"
        assert '"historical_reconstruction"' in e2e_run_source, "Historical reconstruction report missing"
        assert "rows_from_history" not in e2e_run_source
        assert "client.history(" not in e2e_run_source, "E2E must not issue a second LSE vault history export"
        assert "if len(ticks)<100: raise RuntimeError" not in e2e_run_source, "Missing tick tape must not block historical setup reconstruction"
        assert "TCA is the single LSE vault-history export owner" in e2e_run_source, "TCA/E2E single-owner handoff missing"
        assert "DEEP_HISTORY_START" in e2e_run_source, "Deep-history start handoff missing"
        assert "deep_history_manifest.json" in e2e_run_source, "Deep-history artifact handoff missing"
        assert "resample_5m_to_timeframe" in e2e_run_source, "Deep-history timeframe reconstruction missing"
        assert "DEEP_DECISION_STEP_MINUTES" in e2e_run_source, "Deep decision pacing missing"
        assert "EXPORT_BUDGET_CAPPED" in e2e_run_source, "E2E export-cap handoff missing"
        assert "NO_BID_ASK_FIELDS_IN_DATASET" in tca_run_source, "Price-only LSE datasets must be distinguished from missing data"
        assert "normalize_price_ticks" in tca_run_source, "Raw price-tick evidence normalizer missing"
        assert "isinstance(v, (int, float))" in e2e_run_source, "E2E WebSocket numeric Unix timestamp parsing missing"
        assert "datetime.fromtimestamp(float(v), tz=timezone.utc)" in e2e_run_source, "E2E Unix-seconds timestamp conversion missing"
        assert "bid={getattr(tick,'bid',None)!r}" in e2e_run_source, "WebSocket bid diagnostic missing"
        assert "ask={getattr(tick,'ask',None)!r}" in e2e_run_source, "WebSocket ask diagnostic missing"
        assert "LSE API key and data-access preflight" in tca_preflight_step["name"], "LSE API key preflight missing"
        assert "LSE API KEY STATUS: INVALID" in tca_preflight_step["run"], "Explicit invalid-key diagnostic missing"
        assert "E2E_MIN_TICKS" in e2e_run_source, "E2E minimum-tick constant missing"
        assert "vault_raw_price_count >= MIN_TICKS" not in e2e_run_source, "E2E still references undefined TCA MIN_TICKS"
        assert 'timeframe="tick"' not in tca_run_source, "Raw tick history must use documented history() semantics without a candle timeframe"
        assert "vault_valid_count=0" in tca_run_source, "TCA vault_valid_count must be initialized before branch-local use"
        assert "vault_raw_price_count=0" in tca_run_source, "TCA vault_raw_price_count must be initialized before branch-local use"
        
        total_python = 0
        for job_name, job in jobs.items():
            for step_index, step in enumerate(job.get("steps", [])):
                run = step.get("run")
                if not isinstance(run, str):
                    continue
                for match in re.finditer(
                    r"python\s+-\s+<<['\"]?PY['\"]?\n(.*?)\nPY(?:\n|$)",
                    run,
                    flags=re.S,
                ):
                    code = match.group(1)
                    ast.parse(code, filename=f"{workflow}:{job_name}:step{step_index}")
                    total_python += 1
        
        assert total_python >= 8, f"Expected embedded Python validation coverage; found {total_python}"
        print(f"WORKFLOW VALIDATION PASS | {workflow}")
        print("YAML duplicate-key check: PASS")
        print("Dependency/preflight ordering: PASS")
        print("LSE API date-boundary guard: PASS")
        print("429 circuit breaker: PASS")
        print("E2E history normalizer: PASS")
        print(f"Embedded Python AST/compile checks: PASS ({total_python} blocks)")
        PY
  scan:
    needs:
    - validate_workflow
    - tca_replay
    - e2e_replay
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 70
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      MAX_INSTRUMENTS: ${{ inputs.max_instruments || '0' }}
      SCAN_RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '8' }}
      LSE_CATEGORIES: ${{ inputs.categories || 'forex,commodity,crypto' }}
      TOP_N: ${{ inputs.top_n || '5' }}
      SCAN_MODE: ${{ inputs.scan_mode || 'ONCE' }}
      UNTIL_POSITION_MAX_MINUTES: ${{ inputs.until_position_max_minutes || '55' }}
      POLL_SECONDS: ${{ inputs.poll_seconds || '30' }}
      FAST_CANDIDATE_LIMIT: ${{ inputs.fast_candidate_limit || '8' }}
      FAST_MIN_SCORE: ${{ inputs.fast_min_score || '55' }}
      RUN_TCA: ${{ inputs.run_tca || 'false' }}
      RUN_E2E: ${{ inputs.run_e2e || 'false' }}
      TCA_SYMBOLS: ${{ inputs.tca_symbols || 'EUR/USD,GBP/USD,USD/JPY,USD/CHF' }}
      E2E_SYMBOLS: ${{ inputs.e2e_symbols || 'EUR/USD,GBP/USD,USD/JPY,USD/CHF' }}
      E2E_START: ${{ inputs.e2e_start || '' }}
      E2E_END: ${{ inputs.e2e_end || '' }}
      TCA_START: ${{ inputs.tca_start || '' }}
      TCA_END: ${{ inputs.tca_end || '' }}
      # Fixed safe TCA defaults are job configuration, not manual dispatch inputs.
      TCA_HORIZON_MINUTES: '60'
      TCA_OBSERVATION_SECONDS: '15'
      TCA_MAX_SETUPS: '200'
      TCA_MIN_TICKS: '2'
      TCA_MAX_VAULT_EXPORTS: '1'
      TCA_CALIBRATION_MIN_OBSERVATIONS: '100'
      NEWS_RSS_URLS: ${{ secrets.NEWS_RSS_URLS }}
      PYTHONUNBUFFERED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Download empirical execution calibration
      uses: actions/download-artifact@v8
      with:
        name: historical-tick-replay-tca
        path: .
      if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_tca == true || inputs.run_e2e == true) }}
    - name: Download historical strategy selection
      uses: actions/download-artifact@v8
      with:
        name: historical-strategy-selection
        path: .
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e == true }}

    - name: Recover latest validated historical strategy from a prior run
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e != true }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ -s historical_strategy_selection.json ]; then
          echo "Historical strategy selection already present."
          exit 0
        fi
        found=0
        for run_id in $(gh run list --workflow "$GITHUB_WORKFLOW" --status completed --limit 20 --json databaseId,conclusion --jq '.[] | select(.conclusion=="success") | .databaseId'); do
          if gh run download "$run_id" -n historical-strategy-selection -D . >/dev/null 2>&1; then
            echo "Recovered historical strategy selection from run $run_id."
            found=1
            break
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "No prior successful run with a historical strategy artifact was found."
        fi

    - name: Set up Python 3.12 (Node 24 actions)
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        python -m pip install "lse-data[frames]==0.14.0" "feedparser>=6.0,<7" "PyYAML>=6.0,<7" "matplotlib>=3.8,<4" "pandas>=2.0,<3" "pyarrow>=15,<23"

        '
    - name: Validate embedded scanner before live run
      run: |
        set -euo pipefail
        export WORKFLOW_DIR="$GITHUB_WORKSPACE/.github/workflows"
        python - <<'PY'
        import ast
        import os
        from pathlib import Path
        import yaml
        
        workflow_dir = Path(os.environ["WORKFLOW_DIR"]).resolve()
        assert workflow_dir.is_dir(), f"Workflow directory missing: {workflow_dir}"
        
        # Validate the exact workflow used by this GitHub Actions run.
        # This prevents an older v8.x scanner in the repository from being selected.
        workflow_ref = os.environ.get("GITHUB_WORKFLOW_REF", "")
        workflow_path = None
        if workflow_ref:
            ref_path = workflow_ref.split("@", 1)[0]
            marker = ".github/workflows/"
            if marker in ref_path:
                workflow_path = workflow_dir / ref_path.split(marker, 1)[1]
        
        if workflow_path is None:
            candidates = [
                p for p in sorted(workflow_dir.glob("*.yml")) + sorted(workflow_dir.glob("*.yaml"))
                if p.is_file()
            ]
            matches = []
            for candidate in candidates:
                try:
                    candidate_text = candidate.read_text(encoding="utf-8")
                except OSError:
                    continue
                if "SMC LSE SMART INTRADAY SCANNER" in candidate_text and "from lse import LSE" in candidate_text:
                    matches.append((candidate, candidate_text))
            assert len(matches) == 1, (
                "Could not safely identify the current scanner workflow. "
                "Remove duplicate scanner workflow files or run under GitHub Actions."
            )
            workflow_path, text = matches[0]
        else:
            assert workflow_path.is_file(), f"Current workflow file not found: {workflow_path}"
            text = workflow_path.read_text(encoding="utf-8")
        
        doc = yaml.safe_load(text)
        assert isinstance(doc, dict), "Workflow is not a YAML mapping"
        jobs = doc.get("jobs")
        assert isinstance(jobs, dict) and isinstance(jobs.get("scan"), dict), "scan job missing"
        steps = jobs["scan"].get("steps", [])
        assert isinstance(steps, list), "scan.steps is not a list"
        
        run_blocks = [s.get("run", "") for s in steps if isinstance(s, dict) and isinstance(s.get("run"), str)]
        scanner_blocks = [
            x for x in run_blocks
            if "python - <<'PY'" in x
            and "from lse import LSE" in x
            and "print(\"LSE SMART SIGNAL SCANNER v12.41" in x
            and "def now_utc" in x
        ]
        assert len(scanner_blocks) == 1, f"Expected exactly one main embedded scanner block, found {len(scanner_blocks)}"
        scanner = scanner_blocks[0]
        assert "v12.42" in scanner and "FAST FILTER -> DEEP ANALYSIS" in scanner, "Wrong scanner version embedded in current workflow"
        assert "import feedparser" in scanner and "def external_news" in scanner, "RSS layer missing from embedded scanner"
        assert "def event_risk" in scanner and "RSS is secondary risk intelligence" in scanner, "RSS risk integration missing"
        assert "alignment = {" in scanner, "Timeframe alignment definition missing"
        assert '"1mo": nine_strategy_signals' in scanner, "Monthly strategy analysis missing"
        assert "monthly_alignment_ok" in scanner and "signal_timeframes" in scanner, "Monthly/any-timeframe agreement gate missing"
        assert scanner.index("alignment = {") < scanner.index('"alignment":alignment'), "Alignment must be defined before result construction"
        assert "strategy_score" in scanner and "execution_quality_score" in scanner, "Separate strategy/execution scores missing"
        assert "ENTRY_HORIZONS" in scanner and "horizon_for(" in scanner, "Entry-type horizon mapping missing"
        assert "WAITING_FOR_TRIGGER" in scanner, "WAITING_FOR_TRIGGER state missing"
        assert "rss_news_risk" in scanner and "event_risk" in scanner and "event_alignment" in scanner, "Event-aware risk output/integration missing"
        assert "actions/upload-artifact@v7" in text, "Artifact upload is not using actions/upload-artifact@v7"
        assert "Send validated scanner output to Telegram" in text, "Telegram delivery step missing"
        telegram_step = next(
            s for s in jobs["scan"]["steps"]
            if s.get("name") == "Send validated scanner output to Telegram"
        )
        telegram_env = telegram_step.get("env", {})
        assert "BOT_TOKEN" in telegram_env and "TELEGRAM_CHAT_ID" in telegram_env, "Telegram step secret env wiring missing"
        assert "secrets.TELEGRAM_BOT_TOKEN" in str(telegram_env["BOT_TOKEN"]) or "secrets.BOT_TOKEN" in str(telegram_env["BOT_TOKEN"]), "Telegram bot-token secret not wired"
        assert "secrets.TELEGRAM_CHAT_ID" in str(telegram_env["TELEGRAM_CHAT_ID"]), "Telegram chat-id secret not wired"
        assert "matplotlib" in text and "sendPhoto" in text, "Telegram candlestick chart delivery missing"
        secret_prefix = "lse" + "_live_"
        assert secret_prefix not in text, "Literal LSE API key must never be committed"
        assert "chart_candles" in scanner and "chart_timeframe" in scanner, "Adaptive chart data missing from scanner handoff"
        assert "status_rule" in scanner, "WAIT/confirmed status rule missing from JSON"
        assert "POSITION_TIMEFRAME_PROFILES" in scanner, "Adaptive position timeframe profiles missing"
        assert "timeframe_analysis" in scanner, "Per-timeframe analysis missing"
        assert "position_timeframe" in scanner, "Position timeframe field missing"
        assert "FAST_FETCH_LIMIT" in scanner and "fast_nine_strategy_signals" in scanner, "Fast native timeframe filter missing"
        assert "candidate_meta" in scanner and "for idx, meta in enumerate(candidate_meta, 1)" in scanner, "Deep scan is not restricted to promoted candidates"
        assert "entry_price" in scanner and "candidate_price" in scanner and "candidate_plan" in scanner, "Closed-candle entry plan missing"
        assert "def execution_trigger_state" in scanner, "Closed-candle execution trigger engine missing"
        assert "trigger_crossed" in scanner and "OVEREXTENDED" in scanner, "Conditional trigger state missing"
        assert "ENTRY_BUFFER_ATR =" in scanner and "ENTRY_MAX_CHASE_ATR =" in scanner, "Execution trigger constants missing"
        assert "TRIGGER_SWING_LOOKBACK =" in scanner and "TRIGGER_SWING_WINDOW =" in scanner, "Structural trigger configuration missing"
        assert "forming candle never votes" in scanner, "Forming candle must not influence directional scoring"
        assert "entry_plan" in scanner and "take_profit" in scanner and "stop_loss" in scanner, "Fast-filter entry plan missing"
        assert "FAST FILTER ENTRY PLANS" in text, "Telegram fast-filter entry plans missing"
        assert "scan_mode" in text and "UNTIL_POSITION" in text, "Until-position scan mode missing"
        assert "SCAN_MODE" in text and "POLL_SECONDS" in text, "Continuous scan configuration missing"
        assert "FAST_CANDIDATE_LIMIT" in text and "FAST_MIN_SCORE" in text, "Fast-filter configuration missing"
        assert "historical tick replay" in text and "implementation_shortfall" in text, "Historical tick replay/TCA layer missing"
        assert "api_date" in text and "LSE historical REST boundaries require YYYY-MM-DD" in text, "Historical replay date-boundary guard missing"
        assert "Vault history diagnostic:" in text, "Vault history/export failure diagnostic missing"
        assert "DATA_UNAVAILABLE" in text and "NO_QUALIFIED_SIGNALS" in text, "Explicit non-evidence states missing"
        assert "RATE_LIMITED" in text and "remaining exports skipped" in text, "Rate-limit circuit breaker missing"
        assert "replay_count=len(retry_rows)" in text, "E2E WebSocket retry count bug not fixed"
        assert "timeout = 4.0 if timeout is None else timeout" in scanner, "Live quote timeout normalization missing"
        assert "timeout = max(0.5, min(30.0, float(timeout)))" in scanner, "Live quote timeout must be finite and bounded"
        assert "start=api_date(query_start)" in doc["jobs"]["tca_replay"]["steps"][4]["run"], "TCA vault history export must use YYYY-MM-DD boundaries"
        assert "end=api_date(query_end + timedelta(days=1))" in doc["jobs"]["tca_replay"]["steps"][4]["run"], "TCA vault history export end must use YYYY-MM-DD"
        assert "client.history(" not in doc["jobs"]["e2e_replay"]["steps"][7]["run"], "E2E must not issue direct vault history exports"
        assert "TCA is the single LSE vault-history export owner" in doc["jobs"]["e2e_replay"]["steps"][7]["run"], "TCA/E2E single-owner handoff missing"
        assert "start=iso_z(query_start)" not in doc["jobs"]["tca_replay"]["steps"][4]["run"]
        
        assert "execution_tca.json" in text and "execution_tca.csv" in text, "TCA artifacts missing"
        assert "FAST FILTER -> DEEP ANALYSIS" in scanner, "Two-stage scan architecture missing"
        assert "fast_candidates" in scanner and "fast_watch" in scanner, "Fast candidate/watch handoff missing"
        assert "deep_analysis_count" in scanner and "fast_filtered_count" in scanner, "Two-stage scan metrics missing"
        assert "POTENTIAL_BUY" in scanner and "POTENTIAL_SELL" in scanner, "Directional potential states missing"
        assert "NO_ACTION" in scanner, "Neutral NO_ACTION state missing"
        assert "NO CONFIRMED ENTRY" not in scanner and "NO_ACTION" in scanner, "Legacy no-confirmed-entry wording or NO_ACTION state missing"
        assert "fast_filter" in scanner, "Fast-filter result metadata missing"
        assert "SNIPER_MIN_SCORE" in scanner and "sniper_opportunity" in scanner, "SNIPER precision opportunity engine missing"
        assert "strategy_catalog" in scanner and "strategy_summary" in scanner, "Strategy-category confluence engine missing"
        assert "MIN_CONFIRMED_STRATEGIES = 1" in scanner, "Single-strategy minimum missing"
        assert "entry_category" in scanner and "confirmed_strategies" in scanner, "Categorized strategy output missing"
        assert "CATEGORY_SCORE_MIN" in scanner, "Category thresholds missing"
        assert scanner.index("sniper_ranked = sorted(") < scanner.index("len(sniper_ranked)"), "sniper_ranked must be defined before it is referenced"
        assert "data_quality_report" in scanner and "volatility_regime" in scanner, "Data-quality/volatility validation layer missing"
        assert "ALL ELIGIBLE LIVE-CATALOG" in scanner, "Broad opportunity universe missing"
        telegram_text = "\n".join(run_blocks)
        assert "🟢" in telegram_text and "🟡 WAIT — NOT CONFIRMED / NOT AN ENTRY" in telegram_text and "👀 POTENTIAL — NOT CONFIRMED" in telegram_text, "Telegram status formatting missing"
        assert 'color=' in text, "Colored Telegram chart elements missing"
        heredocs = __import__("re").findall(r"python\s+-\s+<<[\'\"]?PY[\'\"]?\r?\n(.*?)\r?\nPY(?:\r?\n|$)", scanner, flags=__import__("re").S)
        py_candidates = [block for block in heredocs if "from lse import LSE" in block and "FAST FILTER -> DEEP ANALYSIS" in block]
        assert len(py_candidates) == 1, f"Expected exactly one scanner heredoc, found {len(py_candidates)}"
        py = py_candidates[0]
        
        ast.parse(py)
        compile(py, "<embedded-scanner>", "exec")
        print(f"Workflow selected: {workflow_path}")
        print("YAML syntax: PASS")
        print("scan job structure: PASS")
        print("Main embedded Python syntax: PASS")
        print("Embedded scanner compilation: PASS")
        print("RSS integration: PASS")
        print("Alignment definition/order: PASS")
        print("Monthly master filter: PASS")
        print("Any-timeframe agreement gate: PASS")
        print("Score separation: PASS")
        print("Entry-type horizon mapping: PASS")
        print("WAIT/non-entry formatting: PASS")
        print("Artifact upload v7: PASS")
        assert "def dominant(methods, minimum=2)" in scanner, "dominant() helper missing before fast filter"
        assert "Stage A: 1H + 15M only" in scanner, "two-stage fast filter missing"
        assert "_candle_request" in scanner and "API_MAX_RETRIES" in scanner and "API_MIN_INTERVAL_SECONDS" in scanner, "bounded LSE retry/pacing layer missing"
        assert "v12.42" in scanner, "scanner version mismatch"
        assert scanner.count("def dominant(methods, minimum=2)") == 1, "duplicate/missing dominant() definition"
        assert 'daily_intelligence(client, [m["symbol"] for m in candidate_meta])' in scanner, "intelligence is not deferred to deep candidates"
        assert "lower_is_better" in scanner, "event surprise polarity model missing"
        print("Scanner version: v12.41")
        print("Fast two-stage filter: PASS")
        print("Transient LSE retry/backoff: PASS")
        print("Lazy benchmark loading: PASS")
        PY
    - name: Run scanner
