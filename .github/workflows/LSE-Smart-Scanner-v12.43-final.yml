            ]:
                try:
                    sig=fn(rows,category)
                except TypeError:
                    try: sig=fn(rows)
                    except Exception: sig="NEUTRAL"
                except Exception:
                    sig="NEUTRAL"
                out.append({"name":name,"signal":sig[0] if isinstance(sig,(tuple,list)) else sig})
            return out

