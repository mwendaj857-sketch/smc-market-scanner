        def dominant(methods,minimum=2):
            b=sum(m["signal"]=="BUY" for m in methods)
            s=sum(m["signal"]=="SELL" for m in methods)
            if b>=minimum and b>s:return "BUY"
            if s>=minimum and s>b:return "SELL"
            return "NEUTRAL"
        
        def first_cross(ticks,times,start,end,side,trigger):
            lo=bisect.bisect_left(times,start); hi=bisect.bisect_right(times,end)
            for t in ticks[lo:hi]:
                px=t["ask"] if side=="BUY" else t["bid"]
                if (side=="BUY" and px>=trigger) or (side=="SELL" and px<=trigger): return t
            return None
        
        def markout_metrics(ticks,times,fill,side,fill_price,risk,horizon):
            endt=fill+timedelta(seconds=horizon*60)
            lo=bisect.bisect_left(times,fill); hi=bisect.bisect_right(times,endt)
            ex=[t["bid"] if side=="BUY" else t["ask"] for t in ticks[lo:hi]]
            if not ex:return None
            if side=="BUY":
                fav=max(ex)-fill_price; adverse=max(fill_price-x for x in ex); final=ex[-1]-fill_price
            else:
                fav=fill_price-min(ex); adverse=max(x-fill_price for x in ex); final=fill_price-ex[-1]
            return {"mfe_r":fav/max(risk,1e-12),"mae_r":adverse/max(risk,1e-12),
                    "markout_bps":final/max(fill_price,1e-12)*10000.0}
        
        def hit_order(ticks,times,fill,side,sl,tp,horizon):
            # If the simulated fill already crossed a fixed SL/TP because of a gap,
            # resolve that immediately rather than waiting for a later tick.
            first_fill_idx=bisect.bisect_left(times,fill)
            if first_fill_idx < len(ticks):
                first=ticks[first_fill_idx]
                px=first["bid"] if side=="BUY" else first["ask"]
                if side=="BUY":
                    if px<=sl:return "SL_FIRST",first
                    if px>=tp:return "TP_FIRST",first
                else:
                    if px>=sl:return "SL_FIRST",first
                    if px<=tp:return "TP_FIRST",first
            endt=fill+timedelta(minutes=horizon)
            lo=bisect.bisect_left(times,fill); hi=bisect.bisect_right(times,endt)
            for t in ticks[lo:hi]:
                px=t["bid"] if side=="BUY" else t["ask"]
                if side=="BUY":
                    if px<=sl:return "SL_FIRST",t
                    if px>=tp:return "TP_FIRST",t
                else:
                    if px>=sl:return "SL_FIRST",t
                    if px<=tp:return "TP_FIRST",t
            return "NEITHER",None
        
        def avg(xs):
            xs=[float(x) for x in xs if x is not None and math.isfinite(float(x))]
            return statistics.fmean(xs) if xs else None
        
        def pct(n,d): return (100*n/d) if d else None
        
        
        def candle_outcome(base_rows, decision_time, side, sl, tp, horizon_minutes):
            """Point-in-time candle outcome for strategy validation.
            If both TP and SL occur in the same 5m bar, mark it ambiguous and
            exclude it from the clean-trade statistics rather than guessing order.
            """
            end_time = decision_time + timedelta(minutes=horizon_minutes)
            for bar in base_rows:
                ts = bar["timestamp"]
                if ts < decision_time:
                    continue
                if ts > end_time:
                    break
                try:
                    hi, lo = float(bar["high"]), float(bar["low"])
                except Exception:
                    continue
                if side == "BUY":
                    hit_tp = hi >= tp
                    hit_sl = lo <= sl
                else:
                    hit_tp = lo <= tp
                    hit_sl = hi >= sl
                if hit_tp and hit_sl:
                    return "AMBIGUOUS_BAR", None
                if hit_tp:
                    return "TP_FIRST", 1.0
                if hit_sl:
                    return "SL_FIRST", -1.0
            return "OPEN_AT_HORIZON", 0.0

        def tick_field(tick, *names):
            """Read SDK Tick fields robustly across object/dict/case variants."""
            candidates = {str(n).lower() for n in names}
            if isinstance(tick, dict):
                for k, v in tick.items():
                    if str(k).strip().lower() in candidates:
                        return v
                for nested_name in ("fields", "data", "quote"):
                    nested = tick.get(nested_name)
                    if isinstance(nested, dict):
                        for k, v in nested.items():
                            if str(k).strip().lower() in candidates:
                                return v
            for name in names:
                try:
                    value = getattr(tick, name)
                    if value is not None:
                        return value
                except Exception:
                    pass
            return None

        def tick_bool(tick, *names):
            value = tick_field(tick, *names)
            if isinstance(value, bool):
                return value
            if value is None:
                return None
            return str(value).strip().lower() in {"true", "1", "yes", "y", "replay"}

        def tick_to_row(tick):
            ts = tick_field(tick, "timestamp", "datetime", "time", "date")
            bid = fnum(tick_field(tick, "bid", "BID", "bid_price", "best_bid", "bidprice", "bid_1"))
            ask = fnum(tick_field(tick, "ask", "ASK", "ask_price", "best_ask", "askprice", "ask_1"))
            price = fnum(tick_field(tick, "price", "last", "last_price", "trade_price", "mid", "mid_price"))
            volume = fnum(tick_field(tick, "volume", "size", "trade_size")) or 0.0
            if ts is None or bid is None or ask is None or bid <= 0 or ask <= 0 or ask < bid:
                return None
            try:
                dt = parse_ts(ts)
            except Exception:
                return None
            return {"timestamp":dt,"bid":bid,"ask":ask,
                    "price":price if price is not None else (bid+ask)/2.0,"volume":volume}

        def load_replay_ticks(symbols, start, end):
            """WebSocket-first E2E tick loader with explicit vault raw-tick fallback.
        
            Hierarchy:
              1) WebSocket historical replay
              2) validate replay bid/ask ticks
              3) if zero/insufficient -> consume the normalized TCA cache
              4) validate cached bid/ask ticks and filter to the exact UTC window
              5) if still insufficient -> DATA_UNAVAILABLE
            E2E never calls the LSE vault history export directly; TCA is the single export owner.
            """
            ws_replay_allowed = 0 < (end-start).total_seconds() <= 24*3600
            E2E_MIN_TICKS = 100
            meta={}
            out={}
        
            def iso_z(dt):
                return dt.astimezone(timezone.utc).isoformat().replace("+00:00","Z")
        
            def load_cached_ticks(symbol):
                entry = cache_manifest.get("symbols", {}).get(symbol)
                if not entry:
                    return [], "no cache entry"
                cache_start = parse_ts(cache_manifest.get("window_start")) if cache_manifest.get("window_start") else None
                cache_end = parse_ts(cache_manifest.get("window_end")) if cache_manifest.get("window_end") else None
                if cache_start is None or cache_end is None or cache_start > start or cache_end < end:
                    return [], "cache does not fully cover requested exact UTC window"
                rel = entry.get("path")
                path = os.path.abspath(rel) if rel else ""
                if not path or not os.path.isfile(path):
                    return [], "cache artifact file missing"
                try:
                    import pyarrow.parquet as pq
                    table = pq.read_table(path)
                    rows=[]
                    for x in table.to_pylist():
                        class CachedTick:
                            pass
                        cached = CachedTick()
                        cached.timestamp=x.get("timestamp")
                        cached.bid=x.get("bid")
                        cached.ask=x.get("ask")
                        cached.price=x.get("price")
                        cached.volume=x.get("volume")
                        row=tick_to_row(cached)
                        if row is not None and start <= row["timestamp"] <= end:
                            rows.append(row)
                    rows.sort(key=lambda r:r["timestamp"])
                    if len(rows) >= E2E_MIN_TICKS:
                        return rows, None
                    return rows, "cache contains fewer than the minimum validated bid/ask ticks"
                except Exception as exc:
                    return [], f"cache read failed: {type(exc).__name__}: {exc}"
        
            def load_ws(symbol,replay_start,window_start,window_end,minimum_ticks):
                """LSE WebSocket replay: START-anchored, <=24h, locally END-clipped.

                Official LSE contract: client.stream([symbol], start=<ISO timestamp>).
                The server replays from START for up to 24 hours, then transitions
                to live ticks. END is not a WebSocket parameter; this workflow
                enforces END locally and never accepts live ticks as historical evidence.
                """
                rows=[]; seen=set(); live_seen=0; replay_seen=0
                invalid_bidask=0; invalid_timestamp=0; before_window=0; after_window=0
                first_tick_ts=None; first_tick_replay=None; error=None; c=None
                if window_end <= window_start:
                    return [],0,"REPLAY_INVALID_WINDOW: end must be after start"
                if (window_end-window_start).total_seconds() > 24*3600:
                    return [],0,"REPLAY_HORIZON_EXCEEDED: requested window exceeds LSE's documented 24h replay horizon"
                try:
                    c=LSE(api_key=api_key)
                    replay_anchor=replay_start.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S")
                    print(f"LSE WS REPLAY REQUEST {symbol}: start={replay_anchor} | local_end={window_end.astimezone(timezone.utc).isoformat()}")
                    for tick in c.stream([symbol],start=replay_anchor):
                        if str(tick_field(tick, "symbol", "RIC", "name") or "").strip().upper()!=symbol.upper():
                            continue
                        raw_dt=getattr(tick,"datetime",None)
                        raw_ts=tick_field(tick, "timestamp", "datetime", "time", "date")
                        try:
                            tick_dt=(raw_dt.astimezone(timezone.utc) if raw_dt is not None else parse_ts(raw_ts))
                        except Exception:
                            try:
                                tick_dt=parse_ts(raw_ts)
                            except Exception:
                                tick_dt=None
                        if first_tick_ts is None:
                            first_tick_ts=tick_dt.isoformat() if tick_dt else str(raw_ts)
                            first_tick_replay=tick_bool(tick, "replay", "is_replay")
                            print(
                                f"LSE WS FIRST TICK {symbol}: timestamp={first_tick_ts} "
                                f"replay={first_tick_replay} "
                                f"bid={getattr(tick,'bid',None)!r} ask={getattr(tick,'ask',None)!r}"
                            )
                        replay_flag=tick_bool(tick, "replay", "is_replay")
                        if replay_flag is False:
                            live_seen+=1
                            print(f"LSE WS REPLAY COMPLETE/NO_REPLAY {symbol}: replay_seen={replay_seen} live_seen={live_seen}")
                            break
                        replay_seen+=1
                        row=tick_to_row(tick)
                        if row is None:
                            invalid_bidask += 1
                            if invalid_bidask <= 3:
                                print(f"LSE WS INVALID TICK {symbol}: ts={raw_ts!r} bid={tick_field(tick,'bid','BID','bid_price')!r} ask={tick_field(tick,'ask','ASK','ask_price')!r}")
                            continue
                        ts=row["timestamp"]
                        if ts < window_start:
                            continue
                        if ts > window_end:
                            break
                        key=(ts,row["bid"],row["ask"])
                        if key in seen:
                            continue
                        seen.add(key); rows.append(row)
                        if len(rows)>=minimum_ticks:
                            print(f"LSE WS REPLAY SUFFICIENT {symbol}: valid_bid_ask={len(rows)} replay_seen={replay_seen}")
                            break
                except Exception as exc:
                    error=f"{type(exc).__name__}: {exc}"
                finally:
                    if c is not None:
                        try: c.disconnect()
                        except Exception: pass
                if not rows and not error:
                    reason = "NO_VALID_BID_ASK_IN_REPLAY" if replay_seen > 0 and invalid_bidask > 0 else "REPLAY_EMPTY"
                    error=(f"{reason}: replay_seen={replay_seen} valid_bid_ask={len(rows)} "
                           f"invalid_bidask={invalid_bidask} invalid_timestamp={invalid_timestamp} "
                           f"before_window={before_window} after_window={after_window} "
                           f"first_tick_replay={first_tick_replay!r} first_tick_ts={first_tick_ts!r}")

                return sorted(rows,key=lambda r:r["timestamp"]),live_seen,error
            print(f"E2E RESOLVED UTC WINDOW: {iso_z(start)} -> {iso_z(end)}")
            export_rate_limited=False
            for symbol in symbols:
                if ws_replay_allowed:
                    ws_rows,live_seen,ws_error=load_ws(symbol,start,start,end,E2E_MIN_TICKS)
                else:
                    ws_rows=[]; live_seen=False
                    ws_error="WebSocket replay skipped: requested UTC window exceeds the provider replay horizon; vault fallback is authoritative."
                replay_count=len(ws_rows)
                retry_used=False
                fallback_error=None
                vault_raw_count=0
                vault_raw_price_count=0
                vault_window_count=0
                vault_first=None
                vault_last=None
                vault_schema=[]
                vault_catalog=catalog_meta.get(symbol,{})
                cache_window_covers = False
                if symbol in cache_manifest.get("symbols", {}):
                    try:
                        cache_window_covers = (
                            parse_ts(cache_manifest.get("window_start")) <= start
                            and parse_ts(cache_manifest.get("window_end")) >= end
                        )
                    except Exception:
                        cache_window_covers = False
                source="websocket_replay" if replay_count>=E2E_MIN_TICKS else "DATA_UNAVAILABLE"
        
                # A retry is still WebSocket replay, but only within the provider's
                # documented <=24h replay horizon. It is attempted when the first
                # replay is zero/insufficient.
                if replay_count < E2E_MIN_TICKS and ws_replay_allowed:
                    retry_used=True
                    retry_start=max(start-timedelta(minutes=2),end-timedelta(hours=24))
                    retry_rows,live_retry,retry_error=load_ws(symbol,retry_start,start,end,E2E_MIN_TICKS)
                    live_seen=live_seen or live_retry
                    if retry_error and not ws_error: ws_error=retry_error
                    if len(retry_rows) >= E2E_MIN_TICKS:
                        ws_rows=retry_rows
                        replay_count=len(retry_rows)
                        source="websocket_replay"
        
                # Never create a second export if TCA already produced a valid
                # normalized cache. Cache is the successful vault-history handoff
                # between TCA and E2E.
                if replay_count < E2E_MIN_TICKS:
                    cached_rows, cache_error = load_cached_ticks(symbol)
                    if len(cached_rows) >= E2E_MIN_TICKS:
                        rows=cached_rows
                        vault_window_count=len(cached_rows)
                        vault_raw_count=int(vault_catalog.get("ticks") or 0)
                        vault_valid_count=len(cached_rows)
                        vault_first=cached_rows[0]["timestamp"].isoformat()
                        vault_last=cached_rows[-1]["timestamp"].isoformat()
                        fallback_error="cache_hit: reused normalized valid bid/ask tick tape produced by TCA"
                        source="vault_history_cache"
                    elif (
                        export_rate_limited
                        or tca_report_status in ("RATE_LIMITED", "EXPORT_BUDGET_CAPPED")
                        or tca_tick_sources.get(symbol) in ("RATE_LIMITED", "EXPORT_BUDGET_CAPPED")
                    ):
                        vault_rows=[]; vault_raw_count=0; vault_valid_count=0; vault_raw_price_count=0
                        vault_first=None; vault_last=None; vault_schema=[]
                        fallback_error=(
                            "TCA export handoff blocked further vault history requests in this run "
                            "(provider rate-limit state or local export safety cap); E2E will not issue another export."
                        )
                        if cache_error:
                            fallback_error += f" cache={cache_error}"
                        vault_window_count=0
                        rows=[]
                        source="RATE_LIMITED"
                    else:
                        # TCA is the single LSE vault-history export owner when E2E is enabled.
                        # E2E consumes only its normalized cache; it never issues a vault-history request.
                        vault_rows=[]; vault_raw_count=0; vault_valid_count=len(cached_rows)
                        vault_first=cached_rows[0]["timestamp"].isoformat() if cached_rows else None
                        vault_last=cached_rows[-1]["timestamp"].isoformat() if cached_rows else None
                        vault_schema=[]
                        vault_window_count=len(cached_rows)
                        fallback_error=(
                            "DATA_UNAVAILABLE: no TCA cache with enough validated bid/ask ticks "
                            f"for E2E; direct E2E vault history export is disabled to prevent duplicate LSE exports."
                        )
                        rows=[]
                        source="DATA_UNAVAILABLE"
                else:
                    rows=ws_rows
        
                first_ts=rows[0]["timestamp"].isoformat() if rows else None
                last_ts=rows[-1]["timestamp"].isoformat() if rows else None
                meta[symbol]={
                    "ticks":len(rows),
                    "source":source,
                    "websocket_replay_valid_ticks":replay_count,
                    "vault_raw_rows":vault_raw_count,
                    "vault_raw_valid_bid_ask_ticks":vault_valid_count,
                    "vault_raw_price_ticks":vault_raw_price_count,
                    "vault_window_valid_ticks":vault_window_count,
                    "vault_raw_first_timestamp":vault_first,
                    "vault_raw_last_timestamp":vault_last,
                    "vault_catalog_dataset":vault_catalog.get("dataset"),
                    "vault_catalog_ticks":vault_catalog.get("ticks"),
                    "vault_catalog_first_timestamp":vault_catalog.get("first").isoformat() if vault_catalog.get("first") else None,
                    "vault_catalog_last_timestamp":vault_catalog.get("last").isoformat() if vault_catalog.get("last") else None,
                    "live_ticks_seen":live_seen,
                    "retry_used":retry_used,
                    "websocket_replay_allowed":ws_replay_allowed,
                    "websocket_error":ws_error,
                    "fallback_error":fallback_error,
                    "vault_schema":vault_schema,
                    "resolved_window_start":start.isoformat(),
                    "resolved_window_end":end.isoformat(),
                    "replay_evidence":"PRESENT" if rows else "NONE",
                    "diagnostic":(
                        "Historical ticks loaded from WebSocket replay."
                        if source=="websocket_replay" else
                        "WebSocket replay zero/insufficient; reused normalized valid bid/ask tick cache produced by TCA."
                        if source=="vault_history_cache" else
                        "WebSocket replay zero/insufficient; loaded and locally filtered LSE vault raw-tick history."
                        if source=="vault_history_fallback" else
                        "DATA_UNAVAILABLE: neither WebSocket replay nor vault raw-tick history contained enough valid bid/ask ticks for the exact UTC window."
                    ),
                    "first_timestamp":first_ts,
                    "last_timestamp":last_ts
                }
                print(f"{symbol}")
                print(f"WebSocket replay: {replay_count} valid ticks")
                if replay_count < E2E_MIN_TICKS:
                    print(f"Vault catalog: dataset={vault_catalog.get('dataset')} ticks={vault_catalog.get('ticks')} first={vault_catalog.get('first')} last={vault_catalog.get('last')}")
                    print(f"Vault raw tick history rows: {vault_raw_count} | valid price ticks: {vault_raw_price_count} | valid bid/ask ticks: {vault_valid_count}")
                    print(f"Vault raw schema: {vault_schema or 'UNKNOWN'}")
                    print(f"Vault history diagnostic: {fallback_error or 'none'}")
                    print(f"Vault ticks in exact window: {vault_window_count} valid bid/ask ticks | {vault_raw_price_count} raw price ticks in export")
                    if vault_raw_price_count >= E2E_MIN_TICKS and vault_valid_count == 0 and str(fallback_error or "") == "NO_BID_ASK_FIELDS_IN_DATASET":
                        print(f"TCA PRICE-ONLY EVIDENCE {symbol}: {vault_raw_price_count} timestamped price ticks are available, but historical bid/ask is not present in this LSE dataset; execution TCA is intentionally withheld.")
                    print(f"Vault raw returned range: {vault_first} -> {vault_last}" if (vault_first or vault_last) else f"Vault raw returned range: NONE (no usable vault rows returned; reason={fallback_error or 'not requested'})")
                print(f"Selected source: {source}")
                print(f"Window: {iso_z(start)} -> {iso_z(end)}")
                print(f"E2E REPLAY {symbol}: {len(rows)} valid historical bid/ask ticks | source={source}")
                if source in ("DATA_UNAVAILABLE","RATE_LIMITED"):
                    print(f"E2E {source} {symbol}: minimum required valid bid/ask ticks={E2E_MIN_TICKS} | diagnostic={fallback_error or 'none'}")
                out[symbol]=rows
            return out,meta
        replay_tick_map, replay_tick_meta=load_replay_ticks(SYMBOLS,start,end)
        
        
        deep_manifest_path=os.path.join("deep_history","deep_history_manifest.json")
        if not os.path.isfile(deep_manifest_path): raise SystemExit("DEEP_HISTORY_ARTIFACT_MISSING: deep_history_manifest.json was not downloaded")
        with open(deep_manifest_path,encoding="utf-8") as f: deep_manifest=json.load(f)
        if deep_manifest.get("status") not in ("READY","DATA_UNAVAILABLE"): raise SystemExit(f"DEEP_HISTORY_ARTIFACT_INVALID: status={deep_manifest.get('status')}")
        if deep_manifest.get("status")=="DATA_UNAVAILABLE": print("DEEP HISTORY ARTIFACT: DATA_UNAVAILABLE — no deep export allowance remained; no historical strategy can be promoted.")
        print(f"DEEP HISTORY ARTIFACT: start={deep_manifest.get('decision_start')} end={deep_manifest.get('decision_end')} timeframe={deep_manifest.get('source_timeframe')} symbols={len(deep_manifest.get('symbols',{}))}")

        rows_out=[]; failures=[]
        total_setup_count=0
        # Separate point-in-time reconstruction diagnostics from qualified
        # trade observations. Zero trades must never be reported as zero
        # historical setup evaluations.
        historical_decision_count=0
        historical_catalog_candidate_count=0
        historical_qualified_count=0
        historical_reconstruction_failures=[]
        for symbol in SYMBOLS:
            category="forex" if "/" in symbol and symbol.upper() not in ("XAU/USD","BTC/USD") else ("commodity" if symbol.upper()=="XAU/USD" else "crypto")
            print(f"E2E {symbol}: loading deep 5m history artifact and reconstructing six timeframes locally")
            try:
                entry=deep_manifest.get("symbols",{}).get(symbol)
                if not entry or entry.get("error") or entry.get("status") != "READY": raise RuntimeError("DEEP_HISTORY_NOT_EXPORTED: symbol has no usable deep-history artifact in this run; this is a controlled data-availability state, not a trade signal.")
                deep_path=os.path.join("deep_history",entry.get("file",""))
                if not os.path.isfile(deep_path): raise RuntimeError(f"DEEP_HISTORY_FILE_MISSING: {deep_path}")
                import pyarrow.parquet as pq
                raw_deep=pq.read_table(deep_path).to_pylist(); base=normalize_rows(raw_deep)
                if len(base)<TF_MIN["5m"]: raise RuntimeError(f"5m deep history has only {len(base)} candles; need {TF_MIN['5m']}")
                candles={tf:resample_5m_to_timeframe(base,tf) for tf in ("1mo","1d","4h","1h","15m","5m")}
                for tf in candles:
                    if len(candles[tf])<TF_MIN[tf]: raise RuntimeError(f"{tf}: only {len(candles[tf])} reconstructed candles; need {TF_MIN[tf]}")
                candle_times={tf:[r["timestamp"] for r in candles[tf]] for tf in candles}
                candle_month_keys={tf:[(r["timestamp"].year,r["timestamp"].month) for r in candles[tf]] for tf in candles}
                ticks=replay_tick_map.get(symbol, [])
                if len(ticks)<100: print(f"E2E {symbol}: only {len(ticks)} valid bid/ask ticks; continuing deep candle setup evaluation")
            except Exception as exc:
                failures.append({"symbol":symbol,"stage":"load","error":f"{type(exc).__name__}: {exc}"})
                print(f"E2E ERROR {symbol}: {type(exc).__name__}: {exc}")
                continue
        
            tick_times=[t["timestamp"] for t in ticks]
            decision_step=max(5,min(60,int(os.environ.get("DEEP_DECISION_STEP_MINUTES","15"))))
            decision_stride=max(1,decision_step//5)
            all_decisions=[r for r in candles["5m"] if deep_start <= r["timestamp"]+timedelta(minutes=5) < deep_end]
            decisions=all_decisions[::decision_stride]
            seen_setups=set(); setup_count=0
            for c5 in decisions:
                decision_time=c5["timestamp"]+timedelta(minutes=5)
                data={}
                for tf in candles:
                    if tf=="1mo": idx=bisect.bisect_left(candle_month_keys[tf],(decision_time.year,decision_time.month))
                    else: idx=bisect.bisect_right(candle_times[tf],decision_time-timedelta(microseconds=1))
                    start_idx=max(0,idx-TF_CONTEXT_BARS[tf]); data[tf]=candles[tf][start_idx:idx]
                if any(len(data[tf])<30 for tf in data): continue

                # Historical setup reconstruction: evaluate the same strategy
                # catalog used by the live scanner on a strictly point-in-time
                # six-timeframe snapshot. No future candle can enter data.
                historical_decision_count += 1
                try:
                    catalog_matches=ns["strategy_catalog"](data,symbol,{})
                except Exception as exc:
                    historical_reconstruction_failures.append({
                        "symbol":symbol,
                        "decision_time":decision_time.isoformat(),
                        "stage":"strategy_catalog",
                        "error":f"{type(exc).__name__}: {exc}",
                    })
                    print(f"E2E RECONSTRUCTION ERROR {symbol} {decision_time.isoformat()}: {type(exc).__name__}: {exc}")
                    continue
                if catalog_matches:
                    historical_catalog_candidate_count += 1

                strategy_names=["SMC","Market Structure","Liquidity","Supply/Demand","Price Action","Fibonacci","Trend","RSI+MACD","Session"]
                for candidate_strategy in strategy_names:
                    # Evaluate each strategy independently at the historical decision point.
                    # This is the source of truth for selecting ONE production strategy.
                    strategy_by_tf={
                        tf:[m for m in strategy_signals(data[tf],category) if m.get("name")==candidate_strategy]
                        for tf in data
                    }
                    tf_cons={tf:dominant(strategy_by_tf[tf],1) for tf in strategy_by_tf}
                    monthly=tf_cons["1mo"]
                    if monthly=="NEUTRAL": continue
        
                    # Reproduce the scanner's exact position-timeframe selection:
                    # 5M -> 15M -> 1H -> 4H when the timeframe and its required
                    # context agree; then fall back to the first agreeing timeframe.
                    context_map={"5m":("15m","1h"),"15m":("1h",),"1h":("4h",),"4h":("1d",)}
