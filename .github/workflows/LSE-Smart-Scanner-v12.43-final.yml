            # Inherit explicit E2E dates whenever TCA dates are blank so the cache
            # covers the exact E2E window and no second vault export is needed.
            if start_env and e2e_start_env and start_env != e2e_start_env:
                raise SystemExit('TCA_START and E2E_START must match when TCA+E2E share one tick-export job')
            if end_env and e2e_end_env and end_env != e2e_end_env:
                raise SystemExit('TCA_END and E2E_END must match when TCA+E2E share one tick-export job')
            if not start_env and e2e_start_env: start_env = e2e_start_env
            if not end_env and e2e_end_env: end_env = e2e_end_env
        requested_end = parse_ts(end_env) if end_env else None
        requested_start = parse_ts(start_env) if start_env else None
        
        client = LSE(api_key=api_key, timeout=120)

        # Provider-documented usage endpoint. The SDK 0.14.0 exposes the endpoint
        # through its vault plumbing but does not provide a public usage() wrapper.
        # This is diagnostic only; the hard per-run export cap below remains the
        # primary protection against export-budget exhaustion.
        vault_usage_snapshot = {}
        try:
            vault_usage_snapshot = client._vault_call("/usage")
            print(
                "TCA VAULT USAGE SNAPSHOT: "
                + json.dumps(vault_usage_snapshot, default=str, sort_keys=True)[:2000]
            )
        except Exception as exc:
