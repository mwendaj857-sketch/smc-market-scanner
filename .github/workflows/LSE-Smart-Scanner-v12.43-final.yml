                f"Monthly master bias: {item.get('monthly_bias', 'UNAVAILABLE')}",
                f"Signal timeframe(s): {', '.join(item.get('signal_timeframes', [])) or 'UNAVAILABLE'}",
                f"Execution timeframe: {item.get('position_timeframe', 'UNAVAILABLE')}",
                f"Alignment: {item.get('alignment_chain', {}).get('count', 'UNAVAILABLE')}/6",
                f"Event/news risk: {item.get('event_level', 'UNAVAILABLE')} | {item.get('event_alignment', {}).get('state', 'UNAVAILABLE')}",
                f"RSS risk: {item.get('rss_news_risk', 'UNAVAILABLE')}",
                f"Target distance: {fmt_price(item.get('target_distance_pips'))} pips | FX strength: {item.get('fx_strength_alignment', {}).get('state', 'UNAVAILABLE')}",
            ])
        
        def make_candlestick_chart(item, output_dir):
            """Create an execution-timeframe candlestick chart for confirmed entries only."""
            candles = item.get("chart_candles")
            levels = item.get("levels")
            status = str(item.get("status", ""))
            if status.startswith("WAIT") or status == "NO_ACTION":
                return None
            if not isinstance(candles, list) or len(candles) < 10:
                raise RuntimeError(f"Insufficient chart candles for {item.get('symbol', 'UNKNOWN')}")
            if not isinstance(levels, list) or len(levels) < 3:
                raise RuntimeError(f"Missing Entry/SL/TP levels for {item.get('symbol', 'UNKNOWN')}")
        
            rows = candles[-80:]
            parsed = []
            for row in rows:
                try:
                    ts = str(row["timestamp"])
                    if ts.endswith("Z"):
                        ts = ts[:-1] + "+00:00"
                    dt = datetime.fromisoformat(ts)
                    values = [float(row[k]) for k in ("open", "high", "low", "close")]
                    if not all(math.isfinite(v) for v in values):
                        raise ValueError("non-finite OHLC")
                    parsed.append((dt, *values))
                except Exception as exc:
                    raise RuntimeError(f"Invalid chart candle for {item.get('symbol', 'UNKNOWN')}: {exc}")
        
            dates = [x[0] for x in parsed]
            opens = [x[1] for x in parsed]
            highs = [x[2] for x in parsed]
            lows = [x[3] for x in parsed]
            closes = [x[4] for x in parsed]
            xvals = mdates.date2num(dates)
            width = (xvals[1] - xvals[0]) * 0.68 if len(xvals) > 1 else 0.01
        
            fig, ax = plt.subplots(figsize=(12, 6.8), dpi=150)
            fig.patch.set_facecolor("#0b0f14")
            ax.set_facecolor("#0b0f14")
        
            for x, o, h, l, c in zip(xvals, opens, highs, lows, closes):
                bullish = c >= o
                body_low = min(o, c)
                body_height = max(abs(c - o), 1e-12)
                candle_color = "#22c55e" if bullish else "#ef4444"
                ax.vlines(x, l, h, color=candle_color, linewidth=1.0)
                ax.add_patch(plt.Rectangle(
                    (x - width / 2, body_low), width, body_height,
                    facecolor=candle_color, edgecolor=candle_color,
                    fill=True, alpha=0.85, linewidth=0.8
                ))
        
            entry, sl, tp = [float(v) for v in levels[:3]]
            ax.axhline(entry, color="#3b82f6", linestyle="--", linewidth=1.5, label=f"ENTRY {fmt_price(entry)}")
            ax.axhline(sl, color="#ef4444", linestyle="--", linewidth=1.5, label=f"SL {fmt_price(sl)}")
            ax.axhline(tp, color="#22c55e", linestyle="--", linewidth=1.5, label=f"TP {fmt_price(tp)}")
        
            ax.set_title(
                f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | {item.get('trade_type', 'UNKNOWN')} | {item.get("chart_timeframe", item.get("position_timeframe", "TF")).upper()}",
                fontsize=13, pad=12
            )
            ax.text(
                0.01, 0.98,
                f"Entry {fmt_price(entry)}   SL {fmt_price(sl)}   TP {fmt_price(tp)}   R:R {fmt_rr(item.get('rr'))}",
                transform=ax.transAxes, va="top", fontsize=9
            )
            ax.grid(True, alpha=0.15)
            ax.xaxis_date()
            ax.xaxis.set_major_formatter(mdates.DateFormatter("%d %b\n%H:%M"))
            ax.tick_params(axis="both", labelsize=8)
            ax.legend(loc="upper left", fontsize=8, frameon=False)
            fig.autofmt_xdate()
            fig.tight_layout()
        
            output_dir.mkdir(parents=True, exist_ok=True)
            safe_symbol = str(item.get("symbol", "UNKNOWN")).replace("/", "_").replace(" ", "_")
            path = output_dir / f"{safe_symbol}_{item.get('side', 'NEUTRAL')}.png"
            fig.savefig(path, bbox_inches="tight")
            plt.close(fig)
            return path
        
        def make_currency_strength_chart(currency_data, output_dir):
            ranked = currency_data.get("ranked", []) if isinstance(currency_data, dict) else []
            if not ranked:
                return None
            output_dir.mkdir(parents=True, exist_ok=True)
            labels = [x["currency"] for x in ranked]
            values = [float(x["score"]) for x in ranked]
            fig, ax = plt.subplots(figsize=(10, 5.2), dpi=150)
            ax.bar(labels, values)
            ax.axhline(50.0, linestyle="--", linewidth=1.0)
            ax.set_ylim(0, 100)
            ax.set_ylabel("Relative strength score")
            ax.set_title("LSE Major FX Currency Strength — closed 1H evidence")
            ax.grid(True, axis="y", alpha=0.15)
            fig.tight_layout()
            path = output_dir / "major_fx_currency_strength.png"
            fig.savefig(path, bbox_inches="tight")
            plt.close(fig)
            return path

        def send_message(text):
            api = f"https://api.telegram.org/bot{token}/sendMessage"
            payload = urlencode({
                "chat_id": chat_id,
                "text": text,
                "disable_web_page_preview": "true",
            }).encode("utf-8")
            request = Request(api, data=payload, method="POST")
            with urlopen(request, timeout=30) as response:
                result = json.loads(response.read().decode("utf-8"))
            if not result.get("ok"):
                raise SystemExit(f"Telegram API rejected message: {result}")
        
        def send_photo(path, caption):
            # Telegram sendPhoto uses multipart/form-data; keep the implementation
            # dependency-free so the workflow does not need python-telegram-bot.
            boundary = "----LSEScannerBoundary7f9d"
            fields = {"chat_id": chat_id, "caption": caption[:1024]}
            body = bytearray()
            for name, value in fields.items():
                body.extend(f"--{boundary}\r\n".encode())
                body.extend(f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode())
                body.extend(str(value).encode("utf-8"))
                body.extend(b"\r\n")
            body.extend(f"--{boundary}\r\n".encode())
            body.extend(b'Content-Disposition: form-data; name="photo"; filename="signal_chart.png"\r\n')
            body.extend(b"Content-Type: image/png\r\n\r\n")
            body.extend(Path(path).read_bytes())
            body.extend(b"\r\n")
            body.extend(f"--{boundary}--\r\n".encode())
        
            api = f"https://api.telegram.org/bot{token}/sendPhoto"
            request = Request(
                api,
                data=bytes(body),
                headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                method="POST",
            )
            with urlopen(request, timeout=60) as response:
                result = json.loads(response.read().decode("utf-8"))
            if not result.get("ok"):
                raise SystemExit(f"Telegram API rejected chart: {result}")
        
        sections = []
        confirmed_items = []
        buckets = [
            ("INTRADAY", data.get("intraday_entries", [])),
            ("SCALP", data.get("scalp_entries", [])),
            ("SWING/HOLD", data.get("swing_entries", [])),
            ("ADAPTIVE PRICE-MOVEMENT", data.get("adaptive_entries", [])),
        ]
        for label, items in buckets:
            if items:
                sections.append(f"🎯 CONFIRMED {label}")
                for item in items[:5]:
                    sections.append(confirmed_line(item))
                    confirmed_items.append(item)
        
        if not sections:
            sections.append("⏸️ NO_ACTION")
            sections.append(
                "No setup currently satisfies the strategy, alignment, structural, risk, and execution gates. "
                "the monthly master-bias and timeframe-agreement gates."
            )
        
        sniper_items = data.get("sniper_opportunities", [])[:5]
        if sniper_items:
            sections.append("🔎 PRECISION OPPORTUNITIES — POTENTIAL ONLY")
            for item in sniper_items:
                s = item.get("sniper") or {}
                zone = s.get("entry_zone") or []
                zone_text = "–".join(fmt_price(x) for x in zone) if zone else "UNAVAILABLE"
                sections.append(
                    f"{item.get('symbol','UNKNOWN')} | {s.get('side','NEUTRAL')} | {'POTENTIAL_BUY' if s.get('side') == 'BUY' else 'POTENTIAL_SELL' if s.get('side') == 'SELL' else 'NO_ACTION'} | "
                    f"Score {fmt_score(s.get('score'))} | R:R {fmt_rr(s.get('rr'))}\n"
                    f"Entry {fmt_price(s.get('entry'))} | SL {fmt_price(s.get('sl'))} | TP1 {fmt_price(s.get('tp'))}\n"
                    f"Entry zone {zone_text} | Sweep {bool(s.get('liquidity_sweep'))} | "
                    f"Displacement {s.get('displacement')} | MSS {s.get('mss')} | FVG {s.get('fvg_signal')} | HTF agree {s.get('higher_tf_agrees')}"
                )
        
        waiting = data.get("setup_waiting", [])[:3]
        potential = data.get("potential", [])[:3]
        if waiting:
            sections.append("⏳ WAITING_FOR_TRIGGER")
            for item in waiting:
                sections.append(
                    f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                    f"{item.get('trade_type', 'UNKNOWN')}\n"
                    f"Strategy score: {fmt_score(item.get('strategy_score'))} | "
                    f"Execution quality: {fmt_score(item.get('execution_quality_score'))}\n"
                    "Status: WAITING_FOR_TRIGGER\n"
                    f"Reason: {'; '.join(item.get('blockers', [])[:2]) or 'execution/risk condition incomplete'}"
                )
        if potential:
            sections.append("👀 POTENTIAL SETUPS")
            for item in potential:
                sections.append(
                    f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                    f"{item.get('trade_type', 'UNKNOWN')}\n"
                    "Status: " + str(item.get("status") or ("POTENTIAL_BUY" if item.get("side") == "BUY" else "POTENTIAL_SELL" if item.get("side") == "SELL" else "NO_ACTION"))
                )
        
        intel = data.get("intelligence", {})
        news_count = data.get("rss_items", len(intel.get("news", [])) if isinstance(intel, dict) else 0)
        sections.append(
            f"📰 RSS intelligence: ACTIVE | {news_count} item(s) | "
            f"feeds configured: {data.get('rss_feeds_configured', 0)}"
        )
        sections.append(
            f"📊 Scan: {data.get('complete', 0)} fully analyzed | "
            f"{data.get('errors', 0)} analysis errors"
        )
        ff = data.get("fast_filter", {})
        sections.append(
            f"⚡ Fast filter: {ff.get('scanned', 0)} scanned -> {ff.get('promoted', 0)} deep analyzed | "
            f"{ff.get('watch_only', 0)} watch-only"
        )
        sections.append(
            f"🧠 HISTORICAL STRATEGY: {ACTIVE_STRATEGY_NAME or 'NONE'} | "
            f"status={HISTORICAL_STRATEGY_STATUS} | {HISTORICAL_STRATEGY_REASON}"
        )
        cal_meta = data.get("execution_calibration", {}) if isinstance(data.get("execution_calibration", {}), dict) else {}
        sections.append(
            f"🧪 Execution calibration: {cal_meta.get('source', 'static_default')} | "
            f"confirmed ≥ {float(cal_meta.get('min_confirmed_score', 70.0)):.1f} | "
            f"high-quality ≥ {float(cal_meta.get('high_quality_score', 85.0)):.1f}"
        )
        fast_entries = ff.get("candidates", [])[:TOP_N]
        if fast_entries:
            sections.append("⚡ FAST FILTER ENTRY PLANS — CONDITIONAL / NOT CONFIRMED")
            for item in fast_entries:
                sections.append(
                    f"{item.get('symbol','UNKNOWN')} | {item.get('side','NEUTRAL')} | SCORE {fmt_score(item.get('score'))}\n"
                    f"Entry {fmt_price(item.get('entry_price'))} | SL {fmt_price(item.get('stop_loss'))} | TP {fmt_price(item.get('take_profit'))} | R:R {fmt_rr(item.get('rr'))}\n"
                    f"Entry state: {item.get('entry_status','UNAVAILABLE')} | basis: CLOSED-CANDLE trigger"
                )
        strength = data.get("currency_strength", {}).get("ranked", []) if isinstance(data.get("currency_strength", {}), dict) else []
        if strength:
            sections.append("💱 MAJOR FX CURRENCY STRENGTH — 1H")
            sections.append(" | ".join(f"{x.get('currency')} {float(x.get('score', 0)):.0f}/100" for x in strength))
        sections.append("🤖 Automatic trading: DISABLED")
        
        header = "📡 LSE SMART SIGNAL SCANNER v12.42"
        body = header + "\n\n" + "\n\n".join(sections)
        
        # Send text first, preserving the explicit WAIT/POTENTIAL non-entry wording.
        chunks = []
        current = ""
        for section in body.split("\n\n"):
            candidate = section if not current else current + "\n\n" + section
            if len(candidate) <= 4000:
                current = candidate
            else:
                if current:
                    chunks.append(current)
                while len(section) > 4000:
                    chunks.append(section[:4000])
                    section = section[4000:]
                current = section
        if current:
            chunks.append(current)
        
        for chunk in chunks:
            send_message(chunk)
        
        chart_dir = Path("telegram_charts")
        sent_charts = 0
        chart_items = []
        chart_items.extend(confirmed_items)
        chart_items.extend(data.get("potential", [])[:2])
        chart_items.extend(data.get("sniper_opportunities", [])[:2])
        seen_chart_keys = set()
        for item in chart_items:
            key = (item.get("symbol"), item.get("side"), item.get("status"))
            if key in seen_chart_keys:
                continue
            seen_chart_keys.add(key)
            try:
                chart_path = make_candlestick_chart(item, chart_dir)
            except Exception as exc:
                print(f"Telegram chart warning {item.get('symbol','UNKNOWN')}: {type(exc).__name__}: {exc}")
                continue
            if chart_path is None:
                continue
            confirmed = str(item.get("status","")).startswith("CONFIRMED ")
            prefix = "🕯️ CONFIRMED" if confirmed else "👀 POTENTIAL — NOT CONFIRMED"
            levels = item.get("levels") or []
            if len(levels) >= 3:
                caption = (
                    f"{prefix} {item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                    f"{item.get('trade_type', 'UNKNOWN')}\n"
                    f"Entry {fmt_price(levels[0])} | SL {fmt_price(levels[1])} | TP {fmt_price(levels[2])} | R:R {fmt_rr(item.get('rr'))}"
                )
            else:
                caption = f"{prefix} {item.get('symbol','UNKNOWN')} | {item.get('side','NEUTRAL')}"
            send_photo(chart_path, caption)
            sent_charts += 1

        strength_chart = make_currency_strength_chart(data.get("currency_strength", {}), chart_dir)
        if strength_chart:
            send_photo(strength_chart, "💱 MAJOR FX CURRENCY STRENGTH | Relative closed-1H ranking | informational, not an entry")
            sent_charts += 1

        print(f"Telegram delivery: PASS ({len(chunks)} text message(s), {sent_charts} chart(s))")
        PY
    - name: Upload scanner results
