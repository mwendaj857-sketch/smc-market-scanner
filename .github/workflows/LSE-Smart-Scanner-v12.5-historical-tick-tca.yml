                  sides = [side_score(maps, side) for side in ("BUY","SELL")]
                  sides = [x for x in sides if x["strategy_count"] >= 2 and x["local_consensus_tfs"]]
                  if not sides:
                      continue
                  best = max(sides, key=lambda x:(x["score"], x["strategy_count"], len(x["local_consensus_tfs"])))
                  fast_plan = candidate_plan(item["rows"]["15m"], best["side"], current_price=None)
                  fast_quote = {"ticks": fast_live_raw.get(symbol, [])}
                  fast_trigger = execution_trigger_state(item["rows"]["15m"], fast_quote, best["side"])
                  best.update({"symbol":symbol,"category":category,"entry_plan":fast_plan,
                               "execution_model":fast_trigger,
                               "entry_price":fast_plan.get("entry") if fast_plan else None,
                               "stop_loss":fast_plan.get("sl") if fast_plan else None,
                               "take_profit":fast_plan.get("tp") if fast_plan else None,
                               "rr":fast_plan.get("rr") if fast_plan else None,
                               "entry_status":fast_trigger.get("state") if fast_trigger.get("state") else (fast_plan.get("status") if fast_plan else "UNAVAILABLE"),
                               "entry_basis":"15M closed-candle breakout trigger; live LSE bid/ask determines executable readiness; forming candle never votes"})
                  if best["score"] >= FAST_MIN_SCORE:
