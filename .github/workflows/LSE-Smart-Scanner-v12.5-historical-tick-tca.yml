              ax.tick_params(axis="both", labelsize=8)
              ax.legend(loc="upper left", fontsize=8, frameon=False)
              fig.autofmt_xdate()
              fig.tight_layout()

              output_dir.mkdir(parents=True, exist_ok=True)
              safe_symbol = str(item.get("symbol", "UNKNOWN")).replace("/", "_").replace(" ", "_")
              path = output_dir / f"{safe_symbol}_{item.get('side', 'NEUTRAL')}.png"
              fig.savefig(path, bbox_inches="tight")
              plt.close(fig)
              return path

          def send_message(text):
              api = f"https://api.telegram.org/bot{token}/sendMessage"
              payload = urlencode({
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = Request(api, data=payload, method="POST")
              with urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit(f"Telegram API rejected message: {result}")

          def send_photo(path, caption):
              # Telegram sendPhoto uses multipart/form-data; keep the implementation
              # dependency-free so the workflow does not need python-telegram-bot.
              boundary = "----LSEScannerBoundary7f9d"
              fields = {"chat_id": chat_id, "caption": caption[:1024]}
              body = bytearray()
              for name, value in fields.items():
                  body.extend(f"--{boundary}\r\n".encode())
                  body.extend(f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode())
                  body.extend(str(value).encode("utf-8"))
                  body.extend(b"\r\n")
              body.extend(f"--{boundary}\r\n".encode())
              body.extend(b'Content-Disposition: form-data; name="photo"; filename="signal_chart.png"\r\n')
              body.extend(b"Content-Type: image/png\r\n\r\n")
              body.extend(Path(path).read_bytes())
              body.extend(b"\r\n")
              body.extend(f"--{boundary}--\r\n".encode())

              api = f"https://api.telegram.org/bot{token}/sendPhoto"
              request = Request(
                  api,
                  data=bytes(body),
                  headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                  method="POST",
              )
              with urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit(f"Telegram API rejected chart: {result}")

          sections = []
          confirmed_items = []
          buckets = [
              ("INTRADAY", data.get("intraday_entries", [])),
              ("SCALP", data.get("scalp_entries", [])),
              ("SWING/HOLD", data.get("swing_entries", [])),
              ("ADAPTIVE PRICE-MOVEMENT", data.get("adaptive_entries", [])),
          ]
          for label, items in buckets:
              if items:
                  sections.append(f"🎯 CONFIRMED {label}")
                  for item in items[:5]:
                      sections.append(confirmed_line(item))
                      confirmed_items.append(item)

          if not sections:
              sections.append("⛔ NO CONFIRMED ENTRY")
              sections.append(
                  "No signal passed the 2-of-9 / 3-method route together with "
                  "the monthly master-bias and timeframe-agreement gates."
              )

          sniper_items = data.get("sniper_opportunities", [])[:5]
          if sniper_items:
              sections.append("🎯 SNIPER PRECISION OPPORTUNITIES")
              for item in sniper_items:
                  s = item.get("sniper") or {}
                  zone = s.get("entry_zone") or []
                  zone_text = "–".join(fmt_price(x) for x in zone) if zone else "UNAVAILABLE"
                  sections.append(
                      f"{item.get('symbol','UNKNOWN')} | {s.get('side','NEUTRAL')} | {s.get('status','WATCH')} | "
                      f"Score {fmt_score(s.get('score'))} | R:R {fmt_rr(s.get('rr'))}\n"
                      f"Entry {fmt_price(s.get('entry'))} | SL {fmt_price(s.get('sl'))} | TP1 {fmt_price(s.get('tp'))}\n"
                      f"Entry zone {zone_text} | Sweep {bool(s.get('liquidity_sweep'))} | "
                      f"Displacement {s.get('displacement')} | MSS {s.get('mss')} | FVG {s.get('fvg_signal')} | HTF agree {s.get('higher_tf_agrees')}"
                  )

          waiting = data.get("setup_waiting", [])[:3]
          potential = data.get("potential", [])[:3]
          if waiting:
              sections.append("🟡 WAIT — NOT CONFIRMED / NOT AN ENTRY")
              for item in waiting:
                  sections.append(
                      f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                      f"{item.get('trade_type', 'UNKNOWN')}\n"
                      f"Strategy score: {fmt_score(item.get('strategy_score'))} | "
                      f"Execution quality: {fmt_score(item.get('execution_quality_score'))}\n"
                      "Status: WAIT — NOT CONFIRMED / NOT AN ENTRY\n"
                      f"Reason: {'; '.join(item.get('blockers', [])[:2]) or 'execution/risk condition incomplete'}"
                  )
          if potential:
              sections.append("👀 POTENTIAL — NOT CONFIRMED")
              for item in potential:
                  sections.append(
                      f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                      f"{item.get('trade_type', 'UNKNOWN')}\n"
                      "Status: POTENTIAL — NOT CONFIRMED / NOT AN ENTRY"
                  )

          intel = data.get("intelligence", {})
          news_count = data.get("rss_items", len(intel.get("news", [])) if isinstance(intel, dict) else 0)
          sections.append(
              f"📰 RSS intelligence: ACTIVE | {news_count} item(s) | "
              f"feeds configured: {data.get('rss_feeds_configured', 0)}"
          )
          sections.append(
              f"📊 Scan: {data.get('complete', 0)} fully analyzed | "
              f"{data.get('errors', 0)} analysis errors"
          )
          ff = data.get("fast_filter", {})
          sections.append(
              f"⚡ Fast filter: {ff.get('scanned', 0)} scanned -> {ff.get('promoted', 0)} deep analyzed | "
              f"{ff.get('watch_only', 0)} watch-only"
          )
          fast_entries = ff.get("candidates", [])[:TOP_N]
          if fast_entries:
              sections.append("⚡ FAST FILTER ENTRY PLANS — CONDITIONAL / NOT CONFIRMED")
              for item in fast_entries:
                  sections.append(
                      f"{item.get('symbol','UNKNOWN')} | {item.get('side','NEUTRAL')} | SCORE {fmt_score(item.get('score'))}\n"
                      f"Entry {fmt_price(item.get('entry_price'))} | SL {fmt_price(item.get('stop_loss'))} | TP {fmt_price(item.get('take_profit'))} | R:R {fmt_rr(item.get('rr'))}\n"
                      f"Entry state: {item.get('entry_status','UNAVAILABLE')} | basis: CLOSED-CANDLE trigger"
                  )
          sections.append("🤖 Automatic trading: DISABLED")

          header = "📡 LSE SMART SIGNAL SCANNER v12.5"
          body = header + "\n\n" + "\n\n".join(sections)

          # Send text first, preserving the explicit WAIT/POTENTIAL non-entry wording.
          chunks = []
          current = ""
          for section in body.split("\n\n"):
              candidate = section if not current else current + "\n\n" + section
              if len(candidate) <= 4000:
                  current = candidate
              else:
                  if current:
                      chunks.append(current)
                  while len(section) > 4000:
                      chunks.append(section[:4000])
                      section = section[4000:]
                  current = section
          if current:
              chunks.append(current)

          for chunk in chunks:
              send_message(chunk)

          # Only CONFIRMED entries get a chart. WAIT and POTENTIAL are never rendered
          # as trade charts, so Telegram cannot visually imply a confirmed trade.
          chart_dir = Path("telegram_charts")
          sent_charts = 0
          for item in confirmed_items:
              chart_path = make_candlestick_chart(item, chart_dir)
              caption = (
                  f"🕯️ CONFIRMED {item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                  f"{item.get('trade_type', 'UNKNOWN')}\n"
                  f"Entry {fmt_price(item['levels'][0])} | SL {fmt_price(item['levels'][1])} | TP {fmt_price(item['levels'][2])} | R:R {fmt_rr(item.get('rr'))}"
              )
              send_photo(chart_path, caption)
              sent_charts += 1

          print(f"Telegram delivery: PASS ({len(chunks)} text message(s), {sent_charts} chart(s))")
          PY

      - name: Upload scanner results
        if: ${{ success() && hashFiles('scan_results.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: scanner-results
          path: scan_results.json
          if-no-files-found: error

  tca_replay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tca == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      TCA_SYMBOLS: ${{ inputs.tca_symbols }}
      TCA_START: ${{ inputs.tca_start }}
      TCA_END: ${{ inputs.tca_end }}
      TCA_HORIZON_MINUTES: ${{ inputs.tca_horizon_minutes }}
      TCA_OBSERVATION_SECONDS: ${{ inputs.tca_observation_seconds }}
      TCA_MAX_SETUPS: ${{ inputs.tca_max_setups }}
      TCA_MIN_TICKS: ${{ inputs.tca_min_ticks }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TCA replay dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "lse-data[frames]==0.14.0" "pandas>=2.0,<3" "pyarrow>=15,<23"

      - name: Historical tick replay + execution TCA
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import math
          import os
          import statistics
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone

          from lse import LSE, LSEError

          def now_utc():
              return datetime.now(timezone.utc)

          def parse_ts(value):
              if isinstance(value, datetime):
                  dt = value
              else:
                  s = str(value).strip()
                  if s.endswith("Z"):
                      s = s[:-1] + "+00:00"
                  dt = datetime.fromisoformat(s)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          def fnum(value):
              try:
                  x = float(value)
                  return x if math.isfinite(x) else None
              except (TypeError, ValueError):
                  return None

          def rows_from_history(obj):
              # lse-data[frames] returns a DataFrame for history(); the fallback
              # keeps the replay compatible with list/dict rows if the SDK changes.
              if hasattr(obj, "to_dict"):
                  return obj.to_dict(orient="records")
              if isinstance(obj, dict):
                  for key in ("data", "rows", "ticks"):
                      if isinstance(obj.get(key), list):
                          return obj[key]
              if isinstance(obj, (list, tuple)):
                  return list(obj)
              return []

          def normalize_ticks(raw):
              out = []
              for row in rows_from_history(raw):
                  if not isinstance(row, dict):
                      continue
                  ts = row.get("timestamp", row.get("ts", row.get("datetime")))
                  bid = fnum(row.get("bid"))
                  ask = fnum(row.get("ask"))
                  price = fnum(row.get("price", row.get("last")))
                  volume = fnum(row.get("volume")) or 0.0
                  if ts is None or bid is None or ask is None:
                      continue
                  if bid <= 0 or ask <= 0 or ask < bid:
                      continue
                  try:
                      dt = parse_ts(ts)
                  except Exception:
                      continue
                  out.append({"timestamp": dt, "bid": bid, "ask": ask,
                              "price": price or (bid + ask) / 2.0, "volume": volume})
              out.sort(key=lambda x: x["timestamp"])
              return out

          def normalize_candles(raw):
              out = []
              for row in rows_from_history(raw):
                  if not isinstance(row, dict):
                      continue
                  ts = row.get("timestamp", row.get("time", row.get("datetime")))
                  vals = [fnum(row.get(k)) for k in ("open", "high", "low", "close")]
                  if ts is None or any(v is None for v in vals):
                      continue
                  try:
                      dt = parse_ts(ts)
                  except Exception:
                      continue
                  out.append({"timestamp": dt, "open": vals[0], "high": vals[1],
                              "low": vals[2], "close": vals[3],
                              "volume": fnum(row.get("volume")) or 0.0})
              out.sort(key=lambda x: x["timestamp"])
              return out

          def atr(rows, period=14):
              if len(rows) <= period:
                  return None
              trs = []
              for i in range(1, len(rows)):
                  h, l, pc = rows[i]["high"], rows[i]["low"], rows[i-1]["close"]
                  trs.append(max(h-l, abs(h-pc), abs(l-pc)))
              return statistics.fmean(trs[-period:]) if trs else None

          def swings(rows, lookback=2):
              highs, lows = [], []
              for i in range(lookback, len(rows)-lookback):
                  h, l = rows[i]["high"], rows[i]["low"]
                  if h == max(x["high"] for x in rows[i-lookback:i+lookback+1]):
                      highs.append((i, h))
                  if l == min(x["low"] for x in rows[i-lookback:i+lookback+1]):
                      lows.append((i, l))
              return highs, lows

          def closed_breakout_level(rows, side, window=40, lookback=2):
              if not rows:
                  return None
              sample = rows[-window:]
              last = sample[-1]
              highs, lows = swings(sample, lookback)
              if side == "BUY":
                  return max(last["high"], float(highs[-1][1]) if highs else last["high"])
              if side == "SELL":
                  return min(last["low"], float(lows[-1][1]) if lows else last["low"])
              return None

          def levels(rows, side, entry):
              a = atr(rows)
              if not a or a <= 0:
                  return None
              highs, lows = swings(rows[-100:], 2)
              price = float(entry)
              if side == "BUY":
                  stop_candidates = [x[1] for x in lows if x[1] < price]
                  targets = sorted(set(x[1] for x in highs if x[1] > price))
                  if not stop_candidates or not targets:
                      return None
                  sl = max(stop_candidates[-3:]) - 0.25 * a
                  tp = targets[0]
              else:
                  stop_candidates = [x[1] for x in highs if x[1] > price]
                  targets = sorted(set(x[1] for x in lows if x[1] < price), reverse=True)
                  if not stop_candidates or not targets:
                      return None
                  sl = min(stop_candidates[-3:]) + 0.25 * a
                  tp = targets[0]
              risk = abs(price-sl)
              reward = abs(tp-price)
              if risk <= 0:
                  return None
              return {"entry":price, "sl":sl, "tp":tp, "atr":a,
                      "rr":reward/risk, "risk":risk}

          def prediction(snapshot, side, trigger, atr_value, asof):
              if side not in ("BUY","SELL") or not snapshot or not atr_value:
                  return None
              # The snapshot represents the same bounded observation period used by
              # the live scanner. The decision is made at the final observed tick,
              # so no tick after decision_time may influence the prediction.
              valid = list(snapshot)
              if len(valid) < MIN_TICKS:
                  return None
              latest = valid[-1]
              bid, ask = latest["bid"], latest["ask"]
              mids = [(x["bid"]+x["ask"])/2.0 for x in valid]
              spreads = [x["ask"]-x["bid"] for x in valid]
              mid = (bid+ask)/2.0
              spread = ask-bid
              median_spread = statistics.median(spreads)
              executable = ask if side == "BUY" else bid
              crossed = executable >= trigger if side == "BUY" else executable <= trigger
              spread_atr = spread/atr_value
              spread_bps = spread/max(mid, 1e-12)*10000.0
              spread_vs_median = spread/max(median_spread, 1e-12)
              micro_moves = [abs(mids[i]-mids[i-1])/atr_value for i in range(1,len(mids))]
              micro_move = statistics.median(micro_moves) if micro_moves else 0.0
              chase = abs(executable-trigger)/atr_value
              slippage_proxy = (spread/2.0)/atr_value + max(0.0, micro_move)
              score = 100.0
              reasons = []
              if spread_atr > MAX_SPREAD_ATR:
                  score -= 25.0; reasons.append("wide_spread")
              if spread_vs_median > MAX_SPREAD_MEDIAN_MULTIPLIER:
                  score -= 20.0; reasons.append("spread_vs_median")
              if micro_move > EXECUTION_STABILITY_MAX_ATR_PER_TICK:
                  score -= 20.0; reasons.append("unstable_microstructure")
              if chase > ENTRY_MAX_CHASE_ATR:
                  score -= 30.0; reasons.append("overextended")
              if len(valid) < MIN_TICKS:
                  score -= 15.0; reasons.append("insufficient_ticks")
              score = max(0.0, min(100.0, score))
              state = "OVEREXTENDED" if crossed and chase > ENTRY_MAX_CHASE_ATR else (
                      "EXECUTABLE_TRIGGER_CROSSED" if crossed else "WAITING_FOR_TRIGGER")
              return {
                  "state": state, "prediction_time": valid[-1]["timestamp"].isoformat(), "decision_time": valid[-1]["timestamp"].isoformat(),
                  "executable_price": executable, "bid": bid, "ask": ask, "mid": mid,
                  "spread": spread, "spread_bps": spread_bps,
                  "spread_atr": spread_atr, "spread_vs_median": spread_vs_median,
                  "micro_move_atr_per_tick": micro_move, "chase_distance_atr": chase,
                  "slippage_proxy_atr": slippage_proxy, "execution_score": round(score,1),
                  "tick_count": len(valid), "reasons": reasons
              }

          def tick_slice(ticks, tick_times, start, end):
              lo = bisect.bisect_left(tick_times, start)
              hi = bisect.bisect_right(tick_times, end)
              return ticks[lo:hi]

          def first_cross(ticks, tick_times, start, end, side, trigger):
              lo = bisect.bisect_left(tick_times, start)
              hi = bisect.bisect_right(tick_times, end)
              for t in ticks[lo:hi]:
                  executable = t["ask"] if side == "BUY" else t["bid"]
                  if (side == "BUY" and executable >= trigger) or (side == "SELL" and executable <= trigger):
                      return t
              return None

          def markout(ticks, tick_times, fill_time, side, fill_price, horizon_seconds):
              end = fill_time + timedelta(seconds=horizon_seconds)
              future = tick_slice(ticks, tick_times, fill_time, end)
              if not future:
                  return None
              # Exit is the opposite executable side: BID for a long, ASK for a short.
              exits = [(t["bid"] if side == "BUY" else t["ask"]) for t in future]
              if side == "BUY":
                  mfe = max(exits) - fill_price
                  mae = min(exits) - fill_price
                  final = exits[-1] - fill_price
              else:
                  mfe = fill_price - min(exits)
                  mae = fill_price - max(exits)
                  final = fill_price - exits[-1]
              return {"mfe":mfe, "mae":mae, "final":final, "ticks":len(future)}

          def hit_order(ticks, tick_times, fill_time, side, sl, tp, horizon_seconds):
              end = fill_time + timedelta(seconds=horizon_seconds)
              for t in tick_slice(ticks, tick_times, fill_time, end):
                  exit_px = t["bid"] if side == "BUY" else t["ask"]
                  if side == "BUY":
                      if exit_px <= sl:
                          return "SL_FIRST", t
                      if exit_px >= tp:
                          return "TP_FIRST", t
                  else:
                      if exit_px >= sl:
                          return "SL_FIRST", t
                      if exit_px <= tp:
                          return "TP_FIRST", t
              return "NEITHER", None

          def bucket(score):
              if score < 50: return "0-49"
              if score < 70: return "50-69"
              if score < 85: return "70-84"
              return "85-100"

          # Configuration with safety bounds.
          api_key = os.environ.get("LSE_API_KEY", "").strip()
          if not api_key:
              raise SystemExit("TCA replay requires LSE_API_KEY")
          symbols = [x.strip() for x in os.environ.get("TCA_SYMBOLS","").split(",") if x.strip()]
          if not symbols:
              raise SystemExit("TCA replay requires at least one symbol")
          try:
              horizon_minutes = max(5, min(240, int(os.environ.get("TCA_HORIZON_MINUTES","60"))))
              observation_seconds = max(1, min(30, int(os.environ.get("TCA_OBSERVATION_SECONDS","4"))))
              max_setups = max(20, min(5000, int(os.environ.get("TCA_MAX_SETUPS","500"))))
              min_ticks = max(2, min(100, int(os.environ.get("TCA_MIN_TICKS","3"))))
          except ValueError as exc:
              raise SystemExit(f"Invalid TCA numeric configuration: {exc}")
          MIN_TICKS = min_ticks
          MAX_SPREAD_ATR = 0.35
          MAX_SPREAD_MEDIAN_MULTIPLIER = 2.50
          EXECUTION_STABILITY_MAX_ATR_PER_TICK = 0.12
          ENTRY_BUFFER_ATR = 0.10
          ENTRY_MAX_CHASE_ATR = 0.50

          end_env = os.environ.get("TCA_END","").strip()
          start_env = os.environ.get("TCA_START","").strip()
          end_dt = parse_ts(end_env) if end_env else now_utc()
          start_dt = parse_ts(start_env) if start_env else end_dt - timedelta(hours=24)
          if end_dt <= start_dt:
              raise SystemExit("TCA_END must be later than TCA_START")
          if (end_dt - start_dt).total_seconds() > 7*86400:
              raise SystemExit("TCA replay is capped at 7 days per manual run; split longer studies into separate runs")

          client = LSE(api_key=api_key)
          observations = []
          failures = []

          for symbol in symbols:
              print(f"TCA REPLAY {symbol}: loading raw tick tape {start_dt.isoformat()} -> {end_dt.isoformat()}")
              try:
                  raw_ticks = client.history(symbol, start=start_dt.isoformat(), end=end_dt.isoformat())
                  ticks = normalize_ticks(raw_ticks)
              except Exception as exc:
                  failures.append({"symbol":symbol, "stage":"ticks", "error":f"{type(exc).__name__}: {exc}"})
                  print(f"TCA ERROR {symbol} ticks: {type(exc).__name__}: {exc}")
                  continue
              tick_times = [t["timestamp"] for t in ticks]
              print(f"TCA REPLAY {symbol}: {len(ticks)} valid bid/ask ticks")
              if len(ticks) < 100:
                  failures.append({"symbol":symbol, "stage":"ticks", "error":"insufficient valid tick history"})
                  continue

              # Pull 5m candles with a lookback so ATR and structural swings are known
              # at every historical decision point. This is execution replay, not a
              # replacement for the nine-strategy directional backtest.
              lookback_start = start_dt - timedelta(hours=12)
              try:
                  raw_candles = client.candles(symbol, "5m",
                                               start=lookback_start.isoformat(),
                                               end=end_dt.isoformat())
                  candles = normalize_candles(raw_candles)
              except Exception as exc:
                  failures.append({"symbol":symbol, "stage":"candles", "error":f"{type(exc).__name__}: {exc}"})
                  print(f"TCA ERROR {symbol} candles: {type(exc).__name__}: {exc}")
                  continue

              if len(candles) < 60:
                  failures.append({"symbol":symbol, "stage":"candles", "error":"insufficient 5m candle history"})
                  continue

              tick_i = 0
              setup_count = 0
              for i in range(50, len(candles)-1):
                  candle = candles[i]
                  asof = candle["timestamp"] + timedelta(minutes=5)
                  if asof < start_dt or asof >= end_dt:
                      continue
                  # Only use ticks after the candle is closed. No future tick is used
                  # in the trigger, ATR, SL/TP or predicted execution score.
                  while tick_i < len(ticks) and ticks[tick_i]["timestamp"] < asof:
                      tick_i += 1
                  if tick_i >= len(ticks):
                      break

                  history_rows = candles[:i+1]
                  a = atr(history_rows)
                  if not a or a <= 0:
                      continue

                  for side in ("BUY","SELL"):
                      reference = closed_breakout_level(history_rows, side)
                      if reference is None:
                          continue
                      trigger = reference + a*ENTRY_BUFFER_ATR if side == "BUY" else reference - a*ENTRY_BUFFER_ATR
                      plan = levels(history_rows, side, trigger)
                      if not plan or plan["rr"] < 1.0:
                          continue

                      obs_end = min(end_dt, asof + timedelta(seconds=observation_seconds))
                      snapshot = []
                      j = tick_i
                      while j < len(ticks) and ticks[j]["timestamp"] <= obs_end:
                          snapshot.append(ticks[j]); j += 1
                      pred = prediction(snapshot, side, trigger, a, asof)
                      if pred is None:
                          continue

                      decision_time = parse_ts(pred["decision_time"])
                      future_end = min(end_dt, decision_time + timedelta(minutes=horizon_minutes))
                      if pred["state"] == "EXECUTABLE_TRIGGER_CROSSED":
                          # The live model would treat the latest observed executable
                          # quote as the decision-time fill candidate.
                          cross = snapshot[-1]
                      else:
                          cross = first_cross(ticks, tick_times, decision_time, future_end, side, trigger)
                      row = {
                          "symbol":symbol, "asof":asof.isoformat(), "decision_time":pred["decision_time"], "side":side,
                          "trigger":trigger, "atr":a, "planned_sl":plan["sl"], "planned_tp":plan["tp"],
                          "planned_rr":plan["rr"], "prediction_state":pred["state"],
                          "predicted_execution_score":pred["execution_score"],
                          "predicted_spread_bps":pred["spread_bps"],
                          "predicted_spread_atr":pred["spread_atr"],
                          "predicted_slippage_proxy_atr":pred["slippage_proxy_atr"],
                          "predicted_chase_atr":pred["chase_distance_atr"],
                          "predicted_tick_count":pred["tick_count"],
                          "trigger_crossed_within_horizon":bool(cross),
                          "fill_time":None, "fill_price":None,
                          "realized_entry_slippage_atr":None,
                          "realized_spread_bps":None,
                          "markout_5m_bps":None, "markout_15m_bps":None,
                          "markout_60m_bps":None,
                          "mfe_r":None, "mae_r":None,
                          "outcome_1r":None, "tp_or_sl_first":None,
                      }
                      if cross:
                          fill_time = cross["timestamp"]
                          fill_price = cross["ask"] if side == "BUY" else cross["bid"]
                          fill_mid = (cross["bid"]+cross["ask"])/2.0
                          row["fill_time"] = fill_time.isoformat()
                          row["fill_price"] = fill_price
                          row["realized_entry_slippage_atr"] = abs(fill_price-trigger)/a
                          row["realized_spread_bps"] = (cross["ask"]-cross["bid"])/max(fill_mid,1e-12)*10000.0
                          for mins, key in ((5,"markout_5m_bps"),(15,"markout_15m_bps"),(60,"markout_60m_bps")):
                              if mins*60 <= horizon_minutes:
                                  mo = markout(ticks, tick_times, fill_time, side, fill_price, mins*60)
                                  if mo:
                                      denom = max(fill_price,1e-12)
                                      row[key] = (mo["final"]/denom)*10000.0
                                      if mins == 5:
                                          row["mfe_r"] = mo["mfe"]/max(plan["risk"],1e-12)
                                          row["mae_r"] = mo["mae"]/max(plan["risk"],1e-12)
                          outcome, outcome_tick = hit_order(ticks, tick_times, fill_time, side, plan["sl"], plan["tp"], horizon_minutes*60)
                          row["tp_or_sl_first"] = outcome
                          if outcome == "TP_FIRST":
                              row["outcome_1r"] = "WIN"
                          elif outcome == "SL_FIRST":
                              row["outcome_1r"] = "LOSS"
                          else:
                              row["outcome_1r"] = "OPEN_AT_HORIZON"
                      observations.append(row)
                      setup_count += 1
                      if setup_count >= max_setups:
                          break
                  if setup_count >= max_setups:
                      break

              print(f"TCA REPLAY {symbol}: {setup_count} historical setup snapshots evaluated")

          # Calibration statistics.
          def mean(values):
              vals = [float(x) for x in values if x is not None and math.isfinite(float(x))]
              return statistics.fmean(vals) if vals else None

          def rate(values, positive):
              vals = [x for x in values if x is not None]
              return (sum(1 for x in vals if x == positive)/len(vals)*100.0) if vals else None

          buckets = defaultdict(list)
          for row in observations:
              buckets[bucket(float(row["predicted_execution_score"]))].append(row)

          bucket_summary = {}
          for name in ("0-49","50-69","70-84","85-100"):
              rows = buckets.get(name, [])
              bucket_summary[name] = {
                  "observations":len(rows),
                  "trigger_fill_rate_pct":rate([r["trigger_crossed_within_horizon"] for r in rows], True),
                  "avg_predicted_spread_bps":mean([r["predicted_spread_bps"] for r in rows]),
                  "avg_realized_spread_bps":mean([r["realized_spread_bps"] for r in rows]),
                  "avg_predicted_slippage_atr":mean([r["predicted_slippage_proxy_atr"] for r in rows]),
                  "avg_realized_entry_slippage_atr":mean([r["realized_entry_slippage_atr"] for r in rows]),
                  "avg_5m_markout_bps":mean([r["markout_5m_bps"] for r in rows]),
                  "avg_15m_markout_bps":mean([r["markout_15m_bps"] for r in rows]),
                  "win_rate_pct":rate([r["outcome_1r"] for r in rows], "WIN"),
                  "loss_rate_pct":rate([r["outcome_1r"] for r in rows], "LOSS"),
              }

          fill_rows = [r for r in observations if r["fill_price"] is not None]
          spread_abs_errors = [abs(r["predicted_spread_bps"]-r["realized_spread_bps"]) for r in fill_rows
                               if r["realized_spread_bps"] is not None]
          slip_abs_errors = [abs(r["predicted_slippage_proxy_atr"]-r["realized_entry_slippage_atr"]) for r in fill_rows
                             if r["realized_entry_slippage_atr"] is not None]
          overall = {
              "observations":len(observations),
              "fills":len(fill_rows),
              "trigger_fill_rate_pct": (len(fill_rows)/len(observations)*100.0) if observations else None,
              "avg_predicted_spread_bps":mean([r["predicted_spread_bps"] for r in observations]),
              "avg_realized_spread_bps":mean([r["realized_spread_bps"] for r in fill_rows]),
              "spread_prediction_mae_bps":mean(spread_abs_errors),
              "avg_predicted_slippage_proxy_atr":mean([r["predicted_slippage_proxy_atr"] for r in observations]),
              "avg_realized_entry_slippage_atr":mean([r["realized_entry_slippage_atr"] for r in fill_rows]),
              "slippage_prediction_mae_atr":mean(slip_abs_errors),
              "avg_5m_markout_bps":mean([r["markout_5m_bps"] for r in fill_rows]),
              "avg_15m_markout_bps":mean([r["markout_15m_bps"] for r in fill_rows]),
              "avg_60m_markout_bps":mean([r["markout_60m_bps"] for r in fill_rows]),
              "win_rate_pct":rate([r["outcome_1r"] for r in fill_rows], "WIN"),
              "loss_rate_pct":rate([r["outcome_1r"] for r in fill_rows], "LOSS"),
          }

          report = {
              "version":"v12.5-historical-tick-replay-tca",
              "generated_at":now_utc().isoformat(),
              "methodology":{
                  "source":"LSE historical raw tick tape + 5m closed candles",
                  "execution_side_rule":"BUY=ASK, SELL=BID",
                  "prediction_window_seconds":observation_seconds,
                  "minimum_prediction_ticks":min_ticks,
                  "trigger":"closed-candle structural breakout + 0.10 ATR buffer",
                  "fill":"first historical executable bid/ask crossing trigger",
                  "markout":"executable opposite side after fill; no mid/last substitution",
                  "warning":"This is execution-model validation, not a full nine-strategy directional backtest. It measures whether the live top-of-book execution model predicts realized execution conditions and post-trigger outcomes."
              },
              "period":{"start":start_dt.isoformat(),"end":end_dt.isoformat()},
              "symbols":symbols,
              "overall":overall,
              "score_calibration":bucket_summary,
              "failures":failures,
              "observations":observations,
          }
          with open("execution_tca.json","w",encoding="utf-8") as f:
              json.dump(report,f,indent=2,default=str)
          fields = list(observations[0].keys()) if observations else [
              "symbol","asof","side","trigger","predicted_execution_score"
          ]
          with open("execution_tca.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields)
              w.writeheader()
              w.writerows(observations)

          print("="*72)
          print("HISTORICAL TICK REPLAY + EXECUTION TCA")
          print("="*72)
          print(json.dumps({"overall":overall,"score_calibration":bucket_summary,"failures":failures},indent=2))
          if not observations:
              raise SystemExit("TCA replay produced zero observations; check symbol history, date range, and API access")
          print(f"TCA COMPLETE: {len(observations)} observations / {len(fill_rows)} simulated fills")
          PY

      - name: Validate TCA report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path
          report=json.loads(Path("execution_tca.json").read_text(encoding="utf-8"))
          assert report.get("version") == "v12.5-historical-tick-replay-tca"
          assert isinstance(report.get("observations"), list) and report["observations"]
          overall=report["overall"]
          for key in ("observations","fills","trigger_fill_rate_pct","avg_predicted_spread_bps",
                      "avg_realized_spread_bps","avg_predicted_slippage_proxy_atr",
                      "avg_realized_entry_slippage_atr"):
              assert key in overall, f"Missing TCA field: {key}"
          for row in report["observations"][:100]:
              assert row["side"] in ("BUY","SELL")
              assert row["trigger"] is not None
              assert row["predicted_execution_score"] is not None
              assert 0 <= float(row["predicted_execution_score"]) <= 100
              if row["fill_price"] is not None:
                  assert row["fill_time"] is not None
                  assert row["realized_entry_slippage_atr"] is not None
          print("Historical tick replay/TCA report validation: PASS")
          print(f"Observations: {overall['observations']} | fills: {overall['fills']}")
          PY

      - name: Upload TCA artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: historical-tick-replay-tca
          path: |
            execution_tca.json
            execution_tca.csv
          if-no-files-found: error
