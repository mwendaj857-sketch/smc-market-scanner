                      return None, None
                  entry, sl, tp, a = level
                  rr = abs(tp-entry) / max(abs(entry-sl), 1e-12)
                  return level, rr
          
              def target_ladder(rows, side, entry):
                  """Return up to three real opposing swing targets beyond the reference entry."""
                  if not rows or entry is None:
                      return []
                  highs, lows = swings(rows[-120:], 2)
                  if side == "BUY":
                      targets = sorted({float(x[1]) for x in highs if x[1] > entry})
                  elif side == "SELL":
                      targets = sorted({float(x[1]) for x in lows if x[1] < entry}, reverse=True)
                  else:
                      return []
                  return targets[:3]

              def support_score(methods, side_c):
                  aligned, opposed, neutral = counts(methods, side_c)
                  return max(0.0, min(100.0,
                      (aligned / max(len(methods), 1)) * 100.0 -
                      (opposed / max(len(methods), 1)) * 20.0))
          
              def support_reasons(methods, side_c):
