                  f"RSS risk: {item.get('rss_news_risk', 'UNAVAILABLE')}",
              ])

          def make_candlestick_chart(item, output_dir):
              """Create an execution-timeframe candlestick chart for confirmed entries only."""
              candles = item.get("chart_candles")
              levels = item.get("levels")
              status = str(item.get("status", ""))
              if not status.startswith("CONFIRMED "):
                  return None
              if not isinstance(candles, list) or len(candles) < 10:
                  raise RuntimeError(f"Insufficient chart candles for {item.get('symbol', 'UNKNOWN')}")
              if not isinstance(levels, list) or len(levels) < 3:
                  raise RuntimeError(f"Missing Entry/SL/TP levels for {item.get('symbol', 'UNKNOWN')}")

              rows = candles[-80:]
              parsed = []
              for row in rows:
                  try:
                      ts = str(row["timestamp"])
                      if ts.endswith("Z"):
                          ts = ts[:-1] + "+00:00"
                      dt = datetime.fromisoformat(ts)
                      values = [float(row[k]) for k in ("open", "high", "low", "close")]
                      if not all(math.isfinite(v) for v in values):
                          raise ValueError("non-finite OHLC")
                      parsed.append((dt, *values))
                  except Exception as exc:
                      raise RuntimeError(f"Invalid chart candle for {item.get('symbol', 'UNKNOWN')}: {exc}")

              dates = [x[0] for x in parsed]
              opens = [x[1] for x in parsed]
              highs = [x[2] for x in parsed]
              lows = [x[3] for x in parsed]
              closes = [x[4] for x in parsed]
              xvals = mdates.date2num(dates)
              width = (xvals[1] - xvals[0]) * 0.68 if len(xvals) > 1 else 0.01

              fig, ax = plt.subplots(figsize=(12, 6.8), dpi=150)
