              "JPY": ("yen", "jpy", "japan", "boj", "bank of japan"),
              "CHF": ("franc", "chf", "switzerland", "snb"),
              "AUD": ("aussie", "aud", "australia", "rba"),
              "CAD": ("cad", "canada", "canadian", "boc", "bank of canada"),
              "NZD": ("nzd", "new zealand", "rbnz"),
          }
          RSS_ASSET_ALIASES = {
              "XAU/USD": ("gold", "xau"),
              "XAG/USD": ("silver", "xag"),
              "XPT/USD": ("platinum", "xpt"),
              "XPD/USD": ("palladium", "xpd"),
              "BTC/USD": ("bitcoin", "btc", "crypto"),
          }

          def _rss_relevance(title, symbol):
              canonical = SYMBOL_ALIASES.get(str(symbol).upper(), str(symbol))
              t = title.casefold()
              if canonical in RSS_ASSET_ALIASES:
                  terms = RSS_ASSET_ALIASES.get(canonical, ())
                  if "/" in canonical:
                      _, quote = canonical.split("/", 1)
                      terms = terms + RSS_ALIASES.get(quote, ())
              elif "/" in canonical:
                  base, quote = canonical.split("/", 1)
                  terms = RSS_ALIASES.get(base, ()) + RSS_ALIASES.get(quote, ())
              else:
                  terms = RSS_ALIASES.get(canonical, ())
              if canonical == "BTC/USD":
                  terms = terms + ("risk assets", "digital assets", "sec")
              return any(term.casefold() in t for term in terms)

          def _rss_severity(title):
              t = title.casefold()
              if any(word in t for word in RSS_HIGH_WORDS):
                  return "HIGH"
              if any(word in t for word in RSS_MEDIUM_WORDS):
                  return "MEDIUM"
              return "LOW"

          def event_risk(intel, symbol):
              """Combine economic-calendar and relevant RSS risk for this symbol."""
              now = now_utc()
              high = []
              medium = []

              # Official/economic calendar remains the strongest event source.
              for e in intel.get("calendar", []):
                  text_blob = " ".join(
                      str(e.get(k, "")) for k in
                      ("title", "event", "name", "impact", "importance")
                  ).lower()
                  currency_text = " ".join(
                      str(e.get(k, "")) for k in ("currency", "country", "region")
                  ).upper()
                  canonical = SYMBOL_ALIASES.get(str(symbol).upper(), str(symbol))
                  symbol_currencies = set(canonical.split("/")) if "/" in canonical else set()
                  relevant_currency = (
                      (not currency_text)
                      or any(c in currency_text for c in symbol_currencies)
                  )
                  if relevant_currency and any(w in text_blob for w in ("high", "red", "major")):
                      dt = None
                      for k in ("timestamp", "datetime", "date", "time"):
                          if e.get(k):
                              try:
                                  dt = parse_ts(e[k])
                                  break
                              except Exception:
                                  pass
                      if dt is None or abs((dt - now).total_seconds()) <= 24 * 3600:
                          high.append({
                              "source": "economic-calendar",
                              "title": str(e.get("title") or e.get("event") or e.get("name") or "High-impact event"),
                          })

              # RSS is secondary risk intelligence. Relevant headlines older than
              # 36 hours (or implausibly >2 hours in the future) are ignored.
              for item in intel.get("news", []):
                  title = str(item.get("title", "")).strip()
                  if not title or not _rss_relevance(title, symbol):
                      continue

                  published = item.get("published_at")
                  if published:
                      try:
                          dt = parse_ts(published)
                          age = (now - dt).total_seconds()
                          if age > 36 * 3600 or age < -2 * 3600:
                              continue
                      except Exception:
                          pass

                  severity = _rss_severity(title)
                  record = {
                      "source": item.get("source", "rss"),
                      "title": title,
                      "link": item.get("link", ""),
                      "published_at": published,
                  }
                  if severity == "HIGH":
                      high.append(record)
                  elif severity == "MEDIUM":
                      medium.append(record)

              if high:
                  return "HIGH", high[:8]
              if medium:
                  return "MEDIUM", medium[:8]
              return "LOW", []
          
          EVENT_POSITIVE_WORDS = ("beat", "beats", "strong", "stronger", "above forecast", "above estimate", "hawkish", "rate hike", "hikes rates", "tightening", "growth", "surplus")
          EVENT_NEGATIVE_WORDS = ("miss", "misses", "weak", "weaker", "below forecast", "below estimate", "dovish", "rate cut", "cuts rates", "easing", "recession", "deficit")

          def _number(v):
              try:
                  x = float(str(v).replace(",", "").replace("%", "").strip())
                  return x if math.isfinite(x) else None
              except Exception:
                  return None

          def _event_surprise(e):
              actual = next((_number(e.get(k)) for k in ("actual", "actual_value", "result", "value") if _number(e.get(k)) is not None), None)
              expected = next((_number(e.get(k)) for k in ("forecast", "consensus", "estimate", "expected") if _number(e.get(k)) is not None), None)
              return None if actual is None or expected is None else actual - expected

          def _event_dt(e):
              for k in ("timestamp", "datetime", "date", "time", "published_at"):
                  if e.get(k):
                      try: return parse_ts(e[k])
                      except Exception: pass
              return None

          def _event_direction(e, symbol):
              canonical = SYMBOL_ALIASES.get(str(symbol).upper(), str(symbol))
              currencies = set(canonical.split("/")) if "/" in canonical else set()
              cur_text = " ".join(str(e.get(k, "")) for k in ("currency", "country", "region")).upper()
              cur = next((c for c in currencies if c in cur_text), None)
              if not cur:
                  return "NEUTRAL"
              title = " ".join(str(e.get(k, "")) for k in ("title", "event", "name")).casefold()
              surprise = _event_surprise(e)

              # Surprise polarity is event-specific. Do not assume "actual > forecast"
              # is always bullish: jobless claims/unemployment differ from CPI/rates.
              lower_is_better = ("unemployment" in title or "jobless claims" in title or
                                 "initial claims" in title or "continuing claims" in title)
              higher_is_better = ("retail sales" in title or "industrial production" in title or
                                  "pmi" in title or "manufacturing" in title or "gdp" in title or
                                  "employment" in title or "payroll" in title)
              hawkish = ("rate hike" in title or "hikes rates" in title or "tightening" in title or
                         "hawkish" in title or "higher for longer" in title)
              dovish = ("rate cut" in title or "cuts rates" in title or "easing" in title or
                        "dovish" in title)

              pos = any(w in title for w in EVENT_POSITIVE_WORDS)
              neg = any(w in title for w in EVENT_NEGATIVE_WORDS)
              if surprise is not None and abs(surprise) > 1e-12:
                  surprise_positive = surprise < 0 if lower_is_better else True if higher_is_better else None
                  if surprise_positive is not None:
                      pos, neg = surprise_positive, not surprise_positive
              if hawkish:
                  pos, neg = True, False
              elif dovish:
                  pos, neg = False, True
              if pos == neg:
                  return "NEUTRAL"
              bias = "BUY" if pos else "SELL"
              base, quote = canonical.split("/", 1)
              return bias if cur == base else ("SELL" if bias == "BUY" else "BUY")

          def event_alignment(intel, symbol, side, price_rows_5m, price_rows_15m):
              """Event-aware gate: only immediate high-impact shock blocks; post-event reaction can qualify."""
              now = now_utc(); records = []
              canonical = SYMBOL_ALIASES.get(str(symbol).upper(), str(symbol))
              currencies = set(canonical.split("/")) if "/" in canonical else set()
              for e in intel.get("calendar", []):
                  if not isinstance(e, dict): continue
                  cur_text = " ".join(str(e.get(k, "")) for k in ("currency", "country", "region")).upper()
                  if cur_text and not any(c in cur_text for c in currencies): continue
                  dt = _event_dt(e)
                  if dt is None: continue
                  delta = (dt-now).total_seconds()/60.0
                  if delta > 180 or delta < -180: continue
                  impact = " ".join(str(e.get(k, "")) for k in ("impact", "importance", "priority")).upper()
                  sev = "HIGH" if any(x in impact for x in ("HIGH", "RED", "MAJOR")) else ("MEDIUM" if "MED" in impact else "LOW")
                  records.append({"title":str(e.get("title") or e.get("event") or e.get("name") or "Economic event"),"timestamp":dt.isoformat(),"severity":sev,"delta_min":delta,"direction":_event_direction(e,symbol)})
              records.sort(key=lambda x: abs(x["delta_min"]))
              strongest = next((x for x in records if x["severity"] == "HIGH"), records[0] if records else None)
              if strongest is None: return {"state":"NONE","gate":True,"score_adjustment":0.0,"events":[],"reason":"No timestamped relevant event in the execution window"}
              d=strongest["delta_min"]
              if strongest["severity"] == "HIGH" and -10 <= d <= 15:
                  return {"state":"IMMEDIATE_HIGH","gate":False,"score_adjustment":-20.0,"events":records[:5],"reason":"Immediate high-impact release window; wait for initial volatility to settle"}
              if -120 <= d < -10:
                  def reaction(rows,bars):
                      if len(rows)<bars+2: return 0.0
                      a,b=rows[-bars-1]["close"],rows[-1]["close"]
                      return (b/a-1.0) if a else 0.0
                  r5,r15=reaction(price_rows_5m,3),reaction(price_rows_15m,2)
                  observed="BUY" if r5>0 and r15>0 else ("SELL" if r5<0 and r15<0 else "NEUTRAL")
                  eb=strongest["direction"]
                  if observed==side and eb in ("NEUTRAL",side): return {"state":"POST_EVENT_ALIGNED","gate":True,"score_adjustment":12.2,"events":records[:5],"reason":f"Post-event 5M/15M reaction {observed} aligns with {side}"}
                  if observed in ("BUY","SELL") and observed!=side: return {"state":"POST_EVENT_CONFLICT","gate":False,"score_adjustment":-18.0,"events":records[:5],"reason":f"Post-event 5M/15M reaction {observed} conflicts with {side}"}
                  return {"state":"POST_EVENT_UNCLEAR","gate":True,"score_adjustment":-5.0,"events":records[:5],"reason":"Event passed but the 5M/15M reaction is not decisive"}
              if 15 < d <= 120:
                  return {"state":"UPCOMING","gate":True,"score_adjustment":-5.0,"events":records[:5],"reason":"Upcoming event is known; technical alignment remains eligible"}
              return {"state":"OUTSIDE_IMMEDIATE_WINDOW","gate":True,"score_adjustment":0.0,"events":records[:5],"reason":"Event is outside the immediate execution window"}

          def rss_event_risk(intel, symbol):
              """Return RSS-only severity/events so RSS is not mislabeled as combined event risk."""
              now = now_utc()
              high = []
              medium = []
              for item in intel.get("news", []):
                  title = str(item.get("title", "")).strip()
                  if not title or not _rss_relevance(title, symbol):
                      continue
                  published = item.get("published_at")
                  if published:
                      try:
                          dt = parse_ts(published)
                          age = (now - dt).total_seconds()
                          if age > 36 * 3600 or age < -2 * 3600:
                              continue
                      except Exception:
                          pass
                  severity = _rss_severity(title)
                  record = {
                      "source": item.get("source", "rss"),
                      "title": title,
                      "link": item.get("link", ""),
                      "published_at": published,
                  }
                  if severity == "HIGH":
                      high.append(record)
                  elif severity == "MEDIUM":
                      medium.append(record)
              if high:
                  return "HIGH", high[:8]
              if medium:
                  return "MEDIUM", medium[:8]
              return "LOW", []

          def dominant(methods, minimum=2):
              """Return a direction only when that timeframe has a strict local vote."""
              b = sum(1 for m in methods if m.get("signal") == "BUY")
              ss = sum(1 for m in methods if m.get("signal") == "SELL")
              if b >= minimum and b > ss:
                  return "BUY"
              if ss >= minimum and ss > b:
                  return "SELL"
              return "NEUTRAL"

          def side_score(strategy_maps, side):
              """Fast, bounded score: breadth + timeframe agreement, not a fake deep score."""
              names, tfs, opposed = set(), set(), set()
              for tf_name, methods in strategy_maps.items():
                  for m in methods:
                      sig = m.get("signal")
                      if sig == side:
                          names.add(m.get("name")); tfs.add(tf_name)
                      elif sig in ("BUY","SELL") and sig != side:
                          opposed.add(m.get("name"))
              local = [tf for tf, methods in strategy_maps.items() if dominant(methods, 2) == side]
              score = 35.0 + len(names)*7.0 + max(0, len(tfs)-1)*5.0 + len(local)*6.0 - len(opposed)*2.0
              return {"side":side, "strategy_count":len(names), "strategies":sorted(x for x in names if x),
                      "timeframes":sorted(tfs), "local_consensus_tfs":local,
                      "opposed":sorted(x for x in opposed if x), "score":round(min(100.0, max(0.0, score)),1)}

          # ----------------------------
          # Dynamic catalog discovery
          # ----------------------------
          api_key = os.getenv("LSE_API_KEY", "").strip()
          if not api_key:
              raise RuntimeError("LSE_API_KEY secret is missing. Add it in GitHub Settings -> Secrets and variables -> Actions.")
          client = LSE(api_key=api_key)
          # Defer calendar/macro/yield/COT/RSS work until fast-filter promotion.
          intel = {"calendar": [], "macro": {}, "yields": {}, "cot": {}, "news": [],
                   "live": "DEFERRED", "ml": "LOCAL STATISTICAL MODEL"}
          
          # Small, fixed benchmark set used only for cross-market context.
          # Missing/unavailable benchmarks are reported rather than guessed.
          # Benchmarks are loaded lazily only when deep analysis begins.
          # This avoids spending five REST calls before the fast filter has found candidates.
          benchmark_rows = {}
          def ensure_benchmarks():
              global benchmark_rows
              if benchmark_rows:
                  return
              for benchmark in ("EUR/USD", "GBP/USD", "USD/JPY", "XAU/USD", "BTC/USD"):
                  try:
                      benchmark_rows[benchmark] = fetch_candles(client, benchmark, "1h", limit=120)
                  except Exception as exc:
                      benchmark_rows[benchmark] = []
                      print(f"  BENCHMARK WARNING {benchmark}: {type(exc).__name__}: {exc}")

          catalog = []
          catalog_errors = []
          # LSE documents catalog() as the authoritative full instrument catalog.
          # Fetch it once, then filter locally. This avoids guessing which singular/plural
          # spelling a particular SDK build accepts (for example futures vs future).
          try:
              rows = client.catalog()
              if isinstance(rows, dict):
                  rows = rows.get("data", rows.get("results", []))
              if isinstance(rows, list):
                  for row in rows:
                      if isinstance(row, dict):
                          sym = row.get("symbol")
                          if sym:
                              catalog.append({
                                  "symbol": sym,
                                  "name": row.get("name", row.get("display_name", sym)),
                                  "category": str(row.get("category", "")).strip().lower(),
                                  "tick_count": row.get("ticks", row.get("tick_count", 0)),
                              })
              else:
                  catalog_errors.append("catalog(): unexpected response shape")
          except Exception as exc:
              catalog_errors.append(f"catalog(): {type(exc).__name__}: {exc}")
          
          # Broad universe: every eligible live-catalog instrument in the requested
          # categories is eligible. Priority assets are ranked first, not whitelisted.
          category_aliases = {"stocks":"stock","stock":"stock","forex":"forex","crypto":"crypto","etfs":"etf","etf":"etf","commodities":"commodity","commodity":"commodity","metals":"commodity","metal":"commodity","indices":"index","index":"index","futures":"futures","future":"futures","options":"options"}
          requested_categories = {category_aliases.get(x.strip().lower(), x.strip().lower()) for x in CATEGORIES if x.strip()}
          unique = {}
          for row in catalog:
              raw_symbol = str(row["symbol"]).strip()
              canonical = SYMBOL_ALIASES.get(raw_symbol.upper(), raw_symbol)
              normalized = category_aliases.get(str(row.get("category", "")).strip().lower(), str(row.get("category", "")).strip().lower())
              if requested_categories and normalized not in requested_categories:
                  continue
              if not canonical:
                  continue
              item = dict(row)
              item["symbol"] = raw_symbol
              item["canonical_symbol"] = canonical
              item["category"] = normalized
              try:
                  item["_tick_count"] = int(item.get("tick_count", 0) or 0)
              except Exception:
                  item["_tick_count"] = 0
              prev = unique.get(canonical)
              if prev is None or (raw_symbol.upper() == canonical and prev["symbol"].upper() != canonical):
                  unique[canonical] = item
          priority_order = ["EUR/USD","GBP/USD","USD/JPY","USD/CHF","AUD/USD","USD/CAD","NZD/USD","EUR/GBP","EUR/JPY","GBP/JPY","EUR/CHF","AUD/JPY","XAU/USD","XAG/USD","XPT/USD","XPD/USD","BTC/USD"]
          priority_rank = {s:i for i,s in enumerate(priority_order)}
          instruments = sorted(unique.values(), key=lambda x:(priority_rank.get(x["canonical_symbol"],999), -x.get("_tick_count",0), x["symbol"]))

          if MAX_INSTRUMENTS > 0:
              instruments = instruments[:MAX_INSTRUMENTS]
          for item in instruments:
              item.pop("_tick_count",None)
          if not instruments:
              raise RuntimeError(
                  "No focused instruments were discovered in the live LSE catalog. "
                  "The scanner will not fabricate symbols or candles. Check catalog access, "
                  "symbol availability, or LSE_API_KEY permissions."
              )
          print(f"CATALOG CATEGORIES REQUESTED: {', '.join(CATEGORIES)}")
          print("UNIVERSE: ALL ELIGIBLE LIVE-CATALOG INSTRUMENTS IN REQUESTED CATEGORIES; PRIORITY ASSETS FIRST")
          print(f"DISCOVERED ELIGIBLE INSTRUMENTS: {len(instruments)}")
          print(f"MAX_INSTRUMENTS: {MAX_INSTRUMENTS} (0 = all eligible requested-category instruments; runtime governor still applies)")
          print(f"RUNTIME BUDGET: {RUNTIME_MINUTES:.1f} minutes")
          discovered = {x["canonical_symbol"] for x in instruments}
          for label, group in (("MAJOR FX",MAJOR_FX),("METALS",PRIORITY_METALS),("BTC",PRIORITY_CRYPTO)):
              found = sorted(group & discovered)
              missing_group = sorted(group - discovered)
              print(f"{label} FOUND: {', '.join(found) if found else 'NONE'}")
              if missing_group:
                  print(f"{label} NOT IN LIVE CATALOG: {', '.join(missing_group)}")
          if catalog_errors:
              print("CATALOG WARNINGS:")
              for x in catalog_errors:
                  print(" -",x)
          print()
          
          # ----------------------------
          # FAST FILTER -> DEEP ANALYSIS
          # ----------------------------
          # Stage 1 intentionally uses only LSE-native 1H/15M/5M candles. It is
          # designed to find directional candidates quickly without paying the
          # cost of a full six-timeframe download for every instrument.
          # Stage 2 below performs the complete 1MO/1D/4H/1H/15M/5M analysis
          # only for the best candidates.
          fast_watch = []
          fast_candidates = []
          fast_errors = 0

          def fast_nine_strategy_signals(rows, category):
              try:
                  smc = smc_core(rows)
              except Exception as exc:
                  smc = {"side":"NEUTRAL","passed":False,"score":0,"why":f"SMC error: {type(exc).__name__}"}
              try:
                  structure_sig, structure_why = structure_signal(rows)
              except Exception as exc:
                  structure_sig, structure_why = "NEUTRAL", f"method error: {type(exc).__name__}"
              try:
                  liquidity_sig, liquidity_why = liquidity_signal(rows)
              except Exception as exc:
                  liquidity_sig, liquidity_why = "NEUTRAL", f"method error: {type(exc).__name__}"
              helper_map = {
                  "Supply/Demand": supply_demand_signal,
                  "Price Action": candle_signal,
                  "Fibonacci": fib_signal,
                  "Trend": trend_signal,
                  "RSI+MACD": indicator_signal,
                  "Session": lambda x: session_signal(x, category),
              }
              out = [
                  {"name":"SMC","signal":smc.get("side") if smc.get("passed") else "NEUTRAL","why":smc.get("why","SMC not established")},
                  {"name":"Market Structure","signal":structure_sig,"why":structure_why},
                  {"name":"Liquidity","signal":liquidity_sig,"why":liquidity_why},
              ]
              for name, fn in helper_map.items():
                  try:
                      sig, why = fn(rows)
                  except Exception as exc:
                      sig, why = "NEUTRAL", f"method error: {type(exc).__name__}"
                  out.append({"name":name,"signal":sig,"why":why})
              return out

          def fast_side_stats(strategy_maps, side):
              return side_score(strategy_maps, side)


          print()
          print("=" * 72)
          print("⚡ FAST FILTER — 1H / 15M / 5M")
          print(f"Promotion target: top {FAST_CANDIDATE_LIMIT} | minimum fast score: {FAST_MIN_SCORE:.1f}")
          print("No 1MO/1D/4H deep data is fetched until an instrument passes this filter.")
          print("=" * 72)

          # Stage A: 1H + 15M only for every instrument. This prevents 17x3
          # simultaneous-ish REST pressure and keeps the first pass fast.
          prelim = []
          for idx, meta in enumerate(instruments, 1):
              symbol = meta["symbol"]; category = meta["category"]
              try:
                  base = {}
                  for tf in ("1h", "15m"):
                      rows, current = fetch_candles_with_forming(client, symbol, tf, limit=FAST_FETCH_LIMIT[tf])
                      base[tf] = rows
                  if any(len(base[tf]) < 60 for tf in ("1h","15m")):
                      fast_errors += 1
                      print(f"FAST FILTER SKIP {symbol}: insufficient 1H/15M data")
                      continue
                  maps = {tf: fast_nine_strategy_signals(base[tf], category) for tf in ("1h","15m")}
                  sides = [side_score(maps, side) for side in ("BUY","SELL")]
                  sides = [x for x in sides if x["strategy_count"] >= 2 and x["local_consensus_tfs"]]
                  if sides:
                      best = max(sides, key=lambda x:(x["score"], x["strategy_count"], len(x["local_consensus_tfs"])))
                      prelim.append({"meta":meta, "score":best["score"], "side":best["side"], "maps":maps, "rows":base})
                  else:
                      raw = max((side_score(maps, side) for side in ("BUY","SELL")), key=lambda x:x["score"])
                      if raw["score"] >= FAST_MIN_SCORE - 10 and raw["strategy_count"] >= 1:
                          fast_watch.append({"symbol":symbol,"side":raw["side"],"score":raw["score"],"strategies":raw["strategies"],"timeframes":raw["timeframes"],"reason":"developing 1H/15M directional evidence"})
              except Exception as exc:
                  fast_errors += 1
                  print(f"FAST FILTER ERROR {symbol}: {type(exc).__name__}: {exc}")

          prelim.sort(key=lambda x:(x["score"], len(x["maps"]), x["side"]), reverse=True)
          prelim = prelim[:FAST_PRESELECT_LIMIT]

          # Short live quote snapshot for the strongest fast candidates. This does
          # not influence directional scoring; it only evaluates executable price,
          # spread, freshness and trigger readiness.
          fast_live_symbols = [x["meta"]["symbol"] for x in prelim[:FAST_CANDIDATE_LIMIT]]
          fast_live_raw = collect_live_quotes(client, fast_live_symbols) if fast_live_symbols else {}

          # Stage B: fetch 5M only for the strongest 1H/15M candidates.
