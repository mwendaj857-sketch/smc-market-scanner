                  three_price = cs["price_count"] >= 3 and cs["price_tf_count"] >= 2 and opposed_count <= 3
          
                  # Determine the strongest applicable execution horizon.
                  level_map = {
                      "INTRADAY": level_rr(c, "INTRADAY", closed_entry_price(m15)),
