name: LSE Smart Signal Scanner v12.5 — Institutional Top-of-Book Execution Model

on:
  workflow_dispatch:
    inputs:
      max_instruments:
        description: "0 = discover all eligible instruments; runtime governor prevents runaway scans"
        required: false
        default: "0"
        type: string
      categories:
        description: "Catalog categories to scan; every eligible live-catalog instrument in these categories is eligible for discovery"
        required: false
        default: "forex,commodity,crypto"
        type: string
      top_n:
        description: "Number of qualified setups / WAIT candidates to display"
        required: false
        default: "5"
        type: string
      runtime_minutes:
        description: "Maximum scanner runtime in minutes; 0 uses the safe default"
        required: false
        default: "8"
        type: string
      scan_mode:
        description: "ONCE = one complete scan; UNTIL_POSITION = repeat full scans until a confirmed position is found or the safety limit is reached"
        required: false
        default: "ONCE"
        type: choice
        options:
          - ONCE
          - UNTIL_POSITION
      until_position_max_minutes:
        description: "Safety limit for UNTIL_POSITION mode (maximum 55 minutes)"
        required: false
        default: "55"
        type: string
      poll_seconds:
        description: "Pause between full scans in UNTIL_POSITION mode"
        required: false
        default: "30"
        type: string
      fast_candidate_limit:
        description: "Maximum instruments promoted from the fast 1H/15M/5M filter to deep analysis"
        required: false
        default: "8"
        type: string
      fast_min_score:
        description: "Minimum fast-filter opportunity score to promote an instrument; lower values show more potential setups"
        required: false
        default: "55"
        type: string
      run_tca:
        description: "Run historical tick replay + execution TCA calibration (manual dispatch only)"
        required: false
        default: false
        type: boolean
      tca_symbols:
        description: "Comma-separated symbols for execution replay"
        required: false
        default: "EUR/USD,GBP/USD,XAU/USD,BTC/USD"
        type: string
      tca_start:
        description: "UTC replay start; blank = last 24 hours"
        required: false
        default: ""
        type: string
      tca_end:
        description: "UTC replay end; blank = now"
        required: false
        default: ""
        type: string
      tca_horizon_minutes:
        description: "Maximum realized markout horizon after a simulated fill"
        required: false
        default: "60"
        type: string
      tca_observation_seconds:
        description: "Historical top-of-book observation window used to predict execution conditions"
        required: false
        default: "4"
        type: string
      tca_max_setups:
        description: "Maximum historical closed-candle setup snapshots per symbol"
        required: false
        default: "500"
        type: string
      tca_min_ticks:
        description: "Minimum ticks required in an execution observation window"
        required: false
        default: "3"
        type: string
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: read

concurrency:
  group: lse-smart-scanner-${{ github.event_name }}-${{ inputs.scan_mode || 'ONCE' }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      MAX_INSTRUMENTS: ${{ inputs.max_instruments || '0' }}
      SCAN_RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '8' }}
      LSE_CATEGORIES: ${{ inputs.categories || 'forex,commodity,crypto' }}
      TOP_N: ${{ inputs.top_n || '5' }}
      SCAN_MODE: ${{ inputs.scan_mode || 'ONCE' }}
      UNTIL_POSITION_MAX_MINUTES: ${{ inputs.until_position_max_minutes || '55' }}
      POLL_SECONDS: ${{ inputs.poll_seconds || '30' }}
      FAST_CANDIDATE_LIMIT: ${{ inputs.fast_candidate_limit || '8' }}
      FAST_MIN_SCORE: ${{ inputs.fast_min_score || '55' }}
      RUN_TCA: ${{ inputs.run_tca || 'false' }}
      TCA_SYMBOLS: ${{ inputs.tca_symbols || 'EUR/USD,GBP/USD,XAU/USD,BTC/USD' }}
      TCA_START: ${{ inputs.tca_start || '' }}
      TCA_END: ${{ inputs.tca_end || '' }}
      TCA_HORIZON_MINUTES: ${{ inputs.tca_horizon_minutes || '60' }}
      TCA_OBSERVATION_SECONDS: ${{ inputs.tca_observation_seconds || '4' }}
      TCA_MAX_SETUPS: ${{ inputs.tca_max_setups || '500' }}
      TCA_MIN_TICKS: ${{ inputs.tca_min_ticks || '3' }}
      NEWS_RSS_URLS: ${{ secrets.NEWS_RSS_URLS }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12 (Node 24 actions)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "lse-data[frames]==0.14.0" "feedparser>=6.0,<7" "PyYAML>=6.0,<7" "matplotlib>=3.8,<4" "pandas>=2.0,<3" "pyarrow>=15,<23"

      - name: Validate embedded scanner before live run
        shell: bash
        run: |
          set -euo pipefail
          export WORKFLOW_DIR="$GITHUB_WORKSPACE/.github/workflows"
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import yaml
          
          workflow_dir = Path(os.environ["WORKFLOW_DIR"]).resolve()
          assert workflow_dir.is_dir(), f"Workflow directory missing: {workflow_dir}"
          
          # Validate the exact workflow used by this GitHub Actions run.
          # This prevents an older v8.x scanner in the repository from being selected.
          workflow_ref = os.environ.get("GITHUB_WORKFLOW_REF", "")
          workflow_path = None
          if workflow_ref:
              ref_path = workflow_ref.split("@", 1)[0]
              marker = ".github/workflows/"
              if marker in ref_path:
                  workflow_path = workflow_dir / ref_path.split(marker, 1)[1]
          
          if workflow_path is None:
              candidates = [
                  p for p in sorted(workflow_dir.glob("*.yml")) + sorted(workflow_dir.glob("*.yaml"))
                  if p.is_file()
              ]
              matches = []
              for candidate in candidates:
                  try:
                      candidate_text = candidate.read_text(encoding="utf-8")
                  except OSError:
                      continue
                  if "SMC LSE SMART INTRADAY SCANNER" in candidate_text and "from lse import LSE" in candidate_text:
                      matches.append((candidate, candidate_text))
              assert len(matches) == 1, (
                  "Could not safely identify the current scanner workflow. "
                  "Remove duplicate scanner workflow files or run under GitHub Actions."
              )
              workflow_path, text = matches[0]
          else:
              assert workflow_path.is_file(), f"Current workflow file not found: {workflow_path}"
              text = workflow_path.read_text(encoding="utf-8")
          
          doc = yaml.safe_load(text)
          assert isinstance(doc, dict), "Workflow is not a YAML mapping"
          jobs = doc.get("jobs")
          assert isinstance(jobs, dict) and isinstance(jobs.get("scan"), dict), "scan job missing"
          steps = jobs["scan"].get("steps", [])
          assert isinstance(steps, list), "scan.steps is not a list"
          
          run_blocks = [s.get("run", "") for s in steps if isinstance(s, dict) and isinstance(s.get("run"), str)]
          scanner_blocks = [
              x for x in run_blocks
              if "python - <<'PY'" in x
              and "from lse import LSE" in x
              and "print(\"LSE SMART SIGNAL SCANNER v12.5" in x
              and "def now_utc" in x
          ]
          assert len(scanner_blocks) == 1, f"Expected exactly one main embedded scanner block, found {len(scanner_blocks)}"
          scanner = scanner_blocks[0]
          assert "v12.5" in scanner and "FAST FILTER -> DEEP ANALYSIS" in scanner, "Wrong scanner version embedded in current workflow"
          assert "import feedparser" in scanner and "def external_news" in scanner, "RSS layer missing from embedded scanner"
          assert "def event_risk" in scanner and "RSS is secondary risk intelligence" in scanner, "RSS risk integration missing"
          assert "alignment = {" in scanner, "Timeframe alignment definition missing"
          assert '"1mo": nine_strategy_signals' in scanner, "Monthly strategy analysis missing"
          assert "monthly_alignment_ok" in scanner and "signal_timeframes" in scanner, "Monthly/any-timeframe agreement gate missing"
          assert scanner.index("alignment = {") < scanner.index('"alignment":alignment'), "Alignment must be defined before result construction"
          assert "strategy_score" in scanner and "execution_quality_score" in scanner, "Separate strategy/execution scores missing"
          assert "ENTRY_HORIZONS" in scanner and "horizon_for(" in scanner, "Entry-type horizon mapping missing"
          assert "WAIT — NOT CONFIRMED / NOT AN ENTRY" in scanner, "WAIT/non-entry separation missing"
          assert "rss_news_risk" in scanner and "event_risk" in scanner and "event_alignment" in scanner, "Event-aware risk output/integration missing"
          assert "actions/upload-artifact@v7" in text, "Artifact upload is not using actions/upload-artifact@v7"
          assert "Send validated scanner output to Telegram" in text, "Telegram delivery step missing"
          assert "BOT_TOKEN" in text and "TELEGRAM_CHAT_ID" in text, "Telegram secrets wiring missing"
          assert "matplotlib" in text and "sendPhoto" in text, "Telegram candlestick chart delivery missing"
          assert "chart_candles" in scanner and "chart_timeframe" in scanner, "Adaptive chart data missing from scanner handoff"
          assert "status_rule" in scanner, "WAIT/confirmed status rule missing from JSON"
          assert "POSITION_TIMEFRAME_PROFILES" in scanner, "Adaptive position timeframe profiles missing"
          assert "timeframe_analysis" in scanner, "Per-timeframe analysis missing"
          assert "position_timeframe" in scanner, "Position timeframe field missing"
          assert "FAST_FETCH_LIMIT" in scanner and "fast_nine_strategy_signals" in scanner, "Fast native timeframe filter missing"
          assert "candidate_meta" in scanner and "for idx, meta in enumerate(candidate_meta, 1)" in scanner, "Deep scan is not restricted to promoted candidates"
          assert "entry_price" in scanner and "candidate_price" in scanner and "candidate_plan" in scanner, "Closed-candle entry plan missing"
          assert "def execution_trigger_state" in scanner, "Closed-candle execution trigger engine missing"
          assert "trigger_crossed" in scanner and "OVEREXTENDED" in scanner, "Conditional trigger state missing"
          assert "ENTRY_BUFFER_ATR =" in scanner and "ENTRY_MAX_CHASE_ATR =" in scanner, "Execution trigger constants missing"
          assert "TRIGGER_SWING_LOOKBACK =" in scanner and "TRIGGER_SWING_WINDOW =" in scanner, "Structural trigger configuration missing"
          assert "forming candle never votes" in scanner, "Forming candle must not influence directional scoring"
          assert "entry_plan" in scanner and "take_profit" in scanner and "stop_loss" in scanner, "Fast-filter entry plan missing"
          assert "FAST FILTER ENTRY PLANS" in text, "Telegram fast-filter entry plans missing"
          assert "scan_mode" in text and "UNTIL_POSITION" in text, "Until-position scan mode missing"
          assert "SCAN_MODE" in text and "POLL_SECONDS" in text, "Continuous scan configuration missing"
          assert "FAST_CANDIDATE_LIMIT" in text and "FAST_MIN_SCORE" in text, "Fast-filter configuration missing"
          assert "historical tick replay" in text and "implementation_shortfall" in text, "Historical tick replay/TCA layer missing"
          assert "execution_tca.json" in text and "execution_tca.csv" in text, "TCA artifacts missing"
          assert "FAST FILTER -> DEEP ANALYSIS" in scanner, "Two-stage scan architecture missing"
          assert "fast_candidates" in scanner and "fast_watch" in scanner, "Fast candidate/watch handoff missing"
          assert "deep_analysis_count" in scanner and "fast_filtered_count" in scanner, "Two-stage scan metrics missing"
          assert "POTENTIAL — NOT CONFIRMED" in scanner, "Potential state missing"
          assert "fast_filter" in scanner, "Fast-filter result metadata missing"
          assert "SNIPER_MIN_SCORE" in scanner and "sniper_opportunity" in scanner, "SNIPER precision opportunity engine missing"
          assert scanner.index("sniper_ranked = sorted(") < scanner.index("len(sniper_ranked)"), "sniper_ranked must be defined before it is referenced"
          assert "data_quality_report" in scanner and "volatility_regime" in scanner, "Data-quality/volatility validation layer missing"
          assert "ALL ELIGIBLE LIVE-CATALOG" in scanner, "Broad opportunity universe missing"
          assert "parse_mode" in text and "🟢" in text and "🔴" in text, "Telegram status-color formatting missing"
          assert 'color=' in text, "Colored Telegram chart elements missing"
          py = scanner.split("python - <<'PY'\n", 1)[1].split("\nPY", 1)[0]
          
          ast.parse(py)
          compile(py, "<embedded-scanner>", "exec")
          print(f"Workflow selected: {workflow_path}")
          print("YAML syntax: PASS")
          print("scan job structure: PASS")
          print("Main embedded Python syntax: PASS")
          print("Embedded scanner compilation: PASS")
          print("RSS integration: PASS")
          print("Alignment definition/order: PASS")
          print("Monthly master filter: PASS")
          print("Any-timeframe agreement gate: PASS")
          print("Score separation: PASS")
          print("Entry-type horizon mapping: PASS")
          print("WAIT/non-entry formatting: PASS")
          print("Artifact upload v7: PASS")
          assert "def dominant(methods, minimum=2)" in scanner, "dominant() helper missing before fast filter"
          assert "Stage A: 1H + 15M only" in scanner, "two-stage fast filter missing"
          assert "_candle_request" in scanner and "API_MAX_RETRIES" in scanner and "API_MIN_INTERVAL_SECONDS" in scanner, "bounded LSE retry/pacing layer missing"
          assert "v12.5" in scanner, "scanner version mismatch"
          assert scanner.count("def dominant(methods, minimum=2)") == 1, "duplicate/missing dominant() definition"
          assert 'daily_intelligence(client, [m["symbol"] for m in candidate_meta])' in scanner, "intelligence is not deferred to deep candidates"
          assert "lower_is_better" in scanner, "event surprise polarity model missing"
          print("Scanner version: v12.5")
          print("Fast two-stage filter: PASS")
          print("Transient LSE retry/backoff: PASS")
          print("Lazy benchmark loading: PASS")
          PY

      - name: Run scanner
        run: |
          set -euo pipefail

          scan_once() {
          python - <<'PY'
          import ast
          import bisect
          import bisect
          import csv
          import json
          import feedparser
          import math
          import os
          import re
          import statistics
          import threading
          from collections import deque
          import sys
          import time
          import traceback
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          
          try:
              from lse import LSE, LSEError
          except Exception as exc:
              print(f"FATAL: lse-data import failed: {exc}")
              raise
          
          print("=" * 72)
          print("LSE SMART SIGNAL SCANNER v12.5 — INSTITUTIONAL TOP-OF-BOOK EXECUTION MODEL — VALIDATED")
          print("=" * 72)
          print("DAILY INTELLIGENCE -> 1MO MASTER BIAS -> 1D CONTEXT -> 4H REGIME -> 1H DECISION")
          print("-> 1H DECISION -> 15M SETUP/CONFIRMATION -> 5M TRIGGER")
          print("MONTHLY ALIGNMENT FILTER: EVERY SIGNAL TIMEFRAME MUST AGREE WITH MONTHLY + LOCAL TF CONSENSUS")
          print("DYNAMIC LSE CATALOG | >=2R CONFIRMATION | STRUCTURAL TP | STRUCTURAL CLOSED-CANDLE ENTRY + LIVE-TRIGGER VALIDATION")
          print("AUTOMATIC TRADING: DISABLED")
          print()
          
          # ----------------------------
          # Configuration
          # ----------------------------
          # Monthly is the highest-timeframe directional filter.
          TF = ["1mo", "1d", "4h", "1h", "15m", "5m"]
          DIRECT_TF = ["1mo", "1d", "4h", "1h", "15m", "5m"]
          MIN_BARS = {"1mo": 60, "1d": 120, "4h": 180, "1h": 240, "15m": 360, "5m": 500}
          # Deep analysis uses only enough closed history for the nine strategies,
          # structure, levels and forming-candle logic. This cuts payload size without
          # changing the native LSE timeframe architecture.
          FETCH_LIMIT = {"1mo": 70, "1d": 180, "4h": 240, "1h": 320, "15m": 420, "5m": 600}
          FAST_FETCH_LIMIT = {"1h": 120, "15m": 160, "5m": 220}
          FAST_PRESELECT_LIMIT = 8
          API_MAX_RETRIES = 3
          API_RETRY_BASE_SECONDS = 0.8
          API_MIN_INTERVAL_SECONDS = 0.18
          LAST_API_REQUEST_AT = 0.0

          ENTRY_STRATEGY_SCORE_MIN = 80.0
          SNIPER_MIN_SCORE = 78.0
          SNIPER_MAX_ENTRY_DISTANCE_ATR = 0.45
          MIN_DATA_QUALITY = 0.98
          POTENTIAL_SCORE_MIN = 70.0
          FORMING_CANDLE_MIN_BODY_RATIO = 0.35
          MIN_CONFIRMED_RR = 2.0

          # Execution-quality controls. Explicit constants prevent silent runtime
          # failures and keep the trigger model auditable.
          ENTRY_BUFFER_ATR = 0.10
          ENTRY_MAX_CHASE_ATR = 0.50
          TRIGGER_SWING_LOOKBACK = 2
          TRIGGER_SWING_WINDOW = 40

          # Institutional-style top-of-book execution model. LSE supplies live
          # websocket ticks containing bid/ask/price/volume. This model does not
          # pretend to be a full central-limit-order-book model: without depth/queue
          # data we explicitly model only executable top-of-book conditions, quote
          # freshness, spread cost, micro-price movement and chase risk.
          LIVE_TICK_TIMEOUT_SECONDS = 4.0
          LIVE_TICK_MIN_SAMPLES = 3
          MAX_QUOTE_AGE_SECONDS = 3.0
          MAX_SPREAD_ATR = 0.35
          MAX_SPREAD_MEDIAN_MULTIPLIER = 2.50
          EXECUTION_STABILITY_MAX_ATR_PER_TICK = 0.12
          EXECUTION_SCORE_MIN = 70.0
          EXECUTION_STREAM_BATCH = 10

          # Entry-type-specific holding horizons. WAIT is deliberately not a
          # trade type and therefore has no trading horizon.
          ENTRY_HORIZONS = {
              "SCALP": "5M-15M / minutes to under 1 hour",
              "INTRADAY": "15M-4H / same trading day",
              "SWING/HOLD": "1H-1D / multiple days",
              "ADAPTIVE PRICE-MOVEMENT": "15M-1H / minutes to several hours",
              "WAIT": "NOT APPLICABLE — WAIT / no entry",
          }

          def horizon_for(entry_type):
              return ENTRY_HORIZONS.get(entry_type, ENTRY_HORIZONS["WAIT"])

          # Each operational timeframe is evaluated independently. The scanner
          # still downloads the complete multi-timeframe history for every symbol,
          # but a position is tied to the timeframe that actually produced the
          # local 2-of-9 consensus instead of being labelled from aggregate votes.
          POSITION_TIMEFRAME_PROFILES = {
              "4h": {"trade_types": ("SWING/HOLD",), "min_strategies": 2, "min_context_tfs": 1, "context": ("1d",)},
              "1h": {"trade_types": ("INTRADAY", "SWING/HOLD"), "min_strategies": 2, "min_context_tfs": 1, "context": ("4h",)},
              "15m": {"trade_types": ("SCALP", "INTRADAY"), "min_strategies": 2, "min_context_tfs": 1, "context": ("1h",)},
              "5m": {"trade_types": ("SCALP",), "min_strategies": 2, "min_context_tfs": 1, "context": ("15m", "1h")},
          }
          POSITION_TIMEFRAMES = tuple(POSITION_TIMEFRAME_PROFILES.keys())

          def profile_trade_type(tf_name, local_count, local_tf_count):
              if tf_name in ("5m", "15m"):
                  return "SCALP"
              if tf_name == "1h":
                  return "INTRADAY"
              return "SWING/HOLD"

          def execution_quality_score(rr, event_level, level, event_state="NONE"):
              """Score execution quality separately from strategy consensus and event timing."""
              rr_component = 0.0
              if rr is not None:
                  try:
                      rr_component = min(70.0, max(0.0, float(rr) / 2.0 * 70.0))
                  except (TypeError, ValueError):
                      rr_component = 0.0

              news_component = {
                  "IMMEDIATE_HIGH": 0.0,
                  "POST_EVENT_ALIGNED": 20.0,
                  "POST_EVENT_UNCLEAR": 10.0,
                  "POST_EVENT_CONFLICT": 0.0,
                  "UPCOMING": 15.0,
                  "OUTSIDE_IMMEDIATE_WINDOW": 20.0,
                  "NONE": 20.0,
              }.get(str(event_state).upper(), 5.0 if str(event_level).upper() == "HIGH" else 15.0)

              level_component = 10.0 if (
                  isinstance(level, (list, tuple)) and len(level) >= 3 and
                  all(isinstance(x, (int, float)) and math.isfinite(float(x)) for x in level[:3])
              ) else 0.0
              return round(min(100.0, rr_component + news_component + level_component), 1)
          def env_int(name, default):
              try:
                  return int(os.getenv(name, str(default)) or str(default))
              except (TypeError, ValueError):
                  print(f"CONFIG WARNING: {name} is invalid; using {default}")
                  return default
          
          def env_float(name, default):
              try:
                  return float(os.getenv(name, str(default)) or str(default))
              except (TypeError, ValueError):
                  print(f"CONFIG WARNING: {name} is invalid; using {default}")
                  return default
          
          MAX_INSTRUMENTS = max(0, env_int("MAX_INSTRUMENTS", 0))
          TOP_N = max(1, env_int("TOP_N", 5))
          FAST_CANDIDATE_LIMIT = max(1, min(10, env_int("FAST_CANDIDATE_LIMIT", 6)))
          FAST_MIN_SCORE = max(40.0, min(90.0, env_float("FAST_MIN_SCORE", 55.0)))
          RUNTIME_MINUTES = env_float("SCAN_RUNTIME_MINUTES", 8.0)
          if RUNTIME_MINUTES <= 0:
              RUNTIME_MINUTES = 8.0
          RUNTIME_MINUTES = min(RUNTIME_MINUTES, 10.0)
          # Keep a small safety reserve so the scanner stops before the configured budget
          # instead of overrunning it because of final formatting / cleanup.
          RUNTIME_GUARD_SECONDS = 20.0
          SCAN_START = time.monotonic()
          SCAN_BUDGET_SECONDS = max(30.0, RUNTIME_MINUTES * 60.0 - RUNTIME_GUARD_SECONDS)
          SCAN_DEADLINE = SCAN_START + SCAN_BUDGET_SECONDS
          CATEGORIES = [x.strip().lower() for x in os.getenv(
              "LSE_CATEGORIES", "forex,commodity,index,crypto,stock,etf,futures"
          ).split(",") if x.strip()]
          def parse_rss_urls(raw):
              raw = str(raw or "").strip()
              if not raw:
                  return []
              # Accept a JSON string array or a simple comma/newline/semicolon list.
              if raw.startswith("["):
                  try:
                      parsed = json.loads(raw)
                      if isinstance(parsed, list):
                          return [str(x).strip() for x in parsed if str(x).strip()]
                  except Exception:
                      pass
              parts = raw.replace("\n", ",").replace(";", ",").split(",")
              return [x.strip() for x in parts if x.strip()]

          NEWS_URLS = parse_rss_urls(os.getenv("NEWS_RSS_URLS", ""))
          MAJOR_FX = {"EUR/USD","GBP/USD","USD/JPY","USD/CHF","AUD/USD","USD/CAD","NZD/USD","EUR/GBP","EUR/JPY","GBP/JPY","EUR/CHF","AUD/JPY"}
          PRIORITY_METALS = {"XAU/USD","XAG/USD","XPT/USD","XPD/USD"}
          PRIORITY_CRYPTO = {"BTC/USD"}
          FOCUSED_SYMBOLS = MAJOR_FX | PRIORITY_METALS | PRIORITY_CRYPTO
          SYMBOL_ALIASES = {
          "EURUSD":"EUR/USD","EUR-USD":"EUR/USD","EUR_USD":"EUR/USD",
          "GBPUSD":"GBP/USD","GBP-USD":"GBP/USD","GBP_USD":"GBP/USD",
          "USDJPY":"USD/JPY","USD-JPY":"USD/JPY","USD_JPY":"USD/JPY",
          "USDCHF":"USD/CHF","USD-CHF":"USD/CHF","USD_CHF":"USD/CHF",
          "AUDUSD":"AUD/USD","AUD-USD":"AUD/USD","AUD_USD":"AUD/USD",
          "USDCAD":"USD/CAD","USD-CAD":"USD/CAD","USD_CAD":"USD/CAD",
          "NZDUSD":"NZD/USD","NZD-USD":"NZD/USD","NZD_USD":"NZD/USD",
          "EURGBP":"EUR/GBP","EUR-GBP":"EUR/GBP","EUR_GBP":"EUR/GBP",
          "EURJPY":"EUR/JPY","EUR-JPY":"EUR/JPY","EUR_JPY":"EUR/JPY",
          "GBPJPY":"GBP/JPY","GBP-JPY":"GBP/JPY","GBP_JPY":"GBP/JPY",
          "EURCHF":"EUR/CHF","EUR-CHF":"EUR/CHF","EUR_CHF":"EUR/CHF",
          "AUDJPY":"AUD/JPY","AUD-JPY":"AUD/JPY","AUD_JPY":"AUD/JPY",
          "XAUUSD":"XAU/USD","XAU-USD":"XAU/USD","XAU_USD":"XAU/USD",
          "XAGUSD":"XAG/USD","XAG-USD":"XAG/USD","XAG_USD":"XAG/USD",
          "XPTUSD":"XPT/USD","XPT-USD":"XPT/USD","XPT_USD":"XPT/USD",
          "XPDUSD":"XPD/USD","XPD-USD":"XPD/USD","XPD_USD":"XPD/USD",
          "BTCUSD":"BTC/USD","BTC-USD":"BTC/USD","BTC_USD":"BTC/USD"
          }
          
          # User-requested architecture:
          # 1MO master -> 1D context -> 4H regime -> 1H decision
          # -> 15M setup/confirmation -> 5M trigger.
          # Only LSE-native timeframes are used; no synthetic candles are created.
          #
          # The scanner is analytical only. It never places orders.
          
          def now_utc():
              return datetime.now(timezone.utc)
          
          def parse_ts(v):
              if isinstance(v, (int, float)):
                  return datetime.fromtimestamp(v, tz=timezone.utc)
              s = str(v)
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              dt = datetime.fromisoformat(s)
              return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)
          
          def clean_num(v, default=0.0):
              try:
                  x = float(v)
                  return x if math.isfinite(x) else default
              except Exception:
                  return default
          
          def normalize_rows(raw):
              if isinstance(raw, dict):
                  for key in ("data", "rows", "candles", "results"):
                      if isinstance(raw.get(key), list):
                          raw = raw[key]
                          break
              if not isinstance(raw, list):
                  return []
              out = []
              for r in raw:
                  if not isinstance(r, dict):
                      continue
                  # Accept the common OHLCV spellings without guessing a price.
                  ts = r.get("timestamp", r.get("time", r.get("datetime")))
                  if ts is None:
                      continue
                  try:
                      dt = parse_ts(ts)
                  except Exception:
                      continue
                  c = {
                      "timestamp": dt,
                      "open": clean_num(r.get("open")),
                      "high": clean_num(r.get("high")),
                      "low": clean_num(r.get("low")),
                      "close": clean_num(r.get("close")),
                      "volume": clean_num(r.get("volume", 0.0)),
                  }
                  if c["high"] < max(c["open"], c["close"]) or c["low"] > min(c["open"], c["close"]):
                      continue
                  if c["high"] < c["low"]:
                      continue
                  out.append(c)
              out.sort(key=lambda x: x["timestamp"])
              return out
          
          def timeframe_minutes(tf):
              return {"5m": 5, "15m": 15, "1h": 60, "4h": 240, "1d": 1440}[tf]

          def remove_incomplete(rows, tf):
              if not rows:
                  return []
              cutoff = now_utc()
              if tf == "1mo":
                  # Exclude the currently forming calendar month.
                  return [
                      r for r in rows
                      if not (r["timestamp"].year == cutoff.year and r["timestamp"].month == cutoff.month)
                  ]
              mins = timeframe_minutes(tf)
              return [
                  r for r in rows
                  if r["timestamp"] + timedelta(minutes=mins) <= cutoff
              ]

          def _candle_request(client, symbol, tf, limit):
              global LAST_API_REQUEST_AT
              last = None
              for attempt in range(API_MAX_RETRIES):
                  try:
                      elapsed = time.monotonic() - LAST_API_REQUEST_AT
                      if elapsed < API_MIN_INTERVAL_SECONDS:
                          time.sleep(API_MIN_INTERVAL_SECONDS - elapsed)
                      try:
                          result = client.candles(symbol, timeframe=tf, limit=int(limit), order="desc")
                      except TypeError:
                          result = client.candles(symbol, tf, limit=int(limit), order="desc")
                      LAST_API_REQUEST_AT = time.monotonic()
                      return result
                  except Exception as exc:
                      last = exc
                      msg = str(exc).lower()
                      transient = (
                          "503" in msg or "502" in msg or "504" in msg or
                          "timeout" in msg or "timed out" in msg or "saturated" in msg
                      )
                      if not transient or attempt == API_MAX_RETRIES - 1:
                          raise
                      delay = API_RETRY_BASE_SECONDS * (2 ** attempt)
                      print(f"  LSE transient {type(exc).__name__} {symbol} {tf}; retry {attempt+1}/{API_MAX_RETRIES-1} in {delay:.1f}s")
                      time.sleep(delay)
              raise last


          def fetch_candles(client, symbol, tf, limit=None):
              use_limit = int(limit or FETCH_LIMIT[tf])
              raw = _candle_request(client, symbol, tf, use_limit)
              rows = remove_incomplete(normalize_rows(raw), tf)
              return rows[-use_limit:]

          def fetch_candles_with_forming(client, symbol, tf, limit=None):
              use_limit = int(limit or FETCH_LIMIT[tf])
              raw = _candle_request(client, symbol, tf, use_limit)
              normalized = normalize_rows(raw)
              closed = remove_incomplete(normalized, tf)
              forming = None
              if tf in ("1h", "15m", "5m"):  # HTF never exposes a forming candle
                  cutoff = now_utc()
                  incomplete_rows = [r for r in normalized if r["timestamp"] + timedelta(minutes=timeframe_minutes(tf)) > cutoff]
                  if incomplete_rows:
                      forming = incomplete_rows[-1]
              return closed[-use_limit:], forming

          def closed_breakout_level(closed_rows, side):
              """Structural breakout level derived exclusively from CLOSED candles."""
              if not closed_rows or side not in ("BUY", "SELL"):
                  return None
              last = closed_rows[-1]
              try:
                  last_high = float(last["high"])
                  last_low = float(last["low"])
              except (TypeError, ValueError, KeyError):
                  return None
              sample = closed_rows[-TRIGGER_SWING_WINDOW:]
              highs, lows = swings(sample, TRIGGER_SWING_LOOKBACK)
              if side == "BUY":
                  swing_level = float(highs[-1][1]) if highs else last_high
                  return max(last_high, swing_level)
              swing_level = float(lows[-1][1]) if lows else last_low
              return min(last_low, swing_level)

          def _tick_value(tick, key, default=None):
              if isinstance(tick, dict):
                  return tick.get(key, default)
              return getattr(tick, key, default)

          def collect_live_quotes(client, symbols, timeout=LIVE_TICK_TIMEOUT_SECONDS):
              """Collect a short, bounded LSE websocket snapshot for execution modelling.

              The stream is intentionally separated from candle analysis. No tick can
              alter the nine-strategy directional score; ticks only determine whether a
              pre-existing closed-candle trigger is actually executable now.
              """
              symbols = [str(x) for x in symbols if str(x).strip()]
              if not symbols:
                  return {}
              buckets = defaultdict(lambda: deque(maxlen=60))
              lock = threading.Lock()

              def on_tick(tick):
                  symbol = _tick_value(tick, "symbol")
                  if not symbol:
                      return
                  try:
                      bid = float(_tick_value(tick, "bid", 0) or 0)
                      ask = float(_tick_value(tick, "ask", 0) or 0)
                      price = float(_tick_value(tick, "price", 0) or 0)
                      volume = float(_tick_value(tick, "volume", 0) or 0)
                      ts_raw = _tick_value(tick, "timestamp")
                      if ts_raw is None:
                          ts = now_utc()
                      else:
                          ts = parse_ts(ts_raw)
                      if bid <= 0 or ask <= 0 or ask < bid:
                          return
                      with lock:
                          buckets[str(symbol)].append({
                              "timestamp": ts, "bid": bid, "ask": ask,
                              "price": price, "volume": volume
                          })
                  except (TypeError, ValueError, OverflowError):
                      return

              stream_client = LSE(api_key=api_key)
              stream_client.on("tick", on_tick)
              worker_error = []

              def run_stream():
                  try:
                      stream_client.connect(symbols=symbols)
                  except TypeError:
                      try:
                          stream_client.connect(symbols)
                      except Exception as exc:
                          worker_error.append(exc)
                  except Exception as exc:
                      worker_error.append(exc)

              thread = threading.Thread(target=run_stream, daemon=True)
              thread.start()
              time.sleep(max(0.5, float(timeout)))
              try:
                  stream_client.disconnect()
              except Exception:
                  pass
              thread.join(timeout=2.0)
              if worker_error:
                  print(f"LIVE QUOTE STREAM WARNING: {type(worker_error[0]).__name__}: {worker_error[0]}")
              with lock:
                  return {symbol: list(rows) for symbol, rows in buckets.items()}

          def execution_market_model(ticks, side, trigger_price, atr_value):
              """Top-of-book execution/TCA gate using real LSE bid/ask ticks.

              BUY execution uses ASK; SELL execution uses BID. Mid/last price is never
              substituted for the executable side. This is deliberately a top-of-book
              model, not a full depth/queue/market-impact model.
              """
              base = {
                  "state":"NO_LIVE_QUOTE", "executable_price":None, "bid":None, "ask":None,
                  "mid":None, "spread":None, "spread_atr":None, "spread_bps":None,
                  "quote_age_seconds":None, "tick_count":0, "median_spread":None,
                  "spread_vs_median":None, "micro_move_atr_per_tick":None,
                  "trigger_crossed":False, "chase_distance_atr":None,
                  "execution_score":0.0, "slippage_proxy_atr":None,
                  "arrival_mid":None, "implementation_shortfall_bps":None,
                  "adverse_move_bps":None, "spread_cost_bps":None,
                  "observation_seconds":0.0,
                  "reason":"no valid bid/ask ticks"
              }
              if side not in ("BUY","SELL") or trigger_price is None or not atr_value or atr_value <= 0:
                  return base
              valid = []
              for t in ticks or []:
                  try:
                      bid, ask = float(t["bid"]), float(t["ask"])
                      ts = t["timestamp"]
                      if bid > 0 and ask >= bid and ask > 0:
                          valid.append((ts, bid, ask))
                  except (KeyError, TypeError, ValueError):
                      continue
              if not valid:
                  return base
              valid.sort(key=lambda x:x[0])
              ts, bid, ask = valid[-1]
              age = max(0.0, (now_utc() - ts).total_seconds())
              mid_series = [(b+a)/2.0 for _, b, a in valid]
              spreads = [a-b for _, b, a in valid]
              arrival_mid = mid_series[0]
              observation_seconds = max(0.0, (valid[-1][0] - valid[0][0]).total_seconds())
              spread = ask-bid
              median_spread = statistics.median(spreads) if spreads else spread
              mid = (bid+ask)/2.0
              executable = ask if side == "BUY" else bid
              crossed = executable >= float(trigger_price) if side == "BUY" else executable <= float(trigger_price)
              implementation_shortfall_bps = (
                  ((executable-arrival_mid)/max(arrival_mid,1e-12))*10000.0
                  if side == "BUY" else
                  ((arrival_mid-executable)/max(arrival_mid,1e-12))*10000.0
              )
              adverse_move_bps = (
                  ((mid-arrival_mid)/max(arrival_mid,1e-12))*10000.0
                  if side == "BUY" else
                  ((arrival_mid-mid)/max(arrival_mid,1e-12))*10000.0
              )
              spread_cost_bps = (spread/max(mid,1e-12))*5000.0
              chase = abs(executable-float(trigger_price))/atr_value
              spread_atr = spread/atr_value
              spread_bps = (spread/max(mid,1e-12))*10000.0
              spread_vs_median = spread/max(median_spread,1e-12)
              micro_moves = [abs(mid_series[i]-mid_series[i-1])/atr_value for i in range(1,len(mid_series))]
              micro_move = statistics.median(micro_moves) if micro_moves else 0.0

              score = 100.0
              reasons = []
              if age > MAX_QUOTE_AGE_SECONDS:
                  score -= 45.0; reasons.append(f"quote stale by {age:.2f}s")
              if spread_atr > MAX_SPREAD_ATR:
                  score -= 25.0; reasons.append(f"spread is {spread_atr:.2f} ATR")
              if spread_vs_median > MAX_SPREAD_MEDIAN_MULTIPLIER:
                  score -= 20.0; reasons.append(f"spread is {spread_vs_median:.1f}x snapshot median")
              if micro_move > EXECUTION_STABILITY_MAX_ATR_PER_TICK:
                  score -= 20.0; reasons.append(f"micro-price movement {micro_move:.2f} ATR/tick is unstable")
              if chase > ENTRY_MAX_CHASE_ATR:
                  score -= 30.0; reasons.append(f"execution price is {chase:.2f} ATR beyond trigger")
              if implementation_shortfall_bps > max(2.0, spread_bps * 1.5):
                  score -= 10.0; reasons.append(f"estimated implementation shortfall {implementation_shortfall_bps:.2f} bps is elevated")
              if len(valid) < LIVE_TICK_MIN_SAMPLES:
                  score -= 15.0; reasons.append(f"only {len(valid)} valid quote samples")
              score = max(0.0, min(100.0, score))

              if age > MAX_QUOTE_AGE_SECONDS:
                  state = "STALE_QUOTE"
              elif spread_atr > MAX_SPREAD_ATR or spread_vs_median > MAX_SPREAD_MEDIAN_MULTIPLIER:
                  state = "WIDE_SPREAD"
              elif micro_move > EXECUTION_STABILITY_MAX_ATR_PER_TICK:
                  state = "MICROSTRUCTURE_UNSTABLE"
              elif crossed and chase > ENTRY_MAX_CHASE_ATR:
                  state = "OVEREXTENDED"
              elif crossed:
                  state = "EXECUTABLE_TRIGGER_CROSSED"
              else:
                  state = "WAITING_FOR_TRIGGER"

              slippage_proxy = (spread/2.0)/atr_value + max(0.0, micro_move)
              reason = "; ".join(reasons) if reasons else (
                  "fresh executable quote; trigger not crossed" if not crossed else
                  "fresh executable quote crossed the closed-candle trigger"
              )
              return {
                  "state":state, "executable_price":executable, "bid":bid, "ask":ask, "mid":mid,
                  "spread":spread, "spread_atr":spread_atr, "spread_bps":spread_bps,
                  "quote_age_seconds":age, "tick_count":len(valid), "median_spread":median_spread,
                  "spread_vs_median":spread_vs_median, "micro_move_atr_per_tick":micro_move,
                  "trigger_crossed":crossed, "chase_distance_atr":chase,
                  "execution_score":round(score,1), "slippage_proxy_atr":slippage_proxy,
                  "arrival_mid":arrival_mid, "implementation_shortfall_bps":implementation_shortfall_bps,
                  "adverse_move_bps":adverse_move_bps, "spread_cost_bps":spread_cost_bps,
                  "observation_seconds":observation_seconds,
                  "reason":reason
              }

          def execution_trigger_state(closed_rows, live_quote=None, side=None):
              """Closed-candle trigger + real executable bid/ask validation."""
              if not closed_rows or side not in ("BUY","SELL"):
                  return {"state":"UNAVAILABLE","signal":"NEUTRAL","trigger_price":None,
                          "current_price":None,"reason":"closed execution history unavailable"}
              av = atr(closed_rows) or 0.0
              if av <= 0:
                  return {"state":"UNAVAILABLE","signal":"NEUTRAL","trigger_price":None,
                          "current_price":None,"reason":"ATR unavailable"}
              reference = closed_breakout_level(closed_rows, side)
              if reference is None:
                  return {"state":"UNAVAILABLE","signal":"NEUTRAL","trigger_price":None,
                          "current_price":None,"reason":"closed structural trigger unavailable"}
              trigger = float(reference + av * ENTRY_BUFFER_ATR) if side == "BUY" else float(reference - av * ENTRY_BUFFER_ATR)
              model = execution_market_model((live_quote or {}).get("ticks", []), side, trigger, av)
              model.update({
                  "trigger_price":trigger,
                  "reference_candle_timestamp":str(closed_rows[-1].get("timestamp")),
                  "signal": side if model.get("state") == "EXECUTABLE_TRIGGER_CROSSED" and model.get("execution_score",0) >= EXECUTION_SCORE_MIN else "NEUTRAL",
                  "current_price":model.get("executable_price"),
              })
              return model

          def closed_candle_bias(rows):
              """Directional candle evidence from the last CLOSED candle only."""
              return candle_signal(rows)

          def ema(values, period):
              if len(values) < period:
                  return [None] * len(values)
              alpha = 2.0 / (period + 1)
              out = [None] * (period - 1)
              e = statistics.fmean(values[:period])
              out.append(e)
              for v in values[period:]:
                  e = alpha * v + (1 - alpha) * e
                  out.append(e)
              return out
          
          def rsi(values, period=14):
              if len(values) <= period:
                  return None
              gains, losses = [], []
              for i in range(1, len(values)):
                  d = values[i] - values[i - 1]
                  gains.append(max(d, 0))
                  losses.append(max(-d, 0))
              ag = statistics.fmean(gains[:period])
              al = statistics.fmean(losses[:period])
              for g, l in zip(gains[period:], losses[period:]):
                  ag = (ag * (period - 1) + g) / period
                  al = (al * (period - 1) + l) / period
              if al == 0:
                  return 100.0
              return 100.0 - (100.0 / (1.0 + ag / al))
          
          def atr(rows, period=14):
              if len(rows) <= period:
                  return None
              trs = []
              for i in range(1, len(rows)):
                  h, l, pc = rows[i]["high"], rows[i]["low"], rows[i-1]["close"]
                  trs.append(max(h-l, abs(h-pc), abs(l-pc)))
              return statistics.fmean(trs[-period:])
          
          def macd(values):
              e12, e26 = ema(values, 12), ema(values, 26)
              series = [(a-b) for a, b in zip(e12, e26) if a is not None and b is not None]
              if len(series) < 9:
                  return 0.0, 0.0
              sig = ema(series, 9)
              return series[-1], sig[-1] if sig[-1] is not None else 0.0
          
          def swings(rows, lookback=2):
              highs, lows = [], []
              for i in range(lookback, len(rows)-lookback):
                  h = rows[i]["high"]
                  l = rows[i]["low"]
                  if h == max(x["high"] for x in rows[i-lookback:i+lookback+1]):
                      highs.append((i, h))
                  if l == min(x["low"] for x in rows[i-lookback:i+lookback+1]):
                      lows.append((i, l))
              return highs, lows
          
          def direction(rows):
              if len(rows) < 30:
                  return "NEUTRAL"
              c = [x["close"] for x in rows]
              e20, e50 = ema(c, 20), ema(c, 50)
              if e20[-1] is None or e50[-1] is None:
                  return "NEUTRAL"
              if c[-1] > e20[-1] > e50[-1]:
                  return "BUY"
              if c[-1] < e20[-1] < e50[-1]:
                  return "SELL"
              return "NEUTRAL"
          
          def structure_signal(rows):
              if len(rows) < 20:
                  return "NEUTRAL", "insufficient structure"
              highs, lows = swings(rows[-80:], 2)
              if len(highs) < 2 or len(lows) < 2:
                  return "NEUTRAL", "insufficient swing structure"
              last_h, prev_h = highs[-1][1], highs[-2][1]
              last_l, prev_l = lows[-1][1], lows[-2][1]
              if last_h > prev_h and last_l > prev_l:
                  return "BUY", "bullish HH + HL"
              if last_h < prev_h and last_l < prev_l:
                  return "SELL", "bearish LH + LL"
              return "NEUTRAL", "mixed structure"
          
          def candle_signal(rows):
              if len(rows) < 3:
                  return "NEUTRAL", "insufficient candles"
              a, b = rows[-2], rows[-1]
              body = abs(b["close"] - b["open"])
              rng = max(b["high"] - b["low"], 1e-12)
              bull = b["close"] > b["open"]
              bear = b["close"] < b["open"]
              engulf_bull = bull and a["close"] < a["open"] and b["close"] >= a["open"] and b["open"] <= a["close"]
              engulf_bear = bear and a["close"] > a["open"] and b["open"] >= a["close"] and b["close"] <= a["open"]
              if engulf_bull or (bull and body/rng >= 0.65):
                  return "BUY", "bullish impulse/engulfing"
              if engulf_bear or (bear and body/rng >= 0.65):
                  return "SELL", "bearish impulse/engulfing"
              return "NEUTRAL", "no strong price action"
          
          def liquidity_signal(rows):
              if len(rows) < 25:
                  return "NEUTRAL", "insufficient liquidity history"
              prior = rows[-21:-1]
              last = rows[-1]
              hi = max(x["high"] for x in prior)
              lo = min(x["low"] for x in prior)
              # Sweep then close back inside = liquidity event.
              if last["low"] < lo and last["close"] > lo:
                  return "BUY", "sell-side liquidity sweep"
              if last["high"] > hi and last["close"] < hi:
                  return "SELL", "buy-side liquidity sweep"
              return "NEUTRAL", "no fresh sweep"
          
          def fib_signal(rows):
              if len(rows) < 40:
                  return "NEUTRAL", "insufficient swing range"
              highs, lows = swings(rows[-100:], 2)
              if not highs or not lows:
                  return "NEUTRAL", "no usable swing"
              h = highs[-1][1]
              l = lows[-1][1]
              span = h - l
              if span <= 0:
                  return "NEUTRAL", "invalid swing range"
              p = rows[-1]["close"]
              retr = (p-l)/span
              if 0.382 <= retr <= 0.618:
                  # Direction follows the current trend rather than guessing from the fib alone.
                  d = direction(rows)
                  return d, "price in 0.382-0.618 retracement zone" if d != "NEUTRAL" else "fib zone, trend unclear"
              return "NEUTRAL", "fib zone not near"
          
          def trend_signal(rows):
              d = direction(rows)
              return d, ("EMA alignment" if d != "NEUTRAL" else "mixed EMA alignment")
          
          def indicator_signal(rows):
              c = [x["close"] for x in rows]
              rv = rsi(c)
              m, s = macd(c)
              if rv is None:
                  return "NEUTRAL", "RSI unavailable"
              if rv >= 55 and m > s:
                  return "BUY", f"RSI {rv:.1f} / MACD bullish"
              if rv <= 45 and m < s:
                  return "SELL", f"RSI {rv:.1f} / MACD bearish"
              return "NEUTRAL", f"RSI {rv:.1f} / MACD mixed"
          
          def session_signal(rows, category):
              # Session is a context filter, not a standalone reason to enter.
              if not rows:
                  return "NEUTRAL", "session unavailable"
              h = rows[-1]["timestamp"].hour
              # London/NY overlap in UTC approximately 13:00-16:00, with DST handled
              # imperfectly; this is intentionally a soft score only.
              if 13 <= h < 16:
                  return direction(rows), "London + New York overlap"
              if 7 <= h < 16:
                  return direction(rows), "London session"
              if 13 <= h < 21:
                  return direction(rows), "New York session"
              return "NEUTRAL", "outside preferred session"
          
          def smc_signal(rows):
              if len(rows) < 30:
                  return "NEUTRAL", "insufficient MSS history"
              last = rows[-1]
              hi = max(x["high"] for x in rows[-21:-1])
              lo = min(x["low"] for x in rows[-21:-1])
              if last["close"] > hi:
                  return "BUY", "bullish MSS / structure break"
              if last["close"] < lo:
                  return "SELL", "bearish MSS / structure break"
              # A sweep alone is not promoted to MSS.
              return "NEUTRAL", "no confirmed MSS"
          
          def supply_demand_signal(rows):
              if len(rows) < 30:
                  return "NEUTRAL", "insufficient impulse history"
              a, b = rows[-2], rows[-1]
              atrv = atr(rows)
              if atrv is None:
                  return "NEUTRAL", "ATR unavailable"
              body = abs(b["close"] - b["open"])
              if body >= 1.2 * atrv:
                  return ("BUY", "demand zone + bullish impulse") if b["close"] > b["open"] else ("SELL", "supply zone + bearish impulse")
              return "NEUTRAL", "no strong impulse"
          
          def fair_value_gaps(rows, lookback=80):
              """Detect real closed-candle three-candle imbalances."""
              if len(rows) < 3:
                  return []
              sample = rows[-lookback:]
              out = []
              for i in range(2, len(sample)):
                  a, b, c = sample[i-2], sample[i-1], sample[i]
                  av = atr(sample[:i+1])
                  if c["low"] > a["high"]:
                      gap = c["low"] - a["high"]
                      out.append({"side":"BUY","timestamp":c["timestamp"],"low":a["high"],"high":c["low"],"gap":gap,"quality":gap/av if av and av > 0 else 0.0,"mitigated":any(x["low"] <= a["high"] for x in sample[i+1:])})
                  if c["high"] < a["low"]:
                      gap = a["low"] - c["high"]
                      out.append({"side":"SELL","timestamp":c["timestamp"],"low":c["high"],"high":a["low"],"gap":gap,"quality":gap/av if av and av > 0 else 0.0,"mitigated":any(x["high"] >= a["low"] for x in sample[i+1:])})
              return out
          
          def fvg_signal(rows):
              fresh = [g for g in fair_value_gaps(rows) if not g["mitigated"]]
              if not fresh:
                  return "NEUTRAL", "no fresh unmitigated FVG", None
              g = fresh[-1]
              strength = "strong" if g["quality"] >= 0.25 else "normal"
              return g["side"], f"{strength} unmitigated FVG {g['low']:.6g}-{g['high']:.6g}", g
          
          def data_quality_report(rows):
              """Validate candle integrity before using precision levels."""
              if not rows:
                  return {"score":0.0,"ok":False,"issues":["NO_DATA"],"duplicate_timestamps":0,"bad_ohlc":0}
              bad_ohlc = 0
              duplicate = 0
              ts = []
              for r in rows:
                  try:
                      o,h,l,c = [float(r[k]) for k in ("open","high","low","close")]
                      if not all(math.isfinite(x) for x in (o,h,l,c)) or h < max(o,c) or l > min(o,c) or h < l:
                          bad_ohlc += 1
                  except Exception:
                      bad_ohlc += 1
                  try: ts.append(parse_ts(r.get("timestamp")))
                  except Exception: pass
              for a,b in zip(ts, ts[1:]):
                  if b <= a: duplicate += 1
              score = max(0.0, 1.0 - (bad_ohlc + duplicate) / max(len(rows),1))
              issues = ([f"BAD_OHLC={bad_ohlc}"] if bad_ohlc else []) + ([f"NON_MONOTONIC_TS={duplicate}"] if duplicate else [])
              ok = len(rows) >= 80 and score >= MIN_DATA_QUALITY
              if not ok and not issues: issues.append("INSUFFICIENT_HISTORY")
              return {"score":round(score,4),"ok":ok,"issues":issues,"duplicate_timestamps":duplicate,"bad_ohlc":bad_ohlc}

          def volatility_regime(rows):
              """Classify current ATR/price against its recent distribution."""
              if len(rows) < 60: return {"state":"UNKNOWN","ratio":None,"percentile":None}
              vals=[]
              for i in range(30,len(rows)):
                  a=atr(rows[:i+1])
                  try: px=float(rows[i]["close"])
                  except Exception: continue
                  if a and px>0: vals.append(a/px)
              if len(vals)<20: return {"state":"UNKNOWN","ratio":None,"percentile":None}
              cur=vals[-1]; rank=sum(x<=cur for x in vals)/len(vals)*100.0
              state="EXTREME_HIGH" if rank>=85 else "HIGH" if rank>=65 else "LOW" if rank<=15 else "NORMAL"
              return {"state":state,"ratio":cur,"percentile":round(rank,1)}

          def liquidity_sweep_setup(rows):
              """Detect a closed-candle sweep through a recent swing followed by a reclaim."""
              if len(rows)<30: return None
              sample=rows[-50:]; last=sample[-1]; av=atr(sample)
              if not av or av<=0: return None
              highs,lows=swings(sample[:-2],2)
              candidates=[]
              for level in [float(x[1]) for x in lows][-5:]:
                  if float(last["low"])<level<float(last["close"]):
                      rng=max(float(last["high"])-float(last["low"]),1e-12)
                      candidates.append(("BUY",level,(level-float(last["low"]))/av,abs(float(last["close"])-float(last["open"]))/rng))
              for level in [float(x[1]) for x in highs][-5:]:
                  if float(last["high"])>level>float(last["close"]):
                      rng=max(float(last["high"])-float(last["low"]),1e-12)
                      candidates.append(("SELL",level,(float(last["high"])-level)/av,abs(float(last["close"])-float(last["open"]))/rng))
              if not candidates: return None
              side,level,w,b=max(candidates,key=lambda x:(x[2],x[3]))
              return {"side":side,"liquidity_level":level,"wick_atr":round(w,3),"body_ratio":round(b,3),"timestamp":str(last.get("timestamp"))}

          def sniper_opportunity(trigger_rows, setup_rows):
              """Precision setup: liquidity sweep + displacement/MSS + fresh FVG + executable target."""
              if len(trigger_rows)<80 or len(setup_rows)<80: return None
              if not data_quality_report(trigger_rows)["ok"] or not data_quality_report(setup_rows)["ok"]: return None
              sweep=liquidity_sweep_setup(trigger_rows)
              if not sweep: return None
              av=atr(trigger_rows)
              if not av or av<=0: return None
              last=trigger_rows[-1]; rng=max(float(last["high"])-float(last["low"]),1e-12); body=abs(float(last["close"])-float(last["open"]))
              prior=[float(x["high"])-float(x["low"]) for x in trigger_rows[-30:-1]]
              med=statistics.median(prior) if prior else rng
              displacement=(body/rng>=0.55 and rng>=1.15*av and rng>=1.20*med)
              mss_sig,mss_why=smc_signal(trigger_rows)
              structure_sig,structure_why=structure_signal(trigger_rows)
              fvg_sig,fvg_why,fvg=fvg_signal(trigger_rows)
              fvg_ok=fvg is not None and fvg_sig==sweep["side"] and fvg.get("quality",0)>=0.12
              htf_sig,_=smc_signal(setup_rows)
              score=min(100.0, (28 if sweep else 0)+(24 if displacement else 0)+(20 if mss_sig==sweep["side"] else 0)+(12 if structure_sig==sweep["side"] else 0)+(16 if fvg_ok else 0)+(10 if htf_sig==sweep["side"] else 0))
              if fvg_ok:
                  lo,hi=float(fvg["low"]),float(fvg["high"]); entry=(lo+hi)/2.0; zone=[lo,hi]
              else:
                  entry=float(last["close"]); zone=[entry,entry]
              sl=sweep["liquidity_level"]-0.20*av if sweep["side"]=="BUY" else sweep["liquidity_level"]+0.20*av
              risk=abs(entry-sl)
              if risk<=0: return None
              highs,lows=swings(trigger_rows[-80:],2)
              targets=sorted([float(x[1]) for x in highs if float(x[1])>entry]) if sweep["side"]=="BUY" else sorted([float(x[1]) for x in lows if float(x[1])<entry],reverse=True)
              targets=[x for x in targets if abs(x-entry)/risk>=1.5]
              if not targets: return None
              tp=targets[0]; rr=abs(tp-entry)/risk; current=float(last["close"]); distance=abs(current-entry)/av
              in_zone=fvg_ok and distance<=SNIPER_MAX_ENTRY_DISTANCE_ATR
              confirmed=score>=SNIPER_MIN_SCORE and displacement and fvg_ok and mss_sig==sweep["side"] and structure_sig==sweep["side"] and rr>=MIN_CONFIRMED_RR and in_zone
              status="CONFIRMED SNIPER" if confirmed else "SNIPER WATCH"
              return {"type":"SNIPER","side":sweep["side"],"score":round(score,1),"status":status,"entry":entry,"entry_zone":zone,"sl":sl,"tp":tp,"rr":rr,"atr":av,"distance_atr":distance,"in_entry_zone":in_zone,"liquidity_sweep":sweep,"displacement":displacement,"mss":mss_sig,"mss_why":mss_why,"structure":structure_sig,"structure_why":structure_why,"fvg":fvg,"fvg_signal":fvg_sig,"fvg_why":fvg_why,"higher_tf_context":htf_sig,"higher_tf_agrees":htf_sig==sweep["side"],"reason":"sweep + displacement/MSS + fresh FVG"}

          def opportunity_type_classifier(side, methods, sniper=None):
              if side not in ("BUY","SELL"): return []
              sig={m.get("name"):m.get("signal") for m in methods}; labels=[]
              if sniper and sniper.get("side")==side: labels.append("SNIPER")
              if sig.get("Trend")==side and sig.get("Price Action")==side: labels.append("TREND/MOMENTUM")
              if sig.get("Trend")==side and sig.get("Supply/Demand")==side: labels.append("PULLBACK")
              if sig.get("Liquidity")==side and sig.get("Market Structure")==side: labels.append("LIQUIDITY REVERSAL")
              if sig.get("Price Action")==side and sig.get("Market Structure")==side and sig.get("Trend")!=side: labels.append("BREAKOUT/STRUCTURE SHIFT")
              if sig.get("RSI+MACD")==side and sig.get("Trend")!=side: labels.append("MEAN REVERSION")
              return labels or ["MULTI-TF CONSENSUS"]

          def smc_core(rows):
              """SMC is one of nine independent directional methods; it never creates a mandatory direction."""
              structure_sig, structure_why = structure_signal(rows)
              mss_sig, mss_why = smc_signal(rows)
              liq_sig, liq_why = liquidity_signal(rows)
              fvg_sig, fvg_why, fvg = fvg_signal(rows)
          
              votes = [
                  ("Structure", structure_sig, structure_why),
                  ("MSS/CHoCH", mss_sig, mss_why),
                  ("Liquidity", liq_sig, liq_why),
                  ("FVG", fvg_sig, fvg_why),
              ]
              candidates = []
              for side in ("BUY", "SELL"):
                  aligned_names = [name for name, sig, _ in votes if sig == side]
                  opposed = sum(1 for _, sig, _ in votes if sig in ("BUY","SELL") and sig != side)
                  has_structure = structure_sig == side
                  has_mss = mss_sig == side
                  has_liquidity = liq_sig == side
                  has_fvg = fvg_sig == side
          
                  # SMC is deliberately broader than the previous version:
                  # a valid primary setup needs at least TWO SMC components,
                  # with structure or MSS present. This captures real SMC setups
                  # where a fresh liquidity sweep or FVG is not present on every TF.
                  component_count = len(aligned_names)
                  structural_anchor = has_structure or has_mss
                  strong_combo = (
                      (has_mss and (has_structure or has_liquidity or has_fvg)) or
                      (has_structure and (has_liquidity or has_fvg)) or
                      (has_liquidity and has_fvg)
                  )
                  passed = structural_anchor and component_count >= 2 and opposed <= 1
          
                  score = (
                      (30 if has_mss else 0) +
                      (25 if has_fvg else 0) +
                      (25 if has_structure else 0) +
                      (20 if has_liquidity else 0)
                  )
                  if strong_combo:
                      score += 5
                  score = min(100, score)
          
                  candidates.append((score, side, passed, component_count, opposed))
          
              candidates.sort(key=lambda x: (x[0], x[3], -x[4]), reverse=True)
              if not candidates or candidates[0][0] == 0:
                  return {"side":"NEUTRAL","passed":False,"score":0,"aligned":0,"opposed":0,"evidence":votes,"why":"no actionable SMC core"}
          
              top = candidates[0]
              # Equal SMC evidence on BUY and SELL is a tie, not a directional signal.
              tied = [x for x in candidates if x[0] == top[0] and x[3] == top[3] and x[4] == top[4]]
              if len(tied) > 1:
                  return {
                      "side":"NEUTRAL","passed":False,"score":top[0],"aligned":top[3],"opposed":top[4],
                      "evidence":votes,
                      "why":"SMC BUY/SELL evidence is tied; no directional edge"
                  }
          
              score, side, passed, aligned, opposed = top
              if not passed:
                  return {
                      "side":side,"passed":False,"score":score,"aligned":aligned,"opposed":opposed,
                      "evidence":votes,
                      "why":"SMC evidence is developing; at least two aligned SMC components with a structural anchor are required"
                  }
              return {
                  "side":side,"passed":True,"score":score,"aligned":aligned,"opposed":opposed,
                  "evidence":votes,
                  "why":"primary SMC structure/MSS/liquidity/FVG gate passed"
              }
          
          def method_scores(rows):
              """Supporting confirmation layer only. SMC components are evaluated separately by smc_core."""
              methods = []
              funcs = [
                  ("Supply/Demand", supply_demand_signal),
                  ("Price Action", candle_signal),
                  ("Fibonacci", fib_signal),
                  ("Trend", trend_signal),
                  ("RSI+MACD", indicator_signal),
                  ("Session", lambda x: session_signal(x, "")),
              ]
              for name, fn in funcs:
                  try:
                      sig, why = fn(rows)
                  except Exception as exc:
                      sig, why = "NEUTRAL", f"method error: {type(exc).__name__}"
                  points = 1 if sig in ("BUY", "SELL") else 0
                  methods.append({"name": name, "signal": sig, "why": why, "points": points})
              return methods
          
          def method_side_score(methods, side):
              """Directional evidence from supporting methods only; SMC remains primary."""
              if side not in ("BUY", "SELL"):
                  return 0.0
              aligned = sum(1 for m in methods if m["signal"] == side)
              opposed = sum(1 for m in methods if m["signal"] in ("BUY", "SELL") and m["signal"] != side)
              # Reward aligned methods, lightly penalize direct opposition, never punish missing/neutral methods.
              total = max(len(methods), 1)
              return max(0.0, min(100.0, (aligned / total) * 100.0 - (opposed / total) * 20.0))
          
          def dominant_signal(methods, minimum=3):
              b = sum(m["points"] for m in methods if m["signal"] == "BUY")
              s = sum(m["points"] for m in methods if m["signal"] == "SELL")
              if b > s and b >= minimum:
                  return "BUY"
              if s > b and s >= minimum:
                  return "SELL"
              return "NEUTRAL"
          
          def levels(rows, side, entry_price=None):
              """Build SL/TP from real market structure. Never manufacture a 2R target."""
              a = atr(rows)
              if a is None or a <= 0:
                  return None
              if entry_price is not None:
                  try:
                      candidate_price = float(entry_price)
                  except (TypeError, ValueError):
                      candidate_price = rows[-1]["close"]
                  price = candidate_price if math.isfinite(candidate_price) and candidate_price > 0 else rows[-1]["close"]
              else:
                  price = rows[-1]["close"]
              highs, lows = swings(rows[-100:], 2)
          
              if side == "BUY":
                  stop_candidates = [x[1] for x in lows if x[1] < price]
                  if not stop_candidates:
                      return None
                  sl = max(stop_candidates[-3:]) - 0.25 * a
                  risk = price - sl
                  if risk <= 0:
                      return None
          
                  # Report the nearest meaningful opposing swing even below 2R.
                  # >=2R is evaluated later as a risk-quality confirmation gate.
                  targets = sorted(set(x[1] for x in highs if x[1] > price))
                  if not targets:
                      return None
                  tp = targets[0]
                  return price, sl, tp, a
          
              if side == "SELL":
                  stop_candidates = [x[1] for x in highs if x[1] > price]
                  if not stop_candidates:
                      return None
                  sl = min(stop_candidates[-3:]) + 0.25 * a
                  risk = sl - price
                  if risk <= 0:
                      return None
          
                  # Report the nearest meaningful opposing swing even below 2R.
                  # >=2R is evaluated later as a risk-quality confirmation gate.
                  targets = sorted(set(x[1] for x in lows if x[1] < price), reverse=True)
                  if not targets:
                      return None
                  tp = targets[0]
                  return price, sl, tp, a
          
              return None
          
          def rr_ok(level):
              if not level:
                  return False
              entry, sl, tp, _ = level
              risk = abs(entry-sl)
              reward = abs(tp-entry)
              return risk > 0 and (reward / risk) >= (2.0 - 1e-9)
          
          def candidate_plan(rows, side, current_price=None):
              """Conditional Entry/SL/TP plan from CLOSED candles only."""
              if side not in ("BUY", "SELL") or not rows:
                  return None
              av = atr(rows)
              if not av or av <= 0:
                  return None
              last = rows[-1]
              reference = closed_breakout_level(rows, side)
              if reference is None:
                  return None
              trigger = float(reference + av * ENTRY_BUFFER_ATR) if side == "BUY" else float(reference - av * ENTRY_BUFFER_ATR)
              level = levels(rows, side, entry_price=trigger)
              if not level:
                  return None
              entry, sl, tp, atrv = level
              risk = abs(entry-sl)
              rr = abs(tp-entry)/max(risk,1e-12)
              current = None
              if current_price is not None:
                  try:
                      candidate = float(current_price)
                      if math.isfinite(candidate) and candidate > 0:
                          current = candidate
                  except (TypeError, ValueError):
                      current = None
              if current is None:
                  return {"entry":entry,"sl":sl,"tp":tp,"rr":rr,"atr":atrv,"entry_trigger":entry,
                          "current_price":None,"trigger_crossed":False,"distance_atr":None,
                          "entry_mode":"STRUCTURAL_BREAKOUT_FROM_CLOSED_CANDLE",
                          "reference_candle":str(last.get("timestamp")),"status":"PENDING_LIVE_PRICE"}
              distance = abs(current-entry)/max(av,1e-12)
              crossed = current >= entry if side == "BUY" else current <= entry
              state = "TRIGGERED" if crossed and distance <= ENTRY_MAX_CHASE_ATR else ("OVEREXTENDED" if crossed else "PENDING")
              return {"entry":entry,"sl":sl,"tp":tp,"rr":rr,"atr":atrv,"entry_trigger":entry,
                      "current_price":current,"trigger_crossed":crossed,"distance_atr":distance,
                      "entry_mode":"STRUCTURAL_BREAKOUT_FROM_CLOSED_CANDLE","reference_candle":str(last.get("timestamp")),"status":state}

          # ----------------------------
          # LSE daily intelligence
