                      out.append({"name":name,"signal":sig,"why":why})
                  return out
          
              strategy_by_tf = {
                  "1mo": nine_strategy_signals(monthly, smc_monthly),
                  "1d": nine_strategy_signals(d, smc_1d),
                  "4h": nine_strategy_signals(h4, smc_4h),
                  "1h": nine_strategy_signals(h1, smc_1h),
                  "15m": nine_strategy_signals(m15, smc_15m),
                  "5m": nine_strategy_signals(m5, smc_5m),
              }
          
              strategy_names = [
                  "SMC","Market Structure","Liquidity","Supply/Demand",
                  "Price Action","Fibonacci","Trend","RSI+MACD","Session"
              ]
              price_method_names = {
                  "Supply/Demand","Price Action","Fibonacci","Trend","RSI+MACD"
              }

              # Any operational timeframe may originate a signal, but only when
              # its own 2-of-9 consensus agrees with the completed monthly bias.
              tf_consensus = {
                  tf_name: dominant(strategy_by_tf.get(tf_name, []), minimum=2)
                  for tf_name in TF
              }
              # Regime context is available before candidate qualification. The
