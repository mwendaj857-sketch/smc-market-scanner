          def safe_call(fn, *args, **kwargs):
              """Bounded retry for transient LSE vault saturation/timeouts; never retries bad requests indefinitely."""
              last = None
              for attempt in range(API_MAX_RETRIES):
                  try:
                      return fn(*args, **kwargs)
                  except Exception as exc:
                      last = exc
                      msg = str(exc).lower()
                      transient = (
                          "503" in msg or "502" in msg or "504" in msg or
                          "timeout" in msg or "timed out" in msg or
                          "temporarily" in msg or "saturated" in msg
                      )
                      if not transient or attempt == API_MAX_RETRIES - 1:
                          break
                      time.sleep(API_RETRY_BASE_SECONDS * (2 ** attempt))
              return {"_error": f"{type(last).__name__}: {last}"}
          
          def as_list(x):
              if isinstance(x, list):
                  return x
              if isinstance(x, dict):
                  for k in ("data", "rows", "results"):
                      if isinstance(x.get(k), list):
                          return x[k]
              return []
          
          def external_news():
              """Fetch a small, bounded RSS set without letting one feed stall the scan."""
              items = []
              seen = set()
              for url in NEWS_URLS[:8]:
                  try:
                      req = Request(
                          url,
                          headers={"User-Agent": "LSE-Smart-Scanner/12.2"},
                      )
                      with urlopen(req, timeout=8) as response:
                          raw = response.read(1_500_000)
                      feed = feedparser.parse(raw)
                      source = urlparse(url).netloc or url
                      if getattr(feed, "bozo", False) and not getattr(feed, "entries", []):
                          print(f"RSS WARNING: {source}: malformed/empty feed")
                          continue
                      for entry in feed.entries[:8]:
                          title = str(entry.get("title", "")).strip()
                          link = str(entry.get("link", "")).strip()
                          if not title:
                              continue
                          key = (title.casefold(), link)
                          if key in seen:
                              continue
                          seen.add(key)

                          published_at = None
                          for field in ("published_parsed", "updated_parsed"):
                              parsed = entry.get(field)
                              if parsed:
                                  try:
                                      published_at = datetime(*parsed[:6], tzinfo=timezone.utc).isoformat()
                                      break
                                  except Exception:
                                      pass

                          items.append({
                              "title": title,
                              "link": link,
                              "source": source,
                              "published_at": published_at,
                          })
                  except Exception as exc:
                      print(f"RSS WARNING: {urlparse(url).netloc or url}: {type(exc).__name__}")
                      continue
              return items[:30]
          
          def return_series(rows):
              closes = [x["close"] for x in rows if x.get("close") is not None]
              if len(closes) < 3:
                  return []
              return [(closes[i] / closes[i-1]) - 1.0 for i in range(1, len(closes)) if closes[i-1] != 0]
          
          def pearson(a, b):
              n = min(len(a), len(b))
              if n < 20:
                  return None
              a, b = a[-n:], b[-n:]
              ma, mb = statistics.fmean(a), statistics.fmean(b)
              da = [x - ma for x in a]
              db = [x - mb for x in b]
              den = math.sqrt(sum(x*x for x in da) * sum(x*x for x in db))
              return (sum(x*y for x, y in zip(da, db)) / den) if den else None
          
          def correlation_context(symbol, rows, benchmark_rows):
              base = return_series(rows)
              vals = []
              for bench, brow in benchmark_rows.items():
                  if bench == symbol:
                      continue
                  c = pearson(base, return_series(brow))
                  if c is not None:
                      vals.append((bench, c))
              vals.sort(key=lambda x: abs(x[1]), reverse=True)
              return vals[:3]
          
          def daily_intelligence(client, symbols=None):
              """Load only macro/event context needed by the promoted candidate set.
              Calendar data is contextual evidence, never a standalone trade signal.
              """
              intel = {"calendar": [], "macro": {}, "yields": {}, "cot": {}, "news": [],
                       "live": "UNKNOWN", "ml": "LOCAL STATISTICAL MODEL"}
              symbols = symbols or []
              currencies = set()
              assets = set()
              for sym in symbols:
                  canonical = SYMBOL_ALIASES.get(str(sym).upper(), str(sym))
                  if "/" in canonical:
                      base, quote = canonical.split("/", 1)
                      currencies.update((base, quote))
                      if base == "XAU" or quote == "XAU": assets.add("XAU")
                      if base == "XAG" or quote == "XAG": assets.add("XAG")
                      if base == "BTC" or quote == "BTC": assets.add("BTC")
              region_for = {"USD":"US","GBP":"GB","EUR":"EU","JPY":"JP","AUD":"AU","CAD":"CA","NZD":"NZ","CHF":"CH"}
              regions = [region_for[c] for c in sorted(currencies) if c in region_for]
              for region in regions:
                  data = safe_call(client.economic_calendar, region=region, start=now_utc().date().isoformat())
                  if isinstance(data, dict) and "_error" in data:
                      continue
                  intel["calendar"].extend(as_list(data))
              # US macro is relevant to USD crosses, gold and BTC; avoid it for an unrelated pair.
              if "USD" in currencies or assets & {"XAU","XAG","BTC"}:
                  intel["macro"]["cpi_yoy"] = as_list(safe_call(client.economics, "cpi_yoy"))
                  intel["macro"]["policy_rate"] = as_list(safe_call(client.series, "fdtr"))
                  intel["yields"]["US10Y"] = as_list(safe_call(client.bond_yields, "US10Y"))
              # Yield differentials: only fetch currencies actually represented by candidates.
              yield_codes = {"EUR":"DE10Y","GBP":"GB10Y","JPY":"JP10Y","AUD":"AU10Y","CAD":"CA10Y","NZD":"NZ10Y","CHF":"CH10Y"}
              for cur in sorted(currencies):
                  code = yield_codes.get(cur)
                  if code:
                      rows = as_list(safe_call(client.series, code))
                      if rows:
                          intel["yields"][code] = rows
              # COT is useful mainly for commodities; only fetch it when a relevant candidate exists.
              if "XAU" in assets:
                  rows = as_list(safe_call(client.cot, "GC"))
                  if rows: intel["cot"]["GC"] = rows[-1]
              if "BTC" in assets:
                  rows = as_list(safe_call(client.cot, "ES"))
                  if rows: intel["cot"]["ES"] = rows[-1]
              intel["news"] = external_news()
              return intel

          def latest_value(rows):
              if not rows:
                  return None
              row = rows[-1]
              if isinstance(row, dict):
                  for key in ("value", "close", "yield", "rate"):
                      if row.get(key) is not None:
                          try:
                              return float(row[key])
                          except Exception:
                              return None
              return None
          
          YIELD_CODES = {
              "USD": "US10Y", "EUR": "DE10Y", "GBP": "GB10Y", "JPY": "JP10Y",
              "AUD": "AU10Y", "CAD": "CA10Y", "NZD": "NZ10Y", "CHF": "CH10Y"
          }
          
          def yield_context(intel, symbol):
              if "/" not in symbol:
                  return None
              base, quote = symbol.split("/", 1)
              if base not in YIELD_CODES or quote not in YIELD_CODES:
                  return None
              b = latest_value(intel["yields"].get(YIELD_CODES[base], []))
              q = latest_value(intel["yields"].get(YIELD_CODES[quote], []))
              if b is None or q is None:
                  return None
              return b - q
          
