                  )
                  execution_gate = (
                      trigger_state.get("state") == "EXECUTABLE_TRIGGER_CROSSED"
                      and float(trigger_state.get("execution_score", 0.0)) >= EXECUTION_SCORE_MIN
                      and float(trigger_state.get("quote_age_seconds") or 999.0) <= MAX_QUOTE_AGE_SECONDS
                  )
                  qualifies = ((two_of_n or three_price) and lse_alignment_gate and score_gate
                               and trigger_crossed and trigger_safe and quality_gate
                               and volatility_gate and regime_gate and execution_gate)

                  reasons = [
                      f"CONSENSUS: {aligned_count}/9 strategies aligned ({', '.join(sorted(aligned_names))})"
                  ]
                  if cs["tf_count"]:
