                  trigger_tf = {"SCALP": "5m", "INTRADAY": "15m", "SWING/HOLD": "1h", "ADAPTIVE PRICE-MOVEMENT": "15m"}.get(chosen_strategy, "15m")
                  trigger_state = execution_trigger_state(data.get(trigger_tf, []), {"ticks": deep_live_raw.get(symbol, [])}, c)
