name: SMC Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Stage 2 - SMC Market Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          SYMBOLS = [
              "EUR/USD",
              "GBP/USD",
              "USD/JPY",
              "USD/CAD",
              "XAU/USD"
          ]

          INTERVAL = "15min"

          # ==========================================
          # SETTINGS
          # ==========================================

          # Try 2000 first.
          # If unavailable, automatically try 1000,
          # then 500.
          OUTPUT_SIZES = [2000, 1000, 500]

          URL = "https://api.twelvedata.com/time_series"

          SMA_FAST = 100
          SMA_SLOW = 200

          RMA_FAST = 100
          RMA_SLOW = 200

          ATR_PERIOD = 14

          # Stop-loss buffer beyond liquidity sweep
          SL_ATR_MULTIPLIER = 0.25

          # ==========================================
          # HEADER
          # ==========================================

          print("================================")
          print("SMC MARKET SCANNER - STAGE 2")
          print("================================")
          print("Timeframe:", INTERVAL)
          print("Markets:", ", ".join(SYMBOLS))
          print("SMA:", SMA_FAST, SMA_SLOW)
          print("RMA:", RMA_FAST, RMA_SLOW)
          print("ATR:", ATR_PERIOD)
          print("Automatic trading: DISABLED")
          print()

          # ==========================================
          # SMA
          # ==========================================

          def full_sma(values, period):

              result = [None] * len(values)

              if len(values) < period:
                  return result

              for i in range(period - 1, len(values)):

                  window = values[
                      i - period + 1:i + 1
                  ]

                  result[i] = sum(window) / period

              return result

          # ==========================================
          # RMA / WILDER MOVING AVERAGE
          # ==========================================

          def full_rma(values, period):

              result = [None] * len(values)

              if len(values) < period:
                  return result

              current = (
                  sum(values[:period]) / period
              )

              result[period - 1] = current

              for i in range(period, len(values)):

                  current = (
                      (
                          current * (period - 1)
                      )
                      + values[i]
                  ) / period

                  result[i] = current

              return result

          # ==========================================
          # ATR
          # ==========================================

          def calculate_atr(candles, period=14):

              if len(candles) < period + 1:
                  return None

              true_ranges = []

              for i in range(1, len(candles)):

                  high = candles[i]["high"]
                  low = candles[i]["low"]
                  previous_close = candles[i - 1]["close"]

                  tr = max(
                      high - low,
                      abs(high - previous_close),
                      abs(low - previous_close)
                  )

                  true_ranges.append(tr)

              if len(true_ranges) < period:
                  return None

              atr_value = (
                  sum(true_ranges[:period]) / period
              )

              for tr in true_ranges[period:]:

                  atr_value = (
                      (
                          atr_value * (period - 1)
                      ) + tr
                  ) / period

              return atr_value

          # ==========================================
          # SWING HIGH
          # ==========================================

          def is_swing_high(
              candles,
              i,
              strength=2
          ):

              if (
                  i < strength
                  or i >= len(candles) - strength
              ):
                  return False

              high = candles[i]["high"]

              for j in range(1, strength + 1):

                  if high <= candles[i - j]["high"]:
                      return False

                  if high <= candles[i + j]["high"]:
                      return False

              return True

          # ==========================================
          # SWING LOW
          # ==========================================

          def is_swing_low(
              candles,
              i,
              strength=2
          ):

              if (
                  i < strength
                  or i >= len(candles) - strength
              ):
                  return False

              low = candles[i]["low"]

              for j in range(1, strength + 1):

                  if low >= candles[i - j]["low"]:
                      return False

                  if low >= candles[i + j]["low"]:
                      return False

              return True

          # ==========================================
          # FIND LIQUIDITY
          # ==========================================

          def find_liquidity(candles):

              swing_highs = []
              swing_lows = []

              for i in range(
                  2,
                  len(candles) - 2
              ):

                  if is_swing_high(candles, i):

                      swing_highs.append({
                          "index": i,
                          "price": candles[i]["high"],
                          "time": candles[i]["datetime"]
                      })

                  if is_swing_low(candles, i):

                      swing_lows.append({
                          "index": i,
                          "price": candles[i]["low"],
                          "time": candles[i]["datetime"]
                      })

              return swing_highs, swing_lows

          # ==========================================
          # LIQUIDITY SWEEP
          # ==========================================

          def find_sweep(
              candles,
              swing_highs,
              swing_lows
          ):

              sweeps = []

              start = max(
                  0,
                  len(candles) - 35
              )

              for i in range(start, len(candles)):

                  candle = candles[i]

                  # ----------------------------------
                  # BEARISH SWEEP
                  # Takes buy-side liquidity
                  # and closes back below.
                  # ----------------------------------

                  for level in reversed(swing_highs):

                      if level["index"] >= i:
                          continue

                      if (
                          candle["high"]
                          > level["price"]
                          and
                          candle["close"]
                          < level["price"]
                      ):

                          sweeps.append({
                              "type": "BEARISH",
                              "index": i,
                              "liquidity": level["price"],
                              "time": candle["datetime"]
                          })

                          break

                  # ----------------------------------
                  # BULLISH SWEEP
                  # Takes sell-side liquidity
                  # and closes back above.
                  # ----------------------------------

                  for level in reversed(swing_lows):

                      if level["index"] >= i:
                          continue

                      if (
                          candle["low"]
                          < level["price"]
                          and
                          candle["close"]
                          > level["price"]
                      ):

                          sweeps.append({
                              "type": "BULLISH",
                              "index": i,
                              "liquidity": level["price"],
                              "time": candle["datetime"]
                          })

                          break

              return sweeps

          # ==========================================
          # MSS / CHOCH
          # ==========================================

          def find_structure_break(
              candles,
              sweep,
              swing_highs,
              swing_lows
          ):

              sweep_index = sweep["index"]
              direction = sweep["type"]

              search_end = min(
                  len(candles),
                  sweep_index + 11
              )

              # --------------------------------------
              # BULLISH MSS
              # --------------------------------------

              if direction == "BULLISH":

                  previous_highs = [
                      x
                      for x in swing_highs
                      if x["index"] < sweep_index
                  ]

                  if not previous_highs:
                      return None

                  target = previous_highs[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):

                      if (
                          candles[i]["close"]
                          > target["price"]
                      ):

                          return {
                              "type": "BULLISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              # --------------------------------------
              # BEARISH MSS
              # --------------------------------------

              if direction == "BEARISH":

                  previous_lows = [
                      x
                      for x in swing_lows
                      if x["index"] < sweep_index
                  ]

                  if not previous_lows:
                      return None

                  target = previous_lows[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):

                      if (
                          candles[i]["close"]
                          < target["price"]
                      ):

                          return {
                              "type": "BEARISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              return None

          # ==========================================
          # FIND FVG
          # ==========================================

          def find_fvg(candles, mss):

              mss_index = mss["index"]

              start = max(
                  2,
                  mss_index - 1
              )

              end = min(
                  len(candles),
                  mss_index + 7
              )

              for i in range(start, end):

                  if i < 2:
                      continue

                  c0 = candles[i - 2]
                  c1 = candles[i - 1]
                  c2 = candles[i]

                  # ----------------------------------
                  # BULLISH FVG
                  # ----------------------------------

                  if mss["type"] == "BULLISH MSS":

                      if c2["low"] > c0["high"]:

                          return {
                              "type": "BULLISH FVG",
                              "index": i,
                              "low": c0["high"],
                              "high": c2["low"],
                              "time": c2["datetime"]
                          }

                  # ----------------------------------
                  # BEARISH FVG
                  # ----------------------------------

                  if mss["type"] == "BEARISH MSS":

                      if c2["high"] < c0["low"]:

                          return {
                              "type": "BEARISH FVG",
                              "index": i,
                              "low": c2["high"],
                              "high": c0["low"],
                              "time": c2["datetime"]
                          }

              return None

          # ==========================================
          # LONG-TERM TREND
          # ==========================================

          def determine_trend(candles):

              closes = [
                  candle["close"]
                  for candle in candles
              ]

              sma100 = full_sma(
                  closes,
                  SMA_FAST
              )

              sma200 = full_sma(
                  closes,
                  SMA_SLOW
              )

              rma100 = full_rma(
                  closes,
                  RMA_FAST
              )

              rma200 = full_rma(
                  closes,
                  RMA_SLOW
              )

              current = closes[-1]

              s100 = sma100[-1]
              s200 = sma200[-1]

              r100 = rma100[-1]
              r200 = rma200[-1]

              if None in [
                  s100,
                  s200,
                  r100,
                  r200
              ]:

                  return None

              bullish_score = 0
              bearish_score = 0

              # Price vs averages
              if current > s100:
                  bullish_score += 1

              if current > s200:
                  bullish_score += 1

              if current > r100:
                  bullish_score += 1

              if current > r200:
                  bullish_score += 1

              if current < s100:
                  bearish_score += 1

              if current < s200:
                  bearish_score += 1

              if current < r100:
                  bearish_score += 1

              if current < r200:
                  bearish_score += 1

              # Average alignment
              if s100 > s200:
                  bullish_score += 1

              if r100 > r200:
                  bullish_score += 1

              if s100 < s200:
                  bearish_score += 1

              if r100 < r200:
                  bearish_score += 1

              if bullish_score >= 5:

                  trend = "LONG-TERM BULLISH"

              elif bearish_score >= 5:

                  trend = "LONG-TERM BEARISH"

              else:

                  trend = "LONG-TERM NEUTRAL"

              return {
                  "trend": trend,
                  "bullish_score": bullish_score,
                  "bearish_score": bearish_score,
                  "sma100": s100,
                  "sma200": s200,
                  "rma100": r100,
                  "rma200": r200
              }

          # ==========================================
          # PRICE FORMAT
          # ==========================================

          def decimals(symbol):

              if symbol == "XAU/USD":
                  return 2

              if "JPY" in symbol:
                  return 3

              return 5

          def fmt(symbol, value):

              if value is None:
                  return "N/A"

              return (
                  f"{value:.{decimals(symbol)}f}"
              )

          # ==========================================
          # CREATE TRADE PLAN
          # ==========================================

          def create_trade_plan(
              symbol,
              candles,
              sweep,
              mss,
              fvg,
              trend_data
          ):

              current = candles[-1]["close"]

              atr = calculate_atr(
                  candles,
                  ATR_PERIOD
              )

              if atr is None:
                  return None

              direction = mss["type"]

              # ======================================
              # BULLISH
              # ======================================

              if direction == "BULLISH MSS":

                  entry = (
                      fvg["low"] +
                      fvg["high"]
                  ) / 2

                  stop_loss = (
                      sweep["liquidity"]
                      -
                      atr * SL_ATR_MULTIPLIER
                  )

                  risk = entry - stop_loss

                  if risk <= 0:
                      return None

                  tp1 = entry + risk
                  tp2 = entry + risk * 2
                  tp3 = entry + risk * 3
                  tp4 = entry + risk * 4

                  aligned = (
                      trend_data["trend"]
                      == "LONG-TERM BULLISH"
                  )

                  if (
                      fvg["low"]
                      <= current
                      <= fvg["high"]
                  ):

                      entry_status = (
                          "🔥 SNIPER ENTRY NOW"
                      )

                  elif current < fvg["low"]:

                      entry_status = (
                          "⏳ WAIT FOR BULLISH FVG RETEST"
                      )

                  else:

                      entry_status = (
                          "⚠️ PRICE ABOVE FVG - DO NOT CHASE"
                      )

              # ======================================
              # BEARISH
              # ======================================

              else:

                  entry = (
                      fvg["low"] +
                      fvg["high"]
                  ) / 2

                  stop_loss = (
                      sweep["liquidity"]
                      +
                      atr * SL_ATR_MULTIPLIER
                  )

                  risk = stop_loss - entry

                  if risk <= 0:
                      return None

                  tp1 = entry - risk
                  tp2 = entry - risk * 2
                  tp3 = entry - risk * 3
                  tp4 = entry - risk * 4

                  aligned = (
                      trend_data["trend"]
                      == "LONG-TERM BEARISH"
                  )

                  if (
                      fvg["low"]
                      <= current
                      <= fvg["high"]
                  ):

                      entry_status = (
                          "🔥 SNIPER ENTRY NOW"
                      )

                  elif current > fvg["high"]:

                      entry_status = (
                          "⏳ WAIT FOR BEARISH FVG RETEST"
                      )

                  else:

                      entry_status = (
                          "⚠️ PRICE BELOW FVG - DO NOT CHASE"
                      )

              # ======================================
              # SETUP GRADE
              # ======================================

              if (
                  aligned
                  and
                  entry_status ==
                  "🔥 SNIPER ENTRY NOW"
              ):

                 
