name: SMC Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: SMC 9-Method Market Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from datetime import datetime, timezone

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          SYMBOLS = [
              "EUR/USD",
              "GBP/USD",
              "USD/JPY",
              "USD/CAD",
              "XAU/USD"
          ]

          INTERVAL = "15min"
          OUTPUT_SIZE = 500

          ATR_PERIOD = 14
          RSI_PERIOD = 14

          EMA_FAST = 20
          EMA_MID = 50
          EMA_SLOW = 200

          MACD_FAST = 12
          MACD_SLOW = 26
          MACD_SIGNAL = 9

          SL_ATR_MULTIPLIER = 0.25

          URL = "https://api.twelvedata.com/time_series"

          WEIGHTS = {
              "Market Structure": 15,
              "SMC": 20,
              "Supply & Demand": 10,
              "Price Action": 10,
              "Liquidity": 15,
              "Fibonacci": 5,
              "Trend": 10,
              "Indicators": 5,
              "Session": 10
          }

          print("=" * 70)
          print("SMC 9-METHOD MULTI-CONFLUENCE MARKET SCANNER")
          print("=" * 70)
          print("Timeframe:", INTERVAL)
          print("Markets:", ", ".join(SYMBOLS))
          print("Candles:", OUTPUT_SIZE)
          print("Automatic trading: DISABLED")
          print()
          print("1. Market Structure       15")
          print("2. Smart Money Concepts   20")
          print("3. Supply & Demand        10")
          print("4. Price Action           10")
          print("5. Liquidity              15")
          print("6. Fibonacci               5")
          print("7. Trend                  10")
          print("8. Indicators              5")
          print("9. Forex Session          10")
          print("TOTAL                    100")
          print("=" * 70)


          def get_candles(symbol):
              params = {
                  "symbol": symbol,
                  "interval": INTERVAL,
                  "outputsize": OUTPUT_SIZE,
                  "apikey": API_KEY,
                  "format": "JSON"
              }

              try:
                  response = requests.get(
                      URL,
                      params=params,
                      timeout=30
                  )
                  response.raise_for_status()
                  data = response.json()
              except Exception as e:
                  print("REQUEST ERROR:", symbol, e)
                  return []

              if "values" not in data:
                  print("API ERROR:", symbol, data)
                  return []

              candles = []

              for x in reversed(data["values"]):
                  try:
                      candles.append({
                          "datetime": x["datetime"],
                          "open": float(x["open"]),
                          "high": float(x["high"]),
                          "low": float(x["low"]),
                          "close": float(x["close"])
                      })
                  except Exception:
                      continue

              return candles


          def decimals(symbol):
              if symbol == "XAU/USD":
                  return 2
              if "JPY" in symbol:
                  return 3
              return 5


          def fmt(symbol, value):
              if value is None:
                  return "N/A"
              return f"{value:.{decimals(symbol)}f}"


          def calculate_atr(candles, period=14):
              if len(candles) < period + 1:
                  return None

              trs = []

              for i in range(1, len(candles)):
                  high = candles[i]["high"]
                  low = candles[i]["low"]
                  prev_close = candles[i - 1]["close"]

                  trs.append(
                      max(
                          high - low,
                          abs(high - prev_close),
                          abs(low - prev_close)
                      )
                  )

              if len(trs) < period:
                  return None

              atr = sum(trs[:period]) / period

              for tr in trs[period:]:
                  atr = (
                      atr * (period - 1) + tr
                  ) / period

              return atr


          def calculate_ema(values, period):
              if len(values) < period:
                  return None

              multiplier = 2 / (period + 1)
              ema = sum(values[:period]) / period

              for price in values[period:]:
                  ema = (
                      (price - ema) * multiplier
                  ) + ema

              return ema


          def calculate_rsi(candles, period=14):
              if len(candles) < period + 1:
                  return None

              gains = []
              losses = []

              for i in range(1, len(candles)):
                  change = (
                      candles[i]["close"]
                      - candles[i - 1]["close"]
                  )

                  gains.append(max(change, 0))
                  losses.append(max(-change, 0))

              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period

              for i in range(period, len(gains)):
                  avg_gain = (
                      avg_gain * (period - 1)
                      + gains[i]
                  ) / period

                  avg_loss = (
                      avg_loss * (period - 1)
                      + losses[i]
                  ) / period

              if avg_loss == 0:
                  return 100

              rs = avg_gain / avg_loss

              return 100 - (100 / (1 + rs))


          def calculate_macd(candles):
              closes = [x["close"] for x in candles]

              if len(closes) < MACD_SLOW:
                  return None

              fast_ema = calculate_ema(
                  closes,
                  MACD_FAST
              )

              slow_ema = calculate_ema(
                  closes,
                  MACD_SLOW
              )

              if fast_ema is None or slow_ema is None:
                  return None

              return fast_ema - slow_ema


          def is_swing_high(candles, i, strength=2):
              if i < strength:
                  return False

              if i >= len(candles) - strength:
                  return False

              high = candles[i]["high"]

              for j in range(1, strength + 1):
                  if high <= candles[i - j]["high"]:
                      return False
                  if high <= candles[i + j]["high"]:
                      return False

              return True


          def is_swing_low(candles, i, strength=2):
              if i < strength:
                  return False

              if i >= len(candles) - strength:
                  return False

              low = candles[i]["low"]

              for j in range(1, strength + 1):
                  if low >= candles[i - j]["low"]:
                      return False
                  if low >= candles[i + j]["low"]:
                      return False

              return True


          def find_liquidity(candles):
              swing_highs = []
              swing_lows = []

              for i in range(2, len(candles) - 2):
                  if is_swing_high(candles, i):
                      swing_highs.append({
                          "index": i,
                          "price": candles[i]["high"],
                          "time": candles[i]["datetime"]
                      })

                  if is_swing_low(candles, i):
                      swing_lows.append({
                          "index": i,
                          "price": candles[i]["low"],
                          "time": candles[i]["datetime"]
                      })

              return swing_highs, swing_lows


          def market_structure_score(
              candles,
              swing_highs,
              swing_lows
          ):
              if len(swing_highs) < 2 or len(swing_lows) < 2:
                  return 0, None, "NEUTRAL"

              last_high = swing_highs[-1]["price"]
              previous_high = swing_highs[-2]["price"]

              last_low = swing_lows[-1]["price"]
              previous_low = swing_lows[-2]["price"]

              bullish = (
                  last_high > previous_high
                  and last_low > previous_low
              )

              bearish = (
                  last_high < previous_high
                  and last_low < previous_low
              )

              if bullish:
                  return 15, "BUY", "BULLISH HH + HL"

              if bearish:
                  return 15, "SELL", "BEARISH LH + LL"

              return 5, None, "MIXED STRUCTURE"


          def find_sweeps(
              candles,
              swing_highs,
              swing_lows
          ):
              sweeps = []

              start = max(0, len(candles) - 40)

              for i in range(start, len(candles)):
                  candle = candles[i]

                  for level in reversed(swing_highs):
                      if level["index"] >= i:
                          continue

                      if (
                          candle["high"] > level["price"]
                          and candle["close"] < level["price"]
                      ):
                          sweeps.append({
                              "type": "BEARISH",
                              "index": i,
                              "liquidity": level["price"],
                              "time": candle["datetime"]
                          })
                          break

                  for level in reversed(swing_lows):
                      if level["index"] >= i:
                          continue

                      if (
                          candle["low"] < level["price"]
                          and candle["close"] > level["price"]
                      ):
                          sweeps.append({
                              "type": "BULLISH",
                              "index": i,
                              "liquidity": level["price"],
                              "time": candle["datetime"]
                          })
                          break

              return sweeps


          def liquidity_score(sweeps):
              if not sweeps:
                  return 0, None

              latest = sweeps[-1]

              return 15, latest["type"]


          def find_structure_break(
              candles,
              sweep,
              swing_highs,
              swing_lows
          ):
              sweep_index = sweep["index"]

              search_end = min(
                  len(candles),
                  sweep_index + 11
              )

              if sweep["type"] == "BULLISH":
                  previous_highs = [
                      x for x in swing_highs
                      if x["index"] < sweep_index
                  ]

                  if not previous_highs:
                      return None

                  target = previous_highs[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):
                      if candles[i]["close"] > target["price"]:
                          return {
                              "type": "BULLISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              else:
                  previous_lows = [
                      x for x in swing_lows
                      if x["index"] < sweep_index
                  ]

                  if not previous_lows:
                      return None

                  target = previous_lows[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):
                      if candles[i]["close"] < target["price"]:
                          return {
                              "type": "BEARISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              return None


          def find_fvg(candles, mss):
              mss_index = mss["index"]

              start = max(2, mss_index)
              end = min(len(candles), mss_index + 8)

              for i in range(start, end):
                  c0 = candles[i - 2]
                  c2 = candles[i]

                  if mss["type"] == "BULLISH MSS":
                      if c2["low"] > c0["high"]:
                          return {
                              "type": "BULLISH FVG",
                              "index": i,
                              "low": c0["high"],
                              "high": c2["low"],
                              "time": c2["datetime"]
                          }

                  else:
                      if c2["high"] < c0["low"]:
                          return {
                              "type": "BEARISH FVG",
                              "index": i,
                              "low": c2["high"],
                              "high": c0["low"],
                              "time": c2["datetime"]
                          }

              return None


          def smc_score(
              candles,
              swing_highs,
              swing_lows
          ):
              sweeps = find_sweeps(
                  candles,
                  swing_highs,
                  swing_lows
              )

              if not sweeps:
                  return 0, None, None, None

              latest_sweep = sweeps[-1]

              mss = find_structure_break(
                  candles,
                  latest_sweep,
                  swing_highs,
                  swing_lows
              )

              if not mss:
                  return 0, None, latest_sweep, None

              fvg = find_fvg(
                  candles,
                  mss
              )

              if mss["type"] == "BULLISH MSS":
                  direction = "BUY"
              else:
                  direction = "SELL"

              score = 15

              if fvg:
                  score = 20

              return score, direction, latest_sweep, fvg


          def supply_demand_score(
              candles,
              direction,
              atr
          ):
              if atr is None:
                  return 0, "NO ATR"

              recent = candles[-12:]

              if len(recent) < 6:
                  return 0, "NOT ENOUGH DATA"

              for i in range(2, len(recent)):
                  base = recent[i - 2]
                  impulse = recent[i]

                  move = abs(
                      impulse["close"]
                      - base["close"]
                  )

                  if move < atr * 0.8:
                      continue

                  if direction == "BUY":
                      if (
                          base["close"] <= base["open"]
                          and impulse["close"] > impulse["open"]
                      ):
                          return 10, "DEMAND ZONE + BULLISH IMPULSE"

                  if direction == "SELL":
                      if (
                          base["close"] >= base["open"]
                          and impulse["close"] < impulse["open"]
                      ):
                          return 10, "SUPPLY ZONE + BEARISH IMPULSE"

              return 3, "WEAK SUPPLY/DEMAND"


          def price_action_score(
              candles,
              direction
          ):
              if len(candles) < 3:
                  return 0, "NO DATA"

              c = candles[-1]
              prev = candles[-2]

              body = abs(
                  c["close"] - c["open"]
              )

              candle_range = (
                  c["high"] - c["low"]
              )

              if candle_range <= 0:
                  return 0, "INVALID CANDLE"

              upper_wick = (
                  c["high"]
                  - max(c["open"], c["close"])
              )

              lower_wick = (
                  min(c["open"], c["close"])
                  - c["low"]
              )

              bullish_engulfing = (
                  prev["close"] < prev["open"]
                  and c["close"] > c["open"]
                  and c["open"] <= prev["close"]
                  and c["close"] >= prev["open"]
              )

              bearish_engulfing = (
                  prev["close"] > prev["open"]
                  and c["close"] < c["open"]
                  and c["open"] >= prev["close"]
                  and c["close"] <= prev["open"]
              )

              bullish_rejection = (
                  lower_wick > body * 1.5
                  and c["close"] > c["open"]
              )

              bearish_rejection = (
                  upper_wick > body * 1.5
                  and c["close"] < c["open"]
              )

              if direction == "BUY":
                  if bullish_engulfing:
                      return 10, "BULLISH ENGULFING"

                  if bullish_rejection:
                      return 8, "BULLISH REJECTION"

                  if c["close"] > c["open"]:
                      return 5, "BULLISH CANDLE"

              elif direction == "SELL":
                  if bearish_engulfing:
                      return 10, "BEARISH ENGULFING"

                  if bearish_rejection:
                      return 8, "BEARISH REJECTION"

                  if c["close"] < c["open"]:
                      return 5, "BEARISH CANDLE"

              return 0, "NO STRONG PRICE ACTION"


          def fibonacci_score(
              candles,
              swing_highs,
              swing_lows,
              direction
          ):
              if not swing_highs or not swing_lows:
                  return 0, "NO SWINGS"

              high = swing_highs[-1]["price"]
              low = swing_lows[-1]["price"]

              if high <= low:
                  return 0, "INVALID RANGE"

              current = candles[-1]["close"]

              if direction == "BUY":
                  levels = {
                      "0.382": high - (high - low) * 0.382,
                      "0.500": high - (high - low) * 0.500,
                      "0.618": high - (high - low) * 0.618,
                      "0.786": high - (high - low) * 0.786
                  }
              else:
                  levels = {
                      "0.382": low + (high - low) * 0.382,
                      "0.500": low + (high - low) * 0.500,
                      "0.618": low + (high - low) * 0.618,
                      "0.786": low + (high - low) * 0.786
                  }

              tolerance = (high - low) * 0.03
              nearest = None
              nearest_distance = float("inf")

              for name, level in levels.items():
                  distance = abs(
                      current - level
                  )

                  if distance < nearest_distance:
                      nearest_distance = distance
                      nearest = name

              if nearest_distance <= tolerance:
                  return 5, f"NEAR FIB {nearest}"

              return 2, f"FIB {nearest} NEARB 
