name: SMC Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Stage 2 - SMC Market Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          SYMBOLS = [
              "EUR/USD",
              "GBP/USD",
              "USD/JPY",
              "USD/CAD",
              "XAU/USD"
          ]

          INTERVAL = "15min"
          OUTPUT_SIZES = [2000, 1000, 500]

          SMA_FAST = 100
          SMA_SLOW = 200
          RMA_FAST = 100
          RMA_SLOW = 200
          ATR_PERIOD = 14
          SL_ATR_MULTIPLIER = 0.25

          URL = "https://api.twelvedata.com/time_series"

          print("================================")
          print("SMC MARKET SCANNER - STAGE 2")
          print("================================")
          print("Timeframe:", INTERVAL)
          print("Markets:", ", ".join(SYMBOLS))
          print("SMA:", SMA_FAST, SMA_SLOW)
          print("RMA:", RMA_FAST, RMA_SLOW)
          print("ATR:", ATR_PERIOD)
          print("Automatic trading: DISABLED")
          print()

          def full_sma(values, period):
              result = [None] * len(values)

              if len(values) < period:
                  return result

              for i in range(period - 1, len(values)):
                  result[i] = sum(
                      values[i - period + 1:i + 1]
                  ) / period

              return result

          def full_rma(values, period):
              result = [None] * len(values)

              if len(values) < period:
                  return result

              current = sum(values[:period]) / period
              result[period - 1] = current

              for i in range(period, len(values)):
                  current = (
                      current * (period - 1)
                      + values[i]
                  ) / period

                  result[i] = current

              return result

          def calculate_atr(candles, period=14):
              if len(candles) < period + 1:
                  return None

              trs = []

              for i in range(1, len(candles)):
                  high = candles[i]["high"]
                  low = candles[i]["low"]
                  previous_close = candles[i - 1]["close"]

                  trs.append(
                      max(
                          high - low,
                          abs(high - previous_close),
                          abs(low - previous_close)
                      )
                  )

              if len(trs) < period:
                  return None

              atr = sum(trs[:period]) / period

              for tr in trs[period:]:
                  atr = (
                      atr * (period - 1) + tr
                  ) / period

              return atr

          def is_swing_high(candles, i, strength=2):
              if i < strength or i >= len(candles) - strength:
                  return False

              high = candles[i]["high"]

              for j in range(1, strength + 1):
                  if high <= candles[i - j]["high"]:
                      return False

                  if high <= candles[i + j]["high"]:
                      return False

              return True

          def is_swing_low(candles, i, strength=2):
              if i < strength or i >= len(candles) - strength:
                  return False

              low = candles[i]["low"]

              for j in range(1, strength + 1):
                  if low >= candles[i - j]["low"]:
                      return False

                  if low >= candles[i + j]["low"]:
                      return False

              return True

          def find_liquidity(candles):
              swing_highs = []
              swing_lows = []

              for i in range(2, len(candles) - 2):
                  if is_swing_high(candles, i):
                      swing_highs.append({
                          "index": i,
                          "price": candles[i]["high"],
                          "time": candles[i]["datetime"]
                      })

                  if is_swing_low(candles, i):
                      swing_lows.append({
                          "index": i,
                          "price": candles[i]["low"],
                          "time": candles[i]["datetime"]
                      })

              return swing_highs, swing_lows

          def find_sweep(candles, swing_highs, swing_lows):
              sweeps = []

              start = max(0, len(candles) - 35)

              for i in range(start, len(candles)):
                  candle = candles[i]

                  for level in reversed(swing_highs):
                      if level["index"] >= i:
                          continue

                      if (
                          candle["high"] > level["price"]
                          and candle["close"] < level["price"]
                      ):
                          sweeps.append({
                              "type": "BEARISH",
                              "index": i,
                              "liquidity": level["price"],
                              "time": candle["datetime"]
                          })
                          break

                  for level in reversed(swing_lows):
                      if level["index"] >= i:
                          continue

                      if (
                          candle["low"] < level["price"]
                          and candle["close"] > level["price"]
                      ):
                          sweeps.append({
                              "type": "BULLISH",
                              "index": i,
                              "liquidity": level["price"],
                              "time": candle["datetime"]
                          })
                          break

              return sweeps

          def find_structure_break(
              candles,
              sweep,
              swing_highs,
              swing_lows
          ):
              sweep_index = sweep["index"]
              direction = sweep["type"]

              search_end = min(
                  len(candles),
                  sweep_index + 11
              )

              if direction == "BULLISH":
                  previous_highs = [
                      x for x in swing_highs
                      if x["index"] < sweep_index
                  ]

                  if not previous_highs:
                      return None

                  target = previous_highs[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):
                      if candles[i]["close"] > target["price"]:
                          return {
                              "type": "BULLISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              if direction == "BEARISH":
                  previous_lows = [
                      x for x in swing_lows
                      if x["index"] < sweep_index
                  ]

                  if not previous_lows:
                      return None

                  target = previous_lows[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):
                      if candles[i]["close"] < target["price"]:
                          return {
                              "type": "BEARISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              return None

          def find_fvg(candles, mss):
              mss_index = mss["index"]

              start = max(2, mss_index - 1)
              end = min(len(candles), mss_index + 7)

              for i in range(start, end):
                  if i < 2:
                      continue

                  c0 = candles[i - 2]
                  c2 = candles[i]

                  if mss["type"] == "BULLISH MSS":
                      if c2["low"] > c0["high"]:
                          return {
                              "type": "BULLISH FVG",
                              "index": i,
                              "low": c0["high"],
                              "high": c2["low"],
                              "time": c2["datetime"]
                          }

                  if mss["type"] == "BEARISH MSS":
                      if c2["high"] < c0["low"]:
                          return {
                              "type": "BEARISH FVG",
                              "index": i,
                              "low": c2["high"],
                              "high": c0["low"],
                              "time": c2["datetime"]
                          }

              return None

          def determine_trend(candles):
              closes = [
                  candle["close"]
                  for candle in candles
              ]

              sma100 = full_sma(
                  closes,
                  SMA_FAST
              )

              sma200 = full_sma(
                  closes,
                  SMA_SLOW
              )

              rma100 = full_rma(
                  closes,
                  RMA_FAST
              )

              rma200 = full_rma(
                  closes,
                  RMA_SLOW
              )

              current = closes[-1]

              s100 = sma100[-1]
              s200 = sma200[-1]
              r100 = rma100[-1]
              r200 = rma200[-1]

              if None in [s100, s200, r100, r200]:
                  return None

              bullish_score = 0
              bearish_score = 0

              if current > s100:
                  bullish_score += 1

              if current > s200:
                  bullish_score += 1

              if current > r100:
                  bullish_score += 1

              if current > r200:
                  bullish_score += 1

              if s100 > s200:
                  bullish_score += 1

              if r100 > r200:
                  bullish_score += 1

              if current < s100:
                  bearish_score += 1

              if current < s200:
                  bearish_score += 1

              if current < r100:
                  bearish_score += 1

              if current < r200:
                  bearish_score += 1

              if s100 < s200:
                  bearish_score += 1

              if r100 < r200:
                  bearish_score += 1

              if bullish_score >= 5:
                  trend = "LONG-TERM BULLISH"
              elif bearish_score >= 5:
                  trend = "LONG-TERM BEARISH"
              else:
                  trend = "LONG-TERM NEUTRAL"

              return {
                  "trend": trend,
                  "bullish_score": bullish_score,
                  "bearish_score": bearish_score,
                  "sma100": s100,
                  "sma200": s200,
                  "rma100": r100,
                  "rma200": r200
              }

          def decimals(symbol):
              if symbol == "XAU/USD":
                  return 2

              if "JPY" in symbol:
                  return 3

              return 5

          def fmt(symbol, value):
              if value is None:
                  return "N/A"

              return f"{value:.{decimals(symbol)}f}"

          def create_trade_plan(
              symbol,
              candles,
              sweep,
              mss,
              fvg,
              trend_data
          ):
              current = candles[-1]["close"]

              atr = calculate_atr(
                  candles,
                  ATR_PERIOD
              )

              if atr is None:
                  return None

              if mss["type"] == "BULLISH MSS":

                  entry = (
                      fvg["low"] +
                      fvg["high"]
                  ) / 2

                  stop_loss = (
                      sweep["liquidity"]
                      - atr * SL_ATR_MULTIPLIER
                  )

                  risk = entry - stop_loss

                  if risk <= 0:
                      return None

                  tp1 = entry + risk
                  tp2 = entry + risk * 2
                  tp3 = entry + risk * 3
                  tp4 = entry + risk * 4

                  aligned = (
                      trend_data["trend"]
                      == "LONG-TERM BULLISH"
                  )

                  if (
                      fvg["low"]
                      <= current
                      <= fvg["high"]
                  ):
                      entry_status = "🔥 SNIPER ENTRY NOW"

                  elif current < fvg["low"]:
                      entry_status = "⏳ WAIT FOR BULLISH FVG RETEST"

                  else:
                      entry_status = "⚠️ PRICE ABOVE FVG - DO NOT CHASE"

              else:

                  entry = (
                      fvg["low"] +
                      fvg["high"]
                  ) / 2

                  stop_loss = (
                      sweep["liquidity"]
                      + atr * SL_ATR_MULTIPLIER
                  )

                  risk = stop_loss - entry

                  if risk <= 0:
                      return None

                  tp1 = entry - risk
                  tp2 = entry - risk * 2
                  tp3 = entry - risk * 3
                  tp4 = entry - risk * 4

                  aligned = (
                      trend_data["trend"]
                      == "LONG-TERM BEARISH"
                  )

                  if (
                      fvg["low"]
                      <= current
                      <= fvg["high"]
                  ):
                      entry_status = "🔥 SNIPER ENTRY NOW"

                  elif current > fvg["high"]:
                      entry_status = "⏳ WAIT FOR BEARISH FVG RETEST"

                  else:
                      entry_status = "⚠️ PRICE BELOW FVG - DO NOT CHASE"

              if (
                  aligned
                  and
                  entry_status == "🔥 SNIPER ENTRY NOW"
              ):
                  setup_grade = "A+ SNIPER"

              elif aligned:
                  setup_grade = "A - HIGH QUALITY"

              elif entry_status == "🔥 SNIPER ENTRY NOW":
                  setup_grade = "B - COUNTER TREND"

              else:
                  setup_grade = "WAIT"

              return {
                  "direction": mss["type"],
                  "entry": entry,
                  "stop_loss": stop_loss,
                  "tp1": tp1,
                  "tp2": tp2,
                  "tp3": tp3,
                  "tp4": tp4,
                  "risk": risk,
                  "atr": atr,
                  "aligned": aligned,
                  "entry_status": entry_status,
                  "setup_grade": setup_grade
              }

          def scan_market(symbol, candles):

              print()
              print("================================")
              print("MARKET:", symbol)
              print("================================")

              if len(candles) < 250:
                  print("❌ Not enough candles")
                  return

              candles = candles[1:]

              trend_data = determine_trend(candles)

              if not trend_data:
                  print("❌ Trend calculation failed")
                  return

              print()
              print("📊 LONG-TERM TREND")
              print("Trend:", trend_data["trend"])
              print(
                  "Bullish:",
                  trend_data["bullish_score"],
                  "/ 6"
              )
              print(
                  "Bearish:",
                  trend_data["bearish_score"],
                  "/ 6"
              )
              print(
                  "SMA100:",
                  fmt(symbol, trend_data["sma100"])
              )
              print(
                  "SMA200:",
                  fmt(symbol, trend_data["sma200"])
              )
              print(
                  "RMA100:",
                  fmt(symbol, trend_data["rma100"])
              )
              print(
                  "RMA200:",
                  fmt(symbol, trend_data["rma200"])
              )

              swing_highs, swing_lows = (
                  find_liquidity(candles)
              )

              print()
              print(
                  "Swing highs:",
                  len(swing_highs)
              )
              print(
                  "Swing lows:",
                  len(swing_lows)
              )

              sweeps = find_sweep(
                  candles,
                  swing_highs,
                  swing_lows
              )

              if not sweeps:
                  print("STATUS: NO LIQUIDITY SWEEP")
                  return

              sweep = sweeps[-1]

              print()
              print("🔥 LIQUIDITY SWEEP")
              print("Direction:", sweep["type"])
              print(
                  "Liquidity:",
                  fmt(symbol, sweep["liquidity"])
              )
              print("Time:", sweep["time"])

              mss = find_structure_break(
                  candles,
                  sweep,
                  swing_highs,
                  swing_lows
              )

              if not mss:
                  print("STATUS: SWEEP FOUND - NO MSS")
                  return

              print()
              print("🔥 MSS / CHOCH")
              print("Type:", mss["type"])
              print(
                  "Break:",
                  fmt(symbol, mss["level"])
              )
              print("Time:", mss["time"])

              fvg = find_fvg(
                  candles,
                  mss
              )

              if not fvg:
                  print("STATUS: MSS FOUND - NO FVG")
                  return

              print()
              print("🔥 FVG")
              print("Type:", fvg["type"])
              print(
                  "Low:",
                  fmt(symbol, fvg["low"])
              )
              print(
                  "High:",
                  fmt(symbol, fvg["high"])
              )

              trade = create_trade_plan(
                  symbol,
                  candles,
                  sweep,
                  mss,
                  fvg,
                  trend_data
              )

              if not trade:
                  print("❌ Invalid trade geometry")
                  return

              current = candles[-1]["close"]

              print()
              print("================================")
              print("🚨 TRADE PLAN")
              print("================================")
              print("Market:", symbol)
              print("Direction:", trade["direction"])
              print(
                  "Trend:",
                  trend_data["trend"]
              )
              print(
                  "Trend aligned:",
                  "YES ✅"
                  if trade["aligned"]
                  else "NO ❌"
              )
              print()
              print(
                  "ENTRY:",
                  fmt(symbol, trade["entry"])
              )
              print(
                  "SL:",
                  fmt(symbol, trade["stop_loss"])
              )
              print(
                  "TP1 1R:",
                  fmt(symbol, trade["tp1"])
              )
              print(
                  "TP2 2R:",
                  fmt(symbol, trade["tp2"])
              )
              print(
                  "TP3 3R:",
                  fmt(symbol, trade["tp3"])
              )
              print(
                  "TP4 4R:",
                  fmt(symbol, trade["tp4"])
              )
              print(
                  "ATR:",
                  fmt(symbol, trade["atr"])
              )
              print(
                  "Current:",
                  fmt(symbol, current)
              )
              print(
                  "ENTRY STATUS:",
                  trade["entry_status"]
              )
              print(
                  "SETUP:",
                  trade["setup_grade"]
              )

              sniper = (
                  trade["aligned"]
                  and
                  trade["entry_status"]
                  == "🔥 SNIPER ENTRY NOW"
              )

              print()
              print("================================")

              if sniper:
                  print("🎯 SNIPER TRADE CONFIRMED")
                  print(
                      "ENTRY:",
                      fmt(symbol, trade["entry"])
                  )
                  print(
                      "SL:",
                      fmt(symbol, trade["stop_loss"])
                  )
                  print(
                      "TP1:",
                      fmt(symbol, trade["tp1"])
                  )
                  print(
                      "TP2:",
                      fmt(symbol, trade["tp2"])
                  )
                  print(
                      "TP3:",
                      fmt(symbol, trade["tp3"])
                  )
                  print(
                      "TP4:",
                      fmt(symbol, trade["tp4"])
                  )
              else:
                  print("⏳ NO SNIPER ENTRY")

              print("================================")
              print("AUTOMATIC TRADING: DISABLED")

          def request_data():

              for output_size in OUTPUT_SIZES:

                  print(
                      f"Requesting {output_size} candles..."
                  )

                  params = {
                      "symbol": ",".join(SYMBOLS),
                      "interval": INTERVAL,
                      "outputsize": output_size,
                      "apikey": API_KEY
                  }

                  try:

                      response = requests.get(
                          URL,
                          params=params,
                          timeout=30
                      )

                      response.raise_for_status()

                      data = response.json()

                      if "code" in data:
                          print(
                              "API response:",
                              data
                          )
                          continue

                      print(
                          "Using:",
                          output_size,
                          "candles"
                      )

                      return data

                  except Exception as error:

                      print(
                          "Request failed:",
                          error
                      )

              raise SystemExit(
                  "Unable to retrieve market data."
              )

          data = request_data()

          success = 0
          failed = 0

          for symbol in SYMBOLS:

              result = data.get(symbol)

              if not result:
                  print(
                      f"❌ {symbol}: No response"
                  )
                  failed += 1
                  continue

              if result.get("status") == "error":
                  print(
                      f"❌ {symbol}: "
                      f"{result.get('message', 'Unknown error')}"
                  )
                  failed += 1
                  continue

              values = result.get("values", [])

              if not values:
                  print(
                      f"❌ {symbol}: No candles"
                  )
                  failed += 1
                  continue

              candles = []

              for item in values:

                  try:

                      candles.append({
                          "datetime": item["datetime"],
                          "open": float(item["open"]),
                          "high": float(item["high"]),
                          "low": float(item["low"]),
                          "close": float(item["close"])
                      })

                  except Exception:
                      continue

              if len(candles) < 250:

                  print(
                      f"❌ {symbol}: "
                      f"Only {len(candles)} candles"
                  )

                  failed += 1
                  continue

              candles.reverse()

              print(
                  f"✅ {symbol}: "
                  f"{len(candles)} candles loaded"
              )

              scan_market(
                  symbol,
                  candles
              )

              success += 1

          print()
          print("================================")
          print("STAGE 2 SCAN COMPLETED")
          print("================================")
          print(
              "Successful:",
              success
          )
          print(
              "Failed:",
              failed
          )
          print(
              "Timeframe:",
              INTERVAL
          )
          print("Automatic trading: DISABLED")
          print("================================")

          if success == 0:
              raise SystemExit(
                  "No market data was processed."
              )

          PY
