name: SMC Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: SMC Market Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          SYMBOLS = [
              "EUR/USD",
              "GBP/USD",
              "USD/JPY",
              "USD/CAD",
              "XAU/USD"
          ]

          INTERVAL = "15min"
          OUTPUT_SIZE = 500

          ATR_PERIOD = 14
          SL_ATR_MULTIPLIER = 0.25

          URL = "https://api.twelvedata.com/time_series"

          print("================================")
          print("SMC MARKET SCANNER")
          print("================================")
          print("Timeframe:", INTERVAL)
          print("Markets:", ", ".join(SYMBOLS))
          print("Candles:", OUTPUT_SIZE)
          print("Automatic trading: DISABLED")
          print()

          def calculate_atr(candles, period=14):

              if len(candles) < period + 1:
                  return None

              true_ranges = []

              for i in range(1, len(candles)):

                  high = candles[i]["high"]
                  low = candles[i]["low"]
                  previous_close = candles[i - 1]["close"]

                  tr = max(
                      high - low,
                      abs(high - previous_close),
                      abs(low - previous_close)
                  )

                  true_ranges.append(tr)

              if len(true_ranges) < period:
                  return None

              atr = sum(
                  true_ranges[:period]
              ) / period

              for tr in true_ranges[period:]:

                  atr = (
                      atr * (period - 1) + tr
                  ) / period

              return atr

          def is_swing_high(candles, i, strength=2):

              if i < strength or i >= len(candles) - strength:
                  return False

              high = candles[i]["high"]

              for j in range(1, strength + 1):

                  if high <= candles[i-j]["high"]:
                      return False

                  if high <= candles[i+j]["high"]:
                      return False

              return True

          def is_swing_low(candles, i, strength=2):

              if i < strength or i >= len(candles) - strength:
                  return False

              low = candles[i]["low"]

              for j in range(1, strength + 1):

                  if low >= candles[i-j]["low"]:
                      return False

                  if low >= candles[i+j]["low"]:
                      return False

              return True

          def find_liquidity(candles):

              swing_highs = []
              swing_lows = []

              for i in range(2, len(candles) - 2):

                  if is_swing_high(candles, i):

                      swing_highs.append({
                          "index": i,
                          "price": candles[i]["high"],
                          "time": candles[i]["datetime"]
                      })

                  if is_swing_low(candles, i):

                      swing_lows.append({
                          "index": i,
                          "price": candles[i]["low"],
                          "time": candles[i]["datetime"]
                      })

              return swing_highs, swing_lows

          def find_sweep(
              candles,
              swing_highs,
              swing_lows
          ):

              sweeps = []

              start = max(
                  0,
                  len(candles) - 35
              )

              for i in range(start, len(candles)):

                  candle = candles[i]

                  for level in reversed(swing_highs):

                      if level["index"] >= i:
                          continue

                      if candle["high"] > level["price"]:

                          if candle["close"] < level["price"]:

                              sweeps.append({
                                  "type": "BEARISH",
                                  "index": i,
                                  "liquidity": level["price"],
                                  "time": candle["datetime"]
                              })

                              break

                  for level in reversed(swing_lows):

                      if level["index"] >= i:
                          continue

                      if candle["low"] < level["price"]:

                          if candle["close"] > level["price"]:

                              sweeps.append({
                                  "type": "BULLISH",
                                  "index": i,
                                  "liquidity": level["price"],
                                  "time": candle["datetime"]
                              })

                              break

              return sweeps

          def find_structure_break(
              candles,
              sweep,
              swing_highs,
              swing_lows
          ):

              sweep_index = sweep["index"]
              direction = sweep["type"]

              search_end = min(
                  len(candles),
                  sweep_index + 11
              )

              if direction == "BULLISH":

                  previous_highs = [
                      x for x in swing_highs
                      if x["index"] < sweep_index
                  ]

                  if not previous_highs:
                      return None

                  target = previous_highs[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):

                      if candles[i]["close"] > target["price"]:

                          return {
                              "type": "BULLISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              if direction == "BEARISH":

                  previous_lows = [
                      x for x in swing_lows
                      if x["index"] < sweep_index
                  ]

                  if not previous_lows:
                      return None

                  target = previous_lows[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):

                      if candles[i]["close"] < target["price"]:

                          return {
                              "type": "BEARISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              return None

          def find_fvg(candles, mss):

              mss_index = mss["index"]

              start = max(
                  2,
                  mss_index - 1
              )

              end = min(
                  len(candles),
                  mss_index + 7
              )

              for i in range(start, end):

                  if i < 2:
                      continue

                  c0 = candles[i-2]
                  c2 = candles[i]

                  if mss["type"] == "BULLISH MSS":

                      if c2["low"] > c0["high"]:

                          return {
                              "type": "BULLISH FVG",
                              "index": i,
                              "low": c0["high"],
                              "high": c2["low"],
                              "time": c2["datetime"]
                          }

                  if mss["type"] == "BEARISH MSS":

                      if c2["high"] < c0["low"]:

                          return {
                              "type": "BEARISH FVG",
                              "index": i,
                              "low": c2["high"],
                              "high": c0["low"],
                              "time": c2["datetime"]
                          }

              return None

          def decimals(symbol):

              if symbol == "XAU/USD":
                  return 2

              if "JPY" in symbol:
                  return 3

              return 5

          def fmt(symbol, value):

              if value is None:
                  return "N/A"

              return f"{value:.{decimals(symbol)}f}"

          def create_trade_plan(
              symbol,
              candles,
              sweep,
              mss,
              fvg
          ):

              current = candles[-1]["close"]

              atr = calculate_atr(
                  candles,
                  ATR_PERIOD
              )

              if atr is None:
                  return None

              entry = (
                  fvg["low"] +
                  fvg["high"]
              ) / 2

              if mss["type"] == "BULLISH MSS":

                  stop_loss = (
                      sweep["liquidity"]
                      - atr * SL_ATR_MULTIPLIER
                  )

                  risk = entry - stop_loss

                  if risk <= 0:
                      return None

                  tp1 = entry + risk
                  tp2 = entry + risk * 2
                  tp3 = entry + risk * 3
                  tp4 = entry + risk * 4

                  direction = "BUY"

                  if (
                      fvg["low"]
                      <= current
                      <= fvg["high"]
                  ):

                      entry_status = (
                          "🔥 SNIPER ENTRY NOW"
                      )

                  elif current < fvg["low"]:

                      entry_status = (
                          "⏳ WAIT FOR BULLISH FVG RETEST"
                      )

                  else:

                      entry_status = (
                          "⚠️ PRICE ABOVE FVG - DO NOT CHASE"
                      )

              else:

                  stop_loss = (
                      sweep["liquidity"]
                      + atr * SL_ATR_MULTIPLIER
                  )

                  risk = stop_loss - entry

                  if risk <= 0:
                      return None

                  tp1 = entry - risk
                  tp2 = entry - risk * 2
                  tp3 = entry - risk * 3
                  tp4 = entry - risk * 4

                  direction = "SELL"

                  if (
                      fvg["low"]
                      <= current
                      <= fvg["high"]
                  ):

                      entry_status = (
                          "🔥 SNIPER ENTRY NOW"
                      )

                  elif current > fvg["high"]:

                      entry_status = (
                          "⏳ WAIT FOR BEARISH FVG RETEST"
                      )

                  else:

                      entry_status = (
                          "⚠️ PRICE BELOW FVG - DO NOT CHASE"
                      )

              return {
                  "direction": direction,
                  "entry": entry,
                  "stop_loss": stop_loss,
                  "tp1": tp1,
                  "tp2": tp2,
                  "tp3": tp3,
                  "tp4": tp4,
                  "risk": risk,
                  "atr": atr,
                  "rr1": 1.0,
                  "rr2": 2.0,
                  "rr3": 3.0,
                  "rr4": 4.0,
                  "entry_status": entry_status
              }

          def scan_market(symbol, candles):

              print()
              print("================================")
              print("MARKET:", symbol)
              print("================================")

              if len(candles) < 30:

                  print("❌ Not enough candles")
                  return

              candles = candles[1:]

              swing_highs, swing_lows = find_liquidity(
                  candles
              )

              print(
                  "Swing highs:",
                  len(swing_highs)
              )

              print(
                  "Swing lows:",
                  len(swing_lows)
              )

              if swing_highs:

                  latest_high = swing_highs[-1]

                  print(
                      "Liquidity HIGH:",
                      fmt(
                          symbol,
                          latest_high["price"]
                      )
                  )

              if swing_lows:

                  latest_low = swing_lows[-1]

                  print(
                      "Liquidity LOW:",
                      fmt(
                          symbol,
                          latest_low["price"]
                      )
                  )

              sweeps = find_sweep(
                  candles,
                  swing_highs,
                  swing_lows
              )

              print(
                  "Liquidity sweeps:",
                  len(sweeps)
              )

              if not sweeps:

                  print(
                      "STATUS: NO LIQUIDITY SWEEP"
                  )

                  return

              sweep = sweeps[-1]

              print()
              print("🔥 LIQUIDITY SWEEP")
              print(
                  "Direction:",
                  sweep["type"]
              )

              print(
                  "Liquidity:",
                  fmt(
                      symbol,
                      sweep["liquidity"]
                  )
              )

              print(
                  "Time:",
                  sweep["time"]
              )

              mss = find_structure_break(
                  candles,
                  sweep,
                  swing_highs,
                  swing_lows
              )

              if not mss:

                  print(
                      "STATUS: SWEEP FOUND - NO MSS/CHOCH"
                  )

                  return

              print()
              print("🔥 MSS / CHOCH")
              print(
                  "Type:",
                  mss["type"]
              )

              print(
                  "Break level:",
                  fmt(
                      symbol,
                      mss["level"]
                  )
              )

              print(
                  "Time:",
                  mss["time"]
              )

              fvg = find_fvg(
                  candles,
                  mss
              )

              if not fvg:

                  print(
                      "STATUS: MSS FOUND - NO FVG"
                  )

                  return

              print()
              print("🔥 FAIR VALUE GAP")
              print(
                  "Type:",
                  fvg["type"]
              )

              print(
                  "FVG Low:",
                  fmt(
                      symbol,
                      fvg["low"]
                  )
              )

              print(
                  "FVG High:",
                  fmt(
                      symbol,
                      fvg["high"]
                  )
              )

              trade = create_trade_plan(
                  symbol,
                  candles,
                  sweep,
                  mss,
                  fvg
              )

              if not trade:

                  print(
                      "STATUS: INVALID TRADE PLAN"
                  )

                  return

              current = candles[-1]["close"]

              print()
              print("================================")
              print("🚨 SMC TRADE SETUP")
              print("================================")

              print(
                  "Market:",
                  symbol
              )

              print(
                  "Direction:",
                  trade["direction"]
              )

              print(
                  "Entry:",
                  fmt(
                      symbol,
                      trade["entry"]
                  )
              )

              print(
                  "Stop Loss:",
                  fmt(
                      symbol,
                      trade["stop_loss"]
                  )
              )

              print(
                  "TP1:",
                  fmt(
                      symbol,
                      trade["tp1"]
                  ),
                  "RR:",
                  trade["rr1"]
              )

              print(
                  "TP2:",
                  fmt(
                      symbol,
                      trade["tp2"]
                  ),
                  "RR:",
                  trade["rr2"]
              )

              print(
                  "TP3:",
                  fmt(
                      symbol,
                      trade["tp3"]
                  ),
                  "RR:",
                  trade["rr3"]
              )

              print(
                  "TP4:",
                  fmt(
                      symbol,
                      trade["tp4"]
                  ),
                  "RR:",
                  trade["rr4"]
              )

              print(
                  "Risk:",
                  fmt(
                      symbol,
                      trade["risk"]
                  )
              )

              print(
                  "ATR:",
                  fmt(
                      symbol,
                      trade["atr"]
                  )
              )

              print(
                  "Current price:",
                  fmt(
                      symbol,
                      current
                  )
              )

              print(
                  "Entry status:",
                  trade["entry_status"]
              )

              if (
                  trade["entry_status"]
                  == "🔥 SNIPER ENTRY NOW"
              ):

                  print()
                  print(
                      "🎯 SNIPER ENTRY CONFIRMED"
                  )

                  print(
                      "ACTION:",
                      trade["direction"]
                  )

                  print(
                      "ENTRY:",
                      fmt(
                          symbol,
                          trade["entry"]
                      )
                  )

                  print(
                      "SL:",
                      fmt(
                          symbol,
                          trade["stop_loss"]
                      )
                  )

                  print(
                      "TP1:",
                      fmt(
                          symbol,
                          trade["tp1"]
                      )
                  )

                  print(
                      "TP2:",
                      fmt(
                          symbol,
                          trade["tp2"]
                      )
                  )

                  print(
                      "TP3:",
                      fmt(
                          symbol,
                          trade["tp3"]
                      )
                  )

                  print(
                      "TP4:",
                      fmt(
                          symbol,
                          trade["tp4"]
                      )
                  )

              print("================================")
              print("AUTOMATIC TRADING: DISABLED")

