name: SMC Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Test Twelve Data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          SYMBOLS = [
              "EUR/USD",
              "GBP/USD",
              "USD/JPY",
              "USD/CAD",
              "XAU/USD"
          ]

          url = "https://api.twelvedata.com/time_series"

          params = {
              "symbol": ",".join(SYMBOLS),
              "interval": "15min",
              "outputsize": 10,
              "apikey": API_KEY
          }

          print("Requesting Twelve Data market data...")
          print("Markets:", ", ".join(SYMBOLS))
          print("Timeframe: 15min")
          print()

          response = requests.get(
              url,
              params=params,
              timeout=30
          )

          print("HTTP status:", response.status_code)

          response.raise_for_status()

          data = response.json()

          if "code" in data:
              print("Twelve Data error:")
              print(data)
              raise SystemExit(1)

          success = 0
          failed = 0

          for symbol in SYMBOLS:

              result = data.get(symbol)

              if not result:
                  print(f"❌ {symbol}: No response")
                  failed += 1
                  continue

              if result.get("status") == "error":
                  print(
                      f"❌ {symbol}: "
                      f"{result.get('message', 'Unknown error')}"
                  )
                  failed += 1
                  continue

              values = result.get("values", [])

              if not values:
                  print(f"❌ {symbol}: No candles returned")
                  failed += 1
                  continue

              latest = values[0]

              print(f"✅ {symbol}")
              print(f"   Time:  {latest.get('datetime')}")
              print(f"   Open:  {latest.get('open')}")
              print(f"   High:  {latest.get('high')}")
              print(f"   Low:   {latest.get('low')}")
              print(f"   Close: {latest.get('close')}")

              success += 1

          print()
          print("================================")
          print("Twelve Data test completed")
          print(f"Successful markets: {success}")
          print(f"Failed markets: {failed}")
          print("Automatic trading: DISABLED")
          print("================================")

          if success == 0:
              raise SystemExit(
                  "No market data was successfully retrieved."
              )
          PY
