name: SMC Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Test Telegram connection
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]

          api = f"https://api.telegram.org/bot{token}"

          updates = requests.get(
              f"{api}/getUpdates",
              timeout=30
          ).json()

          messages = updates.get("result", [])

          if not messages:
              print("No Telegram message found.")
              print("Open your bot in Telegram and send /start.")
              raise SystemExit(0)

          message = messages[-1].get("message")

          if not message:
              print("No message found.")
              raise SystemExit(0)

          chat_id = message["chat"]["id"]

          text = (
              "🟢 SMC SCANNER ONLINE\n\n"
              "Telegram connection: SUCCESS ✅\n"
              "Market scanner: STARTING\n"
              "SMC analysis: READY\n"
              "News engine: READY\n"
              "Trade execution: DISABLED 🚫\n\n"
              "Next stage: market scanning."
          )

          response = requests.post(
              f"{api}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": text
              },
              timeout=30
          )

          response.raise_for_status()

          print("Telegram test notification sent successfully.")
          PY
