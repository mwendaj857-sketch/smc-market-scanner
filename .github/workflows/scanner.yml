name: SMC Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Stage 2 - SMC Market Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from math import isnan

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]

          SYMBOLS = [
              "EUR/USD",
              "GBP/USD",
              "USD/JPY",
              "USD/CAD",
              "XAU/USD"
          ]

          INTERVAL = "15min"

          # ==========================================
          # CANDLE HISTORY
          # ==========================================

          # 1000+ candles gives the scanner much more
          # historical context for the 100/200 MA system.
          OUTPUT_SIZE = 2000

          URL = "https://api.twelvedata.com/time_series"

          # ==========================================
          # SETTINGS
          # ==========================================

          SMA_FAST = 100
          SMA_SLOW = 200

          RMA_FAST = 100
          RMA_SLOW = 200

          ATR_PERIOD = 14

          # ATR buffer beyond liquidity sweep
          SL_ATR_MULTIPLIER = 0.25

          # Minimum reward required for a setup
          MIN_RR = 2.0

          print("================================")
          print("SMC MARKET SCANNER - STAGE 2")
          print("================================")
          print("Timeframe:", INTERVAL)
          print("Markets:", ", ".join(SYMBOLS))
          print("Candles requested:", OUTPUT_SIZE)
          print("SMA:", SMA_FAST, SMA_SLOW)
          print("RMA:", RMA_FAST, RMA_SLOW)
          print("ATR:", ATR_PERIOD)
          print("Minimum RR:", MIN_RR)
          print("Automatic trading: DISABLED")
          print()

          # ==========================================
          # MOVING AVERAGES
          # ==========================================

          def sma(values, period):

              if len(values) < period:
                  return None

              return sum(values[-period:]) / period


          def full_sma(values, period):

              result = [None] * len(values)

              if len(values) < period:
                  return result

              for i in range(period - 1, len(values)):

                  window = values[i - period + 1:i + 1]

                  result[i] = sum(window) / period

              return result


          def rma(values, period):

              if len(values) < period:
                  return None

              # Wilder RMA:
              # First value = SMA
              current = sum(values[:period]) / period

              for value in values[period:]:

                  current = (
                      (current * (period - 1)) + value
                  ) / period

              return current


          def full_rma(values, period):

              result = [None] * len(values)

              if len(values) < period:
                  return result

              current = sum(values[:period]) / period

              result[period - 1] = current

              for i in range(period, len(values)):

                  current = (
                      (current * (period - 1)) +
                      values[i]
                  ) / period

                  result[i] = current

              return result


          # ==========================================
          # ATR
          # ==========================================

          def calculate_atr(candles, period=14):

              if len(candles) < period + 1:
                  return None

              true_ranges = []

              for i in range(1, len(candles)):

                  high = candles[i]["high"]
                  low = candles[i]["low"]
                  previous_close = candles[i-1]["close"]

                  tr = max(
                      high - low,
                      abs(high - previous_close),
                      abs(low - previous_close)
                  )

                  true_ranges.append(tr)

              if len(true_ranges) < period:
                  return None

              # Wilder-style ATR
              atr_value = sum(
                  true_ranges[:period]
              ) / period

              for tr in true_ranges[period:]:

                  atr_value = (
                      (atr_value * (period - 1)) + tr
                  ) / period

              return atr_value


          # ==========================================
          # SWING DETECTION
          # ==========================================

          def is_swing_high(candles, i, strength=2):

              if i < strength or i >= len(candles) - strength:
                  return False

              high = candles[i]["high"]

              for j in range(1, strength + 1):

                  if high <= candles[i-j]["high"]:
                      return False

                  if high <= candles[i+j]["high"]:
                      return False

              return True


          def is_swing_low(candles, i, strength=2):

              if i < strength or i >= len(candles) - strength:
                  return False

              low = candles[i]["low"]

              for j in range(1, strength + 1):

                  if low >= candles[i-j]["low"]:
                      return False

                  if low >= candles[i+j]["low"]:
                      return False

              return True


          def find_liquidity(candles):

              swing_highs = []
              swing_lows = []

              for i in range(
                  2,
                  len(candles) - 2
              ):

                  if is_swing_high(candles, i):

                      swing_highs.append({
                          "index": i,
                          "price": candles[i]["high"],
                          "time": candles[i]["datetime"]
                      })

                  if is_swing_low(candles, i):

                      swing_lows.append({
                          "index": i,
                          "price": candles[i]["low"],
                          "time": candles[i]["datetime"]
                      })

              return swing_highs, swing_lows


          # ==========================================
          # LIQUIDITY SWEEP
          # ==========================================

          def find_sweep(
              candles,
              swing_highs,
              swing_lows
          ):

              sweeps = []

              start = max(
                  0,
                  len(candles) - 35
              )

              for i in range(start, len(candles)):

                  candle = candles[i]

                  # ==================================
                  # BEARISH SWEEP
                  # ==================================

                  for level in reversed(swing_highs):

                      if level["index"] >= i:
                          continue

                      if candle["high"] > level["price"]:

                          if candle["close"] < level["price"]:

                              sweeps.append({
                                  "type": "BEARISH",
                                  "index": i,
                                  "liquidity": level["price"],
                                  "time": candle["datetime"]
                              })

                              break

                  # ==================================
                  # BULLISH SWEEP
                  # ==================================

                  for level in reversed(swing_lows):

                      if level["index"] >= i:
                          continue

                      if candle["low"] < level["price"]:

                          if candle["close"] > level["price"]:

                              sweeps.append({
                                  "type": "BULLISH",
                                  "index": i,
                                  "liquidity": level["price"],
                                  "time": candle["datetime"]
                              })

                              break

              return sweeps


          # ==========================================
          # MSS / CHOCH
          # ==========================================

          def find_structure_break(
              candles,
              sweep,
              swing_highs,
              swing_lows
          ):

              sweep_index = sweep["index"]
              direction = sweep["type"]

              search_end = min(
                  len(candles),
                  sweep_index + 11
              )

              # ======================================
              # BULLISH MSS
              # ======================================

              if direction == "BULLISH":

                  previous_highs = [
                      x for x in swing_highs
                      if x["index"] < sweep_index
                  ]

                  if not previous_highs:
                      return None

                  target = previous_highs[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):

                      if candles[i]["close"] > target["price"]:

                          return {
                              "type": "BULLISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              # ======================================
              # BEARISH MSS
              # ======================================

              if direction == "BEARISH":

                  previous_lows = [
                      x for x in swing_lows
                      if x["index"] < sweep_index
                  ]

                  if not previous_lows:
                      return None

                  target = previous_lows[-1]

                  for i in range(
                      sweep_index + 1,
                      search_end
                  ):

                      if candles[i]["close"] < target["price"]:

                          return {
                              "type": "BEARISH MSS",
                              "index": i,
                              "level": target["price"],
                              "time": candles[i]["datetime"]
                          }

              return None


          # ==========================================
          # FAIR VALUE GAP
          # ==========================================

          def find_fvg(candles, mss):

              mss_index = mss["index"]

              start = max(
                  2,
                  mss_index - 1
              )

              end = min(
                  len(candles),
                  mss_index + 7
              )

              for i in range(start, end):

                  if i < 2:
                      continue

                  c0 = candles[i-2]
                  c1 = candles[i-1]
                  c2 = candles[i]

                  # ==================================
                  # BULLISH FVG
                  # ==================================

                  if mss["type"] == "BULLISH MSS":

                      if c2["low"] > c0["high"]:

                          return {
                              "type": "BULLISH FVG",
                              "index": i,
                              "low": c0["high"],
                              "high": c2["low"],
                              "time": c2["datetime"]
                          }

                  # ==================================
                  # BEARISH FVG
                  # ==================================

                  if mss["type"] == "BEARISH MSS":

                      if c2["high"] < c0["low"]:

                          return {
                              "type": "BEARISH FVG",
                              "low": c2["high"],
                              "high": c0["low"],
                              "index": i,
                              "time": c2["datetime"]
                          }

              return None


          # ==========================================
          # TREND ENGINE
          # ==========================================

          def determine_trend(candles):

              closes = [
                  x["close"]
                  for x in candles
              ]

              sma100_series = full_sma(
                  closes,
                  SMA_FAST
              )

              sma200_series = full_sma(
                  closes,
                  SMA_SLOW
              )

              rma100_series = full_rma(
                  closes,
                  RMA_FAST
              )

              rma200_series = full_rma(
                  closes,
                  RMA_SLOW
              )

              current = closes[-1]

              sma100 = sma100_series[-1]
              sma200 = sma200_series[-1]

              rma100 = rma100_series[-1]
              rma200 = rma200_series[-1]

              if None in [
                  sma100,
                  sma200,
                  rma100,
                  rma200
              ]:

                  return None

              # ======================================
              # STRONG LONG TERM BULLISH
              # ======================================

              bullish_score = 0

              if current > sma100:
                  bullish_score += 1

              if current > sma200:
                  bullish_score += 1

              if current > rma100:
                  bullish_score += 1

              if current > rma200:
                  bullish_score += 1

              if sma100 > sma200:
                  bullish_score += 1

              if rma100 > rma200:
                  bullish_score += 1

              # ======================================
              # STRONG LONG TERM BEARISH
              # ======================================

              bearish_score = 0

              if current < sma100:
                  bearish_score += 1

              if current < sma200:
                  bearish_score += 1

              if current < rma100:
                  bearish_score += 1

              if current < rma200:
                  bearish_score += 1

              if sma100 < sma200:
                  bearish_score += 1

              if rma100 < rma200:
                  bearish_score += 1

              # ======================================
              # CLASSIFICATION
              # ======================================

              if bullish_score >= 5:

                  trend = "LONG-TERM BULLISH"

              elif bearish_score >= 5:

                  trend = "LONG-TERM BEARISH"

              else:

                  trend = "LONG-TERM NEUTRAL"

              return {
                  "trend": trend,
                  "bullish_score": bullish_score,
                  "bearish_score": bearish_score,
                  "sma100": sma100,
                  "sma200": sma200,
                  "rma100": rma100,
                  "rma200": rma200
              }


          # ==========================================
          # PRICE ROUNDING
          # ==========================================

          def decimals(symbol):

              if symbol == "XAU/USD":
                  return 2

              if "JPY" in symbol:
                  return 3

              return 5


          def fmt(symbol, value):

              if value is None:
                  return "N/A"

              d = decimals(symbol)

              return f"{value:.{d}f}"


          # ==========================================
          # TRADE PLAN
          # ==========================================

          def create_trade_plan(
              symbol,
              candles,
              sweep,
              mss,
              fvg,
              trend_data
          ):

              current = candles[-1]["close"]

              atr = calculate_atr(
                  candles,
                  ATR_PERIOD
              )

              if atr is None:
                  return None

              direction = mss["type"]

              # ======================================
              # BULLISH TRADE
              # ======================================

              if direction == "BULLISH MSS":

                  entry = (
                      fvg["low"] + fvg["high"]
                  ) / 2

                  # SL below sweep liquidity
                  stop_loss = (
                      sweep["liquidity"] -
                      atr * SL_ATR_MULTIPLIER
                  )

                  risk = entry - stop_loss

                  if risk <= 0:
                      return None

                  tp1 = entry + risk * 1
                  tp2 = entry + risk * 2
                  tp3 = entry + risk * 3
                  tp4 = entry + risk * 4

                  rr1 = 1.0
                  rr2 = 2.0
                  rr3 = 3.0
                  rr4 = 4.0

                  aligned = (
                      trend_data["trend"] ==
                      "LONG-TERM BULLISH"
                  )

                  if fvg["low"] <= current <= fvg["high"]:

                      entry_status = (
                          "🔥 SNIPER ENTRY NOW"
                      )

                  elif current < fvg["low"]:

                      entry_status = (
                          "⏳ WAIT FOR BULLISH FVG RETEST"
                      )

                  else:

                      entry_status = (
                          "⚠️ PRICE ABOVE FVG - DO NOT CHASE"
                      )

              # ======================================
              # BEARISH TRADE
              # ======================================

              else:

                  entry = (
                      fvg["low"] + fvg["high"]
                  ) / 2

                  # SL above sweep liquidity
                  stop_loss = (
                      sweep["liquidity"] +
                      atr * SL_ATR_MULTIPLIER
                  )

                  risk = stop_loss - entry

                  if risk <= 0:
                      return None

                  tp1 = entry - risk * 1
                  tp2 = entry - risk * 2
                  tp3 = entry - risk * 3
                  tp4 = entry - risk * 4

                  rr1 = 1.0
                  rr2 = 2.0
                  rr3 = 3.0
                  rr4 = 4.0

                  aligned = (
                      trend_data["trend"] ==
                      "LONG-TERM BEARISH"
                  )

                  if fvg["low"] <= current <= fvg["high"]:

                      entry_status = (
                          "🔥 SNIPER ENTRY NOW"
                      )

                  elif current > fvg["high"]:

                      entry_status = (
                          "⏳ WAIT FOR BEARISH FVG RETEST"
                      )

                  else:

                      entry_status = (
                          "⚠️ PRICE BELOW FVG - DO NOT CHASE"
                      )

              # ======================================
              # SETUP QUALITY
              # ======================================

