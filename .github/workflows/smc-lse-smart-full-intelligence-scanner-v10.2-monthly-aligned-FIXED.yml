      - name: Validate scanner handoff and critical JSON fields
        if: ${{ success() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("scan_results.json")
          if not p.is_file():
              raise SystemExit("Scanner handoff missing: scan_results.json was not created")

          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("Scanner handoff is not a JSON object")

          required = {
              "version", "generated_at", "entries", "sniper_entries",
              "intraday_entries", "scalp_entries", "swing_entries",
              "adaptive_entries", "setup_waiting", "potential", "waiting",
              "score_definitions",
          }
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit(f"Scanner handoff missing keys: {missing}")

          def require_value(obj, path):
              cur = obj
              for part in path.split("."):
                  if not isinstance(cur, dict) or part not in cur:
                      raise SystemExit(f"Critical JSON field missing: {path}")
                  cur = cur[part]
              if cur is None:
                  raise SystemExit(f"Critical JSON field is null: {path}")
              if isinstance(cur, str):
                  if not cur.strip():
                      raise SystemExit(f"Critical JSON field is empty: {path}")
                  if cur.strip().casefold() in {"undefined", "null", "none", "nan"}:
                      raise SystemExit(f"Critical JSON field has invalid value {cur!r}: {path}")
              return cur

          for path in ("version", "generated_at", "entries", "setup_waiting", "potential", "waiting"):
              require_value(data, path)

          critical_entry_fields = (
              "symbol", "status", "side", "trade_type", "horizon",
              "strategy_score", "execution_quality_score",
              "strategy_consensus", "alignment", "monthly_bias", "signal_timeframes",
              "timeframe_consensus", "event_level", "rss_news_risk",
          )

          all_result_buckets = (
              "entries", "sniper_entries", "intraday_entries", "scalp_entries",
              "swing_entries", "adaptive_entries", "setup_waiting", "potential", "waiting",
          )

          checked = 0
          for bucket in all_result_buckets:
              items = data.get(bucket, [])
              if not isinstance(items, list):
                  raise SystemExit(f"JSON bucket is not a list: {bucket}")

              for index, item in enumerate(items):
                  if not isinstance(item, dict):
                      raise SystemExit(f"JSON result is not an object: {bucket}[{index}]")

                  for field in critical_entry_fields:
                      if field not in item:
                          raise SystemExit(f"Critical JSON field missing: {bucket}[{index}].{field}")
                      value = item[field]
                      if value is None:
                          raise SystemExit(f"Critical JSON field is null: {bucket}[{index}].{field}")
                      if isinstance(value, str) and not value.strip():
                          raise SystemExit(f"Critical JSON field is empty: {bucket}[{index}].{field}")

                  status = str(item["status"])
                  trade_type = str(item["trade_type"])
                  horizon = str(item["horizon"])
                  expected_horizons = {
                      "SNIPER": "5M-30M / minutes to a few hours",
                      "INTRADAY": "30M-4H / same trading day",
                      "SCALP": "5M-15M / minutes to under 1 hour",
                      "SWING/HOLD": "1H-1D / multiple days",
                      "ADAPTIVE PRICE-MOVEMENT": "15M-1H / minutes to several hours",
                      "WAIT": "NOT APPLICABLE — WAIT / no entry",
                  }
                  if trade_type in expected_horizons and horizon != expected_horizons[trade_type]:
                      raise SystemExit(f"Trade-type horizon mismatch: {bucket}[{index}]")


                  if status.startswith("CONFIRMED ") and trade_type in ("WAIT", "POTENTIAL"):
                      raise SystemExit(f"Confirmed entry has non-entry type: {bucket}[{index}]")

                  if status.startswith("CONFIRMED ") and horizon.startswith("NOT APPLICABLE"):
                      raise SystemExit(f"Confirmed entry has invalid WAIT horizon: {bucket}[{index}]")

                  if status.startswith("CONFIRMED "):
                      levels = item.get("levels")
                      rr = item.get("rr")
                      chart = item.get("chart_30m")
                      if not isinstance(levels, list) or len(levels) < 3 or any(v is None for v in levels[:3]):
                          raise SystemExit(f"Confirmed entry has invalid Entry/SL/TP levels: {bucket}[{index}]")
                      if not isinstance(rr, (int, float)) or not __import__("math").isfinite(float(rr)) or float(rr) < 2.0:
                          raise SystemExit(f"Confirmed entry has invalid R:R: {bucket}[{index}]")
                      if not isinstance(chart, list) or len(chart) < 10:
                          raise SystemExit(f"Confirmed entry has insufficient 30M chart candles: {bucket}[{index}]")
                      for candle_index, candle in enumerate(chart[-10:]):
                          if not isinstance(candle, dict):
                              raise SystemExit(f"Chart candle is not an object: {bucket}[{index}].chart_30m[{candle_index}]")
                          for key in ("timestamp", "open", "high", "low", "close"):
                              value = candle.get(key)
                              if value is None or (isinstance(value, str) and value.strip().casefold() in {"undefined", "null", "none", "nan"}):
                                  raise SystemExit(f"Invalid chart candle field: {bucket}[{index}].chart_30m[{candle_index}].{key}")

                  if "WAIT" in status and trade_type == "WAIT":
                      if horizon != "NOT APPLICABLE — WAIT / no entry":
                          raise SystemExit(f"WAIT result has a trade horizon: {bucket}[{index}]")

                  checked += 1

          print(f"Scanner handoff: PASS ({len(data.get('entries', []))} confirmed entries)")
          print(f"Critical JSON fields: PASS ({checked} result objects checked; no undefined/null critical fields)")
          print("WAIT/confirmed separation: PASS")
          print("Score separation: PASS")
          PY


