              raise SystemExit("Telegram delivery blocked: TELEGRAM_CHAT_ID repository secret is missing")

          data = json.loads(Path("scan_results.json").read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("Telegram delivery blocked: scan_results.json is not an object")

          def fmt_score(value):
              try:
                  return f"{float(value):.1f}/100"
              except Exception:
                  return "UNAVAILABLE"

          def fmt_rr(value):
              try:
                  return f"{float(value):.2f}R"
              except Exception:
                  return "UNAVAILABLE"

          def fmt_price(value):
              try:
                  x = float(value)
                  if not math.isfinite(x):
                      return "UNAVAILABLE"
                  return f"{x:.6g}"
              except Exception:
                  return "UNAVAILABLE"

          def confirmed_line(item):
              symbol = item.get("symbol", "UNKNOWN")
              side = item.get("side", "NEUTRAL")
              trade_type = item.get("trade_type", "UNKNOWN")
              levels = item.get("levels") or []
              level_text = "UNAVAILABLE"
              if isinstance(levels, list) and len(levels) >= 3:
                  level_text = f"Entry {fmt_price(levels[0])} | SL {fmt_price(levels[1])} | TP {fmt_price(levels[2])}"
              return "\n".join([
                  f"🟢 {symbol} | {side} | {trade_type}",
                  f"Strategy score: {fmt_score(item.get('strategy_score'))}",
                  f"Execution quality: {fmt_score(item.get('execution_quality_score'))}",
                  f"{level_text} | R:R {fmt_rr(item.get('rr'))}",
                  f"Horizon: {item.get('horizon', 'UNAVAILABLE')}",
                  f"Monthly master bias: {item.get('monthly_bias', 'UNAVAILABLE')}",
                  f"Signal timeframe(s): {', '.join(item.get('signal_timeframes', [])) or 'UNAVAILABLE'}",
                  f"Event/news risk: {item.get('event_level', 'UNAVAILABLE')}",
                  f"RSS risk: {item.get('rss_news_risk', 'UNAVAILABLE')}",
              ])

          def make_candlestick_chart(item, output_dir):
              """Create a TradingView/MT5-style 30M candlestick chart for confirmed entries only."""
              candles = item.get("chart_30m")
              levels = item.get("levels")
              status = str(item.get("status", ""))
              if not status.startswith("CONFIRMED "):
                  return None
              if not isinstance(candles, list) or len(candles) < 10:
                  raise RuntimeError(f"Insufficient chart candles for {item.get('symbol', 'UNKNOWN')}")
              if not isinstance(levels, list) or len(levels) < 3:
                  raise RuntimeError(f"Missing Entry/SL/TP levels for {item.get('symbol', 'UNKNOWN')}")

              rows = candles[-80:]
              parsed = []
              for row in rows:
                  try:
                      ts = str(row["timestamp"])
                      if ts.endswith("Z"):
                          ts = ts[:-1] + "+00:00"
                      dt = datetime.fromisoformat(ts)
                      values = [float(row[k]) for k in ("open", "high", "low", "close")]
                      if not all(math.isfinite(v) for v in values):
                          raise ValueError("non-finite OHLC")
                      parsed.append((dt, *values))
                  except Exception as exc:
                      raise RuntimeError(f"Invalid chart candle for {item.get('symbol', 'UNKNOWN')}: {exc}")

              dates = [x[0] for x in parsed]
              opens = [x[1] for x in parsed]
              highs = [x[2] for x in parsed]
              lows = [x[3] for x in parsed]
              closes = [x[4] for x in parsed]
              xvals = mdates.date2num(dates)
              width = (xvals[1] - xvals[0]) * 0.68 if len(xvals) > 1 else 0.01

              fig, ax = plt.subplots(figsize=(12, 6.8), dpi=150)
              fig.patch.set_facecolor("#0b0f14")
              ax.set_facecolor("#0b0f14")

              for x, o, h, l, c in zip(xvals, opens, highs, lows, closes):
                  bullish = c >= o
                  body_low = min(o, c)
                  body_height = max(abs(c - o), 1e-12)
                  ax.vlines(x, l, h, linewidth=1.0)
                  ax.add_patch(plt.Rectangle(
                      (x - width / 2, body_low), width, body_height,
                      fill=bullish, alpha=0.85, linewidth=0.8
                  ))

              entry, sl, tp = [float(v) for v in levels[:3]]
              ax.axhline(entry, linestyle="--", linewidth=1.5, label=f"ENTRY {fmt_price(entry)}")
              ax.axhline(sl, linestyle="--", linewidth=1.5, label=f"SL {fmt_price(sl)}")
              ax.axhline(tp, linestyle="--", linewidth=1.5, label=f"TP {fmt_price(tp)}")

              ax.set_title(
                  f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | {item.get('trade_type', 'UNKNOWN')} | 30M",
                  fontsize=13, pad=12
              )
              ax.text(
                  0.01, 0.98,
                  f"Entry {fmt_price(entry)}   SL {fmt_price(sl)}   TP {fmt_price(tp)}   R:R {fmt_rr(item.get('rr'))}",
                  transform=ax.transAxes, va="top", fontsize=9
              )
              ax.grid(True, alpha=0.15)
              ax.xaxis_date()
              ax.xaxis.set_major_formatter(mdates.DateFormatter("%d %b\n%H:%M"))
              ax.tick_params(axis="both", labelsize=8)
              ax.legend(loc="upper left", fontsize=8, frameon=False)
              fig.autofmt_xdate()
              fig.tight_layout()

              output_dir.mkdir(parents=True, exist_ok=True)
              safe_symbol = str(item.get("symbol", "UNKNOWN")).replace("/", "_").replace(" ", "_")
              path = output_dir / f"{safe_symbol}_{item.get('side', 'NEUTRAL')}.png"
              fig.savefig(path, bbox_inches="tight")
              plt.close(fig)
              return path

          def send_message(text):
              api = f"https://api.telegram.org/bot{token}/sendMessage"
              payload = urlencode({
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = Request(api, data=payload, method="POST")
              with urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit(f"Telegram API rejected message: {result}")

          def send_photo(path, caption):
              # Telegram sendPhoto uses multipart/form-data; keep the implementation
              # dependency-free so the workflow does not need python-telegram-bot.
              boundary = "----LSEScannerBoundary7f9d"
              fields = {"chat_id": chat_id, "caption": caption[:1024]}
              body = bytearray()
              for name, value in fields.items():
                  body.extend(f"--{boundary}\r\n".encode())
                  body.extend(f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode())
                  body.extend(str(value).encode("utf-8"))
                  body.extend(b"\r\n")
              body.extend(f"--{boundary}\r\n".encode())
              body.extend(b'Content-Disposition: form-data; name="photo"; filename="signal_chart.png"\r\n')
              body.extend(b"Content-Type: image/png\r\n\r\n")
              body.extend(Path(path).read_bytes())
              body.extend(b"\r\n")
              body.extend(f"--{boundary}--\r\n".encode())

              api = f"https://api.telegram.org/bot{token}/sendPhoto"
              request = Request(
                  api,
                  data=bytes(body),
                  headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                  method="POST",
              )
              with urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit(f"Telegram API rejected chart: {result}")

          sections = []
          confirmed_items = []
          buckets = [
              ("SNIPER", data.get("sniper_entries", [])),
              ("INTRADAY", data.get("intraday_entries", [])),
              ("SCALP", data.get("scalp_entries", [])),
              ("SWING/HOLD", data.get("swing_entries", [])),
              ("ADAPTIVE PRICE-MOVEMENT", data.get("adaptive_entries", [])),
          ]
          for label, items in buckets:
              if items:
                  sections.append(f"🎯 CONFIRMED {label}")
                  for item in items[:5]:
                      sections.append(confirmed_line(item))
                      confirmed_items.append(item)

          if not sections:
              sections.append("⛔ NO CONFIRMED ENTRY")
              sections.append(
                  "No signal passed the 2-of-9 / 3-method route together with "
                  "the monthly master-bias and timeframe-agreement gates."
              )

          waiting = data.get("setup_waiting", [])[:3]
          potential = data.get("potential", [])[:3]
          if waiting:
              sections.append("🟡 WAIT — NOT CONFIRMED / NOT AN ENTRY")
              for item in waiting:
                  sections.append(
                      f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                      f"{item.get('trade_type', 'UNKNOWN')}\n"
                      f"Strategy score: {fmt_score(item.get('strategy_score'))} | "
                      f"Execution quality: {fmt_score(item.get('execution_quality_score'))}\n"
                      "Status: WAIT — NOT CONFIRMED / NOT AN ENTRY\n"
                      f"Reason: {'; '.join(item.get('blockers', [])[:2]) or 'execution/risk condition incomplete'}"
                  )
          if potential:
              sections.append("👀 POTENTIAL — NOT CONFIRMED")
              for item in potential:
                  sections.append(
                      f"{item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                      f"{item.get('trade_type', 'UNKNOWN')}\n"
                      "Status: POTENTIAL — NOT CONFIRMED / NOT AN ENTRY"
                  )

          intel = data.get("intelligence", {})
          news_count = data.get("rss_items", len(intel.get("news", [])) if isinstance(intel, dict) else 0)
          sections.append(
              f"📰 RSS intelligence: ACTIVE | {news_count} item(s) | "
              f"feeds configured: {data.get('rss_feeds_configured', 0)}"
          )
          sections.append(
              f"📊 Scan: {data.get('complete', 0)} fully analyzed | "
              f"{data.get('errors', 0)} analysis errors"
          )
          sections.append("🤖 Automatic trading: DISABLED")

          header = "📡 LSE SMART INTRADAY SCANNER v10.2"
          body = header + "\n\n" + "\n\n".join(sections)

          # Send text first, preserving the explicit WAIT/POTENTIAL non-entry wording.
          chunks = []
          current = ""
          for section in body.split("\n\n"):
              candidate = section if not current else current + "\n\n" + section
              if len(candidate) <= 4000:
                  current = candidate
              else:
                  if current:
                      chunks.append(current)
                  while len(section) > 4000:
                      chunks.append(section[:4000])
                      section = section[4000:]
                  current = section
          if current:
              chunks.append(current)

          for chunk in chunks:
              send_message(chunk)

          # Only CONFIRMED entries get a chart. WAIT and POTENTIAL are never rendered
          # as trade charts, so Telegram cannot visually imply a confirmed trade.
          chart_dir = Path("telegram_charts")
          sent_charts = 0
          for item in confirmed_items:
              chart_path = make_candlestick_chart(item, chart_dir)
              caption = (
                  f"🕯️ CONFIRMED {item.get('symbol', 'UNKNOWN')} | {item.get('side', 'NEUTRAL')} | "
                  f"{item.get('trade_type', 'UNKNOWN')}\n"
                  f"Entry {fmt_price(item['levels'][0])} | SL {fmt_price(item['levels'][1])} | TP {fmt_price(item['levels'][2])} | R:R {fmt_rr(item.get('rr'))}"
              )
              send_photo(chart_path, caption)
              sent_charts += 1

          print(f"Telegram delivery: PASS ({len(chunks)} text message(s), {sent_charts} chart(s))")
          PY

      - name: Upload scanner results
        if: ${{ success() && hashFiles('scan_results.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: scanner-results
          path: scan_results.json
          if-no-files-found: error
