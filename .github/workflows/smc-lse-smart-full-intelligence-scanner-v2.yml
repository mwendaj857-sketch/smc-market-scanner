name: SMC 9-Method LSE Smart Intraday Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: lse-smart-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install lse-data pandas numpy

      - name: Run scanner
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import inspect
          import math
          import os
          import traceback
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          import numpy as np
          import pandas as pd

          try:
              from lse import LSE
          except Exception as exc:
              raise SystemExit(f"FATAL: lse-data import failed: {exc}")

          API_KEY = os.getenv("LSE_API_KEY", "").strip()
          if not API_KEY:
              raise SystemExit("FATAL: LSE_API_KEY secret is missing.")

          PAIRS = [
              "EUR/USD", "GBP/USD", "USD/JPY", "USD/CHF", "USD/CAD",
              "AUD/USD", "NZD/USD", "EUR/GBP", "EUR/JPY", "EUR/CHF",
              "EUR/AUD", "EUR/CAD", "GBP/JPY", "GBP/CHF", "GBP/AUD",
              "GBP/CAD", "AUD/JPY", "AUD/NZD", "CAD/JPY", "NZD/JPY",
          ]

          # Fundamental hierarchy:
          # 1D = daily context
          # 4H = controlling technical regime
          # 1H = decision
          # 30M = setup
          # 15M = confirmation
          # 5M = trigger
          TIMEFRAMES = {
              "1D":  {"api": "1d",  "bars": 700},
              "4H":  {"api": "4h",  "bars": 1200},
              "1H":  {"api": "1h",  "bars": 1800},
              # 30M is intentionally built from CLOSED 15M bars.
              "30M": {"api": "15m", "bars": 4800},
              "15M": {"api": "15m", "bars": 3000},
              "5M":  {"api": "5m",  "bars": 4000},
          }

          MIN_ROWS = 120
          MIN_RR = 2.0
          TOP_N = 5
          SCORE_THRESHOLD = 70.0
          NEWS_REVIEW_MINUTES = 120

          # COT futures codes used for currency positioning.
          COT_CODES = {
              "EUR": "6E",
              "GBP": "6B",
              "JPY": "6J",
              "CHF": "6S",
              "CAD": "6C",
              "AUD": "6A",
              "NZD": "6N",
          }

          # Government 10Y yield series documented by LSE.
          YIELD_CODES = {
              "USD": "US10Y",
              "EUR": "DE10Y",
              "GBP": "GB10Y",
              "JPY": "JP10Y",
              "CHF": "CH10Y",
              "CAD": "CA10Y",
              "AUD": "AU10Y",
              "NZD": "NZ10Y",
          }

          REQUIRED_INTELLIGENCE = [
              "calendar", "macro", "yields", "cot", "live", "ml", "news"
          ]

          def finite(x):
              try:
                  return math.isfinite(float(x))
              except Exception:
                  return False

          def clean_df(raw):
              if raw is None:
                  return None
              if isinstance(raw, tuple):
                  raw = raw[0]
              if not isinstance(raw, pd.DataFrame):
                  raw = pd.DataFrame(raw)
              if raw.empty:
                  return None

              df = raw.copy()
              rename = {}
              for c in df.columns:
                  k = str(c).strip().lower()
                  if k in ("timestamp", "time", "datetime", "date", "t"):
                      rename[c] = "time"
                  elif k in ("open", "o"):
                      rename[c] = "open"
                  elif k in ("high", "h"):
                      rename[c] = "high"
                  elif k in ("low", "l"):
                      rename[c] = "low"
                  elif k in ("close", "c", "price"):
                      rename[c] = "close"
                  elif k in ("volume", "v"):
                      rename[c] = "volume"
              df = df.rename(columns=rename)

              required = ["time", "open", "high", "low", "close"]
              if not all(c in df.columns for c in required):
                  raise ValueError(
                      f"Missing OHLC/time fields. Got columns: {list(df.columns)}"
                  )

              df["time"] = pd.to_datetime(df["time"], utc=True, errors="coerce")
              for c in ["open", "high", "low", "close"]:
                  df[c] = pd.to_numeric(df[c], errors="coerce")

              if "volume" not in df.columns:
                  df["volume"] = 0.0
              df["volume"] = pd.to_numeric(df["volume"], errors="coerce").fillna(0.0)

              df = (
                  df.dropna(subset=required)
                    .drop_duplicates(subset=["time"])
                    .sort_values("time")
                    .reset_index(drop=True)
              )
              return df if len(df) >= MIN_ROWS else None

          def fetch(client, symbol, api_tf, bars):
              raw = client.candles(
                  symbol, api_tf, limit=min(int(bars), 5000), order="asc"
              )
              df = clean_df(raw)
              return None if df is None else df.tail(bars).reset_index(drop=True)

          def remove_open_bar(df, tf):
              if df is None or df.empty:
                  return df
              minutes = {
                  "5M": 5, "15M": 15, "30M": 30,
                  "1H": 60, "4H": 240, "1D": 1440
              }
              freq = minutes[tf]
              last = pd.Timestamp(df.iloc[-1]["time"])
              now = pd.Timestamp.now(tz="UTC")
              if (now - last).total_seconds() / 60.0 < freq:
                  return df.iloc[:-1].copy()
              return df

          def build_30m_from_15m(df15):
              if df15 is None or df15.empty:
                  return None
              x = df15.copy().set_index("time").sort_index()
              out = x.resample(
                  "30min", label="left", closed="left"
              ).agg({
                  "open": "first",
                  "high": "max",
                  "low": "min",
                  "close": "last",
                  "volume": "sum",
              }).dropna(
                  subset=["open", "high", "low", "close"]
              ).reset_index()

              # Reject partial 30M buckets.
              counts = (
                  x["close"].resample(
                      "30min", label="left", closed="left"
                  ).count().rename("count").reset_index()
              )
              out = out.merge(counts, on="time", how="left")
              out = out[out["count"] == 2].drop(columns=["count"])
              return out.reset_index(drop=True)

          def ema(s, n):
              return s.ewm(span=n, adjust=False).mean()

          def rsi(s, n=14):
              d = s.diff()
              up = d.clip(lower=0)
              dn = -d.clip(upper=0)
              au = up.ewm(alpha=1/n, adjust=False).mean()
              ad = dn.ewm(alpha=1/n, adjust=False).mean()
              rs = au / ad.replace(0, np.nan)
              return (100 - (100 / (1 + rs))).fillna(50)

          def atr(df, n=14):
              pc = df["close"].shift(1)
              tr = pd.concat([
                  df["high"] - df["low"],
                  (df["high"] - pc).abs(),
                  (df["low"] - pc).abs(),
              ], axis=1).max(axis=1)
              return tr.ewm(alpha=1/n, adjust=False).mean()

          def macd(s):
              m = ema(s, 12) - ema(s, 26)
              sig = ema(m, 9)
              return m, sig, m - sig

          def fib_location(df, lookback=100):
              x = df.tail(lookback)
              hi = float(x["high"].max())
              lo = float(x["low"].min())
              close = float(x["close"].iloc[-1])
              rng = hi - lo
              return (
                  0.5 if rng <= 0 else (close - lo) / rng,
                  hi, lo
              )

          def structure(df, lookback=20):
              x = df.tail(max(lookback * 3, 60))
              if len(x) < lookback * 2:
                  return 0, "INSUFFICIENT"
              prev = x.iloc[-lookback*2:-lookback]
              cur = x.iloc[-lookback:]
              ph, pl = prev["high"].max(), prev["low"].min()
              ch, cl = cur["high"].max(), cur["low"].min()
              if ch > ph and cl > pl:
                  return 1, "BULLISH HH+HL"
              if ch < ph and cl < pl:
                  return -1, "BEARISH LH+LL"
              return 0, "MIXED"

          def liquidity_sweep(df, direction):
              if len(df) < 25:
                  return False
              prev = df.tail(25).iloc[:-1]
              last = df.iloc[-1]
              rh = float(prev["high"].max())
              rl = float(prev["low"].min())
              if direction > 0:
                  return bool(last["low"] < rl and last["close"] > rl)
              return bool(last["high"] > rh and last["close"] < rh)

          def candle_impulse(df, direction):
              if len(df) < 3:
                  return False
              b = df.iloc[-1]
              rng = max(float(b["high"] - b["low"]), 1e-12)
              body = abs(float(b["close"] - b["open"]))
              if direction > 0:
                  return bool(
                      b["close"] > b["open"] and body / rng >= 0.55
                  )
              return bool(
                  b["close"] < b["open"] and body / rng >= 0.55
              )

          def smc_mss(df, direction):
              # Conservative price-based MSS proxy. It is not presented as
              # proprietary order-flow data.
              if len(df) < 30:
                  return False
              x = df.tail(30)
              last = x.iloc[-1]
              swing = x.iloc[-8:-1]
              if direction > 0:
                  return bool(
                      last["close"] > float(swing["high"].max())
                      and last["close"] > last["open"]
                  )
              return bool(
                  last["close"] < float(swing["low"].min())
                  and last["close"] < last["open"]
              )

          def supply_demand(df, direction):
              e20 = ema(df["close"], 20).iloc[-1]
              e50 = ema(df["close"], 50).iloc[-1]
              close = float(df["close"].iloc[-1])
              return bool(
                  (direction > 0 and close >= e20 and e20 >= e50)
                  or (direction < 0 and close <= e20 and e20 <= e50)
              )

          def session_state(ts):
              h = ts.hour + ts.minute / 60.0
              london = 8 <= h < 17
              new_york = 13 <= h < 22
              if london and new_york:
                  return "LONDON + NEW YORK OVERLAP", 5
              if london:
                  return "LONDON", 4
              if new_york:
                  return "NEW YORK", 4
              return "ASIA/OFF-OVERLAP", 2

          def local_ml_probability(df):
              # Lightweight local logistic model using recent 5M features.
              if len(df) < 180:
                  return None
              x = df.copy()
              e20 = ema(x["close"], 20)
              e50 = ema(x["close"], 50)
              rr = x["close"].pct_change()
              aa = atr(x)
              feat = pd.DataFrame({
                  "ret": rr,
                  "ema_gap": (
                      e20 - e50
                  ) / x["close"].replace(0, np.nan),
                  "rsi": (rsi(x["close"]) - 50) / 50,
                  "atr_pct": aa / x["close"].replace(0, np.nan),
              }).replace(
                  [np.inf, -np.inf], np.nan
              ).dropna()
              if len(feat) < 120:
                  return None

              y = (
                  x["close"].shift(-1).loc[feat.index]
                  > x["close"].loc[feat.index]
              ).astype(int)
              feat = feat.loc[y.index]
              y = y.loc[feat.index]
              if y.nunique() < 2:
                  return None

              mu = feat.mean()
              sd = feat.std().replace(0, 1)
              z = (feat - mu) / sd
              w = np.zeros(z.shape[1], dtype=float)
              b = 0.0
              X = z.to_numpy()
              Y = y.to_numpy(dtype=float)

              for _ in range(120):
                  p = 1.0 / (
                      1.0 + np.exp(
                          np.clip(-(X @ w + b), -30, 30)
                      )
                  )
                  grad_w = (X.T @ (p - Y)) / len(Y)
                  grad_b = float(np.mean(p - Y))
                  w -= 0.08 * grad_w
                  b -= 0.08 * grad_b

              last = (
                  (feat.iloc[-1] - mu) / sd
              ).to_numpy()
              p = 1.0 / (
                  1.0 + math.exp(
                      -float(np.clip(last @ w + b, -30, 30))
                  )
              )
              return float(p)

          # Nine technical methods:
          # 1 Market Structure
          # 2 SMC / MSS
          # 3 Supply / Demand
          # 4 Price Action
          # 5 Liquidity Sweep
          # 6 Fibonacci
          # 7 Trend
          # 8 RSI + MACD
          # 9 Session
          def analyze(df, label, forced_direction=None):
              x = df.copy()
              x["ema20"] = ema(x["close"], 20)
              x["ema50"] = ema(x["close"], 50)
              x["rsi"] = rsi(x["close"])
              m, ms, _ = macd(x["close"])
              x["macd"] = m
              x["macd_sig"] = ms
              x["atr"] = atr(x)

              d, st = structure(x)
              loc, hi, lo = fib_location(x)
              last = x.iloc[-1]
              trend = 1 if last["ema20"] > last["ema50"] else -1
              ind = (
                  1 if last["rsi"] >= 50
                  and last["macd"] >= last["macd_sig"]
                  else -1
              )

              direction = (
                  forced_direction
                  if forced_direction in (1, -1)
                  else (d if d != 0 else trend)
              )

              methods = {}
              reasons = []
              score = 0.0

              s1 = 15 if d == direction else (-8 if d != 0 else 0)
              methods["market_structure"] = s1
              score += s1
              reasons.append(
                  f"1 Market Structure: {st} ({s1:+.0f})"
              )

              mss = smc_mss(x, direction)
              s2 = 20 if mss else 0
              methods["smc_mss"] = s2
              score += s2
              reasons.append(
                  f"2 SMC/MSS: "
                  f"{'confirmed' if mss else 'not confirmed'} ({s2:+.0f})"
              )

              sd = supply_demand(x, direction)
              s3 = 10 if sd else 0
              methods["supply_demand"] = s3
              score += s3
              reasons.append(
                  f"3 Supply/Demand: "
                  f"{'aligned' if sd else 'not aligned'} ({s3:+.0f})"
              )

              impulse = candle_impulse(x, direction)
              s4 = 10 if impulse else 0
              methods["price_action"] = s4
              score += s4
              reasons.append(
                  f"4 Price Action: "
                  f"{'impulse' if impulse else 'no strong impulse'} ({s4:+.0f})"
              )

              sweep = liquidity_sweep(x, direction)
              s5 = 15 if sweep else 0
              methods["liquidity"] = s5
              score += s5
              reasons.append(
                  f"5 Liquidity: "
                  f"{'directional sweep' if sweep else 'no fresh sweep'} ({s5:+.0f})"
              )

              fib_ok = (
                  (direction > 0 and 0.25 <= loc <= 0.65)
                  or (direction < 0 and 0.35 <= loc <= 0.75)
              )
              s6 = 5 if fib_ok else 0
              methods["fibonacci"] = s6
              score += s6
              reasons.append(
                  f"6 Fibonacci: {loc:.3f} ({s6:+.0f})"
              )

              s7 = 10 if trend == direction else 0
              methods["trend"] = s7
              score += s7
              reasons.append(
                  f"7 Trend: "
                  f"{'EMA20/50 aligned' if trend == direction else 'EMA conflict'} ({s7:+.0f})"
              )

              s8 = 10 if ind == direction else 0
              methods["rsi_macd"] = s8
              score += s8
              reasons.append(
                  f"8 RSI+MACD: RSI {last['rsi']:.1f}, "
                  f"MACD {last['macd']:.5f} ({s8:+.0f})"
              )

              session, s9 = session_state(
                  pd.Timestamp(last["time"])
              )
              methods["session"] = s9
              score += s9
              reasons.append(
                  f"9 Session: {session} ({s9:+.0f})"
              )

              return {
                  "direction": direction,
                  "structure": st,
                  "score": max(0.0, min(100.0, score)),
                  "methods": methods,
                  "rsi": float(last["rsi"]),
                  "macd": float(last["macd"]),
                  "atr": float(last["atr"]),
                  "close": float(last["close"]),
                  "high": hi,
                  "low": lo,
                  "reasons": reasons,
                  "sweep": sweep,
                  "impulse": impulse,
                  "smc_mss": mss,
                  "session": session,
              }

          def target_plan(df, direction, entry):
              a = float(atr(df).iloc[-1])
              if not finite(a) or a <= 0:
                  return None

              x = df.tail(200)
              sl_distance = max(1.2 * a, 1e-12)
              sl = (
                  entry - sl_distance
                  if direction > 0
                  else entry + sl_distance
              )

              # Structural target only; no artificial maximum.
              if direction > 0:
                  levels = sorted(
                      set(
                          float(v)
                          for v in x["high"].values
                          if v > entry
                      )
                  )
                  valid = [
                      t for t in levels
                      if (t - entry) / sl_distance >= MIN_RR
                  ]
                  if not valid:
                      return None
                  tp = valid[0]
              else:
                  levels = sorted(
                      set(
                          float(v)
                          for v in x["low"].values
                          if v < entry
                      ),
                      reverse=True,
                  )
                  valid = [
                      t for t in levels
                      if (entry - t) / sl_distance >= MIN_RR
                  ]
                  if not valid:
                      return None
                  tp = valid[0]

              rr = (
                  (tp - entry) / (entry - sl)
                  if direction > 0
                  else (entry - tp) / (sl - entry)
              )
              if rr < MIN_RR:
                  return None
              return float(sl), float(tp), float(rr), float(a)

          def method_class(score):
              if score >= 82:
                  return "🔥 STRONG"
              if score >= 70:
                  return "⭐ MODERATE"
              return "🟡 WATCH"

          def call_optional(client, method, *args, **kwargs):
              if not method or not hasattr(client, method):
                  return None, "not exposed"
              try:
                  return getattr(client, method)(*args, **kwargs), None
              except Exception as exc:
                  return None, f"{type(exc).__name__}: {exc}"

          def discover_capabilities(client):
              names = set(dir(client))
              return {
                  "calendar": (
                      "economic_calendar"
                      if "economic_calendar" in names
                      else None
                  ),
                  "macro": (
                      "economics"
                      if "economics" in names
                      else (
                          "series" if "series" in names else None
                      )
                  ),
                  "yields": (
                      "bond_yields"
                      if "bond_yields" in names
                      else (
                          "series" if "series" in names else None
                      )
                  ),
                  "cot": (
                      "cot" if "cot" in names else None
                  ),
                  "live": (
                      "stream" if "stream" in names else None
                  ),
                  "ml": None,
                  "news": None,
              }

          def event_impact(event):
              if not isinstance(event, dict):
                  return "UNKNOWN"
              v = str(
                  event.get(
                      "impact",
                      event.get("importance", "")
                  )
              ).upper()
              if "HIGH" in v or v == "3":
                  return "HIGH"
              if "MED" in v or v == "2":
                  return "MEDIUM"
              if "LOW" in v or v == "1":
                  return "LOW"
              return "UNKNOWN"

          def event_time(event):
              if not isinstance(event, dict):
                  return None
              for k in ("datetime", "timestamp", "time", "date"):
                  if event.get(k):
                      try:
                          return pd.to_datetime(
                              event[k], utc=True
                          )
                      except Exception:
                          pass
              return None

          def load_daily_intelligence(client, capabilities):
              now = pd.Timestamp.now(tz="UTC")
              currencies = sorted(
                  set(
                      c
                      for p in PAIRS
                      for c in p.split("/")
                  )
              )

              intel = {
                  "calendar": {},
                  "news": {
                      "status": "UNAVAILABLE",
                      "items": []
                  },
                  "macro": {},
                  "yields": {},
                  "cot": {},
                  "live": (
                      "AVAILABLE"
                      if capabilities.get("live")
                      else "UNAVAILABLE"
                  ),
                  "ml": "LOCAL MODEL",
              }

              cal_method = capabilities.get("calendar")
              if cal_method:
                  for ccy in currencies:
                      payload, err = call_optional(
                          client,
                          cal_method,
                          region=ccy,
                          start=(
                              now - pd.Timedelta(days=1)
                          ).strftime("%Y-%m-%d"),
                          end=(
                              now + pd.Timedelta(days=1)
                          ).strftime("%Y-%m-%d"),
                      )
                      if err is None and payload is not None:
                          rows = (
                              payload
                              if isinstance(payload, list)
                              else [payload]
                          )
                          intel["calendar"][ccy] = rows
                      else:
                          intel["calendar"][ccy] = []

              y_method = capabilities.get("yields")
              if y_method == "bond_yields":
                  for ccy, code in YIELD_CODES.items():
                      payload, err = call_optional(
                          client,
                          y_method,
                          code,
                          start=(
                              now - pd.Timedelta(days=10)
                          ).strftime("%Y-%m-%d"),
                      )
                      if err is None and payload:
                          rows = (
                              payload
                              if isinstance(payload, list)
                              else [payload]
                          )
                          vals = []
                          for row in rows:
                              if isinstance(row, dict):
                                  for k in (
                                      "value", "yield", "close"
                                  ):
                                      if finite(row.get(k)):
                                          vals.append(
                                              float(row[k])
                                          )
                                          break
                          if vals:
                              intel["yields"][ccy] = vals[-1]

              cot_method = capabilities.get("cot")
              if cot_method:
                  for ccy, code in COT_CODES.items():
                      payload, err = call_optional(
                          client, cot_method, code
                      )
                      if err is None and payload:
                          rows = (
                              payload
                              if isinstance(payload, list)
                              else [payload]
                          )
                          intel["cot"][ccy] = rows[-1]

              # We do not guess macro-series codes. The LSE client exposes
              # many economics series; exact country/series selection should
              # come from the LSE catalog.
              intel["macro_status"] = (
                  "AVAILABLE"
                  if capabilities.get("macro")
                  else "UNAVAILABLE"
              )

              # Optional external news. This is never mislabeled as LSE news.
              news_url = os.getenv(
                  "NEWS_API_URL", ""
              ).strip()
              news_key = os.getenv(
                  "NEWS_API_KEY", ""
              ).strip()
              if news_url:
                  try:
                      params = {"limit": "100"}
                      if news_key:
                          params["apiKey"] = news_key
                      url = (
                          news_url
                          + ("&" if "?" in news_url else "?")
                          + urlencode(params)
                      )
                      req = Request(
                          url,
                          headers={
                              "User-Agent":
                              "SMC-LSE-Scanner/1.0"
                          },
                      )
                      with urlopen(req, timeout=8) as resp:
                          payload = resp.read().decode(
                              "utf-8"
                          )
                      data = __import__("json").loads(
                          payload
                      )
                      items = (
                          data.get(
                              "articles",
                              data.get("data", data)
                          )
                          if isinstance(data, dict)
                          else data
                      )
                      if isinstance(items, list):
                          intel["news"] = {
                              "status": "AVAILABLE",
                              "items": items,
                          }
                  except Exception as exc:
                      intel["news"] = {
                          "status": "ERROR",
                          "items": [],
                          "error": (
                              f"{type(exc).__name__}: "
                              f"{exc}"
                          ),
                      }

              return intel

          def pair_intelligence(pair, intel):
              base, quote = pair.split("/")
              currencies = [base, quote]
              events = []
              for ccy in currencies:
                  events.extend(
                      intel["calendar"].get(ccy, [])
                  )

              high = []
              medium = []
              now = pd.Timestamp.now(tz="UTC")
              for e in events:
                  imp = event_impact(e)
                  et = event_time(e)
                  if imp == "HIGH":
                      if (
                          et is None
                          or abs(
                              (et - now).total_seconds()
                          )
                          <= NEWS_REVIEW_MINUTES * 60
                      ):
                          high.append(e)
                  elif imp == "MEDIUM":
                      if (
                          et is None
                          or abs(
                              (et - now).total_seconds()
                          )
                          <= NEWS_REVIEW_MINUTES * 60
                      ):
                          medium.append(e)

              yd = None
              if (
                  base in intel["yields"]
                  and quote in intel["yields"]
              ):
                  yd = float(
                      intel["yields"][base]
                      - intel["yields"][quote]
                  )

              cot_present = [
                  c
                  for c in currencies
                  if c in intel["cot"]
              ]

              news_items = intel["news"].get(
                  "items", []
              )
              news_text = []
              for item in news_items[:100]:
                  if isinstance(item, dict):
                      text = " ".join(
                          str(item.get(k, ""))
                          for k in (
                              "title",
                              "description",
                              "headline",
                          )
                      )
                      if any(
                          c in text.upper()
                          for c in currencies
                      ):
                          news_text.append(text[:300])

              risk = "LOW"
              reason = (
                  "No verified high-impact event is "
                  "currently detected."
              )
              if high:
                  risk = "HIGH"
                  reason = (
                      f"{len(high)} high-impact calendar "
                      "item(s) near the current scan window."
                  )
              elif medium:
                  risk = "REVIEW"
                  reason = (
                      f"{len(medium)} medium-impact calendar "
                      "item(s) near the current scan window."
                  )
              elif (
                  intel["news"]["status"] == "AVAILABLE"
                  and news_text
              ):
                  risk = "REVIEW"
                  reason = (
                      "External news feed has relevant "
                      "currency headlines; review before entry."
                  )

              return {
                  "event_risk": risk,
                  "event_reason": reason,
                  "high_events": len(high),
                  "medium_events": len(medium),
                  "macro": intel["macro_status"],
                  "yield_diff": yd,
                  "cot_available": cot_present,
                  "news_status": (
                      intel["news"]["status"]
                  ),
                  "news_headlines": news_text[:3],
                  "live": intel["live"],
                  "ml": intel["ml"],
              }

          def correlation_context(pair, data):
              base, quote = pair.split("/")
              related = [
                  other
                  for other in PAIRS
                  if other != pair
                  and (base in other or quote in other)
              ]
              if not related:
                  return "UNAVAILABLE"

              signs = []
              for other in related:
                  try:
                      a = (
                          data["1H"][pair]["close"]
                          .pct_change()
                          .tail(60)
                      )
                      b = (
                          data["1H"][other]["close"]
                          .pct_change()
                          .tail(60)
                      )
                      joined = pd.concat(
                          [a, b], axis=1
                      ).dropna()
                      if len(joined) >= 30:
                          corr = float(
                              joined.iloc[:, 0].corr(
                                  joined.iloc[:, 1]
                              )
                          )
                          if finite(corr):
                              signs.append(corr)
                  except Exception:
                      pass

              if not signs:
                  return "UNAVAILABLE"
              avg = float(np.mean(signs))
              if avg >= 0.35:
                  return (
                      f"SUPPORTIVE ({avg:+.2f} avg "
                      "related-pair correlation)"
                  )
              if avg <= -0.35:
                  return (
                      f"OPPOSING ({avg:+.2f} avg "
                      "related-pair correlation)"
                  )
              return (
                  f"MIXED ({avg:+.2f} avg "
                  "related-pair correlation)"
              )

          def intelligence_score_adjustment(pi, direction):
              adj = 0.0
              if pi["event_risk"] == "HIGH":
                  adj -= 10.0
              elif pi["event_risk"] == "REVIEW":
                  adj -= 3.0

              yd = pi["yield_diff"]
              if yd is not None:
                  if direction > 0 and yd > 0:
                      adj += 3.0
                  elif direction < 0 and yd < 0:
                      adj += 3.0
                  elif (
                      direction > 0 and yd < 0
                  ) or (
                      direction < 0 and yd > 0
                  ):
                      adj -= 3.0
              return adj

