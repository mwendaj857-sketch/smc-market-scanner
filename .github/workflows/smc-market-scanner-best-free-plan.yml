name: SMC 9-Method Holding Scanner - Best Free Plan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: SMC 9-Method Holding Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os, time
          from datetime import datetime, timedelta, timezone
          import requests

          API_KEY = os.environ.get("TWELVE_DATA_API_KEY", "").strip()
          if not API_KEY:
              raise SystemExit("TWELVE_DATA_API_KEY secret is missing.")

          SYMBOLS = [
              "EUR/USD","GBP/USD","USD/JPY","USD/CHF","USD/CAD","AUD/USD","NZD/USD",
              "EUR/GBP","EUR/JPY","EUR/CHF","EUR/AUD","EUR/CAD",
              "GBP/JPY","GBP/CHF","GBP/AUD","GBP/CAD","AUD/JPY","AUD/NZD","CAD/JPY","NZD/JPY",
          ]

          TIMEFRAMES = {
              "D1": ("1day", 220),
              "H4": ("4h", 260),
              "H1": ("1h", 260),
          }

          URL = "https://api.twelvedata.com/time_series"

          BATCH_SIZE = 8
          RATE_WINDOW_SECONDS = 61.0
          REQUEST_TIMEOUT = (5, 15)
          MAX_RETRIES = 1

          ATR_PERIOD = 14
          SWING_STRENGTH = 2
          SWING_LOOKBACK = 80

          MIN_SCORE = 68.0
          TOP_N = 5

          MAX_RISK_ATR = 2.75
          ENTRY_ZONE_ATR = 0.35
          SL_BUFFER_ATR = 0.25
          MAX_RR = 8.0

          CACHE = {}
          LAST_REQUEST_AT = 0.0
          SESSION = requests.Session()

          DATA_ISSUES = []
          FATAL_API_ERRORS = []
          MISSING_DATASETS = set()


          def issue(message, fatal=False):
              print(message)
              DATA_ISSUES.append(message)
              if fatal:
                  FATAL_API_ERRORS.append(message)


          def wait_for_rate_window():
              global LAST_REQUEST_AT

              if LAST_REQUEST_AT <= 0:
                  return

              remaining = RATE_WINDOW_SECONDS - (time.monotonic() - LAST_REQUEST_AT)
              if remaining > 0:
                  time.sleep(remaining)


          def completed_candles(rows, interval):
              durations = {
                  "1h": timedelta(hours=1),
                  "4h": timedelta(hours=4),
                  "1day": timedelta(days=1),
              }

              duration = durations[interval]
              now = datetime.now(timezone.utc)
              result = []

              for row in rows:
                  try:
                      dt = datetime.strptime(
                          row["datetime"],
                          "%Y-%m-%d %H:%M:%S",
                      ).replace(tzinfo=timezone.utc)
                  except (KeyError, TypeError, ValueError):
                      continue

                  if dt + duration <= now:
                      result.append(row)

              return result


          def fetch_batch(symbols, interval, outputsize):
              global LAST_REQUEST_AT

              symbols = list(symbols)
              cache_key = ("BATCH", tuple(symbols), interval, outputsize)

              if cache_key in CACHE:
                  return CACHE[cache_key]

              params = {
                  "symbol": ",".join(symbols),
                  "interval": interval,
                  "outputsize": outputsize,
                  "timezone": "UTC",
                  "apikey": API_KEY,
                  "format": "JSON",
              }

              for attempt in range(MAX_RETRIES + 1):
                  wait_for_rate_window()

                  try:
                      response = SESSION.get(
                          URL,
                          params=params,
                          timeout=REQUEST_TIMEOUT,
                      )
                      LAST_REQUEST_AT = time.monotonic()

                      try:
                          payload = response.json()
                      except ValueError:
                          if attempt < MAX_RETRIES:
                              print(
                                  f"⚠️ INVALID JSON {interval}: retry "
                                  f"{attempt + 1}/{MAX_RETRIES}"
                              )
                              time.sleep(RATE_WINDOW_SECONDS)
                              continue

                          issue(f"❌ FATAL {interval}: invalid JSON response.", fatal=True)
                          return {}

                  except requests.RequestException as exc:
                      LAST_REQUEST_AT = time.monotonic()

                      if attempt < MAX_RETRIES:
                          print(
                              f"⚠️ NETWORK ERROR {interval}: retry "
                              f"{attempt + 1}/{MAX_RETRIES}"
                          )
                          time.sleep(RATE_WINDOW_SECONDS)
                          continue

                      issue(
                          f"❌ FATAL {interval}: request failed: {exc}",
                          fatal=True,
                      )
                      return {}

                  used = response.headers.get("api-credits-used")
                  left = response.headers.get("api-credits-left")
                  if used is not None or left is not None:
                      print(
                          f"   API credits: used={used or '?'} "
                          f"left={left or '?'}"
                      )

                  if response.status_code in (401, 403):
                      issue(
                          f"❌ FATAL {interval}: authorization HTTP "
                          f"{response.status_code}.",
                          fatal=True,
                      )
                      return {}

                  if response.status_code == 429:
                      if attempt < MAX_RETRIES:
                          print(
                              f"⚠️ RATE LIMIT {interval}: retrying once after "
                              f"{RATE_WINDOW_SECONDS:.0f}s."
                          )
                          time.sleep(RATE_WINDOW_SECONDS)
                          continue

                      issue(
                          f"❌ FATAL {interval}: rate limit remained after retry.",
                          fatal=True,
                      )
                      return {}

                  if 400 <= response.status_code < 500:
                      message = (
                          payload.get("message", response.text[:200])
                          if isinstance(payload, dict)
                          else response.text[:200]
                      )
                      issue(
                          f"❌ FATAL {interval}: HTTP {response.status_code}: {message}",
                          fatal=True,
                      )
                      return {}

                  if response.status_code >= 500:
                      if attempt < MAX_RETRIES:
                          print(
                              f"⚠️ SERVER ERROR {interval}: retry "
                              f"{attempt + 1}/{MAX_RETRIES}"
                          )
                          time.sleep(RATE_WINDOW_SECONDS)
                          continue

                      issue(
                          f"❌ FATAL {interval}: server HTTP {response.status_code}.",
                          fatal=True,
                      )
                      return {}

                  if not isinstance(payload, dict):
                      issue(
                          f"❌ FATAL {interval}: response is not a JSON object.",
                          fatal=True,
                      )
                      return {}

                  if payload.get("status") == "error":
                      issue(
                          f"❌ FATAL {interval}: "
                          f"{payload.get('message', 'unknown API error')}",
                          fatal=True,
                      )
                      return {}

                  parsed = {}

                  for symbol in symbols:
                      item = payload.get(symbol)

                      if not isinstance(item, dict):
                          item = payload.get(symbol.replace("/", ""))

                      if not isinstance(item, dict):
                          MISSING_DATASETS.add((symbol, interval))
                          issue(f"⚠️ DATA MISSING: {symbol} {interval}")
                          continue

                      if item.get("status") == "error":
                          MISSING_DATASETS.add((symbol, interval))
                          issue(
                              f"⚠️ DATA ERROR: {symbol} {interval}: "
                              f"{item.get('message', 'unknown error')}"
                          )
                          continue

                      values = item.get("values")

                      if not isinstance(values, list):
                          MISSING_DATASETS.add((symbol, interval))
                          issue(f"⚠️ DATA EMPTY: {symbol} {interval}")
                          continue

                      candles = []

                      for row in reversed(values):
                          try:
                              candles.append({
                                  "datetime": row["datetime"],
                                  "open": float(row["open"]),
                                  "high": float(row["high"]),
                                  "low": float(row["low"]),
                                  "close": float(row["close"]),
                              })
                          except (KeyError, TypeError, ValueError):
                              continue

                      candles = completed_candles(candles, interval)

                      if len(candles) < 220:
                          MISSING_DATASETS.add((symbol, interval))
                          issue(
                              f"⚠️ DATA SHORT: {symbol} {interval}: "
                              f"{len(candles)} completed candles"
                          )
                          continue

                      parsed[symbol] = candles
                      CACHE[(symbol, interval, outputsize)] = candles

                  CACHE[cache_key] = parsed
                  return parsed

              return {}


          def preload(symbols, timeframe_names):
              for name in timeframe_names:
                  interval, outputsize = TIMEFRAMES[name]

                  total_batches = (
                      len(symbols) + BATCH_SIZE - 1
                  ) // BATCH_SIZE

                  for i in range(0, len(symbols), BATCH_SIZE):
                      batch = symbols[i:i + BATCH_SIZE]
                      batch_no = i // BATCH_SIZE + 1

                      print(
                          f"📥 FETCH {name}: batch {batch_no}/{total_batches} "
                          f"({len(batch)} symbols)"
                      )

                      fetch_batch(batch, interval, outputsize)


          def get_candles(symbol, timeframe):
              interval, outputsize = TIMEFRAMES[timeframe]
              return CACHE.get((symbol, interval, outputsize), [])


          def ema(values, period):
              if len(values) < period:
                  return None

              k = 2.0 / (period + 1)
              value = sum(values[:period]) / period

              for price in values[period:]:
                  value += k * (price - value)

              return value


          def atr(candles, period=14):
              if len(candles) < period + 1:
                  return None

              true_ranges = []

              for i in range(1, len(candles)):
                  high = candles[i]["high"]
                  low = candles[i]["low"]
                  previous_close = candles[i - 1]["close"]

                  true_ranges.append(
                      max(
                          high - low,
                          abs(high - previous_close),
                          abs(low - previous_close),
                      )
                  )

              value = sum(true_ranges[:period]) / period

              for tr in true_ranges[period:]:
                  value = ((period - 1) * value + tr) / period

              return value


          def rsi(candles, period=14):
              if len(candles) < period + 1:
                  return None

              gains = []
              losses = []

              for i in range(1, len(candles)):
                  change = candles[i]["close"] - candles[i - 1]["close"]
                  gains.append(max(change, 0.0))
                  losses.append(max(-change, 0.0))

              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period

              for i in range(period, len(gains)):
                  avg_gain = ((period - 1) * avg_gain + gains[i]) / period
                  avg_loss = ((period - 1) * avg_loss + losses[i]) / period

              if avg_loss == 0:
                  return 100.0

              if avg_gain == 0:
                  return 0.0

              rs = avg_gain / avg_loss
              return 100.0 - (100.0 / (1.0 + rs))


          def macd(candles):
              closes = [c["close"] for c in candles]

              ema12 = ema(closes, 12)
              ema26 = ema(closes, 26)

              if ema12 is None or ema26 is None:
                  return None

              return ema12 - ema26


          def find_swings(candles):
              highs = []
              lows = []

              for i in range(
                  SWING_STRENGTH,
                  len(candles) - SWING_STRENGTH,
              ):
                  high = candles[i]["high"]
                  low = candles[i]["low"]

                  if all(
                      high > candles[i - j]["high"]
                      and high > candles[i + j]["high"]
                      for j in range(1, SWING_STRENGTH + 1)
                  ):
                      highs.append((i, high))

                  if all(
                      low < candles[i - j]["low"]
                      and low < candles[i + j]["low"]
                      for j in range(1, SWING_STRENGTH + 1)
                  ):
                      lows.append((i, low))

              return highs, lows


          def market_structure(highs, lows):
              if len(highs) < 2 or len(lows) < 2:
                  return 0, None, "INSUFFICIENT SWINGS"

              hh = highs[-1][1] > highs[-2][1]
              hl = lows[-1][1] > lows[-2][1]

              lh = highs[-1][1] < highs[-2][1]
              ll = lows[-1][1] < lows[-2][1]

              if hh and hl:
                  return 15, "BUY", "BULLISH HH + HL"

              if lh and ll:
                  return 15, "SELL", "BEARISH LH + LL"

              return 4, None, "MIXED STRUCTURE"


          def liquidity_sweeps(candles, highs, lows):
              result = []
              start = max(0, len(candles) - 100)

              for i in range(start, len(candles)):
                  previous_high = next(
                      (x for x in reversed(highs) if x[0] < i),
                      None,
                  )
                  previous_low = next(
                      (x for x in reversed(lows) if x[0] < i),
                      None,
                  )

                  if (
                      previous_high
                      and candles[i]["high"] > previous_high[1]
                      and candles[i]["close"] < previous_high[1]
                  ):
                      result.append(
                          ("SELL", i, previous_high[1])
                      )

                  if (
                      previous_low
                      and candles[i]["low"] < previous_low[1]
                      and candles[i]["close"] > previous_low[1]
                  ):
                      result.append(
                          ("BUY", i, previous_low[1])
                      )

              return result


          def smc_mss(candles, highs, lows):
              sweeps = liquidity_sweeps(candles, highs, lows)

              if not sweeps:
                  return 0, None, "NO RECENT LIQUIDITY SWEEP"

              sweep_type, index, level = sweeps[-1]

              if sweep_type == "BUY":
                  for i in range(
                      index + 1,
                      min(len(candles), index + 15),
                  ):
                      if candles[i]["close"] > level:
                          return (
                              20,
                              "BUY",
                              "BULLISH LIQUIDITY SWEEP + MSS",
                          )

              else:
                  for i in range(
                      index + 1,
                      min(len(candles), index + 15),
                  ):
                      if candles[i]["close"] < level:
                          return (
                              20,
                              "SELL",
                              "BEARISH LIQUIDITY SWEEP + MSS",
                          )

              return 0, None, "SWEEP WITHOUT MSS"


          def supply_demand(candles, direction, atr_value):
              if direction is None or atr_value is None:
                  return 0, "NO DIRECTION"

              best_score = 0
              best_text = "NO CLEAR SUPPLY/DEMAND"

              start = max(2, len(candles) - 40)

              for i in range(start, len(candles)):
                  base = candles[i - 2]
                  impulse = candles[i]

                  if abs(
                      impulse["close"] - base["close"]
                  ) < atr_value * 0.8:
                      continue

                  if (
                      direction == "BUY"
                      and base["close"] <= base["open"]
                      and impulse["close"] > impulse["open"]
                  ):
                      best_score = 10
                      best_text = "DEMAND ZONE + BULLISH IMPULSE"

                  if (
                      direction == "SELL"
                      and base["close"] >= base["open"]
                      and impulse["close"] < impulse["open"]
                  ):
                      best_score = 10
                      best_text = "SUPPLY ZONE + BEARISH IMPULSE"

              return best_score, best_text


          def price_action(candles, direction):
              if direction is None:
                  return 0, "NO DIRECTION"

              current = candles[-1]
              previous = candles[-2]

              body = abs(
                  current["close"] - current["open"]
              )

              upper_wick = (
                  current["high"]
                  - max(current["open"], current["close"])
              )

              lower_wick = (
                  min(current["open"], current["close"])
                  - current["low"]
              )

              bullish_engulfing = (
                  previous["close"] < previous["open"]
                  and current["close"] > current["open"]
                  and current["open"] <= previous["close"]
                  and current["close"] >= previous["open"]
              )

              bearish_engulfing = (
                  previous["close"] > previous["open"]
                  and current["close"] < current["open"]
                  and current["open"] >= previous["close"]
                  and current["close"] <= previous["open"]
              )

              if direction == "BUY":
                  if bullish_engulfing:
                      return 10, "BULLISH ENGULFING"

                  if body > 0 and lower_wick > body * 1.5:
                      return 8, "BULLISH REJECTION"

                  if current["close"] > current["open"]:
                      return 5, "BULLISH CANDLE"

              else:
                  if bearish_engulfing:
                      return 10, "BEARISH ENGULFING"

                  if body > 0 and upper_wick > body * 1.5:
                      return 8, "BEARISH REJECTION"

                  if current["close"] < current["open"]:
                      return 5, "BEARISH CANDLE"

              return 0, "NO STRONG PRICE ACTION"


          def liquidity_score(sweeps, direction):
              if not sweeps or direction is None:
                  return 0, "NO RECENT SWEEP"

              if sweeps[-1][0] == direction:
                  return 15, f"{direction} LIQUIDITY SWEEP"

              return 0, "OPPOSING LIQUIDITY SWEEP"


          def fibonacci(candles, highs, lows, direction):
              if direction is None or not highs or not lows:
                  return 0, "NO SWING RANGE"

              high = highs[-1][1]
              low = lows[-1][1]

              if high <= low:
                  return 0, "INVALID RANGE"

              current = candles[-1]["close"]
              ratios = [0.382, 0.500, 0.618, 0.786]

              if direction == "BUY":
                  levels = [
                      (r, high - (high - low) * r)
                      for r in ratios
                  ]
              else:
                  levels = [
                      (r, low + (high - low) * r)
                      for r in ratios
                  ]

              ratio, level = min(
                  levels,
                  key=lambda x: abs(current - x[1]),
              )

              if abs(current - level) <= (high - low) * 0.04:
                  return 5, f"NEAR FIB {ratio:.3f}"

              return 1, f"FIB {ratio:.3f} NOT NEAR"


          def trend(candles, direction):
              closes = [c["close"] for c in candles]

              ema20 = ema(closes, 20)
              ema50 = ema(closes, 50)
              ema200 = ema(closes, 200)

              if None in (ema20, ema50, ema200) or direction is None:
                  return 0, "INSUFFICIENT DATA"

              if (
                  direction == "BUY"
                  and ema20 > ema50 > ema200
              ):
                  return 10, "BULLISH EMA 20 > 50 > 200"

              if (
                  direction == "SELL"
                  and ema20 < ema50 < ema200
              ):
                  return 10, "BEARISH EMA 20 < 50 < 200"

              return 3, "MIXED EMA ALIGNMENT"


          def indicators(candles, direction):
              rsi_value = rsi(candles, 14)
              macd_value = macd(candles)

              if (
                  rsi_value is None
                  or macd_value is None
                  or direction is None
              ):
                  return 0, "INSUFFICIENT DATA"

              good = (
                  direction == "BUY"
                  and rsi_value >= 50
                  and macd_value > 0
              ) or (
                  direction == "SELL"
                  and rsi_value <= 50
                  and macd_value < 0
              )

              score = 5 if good else 2

              return (
                  score,
                  f"RSI {rsi_value:.1f} / MACD {macd_value:.6g}",
              )


          def timeframe_score(candles):
              if len(candles) < 220:
                  return None

              atr_value = atr(candles, ATR_PERIOD)
              highs, lows = find_swings(candles)

              ms_score, ms_direction, ms_text = market_structure(
                  highs,
                  lows,
              )

              smc_score, smc_direction, smc_text = smc_mss(
                  candles,
                  highs,
                  lows,
              )

              if (
                  ms_direction
                  and smc_direction
                  and ms_direction != smc_direction
              ):
                  return {
                      "direction": None,
                      "score": 0.0,
                      "conflict": True,
                      "highs": highs,
                      "lows": lows,
                      "atr": atr_value,
                      "reasons": {
                          "Market Structure": (ms_score, ms_text),
                          "SMC / MSS": (smc_score, smc_text),
                      },
                  }

              direction = smc_direction or ms_direction

              if direction is None:
                  return {
                      "direction": None,
                      "score": 0.0,
                      "conflict": False,
                      "highs": highs,
                      "lows": lows,
                      "atr": atr_value,
                      "reasons": {
                          "Market Structure": (ms_score, ms_text),
                          "SMC / MSS": (smc_score, smc_text),
                      },
                  }

              sweeps = liquidity_sweeps(
                  candles,
                  highs,
                  lows,
              )

              reasons = {
                  "Market Structure": (ms_score, ms_text),
                  "SMC / MSS": (smc_score, smc_text),
                  "Supply/Demand": supply_demand(
                      candles,
                      direction,
                      atr_value,
                  ),
                  "Price Action": price_action(
                      candles,
                      direction,
                  ),
                  "Liquidity": liquidity_score(
                      sweeps,
                      direction,
                  ),
                  "Fibonacci": fibonacci(
                      candles,
                      highs,
                      lows,
                      direction,
                  ),
                  "Trend": trend(
                      candles,
                      direction,
                  ),
                  "Indicators": indicators(
                      candles,
                      direction,
                  ),
                  "Session": (
                      5,
                      "HOLDING MODE - SESSION NEUTRAL",
                  ),
              }

              raw_score = sum(
                  points for points, _ in reasons.values()
              )

              # Nine methods total 95 points because session is deliberately
              # neutralized at 5/10 for holding trades. Normalize to 100.
              normalized = raw_score / 95.0 * 100.0

              return {
                  "direction": direction,
                  "score": round(normalized, 1),
                  "conflict": False,
                  "highs": highs,
                  "lows": lows,
                  "atr": atr_value,
                  "reasons": reasons,
              }


          def d1_h4_direction(d1, h4):
              if (
                  d1["direction"]
                  and h4["direction"]
                  and d1["direction"] == h4["direction"]
                  and d1["score"] >= 55
                  and h4["score"] >= 60
              ):
                  return d1["direction"]

              return None


          def build_levels(candles_h4, h4, direction):
              atr_value = h4["atr"]

              if (
                  direction not in ("BUY", "SELL")
                  or atr_value is None
              ):
                  return None

              highs = h4["highs"]
              lows = h4["lows"]
              market = candles_h4[-1]["close"]

              if direction == "BUY":
                  protected_lows = [
                      x[1]
                      for x in lows[-SWING_LOOKBACK:]
                      if x[1] < market
                  ]

                  protected = (
                      protected_lows[-1]
                      if protected_lows
                      else min(
                          c["low"]
                          for c in candles_h4[-40:]
                      )
                  )

                  sl = (
                      protected
                      - SL_BUFFER_ATR * atr_value
                  )

                  zone_low = protected + 0.10 * atr_value
                  zone_high = protected + ENTRY_ZONE_ATR * atr_value

                  if market < zone_low:
                      entry = zone_low
                  elif market <= zone_high:
                      entry = market
                  else:
                      entry = market

                  risk = entry - sl

                  candidate_targets = sorted(
                      set(
                          x[1]
                          for x in highs[-SWING_LOOKBACK:]
                          if x[1] > entry + 0.25 * atr_value
                      )
                  )

                  if highs and lows:
                      swing_range = (
                          highs[-1][1] - lows[-1][1]
                      )

                      if swing_range > 0:
                          candidate_targets.extend([
                              highs[-1][1]
                              + 0.618 * swing_range,
                              highs[-1][1]
                              + 1.000 * swing_range,
                          ])

                  valid_targets = sorted(
                      target
                      for target in candidate_targets
                      if target > entry + risk
                  )

                  tp1 = (
                      valid_targets[0]
                      if valid_targets
                      else entry + 2.0 * risk
                  )

                  tp2 = (
                      valid_targets[1]
                      if len(valid_targets) > 1
                      else entry + 4.0 * risk
                  )

                  max_tp = entry + MAX_RR * risk
                  tp1 = min(tp1, max_tp)
                  tp2 = min(tp2, max_tp)

              else:
                  protected_highs = [
                      x[1]
                      for x in highs[-SWING_LOOKBACK:]
                      if x[1] > market
                  ]

                  protected = (
                      protected_highs[-1]
                      if protected_highs
                      else max(
                          c["high"]
                          for c in candles_h4[-40:]
                      )
                  )

                  sl = (
                      protected
                      + SL_BUFFER_ATR * atr_value
                  )

                  zone_high = protected - 0.10 * atr_value
                  zone_low = protected - ENTRY_ZONE_ATR * atr_value

                  if market > zone_high:
                      entry = zone_high
                  elif market >= zone_low:
                      entry = market
                  else:
                      entry = market

                  risk = sl - entry

                  candidate_targets = sorted(
                      set(
                          x[1]
                          for x in lows[-SWING_LOOKBACK:]
                          if x[1] < entry - 0.25 * atr_value
                      ),
                      reverse=True,
                  )

                  if highs and lows:
                      swing_range = (
                          highs[-1][1] - lows[-1][1]
                      )

                      if swing_range > 0:
                          candidate_targets.extend([
                              lows[-1][1]
                              - 0.618 * swing_range,
                              lows[-1][1]
                              - 1.000 * swing_range,
                          ])

                  valid_targets = sorted(
                      (
                          target
                          for target in candidate_targets
                          if target < entry - risk
                      ),
                      reverse=True,
                  )

                  tp1 = (
                      valid_targets[0]
                      if valid_targets
                      else entry - 2.0 * risk
                  )

                  tp2 = (
                      valid_targets[1]
                      if len(valid_targets) > 1
                      else entry - 4.0 * risk
                  )

                  min_tp = entry - MAX_RR * risk
                  tp1 = max(tp1, min_tp)
                  tp2 = max(tp2, min_tp)

              if risk <= 0:
                  return None

              risk_atr = risk / atr_value
              rr1 = abs(tp1 - entry) / risk
              rr2 = abs(tp2 - entry) / risk

              if risk_atr > MAX_RISK_ATR:
                  return None

              if rr1 < 1.5:
                  return None

              return {
                  "entry": entry,
                  "zone_low": zone_low,
                  "zone_high": zone_high,
                  "sl": sl,
                  "tp1": tp1,
                  "tp2": tp2,
                  "risk_atr": risk_atr,
                  "rr1": min(rr1, MAX_RR),
                  "rr2": min(rr2, MAX_RR),
                  "entry_basis": "4H protected swing + controlled pullback zone",
                  "sl_basis": "4H protected swing + ATR buffer",
                  "tp_basis": "nearest valid opposing liquidity/structure + Fibonacci extension",
              }


          def analyze_symbol(symbol):
              d1_candles = get_candles(symbol, "D1")
              h4_candles = get_candles(symbol, "H4")

              if (
                  len(d1_candles) < 220
                  or len(h4_candles) < 220
              ):
                  return None, "incomplete_d1_h4"

              d1 = timeframe_score(d1_candles)
              h4 = timeframe_score(h4_candles)

              if d1 is None or h4 is None:
                  return None, "incomplete_d1_h4"

              direction = d1_h4_direction(d1, h4)

              if direction is None:
                  return None, "screened_no_confluence"

              h1_candles = get_candles(symbol, "H1")

              if len(h1_candles) < 220:
                  return None, "incomplete_h1"

              h1 = timeframe_score(h1_candles)

              if h1 is None:
                  return None, "incomplete_h1"

              if (
                  h1["direction"] != direction
                  or h1["score"] < 55
              ):
                  return None, "rejected_h1"

              levels = build_levels(
                  h4_candles,
                  h4,
                  direction,
              )

              if levels is None:
                  return None, "invalid_levels"

              score = (
                  d1["score"] * 0.25
                  + h4["score"] * 0.55
                  + h1["score"] * 0.20
              )

              # Full 1D + 4H + 1H agreement.
              score += 5.0

              # Reward potential helps ranking, but never creates a setup by itself.
              if levels["rr1"] >= 5:
                  score += 4
              elif levels["rr1"] >= 3:
                  score += 3
              elif levels["rr1"] >= 2:
                  score += 2

              score = max(0.0, min(100.0, score))

              if score < MIN_SCORE:
                  return None, "below_score"

              return {
                  "symbol": symbol,
                  "direction": direction,
                  "score": round(score, 1),
                  "d1": d1,
                  "h4": h4,
                  "h1": h1,
                  "levels": levels,
              }, "qualified"


          def fmt(symbol, value):
              if value is None:
