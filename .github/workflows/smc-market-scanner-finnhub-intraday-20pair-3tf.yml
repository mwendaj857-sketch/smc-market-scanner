              result, status = analyze(symbol)
              if status != "incomplete_data": analyzed_count += 1
              else: incomplete_count += 1
              if status == "qualified" and result is not None:
                  results.append(result); qualified_count += 1

          results.sort(key=lambda x: x["score"], reverse=True)
          expected_datasets = len(SYMBOLS) * len(TIMEFRAMES)
          available_datasets = expected_datasets - len(MISSING_DATASETS)
