name: SMC 9-Method Finnhub Intraday Scanner - Corrected

on:
  workflow_dispatch:
  schedule:
    # Intraday refresh every 30 minutes. Finnhub rate protection prevents bursts.
    - cron: "*/30 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: SMC 9-Method Finnhub Intraday Scanner
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          from datetime import datetime, timedelta, timezone
          import requests

          API_KEY = os.environ.get("FINNHUB_API_KEY", "").strip()
          if not API_KEY:
              raise SystemExit("❌ FINNHUB_API_KEY secret is missing.")

          # 20 liquid G10 FX pairs using Finnhub/OANDA symbols.
          SYMBOLS = [
              "OANDA:EUR_USD", "OANDA:GBP_USD", "OANDA:USD_JPY", "OANDA:USD_CHF", "OANDA:USD_CAD",
              "OANDA:AUD_USD", "OANDA:NZD_USD", "OANDA:EUR_GBP", "OANDA:EUR_JPY", "OANDA:EUR_CHF",
              "OANDA:EUR_AUD", "OANDA:EUR_CAD", "OANDA:GBP_JPY", "OANDA:GBP_CHF", "OANDA:GBP_AUD",
              "OANDA:GBP_CAD", "OANDA:AUD_JPY", "OANDA:AUD_NZD", "OANDA:CAD_JPY", "OANDA:NZD_JPY",
          ]

          # Finnhub intraday model:
          # 4H = regime, 1H = confirmation/decision, 30M = entry trigger.
          # 500 completed candles are requested per timeframe to give the
          # 9-method engine more history without fabricating data.
          TIMEFRAMES = {
              "H4": {"resolution": "240", "seconds": 4 * 60 * 60, "bars": 500},
              "H1": {"resolution": "60",  "seconds": 60 * 60,     "bars": 500},
              "M30": {"resolution": "30", "seconds": 30 * 60,    "bars": 500},
          }

          DISPLAY_NAMES = {
              "OANDA:EUR_USD": "EUR/USD", "OANDA:GBP_USD": "GBP/USD", "OANDA:USD_JPY": "USD/JPY",
              "OANDA:USD_CHF": "USD/CHF", "OANDA:USD_CAD": "USD/CAD", "OANDA:AUD_USD": "AUD/USD",
              "OANDA:NZD_USD": "NZD/USD", "OANDA:EUR_GBP": "EUR/GBP", "OANDA:EUR_JPY": "EUR/JPY",
              "OANDA:EUR_CHF": "EUR/CHF", "OANDA:EUR_AUD": "EUR/AUD", "OANDA:EUR_CAD": "EUR/CAD",
              "OANDA:GBP_JPY": "GBP/JPY", "OANDA:GBP_CHF": "GBP/CHF", "OANDA:GBP_AUD": "GBP/AUD",
              "OANDA:GBP_CAD": "GBP/CAD", "OANDA:AUD_JPY": "AUD/JPY", "OANDA:AUD_NZD": "AUD/NZD",
              "OANDA:CAD_JPY": "CAD/JPY", "OANDA:NZD_JPY": "NZD/JPY",
          }

          ATR_PERIOD = 14
          RSI_PERIOD = 14
          SWING_STRENGTH = 2
          SWING_LOOKBACK = 80

          SL_ATR_BUFFER = 0.25
          MIN_SL_ATR = 1.00
          MAX_SL_ATR = 3.50

          BASE_RISK_R = 1.0
          MIN_TARGET_R = 1.0
          MAX_TARGET_R = 8.0
          TARGET_BUFFER_ATR = 0.15
          ENTRY_ZONE_ATR = 0.35

          TOP_N = 5
          MIN_SCORE = 68.0

          URL = "https://finnhub.io/api/v1/forex/candle"

          # Finnhub general free-plan rate limit is 60 API calls/minute.
          # Forex candle access itself is listed as premium on Finnhub's
          # dedicated Forex pricing page, so the startup self-test and
          # per-request error handling deliberately refuse to pretend a
          # free key has candle access if Finnhub rejects it.
          REQUESTS_PER_MINUTE = 60
          FULL_SCAN_CALLS = len(SYMBOLS) * len(TIMEFRAMES)
          REQUEST_WINDOW_SECONDS = 61.0
          MAX_RETRIES = 2
          CANDLE_BARS = 500

          CACHE = {}
          LAST_REQUEST_AT = 0.0
          SESSION = requests.Session()

          # Scan diagnostics. These distinguish a real "no setup" result
          # from an incomplete/failed market-data refresh.
          DATA_ISSUES = []
          FATAL_API_ERRORS = []
          MISSING_DATASETS = set()
          ANALYSIS_ISSUES = {}


          def fmt(symbol, value):
              if value is None:
                  return "N/A"
              decimals = 3 if "JPY" in symbol else 5
              return f"{value:.{decimals}f}"

          def _record_issue(message, fatal=False):
              DATA_ISSUES.append(message)
              if fatal:
                  FATAL_API_ERRORS.append(message)
              print(message)

          def _completed_candles(candles, seconds):
              if not candles:
                  return candles
              now_ts = int(datetime.now(timezone.utc).timestamp())
              completed = [c for c in candles if c["timestamp"] + seconds <= now_ts]
              removed = len(candles) - len(completed)
              if removed:
                  print(f"ℹ️ CLOSED-BAR FILTER: removed {removed} incomplete/latest bar(s).")
              return completed

          def _wait_for_rate_window():
              global LAST_REQUEST_AT
              if LAST_REQUEST_AT <= 0:
                  return
              elapsed = time.monotonic() - LAST_REQUEST_AT
              if elapsed < REQUEST_WINDOW_SECONDS / REQUESTS_PER_MINUTE:
                  time.sleep((REQUEST_WINDOW_SECONDS / REQUESTS_PER_MINUTE) - elapsed)

          def _request_candles(symbol, cfg):
              global LAST_REQUEST_AT
              cache_key = (symbol, cfg["resolution"], cfg["bars"])
              if cache_key in CACHE:
                  return CACHE[cache_key]

              # Request enough history for 500 bars plus a small safety margin.
              to_ts = int(datetime.now(timezone.utc).timestamp())
              from_ts = to_ts - cfg["seconds"] * (cfg["bars"] + 20)
              params = {
                  "symbol": symbol,
                  "resolution": cfg["resolution"],
                  "from": from_ts,
                  "to": to_ts,
                  "token": API_KEY,
              }

              for attempt in range(MAX_RETRIES + 1):
                  _wait_for_rate_window()
                  try:
                      response = SESSION.get(URL, params=params, timeout=30)
                      LAST_REQUEST_AT = time.monotonic()
                  except requests.RequestException as exc:
                      if attempt >= MAX_RETRIES:
                          _record_issue(f"❌ REQUEST ERROR {symbol} {cfg['resolution']}: {exc}", fatal=True)
                          return []
                      print(f"⚠️ REQUEST ERROR {symbol}: retry {attempt + 1}/{MAX_RETRIES}")
                      time.sleep(2)
                      continue

                  if response.status_code == 429:
                      if attempt >= MAX_RETRIES:
                          _record_issue(f"❌ RATE LIMIT EXHAUSTED: {symbol} {cfg['resolution']}", fatal=True)
                          return []
                      retry_after = response.headers.get("Retry-After")
                      try:
                          wait = max(61.0, float(retry_after or 0))
                      except ValueError:
                          wait = 61.0
                      print(f"⚠️ RATE LIMIT: waiting {wait:.0f}s before retrying {symbol}.")
                      time.sleep(wait)
                      continue

                  if response.status_code in (401, 403):
                      try:
                          payload = response.json()
                      except ValueError:
                          payload = {}
                      msg = payload.get("error", payload.get("message", response.text[:200]))
                      _record_issue(f"❌ AUTH/PERMISSION ERROR {symbol}: HTTP {response.status_code}: {msg}", fatal=True)
                      return []

                  if response.status_code >= 500:
                      if attempt >= MAX_RETRIES:
                          _record_issue(f"❌ SERVER ERROR {symbol}: HTTP {response.status_code}", fatal=True)
                          return []
                      time.sleep(5)
                      continue

                  try:
                      response.raise_for_status()
                      payload = response.json()
                  except (requests.RequestException, ValueError) as exc:
                      _record_issue(f"❌ API/JSON ERROR {symbol}: {exc}", fatal=True)
                      return []

                  if not isinstance(payload, dict) or payload.get("s") != "ok":
                      msg = payload.get("s", payload.get("error", "no_data")) if isinstance(payload, dict) else "invalid response"
                      # Premium forex-candle rejection is a configuration/access problem, not a no-setup result.
                      fatal = "premium" in str(msg).lower() or "access" in str(msg).lower()
                      _record_issue(f"❌ DATA ERROR {symbol} {cfg['resolution']}: {msg}", fatal=fatal)
                      MISSING_DATASETS.add((symbol, cfg["resolution"]))
                      return []

                  ts = payload.get("t", [])
                  opens, highs, lows, closes = payload.get("o", []), payload.get("h", []), payload.get("l", []), payload.get("c", [])
                  n = min(len(ts), len(opens), len(highs), len(lows), len(closes))
                  candles = []
                  for i in range(n):
                      try:
                          candles.append({
                              "timestamp": int(ts[i]),
                              "open": float(opens[i]), "high": float(highs[i]),
                              "low": float(lows[i]), "close": float(closes[i]),
                          })
                      except (TypeError, ValueError):
                          continue

                  candles.sort(key=lambda x: x["timestamp"])
                  candles = _completed_candles(candles, cfg["seconds"])[-cfg["bars"]:]
                  if len(candles) < 220:
                      _record_issue(f"⚠️ DATA SHORT: {symbol} {cfg['resolution']}: {len(candles)} completed candles")
                      MISSING_DATASETS.add((symbol, cfg["resolution"]))
                      return []
                  CACHE[cache_key] = candles
                  return candles

              return []

          def get_candles(symbol, cfg):
              return _request_candles(symbol, cfg)

          def preload_market_data():
              total = len(SYMBOLS) * len(TIMEFRAMES)
              print(f"📡 Finnhub candle requests required: {total}")
              print(f"📈 Historical depth: up to {CANDLE_BARS} completed candles per timeframe/pair")
              request_no = 0
              for name, cfg in TIMEFRAMES.items():
                  for symbol in SYMBOLS:
                      request_no += 1
                      print(f"📥 FETCH {name}: {request_no}/{total} {DISPLAY_NAMES.get(symbol, symbol)}")
                      _request_candles(symbol, cfg)

          def ema(values, period):
              if len(values) < period:
                  return None
              k = 2.0 / (period + 1)
              value = sum(values[:period]) / period
              for price in values[period:]:
                  value += k * (price - value)
              return value

          def atr(candles, period=14):
              if len(candles) < period + 1:
                  return None

              trs = []
              for i in range(1, len(candles)):
                  h = candles[i]["high"]
                  l = candles[i]["low"]
                  pc = candles[i - 1]["close"]
                  trs.append(max(h - l, abs(h - pc), abs(l - pc)))

              value = sum(trs[:period]) / period
              for tr in trs[period:]:
                  value = ((period - 1) * value + tr) / period
              return value

          def rsi(candles, period=14):
              if len(candles) < period + 1:
                  return None

              gains = []
              losses = []

              for i in range(1, len(candles)):
                  change = candles[i]["close"] - candles[i - 1]["close"]
                  gains.append(max(change, 0.0))
                  losses.append(max(-change, 0.0))

              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period

              for i in range(period, len(gains)):
                  avg_gain = ((period - 1) * avg_gain + gains[i]) / period
                  avg_loss = ((period - 1) * avg_loss + losses[i]) / period

              if avg_loss == 0:
                  return 100.0
              if avg_gain == 0:
                  return 0.0

              rs = avg_gain / avg_loss
              return 100.0 - (100.0 / (1.0 + rs))

          def macd(candles):
              closes = [c["close"] for c in candles]
              e12 = ema(closes, 12)
              e26 = ema(closes, 26)
              if e12 is None or e26 is None:
                  return None
              return e12 - e26

          def swing_high(candles, i, strength=2):
              if i < strength or i >= len(candles) - strength:
                  return False
              h = candles[i]["high"]
              return all(
                  h > candles[i - j]["high"] and
                  h > candles[i + j]["high"]
                  for j in range(1, strength + 1)
              )

          def swing_low(candles, i, strength=2):
              if i < strength or i >= len(candles) - strength:
                  return False
              low = candles[i]["low"]
              return all(
                  low < candles[i - j]["low"] and
                  low < candles[i + j]["low"]
                  for j in range(1, strength + 1)
              )

          def find_swings(candles):
              highs = []
              lows = []

              for i in range(SWING_STRENGTH, len(candles) - SWING_STRENGTH):
                  if swing_high(candles, i, SWING_STRENGTH):
                      highs.append({"index": i, "price": candles[i]["high"]})
                  if swing_low(candles, i, SWING_STRENGTH):
                      lows.append({"index": i, "price": candles[i]["low"]})

              return highs, lows

          def structure(highs, lows):
              if len(highs) < 2 or len(lows) < 2:
                  return 0, None, "INSUFFICIENT SWINGS"

              hh = highs[-1]["price"] > highs[-2]["price"]
              hl = lows[-1]["price"] > lows[-2]["price"]
              lh = highs[-1]["price"] < highs[-2]["price"]
              ll = lows[-1]["price"] < lows[-2]["price"]

              if hh and hl:
                  return 15, "BUY", "BULLISH HH + HL"
              if lh and ll:
                  return 15, "SELL", "BEARISH LH + LL"

              return 5, None, "MIXED STRUCTURE"

          def liquidity_sweeps(candles, highs, lows):
              sweeps = []
              start = max(0, len(candles) - 100)

              for i in range(start, len(candles)):
                  previous_highs = [x for x in highs if x["index"] < i]
                  previous_lows = [x for x in lows if x["index"] < i]

                  if (
                      previous_highs
                      and candles[i]["high"] > previous_highs[-1]["price"]
                      and candles[i]["close"] < previous_highs[-1]["price"]
                  ):
                      sweeps.append(("SELL", i, previous_highs[-1]["price"]))

                  if (
                      previous_lows
                      and candles[i]["low"] < previous_lows[-1]["price"]
                      and candles[i]["close"] > previous_lows[-1]["price"]
                  ):
                      sweeps.append(("BUY", i, previous_lows[-1]["price"]))

              return sweeps

          def smc(candles, highs, lows):
              sweeps = liquidity_sweeps(candles, highs, lows)

              if not sweeps:
                  return 0, None, "NO RECENT LIQUIDITY SWEEP"

              sweep_type, index, _ = sweeps[-1]

              for i in range(index + 1, min(len(candles), index + 15)):
                  if sweep_type == "BUY":
                      previous_highs = [x for x in highs if x["index"] < index]
                      if previous_highs and candles[i]["close"] > previous_highs[-1]["price"]:
                          return 20, "BUY", "BULLISH LIQUIDITY SWEEP + MSS"
                  else:
                      previous_lows = [x for x in lows if x["index"] < index]
                      if previous_lows and candles[i]["close"] < previous_lows[-1]["price"]:
                          return 20, "SELL", "BEARISH LIQUIDITY SWEEP + MSS"

              return 0, None, "SWEEP WITHOUT MSS"

          def supply_demand(candles, direction, atr_value):
              if direction is None or atr_value is None:
                  return 0, "NO DIRECTION"

              recent = candles[-30:]
              best = 0
              label = "WEAK SUPPLY/DEMAND"

              for i in range(2, len(recent)):
                  base = recent[i - 2]
                  impulse = recent[i]

                  if abs(impulse["close"] - base["close"]) < atr_value * 0.8:
                      continue

                  if (
                      direction == "BUY"
                      and base["close"] <= base["open"]
                      and impulse["close"] > impulse["open"]
                  ):
                      best = 10
                      label = "DEMAND ZONE + BULLISH IMPULSE"

                  if (
                      direction == "SELL"
                      and base["close"] >= base["open"]
                      and impulse["close"] < impulse["open"]
                  ):
                      best = 10
                      label = "SUPPLY ZONE + BEARISH IMPULSE"

              return best, label

          def price_action(candles, direction):
              if direction is None or len(candles) < 2:
                  return 0, "NO DIRECTION"

              c = candles[-1]
              p = candles[-2]

              body = abs(c["close"] - c["open"])
              upper = c["high"] - max(c["open"], c["close"])
              lower = min(c["open"], c["close"]) - c["low"]

              bull = (
                  p["close"] < p["open"]
                  and c["close"] > c["open"]
                  and c["open"] <= p["close"]
                  and c["close"] >= p["open"]
              )

              bear = (
                  p["close"] > p["open"]
                  and c["close"] < c["open"]
                  and c["open"] >= p["close"]
                  and c["close"] <= p["open"]
              )

              if direction == "BUY":
                  if bull:
                      return 10, "BULLISH ENGULFING"
                  if body > 0 and lower > body * 1.5:
                      return 8, "BULLISH REJECTION"
                  if c["close"] > c["open"]:
                      return 5, "BULLISH CANDLE"
              else:
                  if bear:
                      return 10, "BEARISH ENGULFING"
                  if body > 0 and upper > body * 1.5:
                      return 8, "BEARISH REJECTION"
                  if c["close"] < c["open"]:
                      return 5, "BEARISH CANDLE"

              return 0, "NO STRONG PRICE ACTION"

          def liquidity_score(sweeps, direction):
              if not sweeps or direction is None:
                  return 0, "NO RECENT SWEEP"

              if sweeps[-1][0] == direction:
                  return 15, f"{direction} LIQUIDITY SWEEP"

              return 5, "OPPOSING LIQUIDITY SWEEP"

          def fibonacci(candles, highs, lows, direction):
              if direction is None or not highs or not lows:
                  return 0, "NO SWING RANGE"

              high = highs[-1]["price"]
              low = lows[-1]["price"]

              if high <= low:
                  return 0, "INVALID RANGE"

              current = candles[-1]["close"]

              if direction == "BUY":
                  levels = [
                      ("0.382", high - (high - low) * 0.382),
                      ("0.500", high - (high - low) * 0.500),
                      ("0.618", high - (high - low) * 0.618),
                      ("0.786", high - (high - low) * 0.786),
                  ]
              else:
                  levels = [
                      ("0.382", low + (high - low) * 0.382),
                      ("0.500", low + (high - low) * 0.500),
                      ("0.618", low + (high - low) * 0.618),
                      ("0.786", low + (high - low) * 0.786),
                  ]

              name, level = min(levels, key=lambda x: abs(current - x[1]))

              if abs(current - level) <= (high - low) * 0.04:
                  return 5, f"NEAR FIB {name}"

              return 2, f"FIB {name} NOT NEAR"

          def trend(candles, direction):
              closes = [c["close"] for c in candles]
              e20 = ema(closes, 20)
              e50 = ema(closes, 50)
              e200 = ema(closes, 200)

              if None in (e20, e50, e200) or direction is None:
                  return 0, "INSUFFICIENT DATA"

              if direction == "BUY" and e20 > e50 > e200:
                  return 10, "BULLISH EMA ALIGNMENT"

              if direction == "SELL" and e20 < e50 < e200:
                  return 10, "BEARISH EMA ALIGNMENT"

              return 3, "MIXED EMA ALIGNMENT"

          def indicators(candles, direction):
              r = rsi(candles, RSI_PERIOD)
              m = macd(candles)

              if r is None or m is None or direction is None:
                  return 0, "INSUFFICIENT DATA"

              if direction == "BUY":
                  score = 5 if r >= 50 and m > 0 else 2
              else:
                  score = 5 if r <= 50 and m < 0 else 2

              return score, f"RSI {r:.1f} / MACD {m:.6f}"

          def session_score(_):
              hour = datetime.now(timezone.utc).hour
              if 13 <= hour < 17:
                  return 10, "LONDON + NEW YORK OVERLAP"
              if 8 <= hour < 13:
                  return 8, "LONDON SESSION"
              if 17 <= hour < 21:
                  return 6, "NEW YORK SESSION"
              return 3, "OUTSIDE PRIMARY FX SESSIONS"

          def tf_score(candles):
              if len(candles) < 220:
                  return None

              atr_value = atr(candles, ATR_PERIOD)
              highs, lows = find_swings(candles)

              ms_s, ms_dir, ms_text = structure(highs, lows)
              smc_s, smc_dir, smc_text = smc(candles, highs, lows)

              direction = smc_dir or ms_dir

              sd_s, sd_text = supply_demand(candles, direction, atr_value)
              pa_s, pa_text = price_action(candles, direction)

              sweeps = liquidity_sweeps(candles, highs, lows)
              liq_s, liq_text = liquidity_score(sweeps, direction)

              fib_s, fib_text = fibonacci(candles, highs, lows, direction)
              trend_s, trend_text = trend(candles, direction)
              ind_s, ind_text = indicators(candles, direction)
              session_s, session_text = session_score(candles)

              raw_total = sum([
                  ms_s, smc_s, sd_s, pa_s, liq_s,
                  fib_s, trend_s, ind_s, session_s
              ])

              # The nine methods have a theoretical maximum of 100.
              # (15 + 20 + 10 + 10 + 15 + 5 + 10 + 5 + 10 = 100)
              return {
                  "direction": direction,
                  "score": float(raw_total),
                  "atr": atr_value,
                  "highs": highs,
                  "lows": lows,
                  "ms": (ms_s, ms_text),
                  "smc": (smc_s, smc_text),
                  "sd": (sd_s, sd_text),
                  "pa": (pa_s, pa_text),
                  "liq": (liq_s, liq_text),
                  "fib": (fib_s, fib_text),
                  "trend": (trend_s, trend_text),
                  "ind": (ind_s, ind_text),
                  "session": (session_s, session_text),
              }

          def common_direction(h4, h1, m30):
              dirs = [h4.get("direction"), h1.get("direction"), m30.get("direction")]
              if h4.get("direction") == "BUY" and dirs.count("BUY") >= 2:
                  return "BUY"
              if h4.get("direction") == "SELL" and dirs.count("SELL") >= 2:
                  return "SELL"
              return None

          def build_intraday_levels(candles_m30, m30, direction):
              if direction not in ("BUY", "SELL") or m30["atr"] is None:
                  return None
              entry_market = candles_m30[-1]["close"]
              atr30 = m30["atr"]
              highs, lows = m30["highs"], m30["lows"]
              recent_lows = [x["price"] for x in lows[-SWING_LOOKBACK:] if x["price"] < entry_market]
              recent_highs = [x["price"] for x in highs[-SWING_LOOKBACK:] if x["price"] > entry_market]
              if direction == "BUY":
                  protected = recent_lows[-1] if recent_lows else min(c["low"] for c in candles_m30[-40:])
                  sl = min(protected - SL_ATR_BUFFER * atr30, entry_market - MIN_SL_ATR * atr30)
                  pullback = protected + ENTRY_ZONE_ATR * atr30
                  entry = max(entry_market, pullback)
              else:
                  protected = recent_highs[-1] if recent_highs else max(c["high"] for c in candles_m30[-40:])
                  sl = max(protected + SL_ATR_BUFFER * atr30, entry_market + MIN_SL_ATR * atr30)
                  pullback = protected - ENTRY_ZONE_ATR * atr30
                  entry = min(entry_market, pullback)

              risk = abs(entry - sl)
              if risk <= 0:
                  return None
              if risk / atr30 > MAX_SL_ATR:
                  return None

              targets = []
              if direction == "BUY":
                  targets += [x["price"] for x in highs[-SWING_LOOKBACK:] if x["price"] > entry + TARGET_BUFFER_ATR * atr30]
              else:
                  targets += [x["price"] for x in lows[-SWING_LOOKBACK:] if x["price"] < entry - TARGET_BUFFER_ATR * atr30]
              if highs and lows:
                  sh, slow = highs[-1]["price"], lows[-1]["price"]
                  rng = sh - slow
                  if rng > 0:
                      if direction == "BUY":
                          targets += [sh + 0.618*rng, sh + 1.0*rng, sh + 1.618*rng]
                      else:
                          targets += [slow - 0.618*rng, slow - 1.0*rng, slow - 1.618*rng]
              if direction == "BUY":
                  valid = [t for t in targets if t > entry + risk]
                  tp = max(valid) if valid else entry + risk
              else:
                  valid = [t for t in targets if t < entry - risk]
                  tp = min(valid) if valid else entry - risk
              rr = abs(tp-entry)/risk
              if rr > MAX_TARGET_R:
                  tp = entry + MAX_TARGET_R*risk if direction == "BUY" else entry - MAX_TARGET_R*risk
                  rr = MAX_TARGET_R
              if rr < MIN_TARGET_R:
                  return None
              return {"entry":entry,"sl":sl,"tp":tp,"risk":risk,"risk_atr":risk/atr30,"rr":rr,
                      "basis":"30M protected swing + ATR buffer","target_basis":"STRUCTURAL / LIQUIDITY OBJECTIVE + FIB EXTENSION",
                      "entry_type":"30M CURRENT / CONTROLLED PULLBACK ZONE"}

          def analyze(symbol):
              try:
                  data = {}
                  for name, cfg in TIMEFRAMES.items():
                      candles = get_candles(symbol, cfg)
                      if len(candles) < 220:
                          ANALYSIS_ISSUES[symbol] = f"{name}: insufficient completed candles ({len(candles)})"
                          return None, "incomplete_data"
                      scored = tf_score(candles)
                      if scored is None:
                          return None, "incomplete_data"
                      data[name] = (candles, scored)

                  h4, h1, m30 = data["H4"][1], data["H1"][1], data["M30"][1]
                  direction = common_direction(h4, h1, m30)
                  if direction is None:
                      return None, "analyzed_no_confluence"

                  score = h4["score"] * 0.45 + h1["score"] * 0.30 + m30["score"] * 0.25
                  if h1["direction"] != direction: score -= 7
                  if m30["direction"] != direction: score -= 5
                  confirmations = sum(x.get("direction") == direction for x in (h4,h1,m30))
                  score += confirmations * 2

                  levels = build_intraday_levels(data["M30"][0], m30, direction)
                  if not levels:
                      return None, "analyzed_invalid_levels"
                  rr = levels["rr"]
                  if rr >= 6: score += 5
                  elif rr >= 4: score += 4
                  elif rr >= 3: score += 3
                  elif rr >= 2: score += 2
                  score = max(0.0, min(100.0, score))
                  if score < MIN_SCORE:
                      return None, "analyzed_below_score"
                  return {"symbol":symbol,"display_symbol":DISPLAY_NAMES.get(symbol,symbol),"direction":direction,"score":round(score,1),
                          "signal":"STRONG" if score>=78 else "MODERATE","h4":h4,"h1":h1,"m30":m30,"levels":levels,
                          "bias_4h":h4.get("direction") or "NEUTRAL","bias_1h":h1.get("direction") or "NEUTRAL",
                          "bias_30m":m30.get("direction") or "NEUTRAL","confirmations":confirmations,
                          "reasons":{"4H":h4,"1H":h1,"30M":m30}}, "qualified"
              except Exception as exc:
                  ANALYSIS_ISSUES[symbol] = f"{type(exc).__name__}: {exc}"
                  print(f"⚠️ ANALYSIS ERROR {symbol}: {type(exc).__name__}: {exc}")
                  return None, "analysis_error"

          # ============================================================
          # MAIN PROGRAM
          # ============================================================
          print("=" * 78)
