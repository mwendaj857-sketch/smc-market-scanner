                  print(f"🎯 TP BASIS:    {levels['target_basis']}")
                  print("")
                  print("📊 TIMEFRAME ALIGNMENT")
                  print(f"📅 1D: {result['bias_1d']}")
                  print(f"🕓 4H: {result['bias_4h']}")
                  print(f"⏱️ 1H: {result['bias_1h']}")
                  print(f"✅ CONFIRMATIONS: {result['confirmations']}/3")
                  print("")

              print("═" * 64)
