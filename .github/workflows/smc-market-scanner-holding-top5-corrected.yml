          print(f"Batch size: {BATCH_SIZE} symbols")
          print(
              f"Full refresh: {len(SYMBOLS) * len(TIMEFRAMES)} "
              f"symbol-credits"
          )
          print("VALIDATION: dynamic R:R / structural TP enabled")
          print("Risk model: 1R base risk | Reward is structural/probability-based, not fixed.")

          # Preload exactly once. Analysis then uses the cache and does not
          # generate extra API requests.
          preload_market_data()

          # FIXED: results is created before it is used.
          results = []
          analyzed_count = 0

          for symbol in SYMBOLS:
              result = analyze(symbol)
              if result is not None:
                  results.append(result)
              analyzed_count += 1

          # Strongest first.
          results.sort(key=lambda x: x["score"], reverse=True)

          # Only the five strongest qualified holding setups are displayed.
          top5 = results[:TOP_N]

          print("\n" + "═" * 64)
          print("💹🔥 SMC FOREX HOLDING TOP 5 🔥💹")
          print("═" * 64)
          print("💡 1R = BASE RISK | 🎯 TP = PROBABLE OBJECTIVE | ⚖️ R:R = DYNAMIC")
          print("")

          if not top5:
              print("🙊 NO QUALIFIED HOLDING SETUPS FOUND")
              print("💙 The full market universe was scanned, but no pair")
              print("   met the required multi-timeframe confluence and score.")
          else:
              print("🎊 MARKET SCAN COMPLETE")
              print(f"💱 Pairs scanned: {analyzed_count}/{len(SYMBOLS)}")
              print("📊 Timeframes: 1D • 4H • 1H")
              print(f"⭐ Qualified setups: {len(results)}")
              print(f"🏆 Displayed: TOP {len(top5)} ONLY")
              print("")
              print("💎 TOP SYMBOLS: " + ", ".join(r["symbol"] for r in top5))
              print("")

              for rank, result in enumerate(top5, 1):
                  levels = result["levels"]
                  symbol = result["symbol"]

                  medal = {
                      1: "🏆",
