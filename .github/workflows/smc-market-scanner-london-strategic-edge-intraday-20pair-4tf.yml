                  print(f"🎯 ENTRY: {fmt(symbol,levels['entry'])}")
                  print(f"🛡️ STOP LOSS: {fmt(symbol,levels['sl'])}")
                  print(f"💰 TAKE PROFIT: {fmt(symbol,levels['tp'])}")
                  print(f"⚖️ RISK: {levels['risk_atr']:.2f} ATR")
                  print(f"💥 DYNAMIC R:R: 1:{levels['rr']:.2f}")
