                          points,text=tf_reason[key]; print(f"      • {method}: {text} (+{points})")
                  print(f"🎯 FINAL REASON: {result['direction']} selected because the 4H/1H higher-timeframe direction and 30M/15M lower-timeframe confirmation align.")
                  print("")
              print("═"*64)
              print("💚 Intraday model: 4H regime → 1H confirmation → 30M setup → 15M trigger.")
