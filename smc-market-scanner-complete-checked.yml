name: SMC Holding Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: SMC 9-Method Holding Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import random
          import requests

          API_KEY = os.environ.get("TWELVE_DATA_API_KEY", "").strip()
          if not API_KEY:
              raise SystemExit("TWELVE_DATA_API_KEY secret is missing.")

          SYMBOLS = [
              "EUR/USD", "GBP/USD", "USD/JPY", "USD/CHF", "USD/CAD",
              "AUD/USD", "NZD/USD",
              "EUR/GBP", "EUR/JPY", "EUR/CHF", "EUR/AUD", "EUR/CAD",
              "GBP/JPY", "GBP/CHF", "GBP/AUD", "GBP/CAD",
              "AUD/JPY", "AUD/NZD", "CAD/JPY", "NZD/JPY"
          ]

          TIMEFRAMES = {
              "D1": {"interval": "1day", "outputsize": 220},
              "H4": {"interval": "4h", "outputsize": 320},
              "H1": {"interval": "1h", "outputsize": 360},
          }

          ATR_PERIOD = 14
          RSI_PERIOD = 14
          SWING_STRENGTH = 2
          SWING_LOOKBACK = 80
          SL_ATR_BUFFER = 0.25
          MIN_SL_ATR = 1.00
          MAX_SL_ATR = 3.50
          BASE_RISK_R = 1.0
          MIN_TARGET_R = 1.0
          MAX_TARGET_R = 100.0
          TARGET_BUFFER_ATR = 0.15
          ENTRY_ZONE_ATR = 0.35
          TOP_N = 5
          MIN_SCORE = 68
          URL = "https://api.twelvedata.com/time_series"

          # Twelve Data can return HTTP 429 when requests arrive too quickly.
          # The scanner therefore throttles every request, retries 429 responses
          # with exponential backoff, and caches successful responses for this run.
          FREE_PLAN_CREDITS_PER_MINUTE = 8
          REQUEST_GAP_SECONDS = 2.0
          MAX_RETRIES = 5
          BATCH_SIZE = 8
          BATCH_WINDOW_SECONDS = 61
          CACHE = {}
          LAST_REQUEST_AT = 0.0
          SESSION = requests.Session()

          def fmt(symbol, value):
              if value is None:
                  return "N/A"
              decimals = 3 if "JPY" in symbol else 5
              return f"{value:.{decimals}f}"

          def _request_batch(symbols, interval, outputsize):
              """Fetch a batch while respecting the Free plan credit window."""
              global LAST_REQUEST_AT

              symbols = list(symbols)
              if not symbols:
                  return {}

              cache_key = ("BATCH", tuple(symbols), interval, outputsize)
              if cache_key in CACHE:
                  return CACHE[cache_key]

              params = {
                  "symbol": ",".join(symbols),
                  "interval": interval,
                  "outputsize": outputsize,
                  "apikey": API_KEY,
                  "format": "JSON",
              }

              for attempt in range(MAX_RETRIES + 1):
                  wait = BATCH_WINDOW_SECONDS - (time.monotonic() - LAST_REQUEST_AT)
                  if LAST_REQUEST_AT > 0 and wait > 0:
                      time.sleep(wait)

                  try:
                      response = SESSION.get(URL, params=params, timeout=45)
                      LAST_REQUEST_AT = time.monotonic()

                      if response.status_code == 429:
                          retry_after = response.headers.get("Retry-After")
                          try:
                              server_wait = float(retry_after) if retry_after else 0.0
                          except ValueError:
                              server_wait = 0.0
                          backoff = max(server_wait, BATCH_WINDOW_SECONDS * (2 ** attempt))
                          if attempt < MAX_RETRIES:
                              print(f"RATE LIMIT {interval}: waiting {backoff:.0f}s; retry {attempt+1}/{MAX_RETRIES}")
                              time.sleep(backoff)
                              continue
                          print(f"RATE LIMIT {interval}: retries exhausted.")
                          return {}

                      response.raise_for_status()
                      payload = response.json()

                  except requests.RequestException as exc:
                      LAST_REQUEST_AT = time.monotonic()
                      if attempt < MAX_RETRIES:
                          backoff = max(5.0, 10.0 * (2 ** attempt))
                          print(f"BATCH REQUEST ERROR {interval}: {exc}; retrying in {backoff:.0f}s")
                          time.sleep(backoff)
                          continue
                      print(f"BATCH REQUEST ERROR {interval}: retries exhausted.")
                      return {}

                  except ValueError as exc:
                      print(f"BATCH JSON ERROR {interval}: {exc}")
                      return {}

                  if not isinstance(payload, dict):
                      return {}

                  results = {}
                  for symbol in symbols:
                      item = payload.get(symbol)
                      if not isinstance(item, dict) or "values" not in item:
                          print(f"BATCH DATA MISSING: {symbol} {interval}")
                          continue

                      candles = []
                      for row in reversed(item["values"]):
                          try:
                              candles.append({
                                  "datetime": row["datetime"],
                                  "open": float(row["open"]),
                                  "high": float(row["high"]),
                                  "low": float(row["low"]),
                                  "close": float(row["close"]),
                              })
                          except (KeyError, TypeError, ValueError):
                              continue

                      if candles:
                          results[symbol] = candles
                          CACHE[(symbol, interval, outputsize)] = candles

                  CACHE[cache_key] = results
                  return results

              return {}

          def get_candles(symbol, interval, outputsize):
              cache_key = (symbol, interval, outputsize)
              if cache_key in CACHE:
                  return CACHE[cache_key]
              return _request_batch([symbol], interval, outputsize).get(symbol, [])

          def preload_market_data():
              """Load all pairs in 8-symbol batches; each symbol costs one credit."""
              for name, cfg in TIMEFRAMES.items():
                  for i in range(0, len(SYMBOLS), BATCH_SIZE):
                      batch = SYMBOLS[i:i + BATCH_SIZE]
                      print(f"FETCH {name}: batch {i // BATCH_SIZE + 1}")
                      _request_batch(batch, cfg["interval"], cfg["outputsize"])

          def ema(values, period):

              if len(values) < period:
                  return None
              k = 2.0 / (period + 1)
              value = sum(values[:period]) / period
              for price in values[period:]:
                  value += k * (price - value)
              return value

          def atr(candles, period=14):
              if len(candles) < period + 1:
                  return None
              trs = []
              for i in range(1, len(candles)):
                  h, l, pc = candles[i]["high"], candles[i]["low"], candles[i-1]["close"]
                  trs.append(max(h-l, abs(h-pc), abs(l-pc)))
              value = sum(trs[:period]) / period
              for tr in trs[period:]:
                  value = ((period-1) * value + tr) / period
              return value

          def rsi(candles, period=14):
              if len(candles) < period + 1:
                  return None
              gains, losses = [], []
              for i in range(1, len(candles)):
                  change = candles[i]["close"] - candles[i-1]["close"]
                  gains.append(max(change, 0.0))
                  losses.append(max(-change, 0.0))
              ag = sum(gains[:period]) / period
              al = sum(losses[:period]) / period
              for i in range(period, len(gains)):
                  ag = ((period-1)*ag + gains[i]) / period
                  al = ((period-1)*al + losses[i]) / period
              if al == 0:
                  return 100.0
              return 100.0 - (100.0 / (1.0 + ag/al))

          def macd(candles):
              closes = [c["close"] for c in candles]
              e12, e26 = ema(closes, 12), ema(closes, 26)
              return None if e12 is None or e26 is None else e12 - e26

          def swing_high(candles, i, strength=2):
              if i < strength or i >= len(candles)-strength:
                  return False
              h = candles[i]["high"]
              return all(h > candles[i-j]["high"] and h > candles[i+j]["high"]
                         for j in range(1, strength+1))

          def swing_low(candles, i, strength=2):
              if i < strength or i >= len(candles)-strength:
                  return False
              l = candles[i]["low"]
              return all(l < candles[i-j]["low"] and l < candles[i+j]["low"]
                         for j in range(1, strength+1))

          def find_swings(candles):
              highs, lows = [], []
              for i in range(SWING_STRENGTH, len(candles)-SWING_STRENGTH):
                  if swing_high(candles, i, SWING_STRENGTH):
                      highs.append({"index": i, "price": candles[i]["high"]})
                  if swing_low(candles, i, SWING_STRENGTH):
                      lows.append({"index": i, "price": candles[i]["low"]})
              return highs, lows

          def structure(highs, lows):
              if len(highs) < 2 or len(lows) < 2:
                  return 0, None, "INSUFFICIENT SWINGS"
              hh = highs[-1]["price"] > highs[-2]["price"]
              hl = lows[-1]["price"] > lows[-2]["price"]
              lh = highs[-1]["price"] < highs[-2]["price"]
              ll = lows[-1]["price"] < lows[-2]["price"]
              if hh and hl:
                  return 15, "BUY", "BULLISH HH + HL"
              if lh and ll:
                  return 15, "SELL", "BEARISH LH + LL"
              return 5, None, "MIXED STRUCTURE"

          def liquidity_sweeps(candles, highs, lows):
              sweeps = []
              start = max(0, len(candles)-100)
              for i in range(start, len(candles)):
                  ph = [x for x in highs if x["index"] < i]
                  pl = [x for x in lows if x["index"] < i]
                  if ph and candles[i]["high"] > ph[-1]["price"] and candles[i]["close"] < ph[-1]["price"]:
                      sweeps.append(("SELL", i, ph[-1]["price"]))
                  if pl and candles[i]["low"] < pl[-1]["price"] and candles[i]["close"] > pl[-1]["price"]:
                      sweeps.append(("BUY", i, pl[-1]["price"]))
              return sweeps

          def smc(candles, highs, lows):
              sweeps = liquidity_sweeps(candles, highs, lows)
              if not sweeps:
                  return 0, None, "NO RECENT LIQUIDITY SWEEP"
              typ, idx, _ = sweeps[-1]
              for i in range(idx+1, min(len(candles), idx+15)):
                  if typ == "BUY":
                      ph = [x for x in highs if x["index"] < idx]
                      if ph and candles[i]["close"] > ph[-1]["price"]:
                          return 20, "BUY", "BULLISH LIQUIDITY SWEEP + MSS"
                  else:
                      pl = [x for x in lows if x["index"] < idx]
                      if pl and candles[i]["close"] < pl[-1]["price"]:
                          return 20, "SELL", "BEARISH LIQUIDITY SWEEP + MSS"
              return 0, None, "SWEEP WITHOUT MSS"

          def supply_demand(candles, direction, atr_value):
              if direction is None or atr_value is None:
                  return 0, "NO DIRECTION"
              recent = candles[-30:]
              best, label = 0, "WEAK SUPPLY/DEMAND"
              for i in range(2, len(recent)):
                  base, impulse = recent[i-2], recent[i]
                  if abs(impulse["close"]-base["close"]) < atr_value*0.8:
                      continue
                  if direction == "BUY" and base["close"] <= base["open"] and impulse["close"] > impulse["open"]:
                      best, label = 10, "DEMAND ZONE + BULLISH IMPULSE"
                  if direction == "SELL" and base["close"] >= base["open"] and impulse["close"] < impulse["open"]:
                      best, label = 10, "SUPPLY ZONE + BEARISH IMPULSE"
              return best, label

          def price_action(candles, direction):
              if direction is None or len(candles) < 2:
                  return 0, "NO DIRECTION"
              c, p = candles[-1], candles[-2]
              body = abs(c["close"]-c["open"])
              upper = c["high"]-max(c["open"], c["close"])
              lower = min(c["open"], c["close"])-c["low"]
              bull = p["close"] < p["open"] and c["close"] > c["open"] and c["open"] <= p["close"] and c["close"] >= p["open"]
              bear = p["close"] > p["open"] and c["close"] < c["open"] and c["open"] >= p["close"] and c["close"] <= p["open"]
              if direction == "BUY":
                  if bull: return 10, "BULLISH ENGULFING"
                  if body > 0 and lower > body*1.5: return 8, "BULLISH REJECTION"
                  if c["close"] > c["open"]: return 5, "BULLISH CANDLE"
              else:
                  if bear: return 10, "BEARISH ENGULFING"
                  if body > 0 and upper > body*1.5: return 8, "BEARISH REJECTION"
                  if c["close"] < c["open"]: return 5, "BEARISH CANDLE"
              return 0, "NO STRONG PRICE ACTION"

          def liquidity_score(sweeps, direction):
              if not sweeps or direction is None:
                  return 0, "NO RECENT SWEEP"
              if sweeps[-1][0] == direction:
                  return 15, f"{direction} LIQUIDITY SWEEP"
              return 5, "OPPOSING LIQUIDITY SWEEP"

          def fibonacci(candles, highs, lows, direction):
              if direction is None or not highs or not lows:
                  return 0, "NO SWING RANGE"
              high, low = highs[-1]["price"], lows[-1]["price"]
              if high <= low:
                  return 0, "INVALID RANGE"
              current = candles[-1]["close"]
              if direction == "BUY":
                  levels = [("0.382", high-(high-low)*0.382), ("0.500", high-(high-low)*0.5),
                            ("0.618", high-(high-low)*0.618), ("0.786", high-(high-low)*0.786)]
              else:
                  levels = [("0.382", low+(high-low)*0.382), ("0.500", low+(high-low)*0.5),
                            ("0.618", low+(high-low)*0.618), ("0.786", low+(high-low)*0.786)]
              name, level = min(levels, key=lambda x: abs(current-x[1]))
              return (5, f"NEAR FIB {name}") if abs(current-level) <= (high-low)*0.04 else (2, f"FIB {name} NOT NEAR")

          def trend(candles, direction):
              closes = [c["close"] for c in candles]
              e20, e50, e200 = ema(closes, 20), ema(closes, 50), ema(closes, 200)
              if None in (e20, e50, e200) or direction is None:
                  return 0, "INSUFFICIENT DATA"
              if direction == "BUY" and e20 > e50 > e200:
                  return 10, "BULLISH EMA ALIGNMENT"
              if direction == "SELL" and e20 < e50 < e200:
                  return 10, "BEARISH EMA ALIGNMENT"
              return 3, "MIXED EMA ALIGNMENT"

          def indicators(candles, direction):
              r, m = rsi(candles, RSI_PERIOD), macd(candles)
              if r is None or m is None or direction is None:
                  return 0, "INSUFFICIENT DATA"
              if direction == "BUY":
                  return (5 if r >= 50 and m > 0 else 2), f"RSI {r:.1f} / MACD {m:.6f}"
              return (5 if r <= 50 and m < 0 else 2), f"RSI {r:.1f} / MACD {m:.6f}"

          def session_score(_):
              return 10, "HOLDING MODE - SESSION NEUTRAL"

          def tf_score(candles):
              if len(candles) < 220:
                  return None
              atr_value = atr(candles, ATR_PERIOD)
              highs, lows = find_swings(candles)
              ms_s, ms_dir, ms_text = structure(highs, lows)
              smc_s, smc_dir, smc_text = smc(candles, highs, lows)
              direction = smc_dir or ms_dir
              sd_s, sd_text = supply_demand(candles, direction, atr_value)
              pa_s, pa_text = price_action(candles, direction)
              sweeps = liquidity_sweeps(candles, highs, lows)
              liq_s, liq_text = liquidity_score(sweeps, direction)
              fib_s, fib_text = fibonacci(candles, highs, lows, direction)
              trend_s, trend_text = trend(candles, direction)
              ind_s, ind_text = indicators(candles, direction)
              session_s, session_text = session_score(candles)
              total = sum([ms_s, smc_s, sd_s, pa_s, liq_s, fib_s, trend_s, ind_s, session_s])
              return {
                  "direction": direction, "score": total, "atr": atr_value,
                  "highs": highs, "lows": lows,
                  "ms": (ms_s, ms_text), "smc": (smc_s, smc_text),
                  "sd": (sd_s, sd_text), "pa": (pa_s, pa_text),
                  "liq": (liq_s, liq_text), "fib": (fib_s, fib_text),
                  "trend": (trend_s, trend_text), "ind": (ind_s, ind_text),
                  "session": (session_s, session_text),
              }

          def common_direction(d1, h4, h1):
              dirs = [d1.get("direction"), h4.get("direction"), h1.get("direction")]
              if dirs.count("BUY") >= 2 and h4["direction"] == "BUY":
                  return "BUY"
              if dirs.count("SELL") >= 2 and h4["direction"] == "SELL":
                  return "SELL"
              return None

          def build_holding_levels(candles_h4, h4, direction):
              if direction not in ("BUY", "SELL") or h4["atr"] is None:
                  return None

              entry_market = candles_h4[-1]["close"]
              atr4 = h4["atr"]
              highs, lows = h4["highs"], h4["lows"]

              recent_lows = [x["price"] for x in lows[-SWING_LOOKBACK:] if x["price"] < entry_market]
              recent_highs = [x["price"] for x in highs[-SWING_LOOKBACK:] if x["price"] > entry_market]

              if direction == "BUY":
                  protected = recent_lows[-1] if recent_lows else min(c["low"] for c in candles_h4[-40:])
                  sl = min(protected - atr4 * SL_ATR_BUFFER,
                           entry_market - atr4 * MIN_SL_ATR)
              else:
                  protected = recent_highs[-1] if recent_highs else max(c["high"] for c in candles_h4[-40:])
                  sl = max(protected + atr4 * SL_ATR_BUFFER,
                           entry_market + atr4 * MIN_SL_ATR)

              pullback = protected + ENTRY_ZONE_ATR * atr4 if direction == "BUY" else protected - ENTRY_ZONE_ATR * atr4
              entry = min(entry_market, pullback) if direction == "BUY" else max(entry_market, pullback)
              entry = max(entry, protected + 0.05 * atr4) if direction == "BUY" else min(entry, protected - 0.05 * atr4)
              sl = min(sl, entry - MIN_SL_ATR * atr4) if direction == "BUY" else max(sl, entry + MIN_SL_ATR * atr4)

              risk = abs(entry - sl)
              if risk <= 0:
                  return None

              if direction == "BUY":
                  targets = [x["price"] for x in highs[-SWING_LOOKBACK:]
                             if x["price"] > entry + TARGET_BUFFER_ATR * atr4]
              else:
                  targets = [x["price"] for x in lows[-SWING_LOOKBACK:]
                             if x["price"] < entry - TARGET_BUFFER_ATR * atr4]

              if highs and lows:
                  swing_high, swing_low = highs[-1]["price"], lows[-1]["price"]
                  swing_range = swing_high - swing_low
                  if swing_range > 0:
                      if direction == "BUY":
                          targets += [swing_high + 0.618 * swing_range,
                                      swing_high + 1.000 * swing_range,
                                      swing_high + 1.618 * swing_range]
                      else:
                          targets += [swing_low - 0.618 * swing_range,
                                      swing_low - 1.000 * swing_range,
                                      swing_low - 1.618 * swing_range]

              if direction == "BUY":
                  valid_targets = [t for t in targets if t > entry + risk]
                  tp = max(valid_targets) if valid_targets else entry + risk * MIN_TARGET_R
              else:
                  valid_targets = [t for t in targets if t < entry - risk]
                  tp = min(valid_targets) if valid_targets else entry - risk * MIN_TARGET_R

              rr = abs(tp - entry) / risk

              # 1R is the base risk unit. Reward is determined by structure.
              # 100R is only a safety ceiling; it is never forced.
              if rr > MAX_TARGET_R:
                  tp = entry + risk * MAX_TARGET_R if direction == "BUY" else entry - risk * MAX_TARGET_R
                  rr = MAX_TARGET_R

              if rr < MIN_TARGET_R:
                  return None

              return {
                  "entry": entry,
                  "sl": sl,
                  "tp": tp,
                  "risk": risk,
                  "risk_atr": risk / atr4,
                  "rr": rr,
                  "basis": "4H protected swing + ATR buffer",
                  "target_basis": "NEXT STRUCTURAL/LIQUIDITY OBJECTIVE + FIB EXTENSION",
                  "entry_type": "CURRENT / CONTROLLED PULLBACK ZONE",
              }

          def analyze(symbol):
              data = {}
              for name, cfg in TIMEFRAMES.items():
                  candles = get_candles(symbol, cfg["interval"], cfg["outputsize"])
                  if len(candles) < 220:
                      print(f"SKIP {symbol} {name}: insufficient candles ({len(candles)})")
                      return None
                  data[name] = (candles, tf_score(candles))

              d1, h4, h1 = data["D1"][1], data["H4"][1], data["H1"][1]
              direction = common_direction(d1, h4, h1)
              if direction is None:
                  return None

              score = h4["score"]*0.55 + d1["score"]*0.25 + h1["score"]*0.20
              if d1["direction"] != direction:
                  score -= 8
              if h1["direction"] != direction:
                  score -= 5

              levels = build_holding_levels(data["H4"][0], h4, direction)
              if not levels or levels["risk_atr"] > MAX_SL_ATR:
                  return None

              confirmations = sum(x["direction"] == direction for x in (d1, h4, h1))
              score += confirmations*2

              # Dynamic reward potential is a confirmation factor, not a fixed target.
              rr = levels["rr"]
              if rr >= 8:
                  score += 5
              elif rr >= 5:
                  score += 4
              elif rr >= 3:
                  score += 3
              elif rr >= 2:
                  score += 2

              if score < MIN_SCORE:
                  return None

              signal = "STRONG" if score >= 78 else "MODERATE"
              return {
                  "symbol": symbol, "direction": direction, "score": round(score, 1),
                  "signal": signal, "d1": d1, "h4": h4, "h1": h1, "levels": levels
              }

          print("="*78)
          print("SMC 9-METHOD MULTI-TIMEFRAME HOLDING SCANNER")
          print("="*78)
          print("Mode: HOLDING / SWING")
          print("Decision timeframe: 4H | Higher-timeframe regime: 1D | Entry confirmation: 1H")
          print(f"Universe: {len(SYMBOLS)} liquid G10 currency pairs")
          print("Automatic trading: DISABLED")
          print(f"Free-plan mode: {FREE_PLAN_CREDITS_PER_MINUTE} API credits/minute.")
          print(f"Batch size: {BATCH_SIZE} symbols; one full refresh = {len(SYMBOLS) * len(TIMEFRAMES)} credits.")
          print("Batching reduces HTTP overhead; each symbol still consumes one API credit.")

          print("VALIDATION: dynamic RR / structural TP enabled")
          print("Risk model: 1R base risk | Reward is structural/probability-based, not fixed.")

          print("\n" + "═" * 58)
          print("💹🔥 SMC FOREX HOLDING TOP 5 🔥💹")
          print("═" * 58)
          print("💡 1R = BASE RISK | 🎯 TP = PROBABLE OBJECTIVE | ⚖️ R:R = DYNAMIC")
          print("")

          top5 = results[:5]

          if not top5:
              print("🙊 NO QUALIFIED HOLDING SETUPS FOUND")
              print("💙 The scanner completed the market analysis, but no setup")
              print("   met the required confluence and minimum-score rules.")
          else:
              print("🎊 MARKET SCAN COMPLETE")
              print(f"💱 Pairs analyzed: {len(SYMBOLS)}")
              print("📊 Timeframes: 1D • 4H • 1H")
              print(f"⭐ Strongest setups: {len(top5)}")
              print("")
              print("💎 TOP 5 SYMBOLS: " + ", ".join(r["symbol"] for r in top5))
              print("")

              for rank, r in enumerate(top5, 1):
                  lv = r["levels"]
                  medal = {1: "🏆", 2: "🥈", 3: "🥉"}.get(rank, "🏅")
                  direction_emoji = "🟢" if r["direction"] == "BUY" else "🔴"
                  strength_emoji = "🔥" if r["signal"] == "STRONG" else "⭐"

                  print("─" * 58)
                  print(
                      f"{medal} #{rank} 💱 {r['symbol']} | "
                      f"{direction_emoji} {r['direction']} | "
                      f"{strength_emoji} {r['signal']}"
                  )
                  print(f"⭐ SCORE: {r['score']}/100")
                  print("")
                  print(f"🎯 ENTRY:       {lv['entry']:.5f}")
                  print(f"🛡️ STOP LOSS:   {lv['sl']:.5f}")
                  print(f"💰 TAKE PROFIT: {lv['tp']:.5f}")
